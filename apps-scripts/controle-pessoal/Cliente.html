<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const nomes = {diego: 'Diego Machado', iris: 'Iris Marta', condominio: 'Edifício Lisboa'};
  const titulos = {inicio: 'Visão geral', pessoal: 'Financeiro pessoal', servicos: 'Serviços digitais',
    condominio: 'Edifício Lisboa · Financeiro e saldo', contatos: 'Edifício Lisboa · Contatos', simulacoes: 'Edifício Lisboa · Simulações de gastos',
    checklist: 'Edifício Lisboa · Checklist', iptv: 'IPTV · Clientes e vencimentos', importacao: 'Administração · Importar planilhas', config: 'Administração · Configurações / Drive'};
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let estado = null, pagina = 'inicio', ocupado = false, editar = null, previa = null, exportacao = [];
  let busca = '', statusFiltro = 'todos';
  let popupPendente = null;
  let loadingOrigem = null;
  let diaAvisos = '';
  const selecaoBaixa = new Set();
  const e = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = v => v == null ? 'Não disponível' : (v / 100).toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
  const decimal = v => ((v || 0) / 100).toFixed(2);
  const dataBR = s => s ? s.split('-').reverse().join('/') : '—';
  const hoje = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const periodo = () => $('ano').value + '-' + $('mes').value;
  const escopo = () => pagina === 'condominio' ? 'condominio' : $('pessoa').value;
  function dataISO(valor) {
    const texto = String(valor).trim();
    if (!texto) return '';
    const partes = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto);
    if (!partes) throw new Error('Informe uma data válida no formato DD/MM/AAAA.');
    const iso = partes[3]+'-'+partes[2]+'-'+partes[1];
    const d = new Date(iso+'T12:00:00Z');
    if (isNaN(d.getTime()) || d.toISOString().slice(0,10)!==iso || iso<'1900-01-01' || iso>'2200-12-31') {
      throw new Error('Informe uma data válida no formato DD/MM/AAAA, entre 1900 e 2200.');
    }
    return iso;
  }
  function centavos(v) {
    const s = String(v).trim().replace(',', '.');
    if (!/^-?\d+(\.\d{1,2})?$/.test(s)) throw new Error('Informe um valor em reais com até duas casas decimais, sem separador de milhar.');
    const n = Math.round(Number(s) * 100);
    if (!Number.isSafeInteger(n)) throw new Error('Valor acima do limite.');
    return n;
  }
  function rpc(nome, ...args) {
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[nome](...args));
  }
  function mensagem(texto, erro = false) {
    $('mensagem').textContent = texto; $('mensagem').className = erro ? 'erro' : ''; $('mensagem').hidden = !texto;
  }
  function abrirPopup(opcoes) {
    if (ocupado || popupPendente || $('editor').open) return Promise.resolve(null);
    const dialog = $('popup'), input = $('popup-valor');
    $('popup-titulo').textContent = opcoes.titulo;
    $('popup-descricao').textContent = opcoes.descricao;
    $('popup-confirmar').textContent = opcoes.botao || 'Confirmar';
    dialog.dataset.perigo = String(Boolean(opcoes.perigo));
    $('popup-icone').textContent = opcoes.perigo ? '!' : opcoes.tipo === 'month' ? '↗' : opcoes.tipo === 'date' ? '✓' : '?';
    $('popup-campo').hidden = !opcoes.tipo;
    $('popup-rotulo').textContent = opcoes.rotulo || '';
    // Inputs date nativos seguem o idioma do navegador, não o padrão da listagem.
    input.type = opcoes.tipo === 'date' ? 'text' : opcoes.tipo || 'text';
    input.dataset.tipo = opcoes.tipo || '';
    input.placeholder = opcoes.tipo === 'date' ? 'DD/MM/AAAA' : '';
    input.inputMode = opcoes.tipo === 'date' ? 'numeric' : '';
    input.maxLength = opcoes.tipo === 'date' ? 10 : 200;
    input.value = opcoes.tipo === 'date' ? (opcoes.valor ? dataBR(opcoes.valor) : '') : opcoes.valor || '';
    input.required = Boolean(opcoes.tipo);
    input.min = opcoes.tipo === 'date' ? '1900-01-01' : opcoes.tipo === 'month' ? '1900-01' : '';
    input.max = opcoes.tipo === 'date' ? (opcoes.permitirFutura ? '2200-12-31' : hoje()) : opcoes.tipo === 'month' ? '2200-12' : '';
    input.setCustomValidity(''); input.removeAttribute('aria-invalid');
    $('popup-ajuda').textContent = opcoes.ajuda || '';
    $('popup-ajuda').hidden = !opcoes.ajuda;
    $('popup-erro').hidden = true;
    const foco = document.activeElement;
    return new Promise(resolve => {
      popupPendente = {resolve, opcoes, foco};
      dialog.showModal();
      // Ação destrutiva começa em Cancelar; campos começam no seletor.
      (opcoes.tipo ? input : $('popup-cancelar')).focus();
    });
  }
  function finalizarPopup(resultado = null) {
    if (!popupPendente) return;
    const pendente = popupPendente;
    popupPendente = null;
    $('popup').close();
    if (pendente.foco && pendente.foco.isConnected) pendente.foco.focus();
    pendente.resolve(resultado);
  }
  function validarPopup(opcoes, valor) {
    if (opcoes.tipo) {
      const iso = opcoes.tipo === 'month' ? valor + '-01' : valor;
      const d = new Date(iso + 'T12:00:00Z');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) || isNaN(d.getTime()) || d.toISOString().slice(0, 10) !== iso ||
          iso < '1900-01-01' || iso > '2200-12-31') {
        return opcoes.tipo === 'month' ? 'Selecione um mês e ano válidos.' : 'Informe uma data válida.';
      }
      if (opcoes.tipo === 'date' && !opcoes.permitirFutura && valor > hoje()) return 'A data de pagamento não pode ser futura.';
    }
    return opcoes.validar ? opcoes.validar(valor) : '';
  }
  function bloquear(b, texto = 'Processando…') {
    if (ocupado === b) return;
    ocupado = b;
    const loading = $('carregando');
    if (b) {
      const modal = document.querySelector('dialog[open]');
      if (modal) {
        loadingOrigem = {pai: loading.parentNode, proximo: loading.nextSibling};
        modal.appendChild(loading);
      }
    }
    if ($('carregando-texto')) $('carregando-texto').textContent = texto;
    if (b) loading.hidden = false;
    // A camada superior mantém o loading visível durante o salvamento em modais.
    // Index antigo e navegadores sem Popover continuam usando o elemento normal.
    if (loading.getAttribute('popover') === 'manual' && typeof loading.showPopover === 'function') {
      if (b) loading.showPopover();
      else if (loading.matches(':popover-open')) loading.hidePopover();
    }
    if (!b) {
      loading.hidden = true;
      if (loadingOrigem) {
        loadingOrigem.pai.insertBefore(loading, loadingOrigem.proximo);
        loadingOrigem = null;
      }
    }
    if (b) document.querySelectorAll('button,input,select,textarea,summary').forEach(el => {
      el.dataset.antesDisabled = el.disabled ? '1' : '0';
      if ('disabled' in el) el.disabled = true;
    });
    else document.querySelectorAll('[data-antes-disabled]').forEach(el => {
      if ('disabled' in el) el.disabled = el.dataset.antesDisabled === '1';
      delete el.dataset.antesDisabled;
    });
    $('conteudo').setAttribute('aria-busy', String(b));
    if (!b) atualizarAvisos();
  }
  async function carregar() {
    if (ocupado || popupPendente) return;
    if (!$('ano').checkValidity()) { $('ano').reportValidity(); return; }
    bloquear(true, 'Carregando seus dados…');
    try {
      estado = await rpc('consultarSistema', Number($('ano').value));
      previa = null;
      selecaoBaixa.clear();
      mensagem(''); renderizar();
    } catch (err) {
      estado = null;
      atualizarAvisos();
      $('conteudo').innerHTML = '<div class="bloco"><h2>Não foi possível carregar</h2><p>Confira a sessão Google e as permissões. Use Atualizar para tentar novamente.</p></div>';
      mensagem(err.message || String(err), true);
    } finally { bloquear(false); }
  }
  async function alterar(pedido, sucesso = 'Alteração salva.') {
    if (ocupado || !estado || !estado.preparado) return;
    bloquear(true, 'Salvando alterações…'); $('erro-editor').hidden = true;
    try {
      await rpc('alterarSistema', Object.assign({revisao: estado.db.revisao}, pedido));
      selecaoBaixa.clear();
      estado = await rpc('consultarSistema', Number($('ano').value));
      $('editor').close(); editar = null;
      previa = null; renderizar(); mensagem(sucesso);
    } catch (err) {
      const texto = (err.message || String(err)) + ' Se houve falha de comunicação, atualize e confira antes de repetir.';
      if ($('editor').open) { $('erro-editor').textContent = texto; $('erro-editor').hidden = false; }
      else mensagem(texto, true);
    } finally { bloquear(false); }
  }
  function botao(acao, texto, id = '', classe = '') {
    return '<button data-acao="'+e(acao)+'" data-id="'+e(id)+'" class="'+e(classe)+'">'+e(texto)+'</button>';
  }
  function tabela(cabecalhos, linhas, classes = []) {
    return '<div class="tabela"><table><thead><tr>'+cabecalhos.map(c=>'<th scope="col">'+e(c)+'</th>').join('')+
      '</tr></thead><tbody>'+(linhas.length ? linhas.map((c,i)=>'<tr class="'+e(classes[i]||'')+'">'+c.map(t=>'<td>'+t+'</td>').join('')+'</tr>').join('') :
      '<tr><td colspan="'+cabecalhos.length+'" class="vazio">Nenhum registro neste filtro.</td></tr>')+'</tbody></table></div>';
  }
  function card(nome, valor, classe = '') { return '<div class="card"><small>'+e(nome)+'</small><span class="valor '+e(classe)+'">'+brl(valor)+'</span></div>'; }
  function resumo(es) {
    const todos = estado.resumo[es];
    if ($('visao').value === 'mensal') return todos[Number($('mes').value)-1];
    const r = {entradas:0,saidas:0,recebido:0,pago:0,receber:0,pagar:0,caixaEntrada:0,caixaSaida:0,atrasados:0};
    todos.forEach(m=>Object.keys(r).forEach(k=>r[k]+=m[k]));
    r.saldoInicial = todos[0].saldoInicial; r.saldoFinal = todos[11].saldoFinal; r.resultado=r.entradas-r.saidas;
    return r;
  }
  function painelFinanceiro(es) {
    const r = resumo(es);
    return '<div class="cards">'+card('Entradas previstas',r.entradas,'positivo')+card('Saídas previstas',r.saidas,'negativo')+card('Resultado previsto',r.resultado,r.resultado<0?'negativo':'positivo')+
      card('A receber',r.receber,'positivo')+card('A pagar',r.pagar,'negativo')+card('Vencidos / pendentes',r.atrasados,'negativo')+'</div>'+
      '<div class="cards">'+card('Saldo inicial de caixa',r.saldoInicial)+card('Entradas no caixa',r.caixaEntrada,'positivo')+
      card('Saídas do caixa',r.caixaSaida,'negativo')+card('Saldo final de caixa',r.saldoFinal,r.saldoFinal<0?'negativo':'positivo')+'</div>';
  }
  function statusLancamento(l) {
    return l.pagamento ? 'ok' : l.vencimento && l.vencimento < hoje() ? 'atrasado' : 'pendente';
  }
  const situacoesChecklist = {todos:'Todas',pendente:'Pendente',andamento:'Em andamento',ok:'OK',atrasado:'Verificação vencida'};
  function statusChecklist(r) {
    return r.proxima && r.proxima < hoje() ? 'atrasado' : r.status;
  }
  const custosSimulacao = {materiais:'Materiais',maoObra:'Mão de obra',outros:'Outros gastos',reserva:'Reserva para imprevistos'};
  const totalSimulacao = r => Object.keys(custosSimulacao).reduce((t,k)=>t+r[k],0);
  function saldoSimulacao() {
    const inicio=estado.db.config.saldos.condominio, data=hoje();
    if (data<inicio.data) return null;
    return estado.db.lancamentos.filter(l=>l.escopo==='condominio'&&l.pagamento&&l.pagamento>=inicio.data&&l.pagamento<=data)
      .reduce((t,l)=>t+(l.tipo==='entrada'?l.valor:-l.valor),inicio.valor);
  }
  function previaSimulacao() {
    if (!editar || editar.colecao!=='simulacoes' || !$('simulacao-previa')) return;
    try {
      const r={};Object.keys(custosSimulacao).forEach(k=>{
        r[k]=centavos(document.querySelector('#campos [name="'+k+'"]').value);
        if(r[k]<0) throw new Error('Os custos não podem ser negativos.');
      });
      const saldo=saldoSimulacao(), total=totalSimulacao(r), restante=saldo===null?null:saldo-total;
      $('simulacao-previa').innerHTML='<div class="cards">'+card('Saldo atual registrado',saldo)+card('Custo total estimado',total)+
        card('Saldo após o cenário',restante,restante<0?'negativo':'positivo')+'</div>'+
        '<p>'+(saldo===null?'Saldo indisponível: confira a data de referência nas configurações.':restante<0?'Faltariam '+brl(-restante)+' para este cenário.':'O caixa registrado cobre este cenário, sobrando '+brl(restante)+'.')+'</p>';
    } catch(err) { $('simulacao-previa').textContent=err.message; }
  }
  const situacoesIPTV = {todos:'Todos',ativo:'Ativos',inativo:'Inativos',atrasado:'Vencidos',hoje:'Vencem hoje',proximo:'Próximos 2 dias'};
  const rotulosIPTV = {ativo:'Ativo · em dia',inativo:'Inativo',atrasado:'Vencido',hoje:'Vence hoje',proximo:'Vence em até 2 dias'};
  function statusIPTV(r) {
    if (r.status === 'inativo') return 'inativo';
    const dias = Math.round((Date.parse(r.vencimento+'T12:00:00Z')-Date.parse(hoje()+'T12:00:00Z'))/86400000);
    return dias < 0 ? 'atrasado' : dias === 0 ? 'hoje' : dias <= 2 ? 'proximo' : 'ativo';
  }
  function calcularAvisos(dataHoje = hoje()) {
    if (!estado || !estado.preparado) return [];
    const base = Date.parse(dataHoje+'T12:00:00Z');
    const avisos = [];
    const adicionar = (r, colecao, data) => {
      if (!data) return;
      const dias = Math.round((Date.parse(data+'T12:00:00Z')-base)/86400000);
      if (!Number.isFinite(dias) || dias > 2) return;
      avisos.push({id:r.id,colecao,nome:r.nome,data,dias,escopo:colecao==='iptv'?'iptv':colecao==='checklist'?'condominio':r.escopo,
        competencia:r.competencia,valor:r.valor,tipo:r.tipo});
    };
    estado.db.lancamentos.filter(r=>!r.pagamento).forEach(r=>adicionar(r,'lancamentos',r.vencimento));
    // A próxima verificação representa um novo ciclo, mesmo após uma verificação OK.
    estado.db.checklist.forEach(r=>adicionar(r,'checklist',r.proxima));
    (estado.db.iptv || []).filter(r=>r.status==='ativo').forEach(r=>adicionar(r,'iptv',r.vencimento));
    return avisos.sort((a,b)=>a.data.localeCompare(b.data)||a.escopo.localeCompare(b.escopo)||a.nome.localeCompare(b.nome));
  }
  function atualizarAvisos() {
    diaAvisos = hoje();
    if (!$('sino') || !$('avisos')) return;
    const avisos = calcularAvisos(diaAvisos);
    const disponivel = Boolean(estado && estado.preparado);
    $('sino').disabled = ocupado || !disponivel;
    $('sino').setAttribute('aria-label', 'Avisos: '+avisos.length+' item(ns)');
    $('sino').title = avisos.length+' aviso(s) · Vencidos, hoje e próximos 2 dias';
    $('sino-contador').textContent = avisos.length > 99 ? '99+' : String(avisos.length);
    $('sino-contador').hidden = !avisos.length;
    $('sino').classList.toggle('tem-atrasados', avisos.some(a=>a.dias<0));
    $('avisos-lista').innerHTML = [
      ['Vencidos','vencido',a=>a.dias<0], ['Hoje','hoje',a=>a.dias===0], ['Próximos 2 dias','proximo',a=>a.dias>0]
    ].map(([titulo,classe,filtro])=>{
      const itens = avisos.filter(filtro);
      if (!itens.length) return '';
      return '<section class="avisos-secao"><h3>'+e(titulo)+' ('+itens.length+')</h3><ul>'+itens.map(a=>{
        const financeiro = a.colecao === 'lancamentos';
        const prazo = a.dias<0 ? Math.abs(a.dias)+' dia(s) em atraso' : a.dias===0 ? 'Hoje' : 'Em '+a.dias+' dia(s)';
        return '<li><button class="aviso-item '+classe+'" data-acao="ver-aviso" data-colecao="'+e(a.colecao)+'" data-id="'+e(a.id)+'">'+
          '<strong>'+e(a.nome)+'</strong><small>'+e(a.colecao==='iptv'?'IPTV · Renovação de cliente':nomes[a.escopo]+' · '+(financeiro?(a.tipo==='entrada'?'A receber':'A pagar'):'Checklist'))+'</small>'+
          '<span>'+dataBR(a.data)+' · '+e(prazo)+(financeiro?' · '+brl(a.valor):'')+'</span><small>Ver item →</small></button></li>';
      }).join('')+'</ul></section>';
    }).join('') || '<p class="info">Nenhum vencimento ou verificação atrasada, para hoje ou para os próximos 2 dias (incluindo IPTV).</p>';
    if (!disponivel) $('avisos').close();
  }
  async function verAviso(colecao, id) {
    const aviso = calcularAvisos().find(a=>a.colecao===colecao && a.id===id);
    if (!aviso) { atualizarAvisos(); return; }
    $('avisos').close();
    selecaoBaixa.clear(); busca=''; statusFiltro='todos'; previa=null;
    if (colecao === 'lancamentos') {
      pagina = aviso.escopo === 'condominio' ? 'condominio' : 'pessoal';
      if (aviso.escopo !== 'condominio') $('pessoa').value = aviso.escopo;
      const mudouAno = $('ano').value !== aviso.competencia.slice(0,4);
      $('ano').value = aviso.competencia.slice(0,4);
      $('mes').value = aviso.competencia.slice(5,7);
      $('visao').value = 'mensal';
      if (mudouAno) await carregar(); else renderizar();
    } else { pagina=colecao==='iptv'?'iptv':'checklist'; renderizar(); }
    const acao = colecao === 'lancamentos' ? 'pagamento' : colecao === 'iptv' ? 'renovar-iptv' : 'verificar';
    const alvo = Array.from($('conteudo').querySelectorAll('[data-acao="'+acao+'"]')).find(b=>b.dataset.id===id);
    if (alvo) {
      alvo.closest('tr').classList.add('linha-aviso-alvo');
      alvo.scrollIntoView({block:'center'}); alvo.focus({preventScroll:true});
      mensagem('Item localizado: '+aviso.nome+'. Confira o registro antes de registrar baixa, verificação ou renovação.');
    }
  }
  function passaBusca(r) {
    const normal = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    return normal(JSON.stringify(r)).includes(normal(busca));
  }
  function lancamentosFiltrados() {
    return estado.db.lancamentos.filter(l=>l.escopo===escopo() &&
      ($('visao').value==='anual'?l.competencia.startsWith($('ano').value+'-'):l.competencia===periodo()) &&
      passaBusca(l) && (statusFiltro==='todos'||statusLancamento(l)===statusFiltro));
  }
  function barraCadastro(colecao) {
    return '<div class="acoes">'+botao('novo','Novo registro',colecao)+botao('csv','Exportar CSV','','secundario')+botao('abrir-pdf','Abrir PDF','','secundario')+botao('imprimir','Baixar PDF','','secundario')+'</div>';
  }
  function filtrosLista(financeiro = false) {
    return '<div class="filtros nao-imprimir"><label>Buscar<input id="busca" value="'+e(busca)+'" placeholder="Descrição, conta, unidade…"></label>'+
      (financeiro ? '<label>Situação<select id="status-filtro"><option value="todos">Todas</option><option value="pendente">Pendentes</option><option value="atrasado">Vencidos</option><option value="ok">Pagos / recebidos</option></select></label>' :
        ['checklist','iptv'].includes(pagina) ? '<label>Situação<select id="status-filtro">'+Object.entries(pagina==='iptv'?situacoesIPTV:situacoesChecklist).map(([valor,rotulo])=>'<option value="'+valor+'">'+e(rotulo)+'</option>').join('')+'</select></label>' : '')+'</div>';
  }
  function anual(es) {
    return tabela(['Mês','Entradas previstas','Saídas previstas','Resultado previsto','Entradas caixa','Saídas caixa','Saldo inicial','Saldo final'],
      estado.resumo[es].map(r=>[e(meses[Number(r.mes.slice(5))-1]),...['entradas','saidas','resultado','caixaEntrada','caixaSaida','saldoInicial','saldoFinal'].map(k=>'<span class="numero">'+brl(r[k])+'</span>')]));
  }
  function renderizar() {
    $('titulo').textContent = titulos[pagina];
    $('pessoa-label').hidden = !['pessoal','servicos'].includes(pagina);
    document.querySelector('section[aria-label="Período"]').hidden = ['iptv','simulacoes'].includes(pagina);
    if ($('menu-admin') && ['importacao','config'].includes(pagina)) $('menu-admin').open = true;
    document.querySelectorAll('[data-pagina]').forEach(b=>b.classList.toggle('ativo',b.dataset.pagina===pagina));
    atualizarAvisos();
    if (!estado) return;
    $('identidade').textContent = estado.usuario;
    if (!estado.preparado) {
      $('conteudo').innerHTML='<div class="bloco"><h2>Prepare seu espaço privado</h2><p>O sistema criará uma pasta exclusiva no seu Meu Drive, sem compartilhar arquivos, e iniciará uma base vazia.</p>'+botao('preparar','Preparar sistema')+'</div>';
      return;
    }
    $('rodape').textContent = 'Revisão '+estado.db.revisao+' · Atualizado em '+new Date(estado.db.atualizadoEm).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · '+($('visao').value==='anual'?'Ano '+$('ano').value:meses[Number($('mes').value)-1]+' / '+$('ano').value);
    exportacao = [];
    let html = '';
    if (pagina === 'inicio') {
      html='<div class="acoes">'+botao('abrir-pdf','Abrir PDF da visão geral','','secundario')+botao('imprimir','Baixar PDF da visão geral','','secundario')+'</div>'+

  function atualizarSelecaoBaixa() {
    const botao=$('baixar-selecionados');
    if (!botao) return;
    const alvos=lancamentosFiltrados().filter(l=>!l.pagamento && selecaoBaixa.has(l.id));
    botao.textContent='Registrar baixa dos selecionados ('+alvos.length+')';
    botao.disabled=!alvos.length;
    $('limpar-baixas').disabled=!selecaoBaixa.size;
    const total=tipo=>brl(alvos.filter(l=>l.tipo===tipo).reduce((s,l)=>s+l.valor,0));
    $('resumo-selecao').textContent=alvos.length+' selecionado(s) · Entradas: '+total('entrada')+' · Saídas: '+total('saida')+
      '. Apenas os pendentes visíveis; itens ocultos pelos filtros saem da seleção.';
    document.querySelectorAll('[data-baixa-id]').forEach(el=>{el.checked=!el.disabled && selecaoBaixa.has(el.dataset.baixaId);});
  }
  function campo(nome, rotulo, valor, tipo='text', obrigatorio=false, opcoes=null) {
    let html;
    if (opcoes) html='<select name="'+e(nome)+'">'+opcoes.map(o=>'<option value="'+e(o[0])+'" '+(String(valor)===String(o[0])?'selected':'')+'>'+e(o[1])+'</option>').join('')+'</select>';
    else if (tipo==='textarea') html='<textarea name="'+e(nome)+'" maxlength="2000">'+e(valor)+'</textarea>';
    else if (tipo==='date') html='<input name="'+e(nome)+'" type="text" data-tipo="date" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" value="'+
      e(valor ? dataBR(valor) : '')+'" '+(obrigatorio?'required':'')+'>';
    else html='<input name="'+e(nome)+'" type="'+tipo+'" value="'+e(valor)+'" '+(obrigatorio?'required':'')+
      (tipo==='number'?' step="1"':tipo==='text'?' maxlength="200"':'')+'>';
    return '<label class="'+(tipo==='textarea'?'inteiro':'')+'">'+e(rotulo)+html+'</label>';
  }

  async function exportarPDF(abrir = false) {
    if (ocupado || popupPendente || !estado || !estado.preparado) return;
    if (!window.CPRelatorios) throw new Error('Atualize também Index.html e Relatorios.html para exportar o PDF.');
    const financeiro = ['pessoal','condominio'].includes(pagina);
    const mensal = pagina === 'servicos' || $('visao').value === 'mensal';
    const periodoRelatorio = ['iptv','simulacoes'].includes(pagina) ? 'Posição em '+dataBR(hoje()) : mensal ? meses[Number($('mes').value)-1]+' / '+$('ano').value : 'Ano '+$('ano').value;
    const filtros = [];
    if (['pessoal','condominio','servicos','contatos','simulacoes','checklist','iptv'].includes(pagina)) {
      filtros.push('Busca: '+(busca || 'sem filtro'));
      if (financeiro) filtros.push('Situação: '+({todos:'Todas',pendente:'Pendentes',atrasado:'Vencidos',ok:'Pagos / recebidos'}[statusFiltro] || 'Todas'));
      if (pagina === 'checklist') filtros.push('Situação: '+(situacoesChecklist[statusFiltro] || 'Todas'));
      if (pagina === 'iptv') filtros.push('Situação: '+(situacoesIPTV[statusFiltro] || 'Todos'));
    }
    const entidade = pagina === 'iptv' ? 'Clientes IPTV' : ['pessoal','servicos'].includes(pagina) ? nomes[$('pessoa').value] : pagina !== 'inicio' ? nomes.condominio : '';
    const dataAtualizada = new Date(estado.db.atualizadoEm);
    const modelo = window.CPRelatorios.capturar($('conteudo'), {
      titulo: titulos[pagina], entidade, periodo: periodoRelatorio, filtros: filtros.join(' | '),
      emitidoEm: new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}),
      revisao: estado.db.revisao, atualizadoEm: isNaN(dataAtualizada.getTime()) ? 'Não informado' : dataAtualizada.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})
    });
    const nome = ('meu-controle-'+pagina+'-'+(entidade || 'geral')+'-'+(['iptv','simulacoes'].includes(pagina)?hoje():mensal ? periodo() : $('ano').value))
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9-]+/g,'-')+'.pdf';
    // Reserva a aba durante o clique, antes do await, para evitar bloqueio de pop-ups.
    const aba = abrir ? window.open('about:blank', '_blank') : null;
    if (abrir && !aba) throw new Error('O navegador bloqueou a nova aba. Permita pop-ups para abrir o PDF ou use Baixar PDF.');
    if (aba) {
      aba.opener = null;
      aba.document.title = 'Preparando PDF · Meu controle';
      aba.document.body.textContent = 'Preparando seu PDF… Aguarde.';
    }
    bloquear(true, 'Preparando seu PDF…');
    try {
      const pdf = await window.CPRelatorios.gerar(modelo);
      const dados = pdf.output('arraybuffer');
      if (aba) {
        if (aba.closed) throw new Error('A aba do PDF foi fechada. Clique em Abrir PDF para tentar novamente.');
        const url = URL.createObjectURL(new Blob([dados], {type:'application/pdf'}));
        try { aba.location.replace(url); }
        catch (err) { URL.revokeObjectURL(url); throw err; }
        // Mantém o arquivo disponível ao visualizador até sair desta página.
        window.addEventListener('unload', ()=>URL.revokeObjectURL(url), {once:true});
        mensagem('PDF aberto em uma nova aba. Você pode visualizar, imprimir ou salvar pelo navegador.');
      } else {
        baixar(nome, dados, 'application/pdf');
        mensagem('PDF gerado. Confira o download do navegador.');
      }
    } catch (err) {
      if (aba && !aba.closed) aba.close();
      throw err;
    } finally { bloquear(false); }
  }

      'popup-campo','popup-rotulo','popup-valor','popup-ajuda','popup-erro','popup-cancelar','popup-confirmar'];
