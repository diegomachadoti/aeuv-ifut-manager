<style>
  :root {
    --azul: #14213d;
    --azul-claro: #1d2f55;
    --dourado: #fca311;
    --fundo: #f4f6fb;
    --borda: #dbe2ef;
    --texto: #172033;
    --apoio: #647089;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  /* ---------- Cabecalho ---------- */

  .topo {
    background: var(--azul);
    color: #fff;
    border-bottom: 4px solid var(--dourado);
  }

  .topo-conteudo {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brasao {
    flex: 0 0 78px;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .28);
    position: relative;
    animation: entrarBrasao .6s ease-out both;
  }

  .brasao::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--dourado);
    opacity: .7;
    animation: respirar 3.2s ease-in-out infinite;
  }

  .brasao img {
    width: 78%;
    height: 78%;
    object-fit: contain;
  }

  .topo h1 {
    margin: 0;
    font-size: clamp(17px, 2.6vw, 24px);
    line-height: 1.25;
  }

  .topo p {
    margin: 4px 0 0;
    font-size: 14px;
    opacity: .85;
  }

  .topo-identidade { flex: 1; min-width: 0; }

  /* ---------- Cartao de conteudo ---------- */

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 20px 48px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(20, 33, 61, .05);
  }

  .card h2 {
    margin: 0 0 6px;
    font-size: 19px;
    color: var(--azul);
  }

  .apoio {
    color: var(--apoio);
    font-size: 14px;
    line-height: 1.55;
  }

  @keyframes entrarBrasao {
    from { transform: scale(.82); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes respirar {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brasao, .brasao::after { animation: none; }
  }

  @media (max-width: 700px) {
    .topo-conteudo { padding: 14px 16px; gap: 12px; }

    .brasao {
      flex-basis: 58px;
      width: 58px;
      height: 58px;
    }

    .container { padding: 16px 14px 40px; }
    .card { padding: 18px 16px; }
  }
</style>
