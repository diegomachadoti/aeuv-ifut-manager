    function tabelaResultadoResumo_() {
      const draft = tabelaEstado.resultado;
      if (!draft) return;
      const resultado = draft.resultado;
      document.getElementById('trWoCampo').hidden = !resultado.wo;
      document.getElementById('trWoEquipe').required = !!resultado.wo;
      document.getElementById('trWoEquipe').disabled = !draft.podeEditar || !resultado.wo;
      ['Mandante', 'Visitante'].forEach(function (lado) {
        document.getElementById('trPen' + lado).hidden = !resultado.penaltis;
        const input = document.getElementById('trPenGols' + lado);
        input.required = !!resultado.penaltis;
        input.disabled = !draft.podeEditar || !resultado.penaltis;
      });
      const avisos = [], totais = [];
      draft.equipes.forEach(function (equipe) {
        const gols = equipe.atletas.reduce(function (total, atleta) { return total + (Number(atleta.gols) || 0); }, 0);
        const golsContra = equipe.atletas.reduce(function (total, atleta) { return total + (Number(atleta.golsContra) || 0); }, 0);
        const adversaria = draft.equipes.find(function (item) { return item.id !== equipe.id; });
        const recebidos = adversaria.atletas.reduce(function (total, atleta) { return total + (Number(atleta.golsContra) || 0); }, 0);
        totais.push(equipe.nome + ': ' + equipe.atletas.filter(function (atleta) { return atleta.participou; }).length + ' atleta(s) e '
          + equipe.comissao.filter(function (pessoa) { return pessoa.participou; }).length + ' membro(s) da comissão participaram, ' + gols + ' gol(s), ' + golsContra + ' gol(s) contra.');
        const placar = document.getElementById(equipe.lado === 'mandante' ? 'trGolsMandante' : 'trGolsVisitante').value;
        if (gols + recebidos !== Number(placar)) avisos.push(equipe.nome + ': gols atribuídos, incluindo gols contra do adversário (' + (gols + recebidos) + '), diferem do placar (' + placar + '). Ajustes administrativos ou sem autoria são permitidos.');
      });
      const pendencias = draft.equipes.reduce(function (lista, equipe) {
        equipe.atletas.forEach(function (atleta) {
          if (atleta.suspensaoAutomatica) lista.push(atleta.nome + ': suspenso por ' + atleta.motivoSuspensaoAutomatica
            + ' (' + atleta.jogosSuspensaoPendentes + ' jogo(s) pendente(s)); participação bloqueada.');
        });
        return lista;
      }, []);
      document.getElementById('trResumo').innerHTML = totais.map(function (texto) { return '<p>' + escapar(texto) + '</p>'; }).join('')
        + (pendencias.length ? '<div class="aviso" role="status"><strong>Suspensões automáticas</strong><ul>'
          + pendencias.map(function (texto) { return '<li>' + escapar(texto) + '</li>'; }).join('') + '</ul></div>' : '')
        + tabelaAvisosHTML_(avisos);
    }

    function tabelaResultadoPayload_() {
      const draft = tabelaEstado.resultado, resultado = draft.resultado;
      if (resultado.wo && !draft.equipes.some(function (equipe) { return equipe.id === resultado.woEquipeId; })) throw new Error('Selecione a equipe ausente no WO.');
      if ((resultado.observacoes || '').length > 2000) throw new Error('As observações devem ter até 2.000 caracteres.');
      return {
        campeonatoId: draft.campeonatoId, id: draft.jogo.id, revisao: draft.revisao, revisaoElencos: draft.revisaoElencos,
        golsMandante: tabelaInteiro_(draft.jogo.golsMandante == null ? 0 : draft.jogo.golsMandante, 999),
        golsVisitante: tabelaInteiro_(draft.jogo.golsVisitante == null ? 0 : draft.jogo.golsVisitante, 999),
        resultado: {
          wo: !!resultado.wo, woEquipeId: resultado.wo ? resultado.woEquipeId : '', prorrogacao: !!resultado.prorrogacao, penaltis: !!resultado.penaltis,
          golsPenaltisMandante: resultado.penaltis ? tabelaInteiro_(resultado.golsPenaltisMandante == null ? 0 : resultado.golsPenaltisMandante, 999) : null,
          golsPenaltisVisitante: resultado.penaltis ? tabelaInteiro_(resultado.golsPenaltisVisitante == null ? 0 : resultado.golsPenaltisVisitante, 999) : null,
          observacoes: resultado.observacoes || ''
        },
        equipes: draft.equipes.map(function (equipe) {
          return { id: equipe.id, atletas: equipe.atletas.map(function (atleta) {
            const eventos = { id: atleta.id, numeroJogo: atleta.numeroJogo == null || atleta.numeroJogo === '' ? '' : tabelaInteiro_(atleta.numeroJogo, 999),
              participou: !!atleta.participou, gols: tabelaInteiro_(atleta.gols, 999), golsContra: tabelaInteiro_(atleta.golsContra, 999),
              amarelos: tabelaInteiro_(atleta.amarelos, 2), vermelho: !!atleta.vermelho };

    function dataBrParaIso_(valor) {
      const texto = String(valor || '').trim();
      if (!texto) return '';
      const partes = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!partes) throw new Error('Informe uma data válida no formato DD/MM/AAAA.');
      const dia = Number(partes[1]), mes = Number(partes[2]), ano = Number(partes[3]);
      const bissexto = ano % 4 === 0 && (ano % 100 !== 0 || ano % 400 === 0);
      const dias = [31, bissexto ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      if (ano < 1 || mes < 1 || mes > 12 || dia < 1 || dia > dias[mes - 1]) {
        throw new Error('Informe uma data válida no formato DD/MM/AAAA.');
      }
      return partes[3] + '-' + partes[2] + '-' + partes[1];
    }

    function validarCamposDataHora_(ids, aviso) {

      return true;

    function mascararDataHora_(campo) {
      const data = campo.dataset.formato === 'data-br';
      const original = campo.value;
      const cursor = campo.selectionStart;
      const digitosAntes = cursor == null ? null : original.slice(0, cursor).replace(/\D/g, '').length;
      const iso = data && original.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const digitos = (iso ? iso[3] + iso[2] + iso[1] : original.replace(/\D/g, '')).slice(0, data ? 8 : 4);
      campo.value = digitos.slice(0, 2)
        + (digitos.length > 2 ? (data ? '/' : ':') + digitos.slice(2, 4) : '')
        + (data && digitos.length > 4 ? '/' + digitos.slice(4) : '');
      if (!iso && digitosAntes != null && typeof campo.setSelectionRange === 'function') {
        let posicao = 0, contagem = 0;
        while (posicao < campo.value.length && contagem < digitosAntes) {
          if (/\d/.test(campo.value.charAt(posicao))) contagem++;
          posicao++;
        }
        campo.setSelectionRange(posicao, posicao);
      }
      validarCampoDataHora_(campo);
    }

          + '<span class="espaco"></span>'
          + '</div>'

      const vazio = '<div class="vazio">Nenhum campeonato cadastrado ainda.</div>';

      document.getElementById('areaCampeonatos').innerHTML = sucesso
        + resumo
        + barra
        + (registros.length
          ? '<div class="campeonatos-cards">' + linhas + '</div>'

        + '<div id="campeonatoFormArea"></div>'

        document.querySelectorAll('[data-editar-campeonato]').forEach(function (botao) {

         + campoTexto('cInicio', 'Data de início', registro ? registro.dataInicio : '', 'curto', '', 'date')
         + campoTexto('cFim', 'Data de fim', registro ? registro.dataFim : '', 'curto', '', 'date')

        + '<h4>Forma de disputa</h4>'

        + campoTexto('cFaseNome', 'Nome da fase', estrutura.faseNome, 'curto', '', 'text')
        + '<div class="campo largo"><label for="cFormato">Formato</label><select id="cFormato">'
        + opcoesSelect(campeonatos.formatos, estrutura.formato, '') + '</select></div>'
        + campoTexto('cGrupos', 'Quantidade de grupos (1 a 32)', estrutura.grupos, 'mini', '', 'number')
        + campoTexto('cVagas', 'Vagas por grupo (2 a 64)', estrutura.vagasPorGrupo, 'mini', '', 'number')
        + campoTexto('cRodadas', 'Quantidade de rodadas (1 a 99)', estrutura.rodadas, 'mini', '', 'number')

          return '<label><input type="checkbox" name="cFaseEliminatoria" value="' + fase[0] + '"'
            + ((estrutura.fasesEliminatorias || []).indexOf(fase[0]) >= 0 ? ' checked' : '') + '> ' + fase[1] + '</label>';

       document.getElementById('voltarCampeonatos').addEventListener('click', function () {

         gravarCampeonato(registro ? registro.id : '');

         document.getElementById('cEliminatorias').hidden = !/mata/i.test(document.getElementById('cFormato').value);

     function gravarCampeonato(idOriginal) {
       const botao = document.getElementById('gravarCampeonato');
       const aviso = document.getElementById('avisoCampeonato');
       if (!validarCamposDataHora_(['cInicio', 'cFim'], aviso)) return;

       botao.disabled = true;
       aviso.textContent = 'Gravando...';

       const payload = {
         idOriginal: idOriginal,
         nome: document.getElementById('cNome').value,
         temporada: document.getElementById('cTemporada').value,
         modalidade: document.getElementById('cModalidade').value,
         status: document.getElementById('cStatus').value,
         visibilidade: document.getElementById('cVisibilidade').value,
         responsavel: document.getElementById('cResponsavel').value,
         dataInicio: lerDataFormulario_('cInicio'),
         dataFim: lerDataFormulario_('cFim'),
         descricao: document.getElementById('cDescricao').value,
         estrutura: {
           faseNome: document.getElementById('cFaseNome').value,
           formato: document.getElementById('cFormato').value,
           grupos: document.getElementById('cGrupos').value,
           vagasPorGrupo: document.getElementById('cVagas').value,
           rodadas: document.getElementById('cRodadas').value,
           idaVolta: document.getElementById('cIdaVolta').value === 'sim',
           fasesEliminatorias: /mata/i.test(document.getElementById('cFormato').value)
             ? Array.from(document.querySelectorAll('[name="cFaseEliminatoria"]:checked')).map(function (item) { return item.value; }) : [],
           observacoes: document.getElementById('cObservacoes').value
         },
         escudo: ''
       };

       const inputEscudo = document.getElementById('cEscudo');
       if (inputEscudo && inputEscudo.files && inputEscudo.files[0]) {
         otimizarImagemEscudo_(inputEscudo.files[0]).then(function (escudo) {
           payload.escudo = escudo; enviarPayload();
         }).catch(function (erro) {
           botao.disabled = false;
           aviso.textContent = erro.message;
         });
       } else {
         enviarPayload();
       }

       function enviarPayload() {
         google.script.run
           .withSuccessHandler(function (dados) {
             campeonatos = dados;
             montarTelaCampeonatos(dados.recado);
           })
           .withFailureHandler(function (erro) {
             botao.disabled = false;
             aviso.innerHTML = '<span class="alerta">'
               + escapar(erro && erro.message ? erro.message : erro) + '</span>';
           })
           .salvarCampeonato(payload);
       }
     }

    function removerCampeonatoDoSistema(id) {
      if (!window.confirm('Remover este campeonato?')) {
        return;
      }

      document.getElementById('areaCampeonatos').innerHTML = blocoCarregando('statusCampeonatos');

      google.script.run
        .withSuccessHandler(function (dados) {
          campeonatos = dados;
          montarTelaCampeonatos(dados.recado);
        })
        .withFailureHandler(function (erro) {
          montarTelaCampeonatos();

          document.getElementById('areaCampeonatos').insertAdjacentHTML('afterbegin',
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>');
        })
        .removerCampeonato(id);
    }

    let timesCampeonato = { campeonatos: [], equipesGlobais: [], registros: [], podeEditar: false };
    let participantesRequisicao = 0;
    let campeonatoParticipantesAtual = '';
    let elencoAtual = null;
    let dialogoDetalhesElencoAtual = null;
    let rotaElencoPendente = Boolean(CONFIG.elenco && (CONFIG.elenco.campeonatoId || CONFIG.elenco.equipeId));

    function fecharDetalhesPessoaElenco(restaurarFoco) {
      const dialogo = dialogoDetalhesElencoAtual;
      if (!dialogo) return;
      const origem = dialogo._elencoOrigemFoco;
      dialogoDetalhesElencoAtual = null;
      if (dialogo.open && typeof dialogo.close === 'function') {
        dialogo.dataset.naoRestaurarFoco = 'true';
        dialogo.close();
      } else dialogo.removeAttribute('open');
      if (restaurarFoco) {
        if (origem && origem.isConnected) origem.focus();
      }
      dialogo._elencoOrigemFoco = null;
      const conteudo = dialogo.querySelector('[data-elenco-detalhes-conteudo]');
      if (conteudo) conteudo.replaceChildren();
    }

    function carregarTimesCampeonato() {
      if (rotaElencoPendente) {
        rotaElencoPendente = false;
        abrirElenco(CONFIG.elenco.campeonatoId, CONFIG.elenco.equipeId);
        return;
      }
      elencoAtual = null;
      const requisicao = ++participantesRequisicao;
      const campeonatoId = campeonatoParticipantesAtual;
      document.getElementById('areaTimesCampeonato').innerHTML = blocoCarregando('statusTimesCampeonato');
      google.script.run
        .withSuccessHandler(function (dados) {
          if (requisicao !== participantesRequisicao || moduloAtual !== 'times-campeonato' || elencoAtual) {
            return;
          }

          timesCampeonato = dados;
          campeonatoParticipantesAtual = dados.campeonatoId || '';
          montarTelaTimesCampeonato();
        })
        .withFailureHandler(function (erro) {
          if (requisicao !== participantesRequisicao || moduloAtual !== 'times-campeonato' || elencoAtual) {
            return;
          }

          document.getElementById('statusTimesCampeonato').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarEquipesParticipantes(campeonatoId);
    }

    function montarTelaTimesCampeonato(recado) {
      montarEquipesParticipantes(recado);
    }

    function montarEquipesParticipantes(recado) {
      elencoAtual = null;
      const area = document.getElementById('areaTimesCampeonato');
      const campeonatos = timesCampeonato.campeonatos || [];
      if (!campeonatos.length) {
        area.innerHTML = '<div class="aviso">Nenhum campeonato com equipe vinculada disponível. A diretoria deve cadastrar o campeonato e vincular a equipe.</div>';
        return;
      }
      if (!campeonatos.some(function (item) { return item.id === campeonatoParticipantesAtual; })) campeonatoParticipantesAtual = campeonatos[0].id;
      const registro = (timesCampeonato.registros || []).find(function (item) { return item.campeonatoId === campeonatoParticipantesAtual; }) || {};
      const times = registro.timesDetalhados || [];
      area.innerHTML = (recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '')
        + '<div class="campo largo"><label for="epCampeonato">Campeonato</label><select id="epCampeonato">'
        + opcoesSelect(campeonatos, campeonatoParticipantesAtual, '') + '</select></div>'
        + '<div class="barra-acoes participantes-acoes">' + (timesCampeonato.podeEditar ? '<button type="button" class="botao-principal" id="epVincular">Vincular equipe existente</button>' : '')
        + '<button type="button" class="botao-apoio" id="epAtualizar">Atualizar</button></div>'
        + '<div class="campeonatos-cards">' + times.map(function (time) {
          return '<article class="campeonato-card"><div class="campeonato-card-topo">'
            + '<div class="campeonato-card-escudo">'
            + (time.escudo ? '<img src="' + escapar(time.escudo) + '" alt="Escudo de ' + escapar(time.nome) + '">' : '<span aria-hidden="true">🛡️</span>')
            + '</div><div><h3>' + escapar(time.nome) + '</h3><div class="apoio">' + escapar(registro.campeonatoNome || (campeonatos.find(function (item) { return item.id === campeonatoParticipantesAtual; }) || {}).nome || '') + '</div></div></div>'
            + '<dl class="campeonato-card-dados">'
            + '<div><dt>Atletas</dt><dd>' + escapar(time.totalAtletas) + '</dd></div>'
            + '<div><dt>Comissão técnica</dt><dd>' + escapar(time.totalComissao) + '</dd></div>'
            + '<div><dt>Acesso do associado</dt><dd>' + (time.bloqueado ? 'Somente leitura' : 'Elenco liberado') + '</dd></div>'
            + '</dl>'
            + '<div class="barra-acoes participante-card-acoes"><button type="button" class="botao-principal" data-elenco="' + escapar(time.id) + '">Gerenciar elenco</button>'
            + (timesCampeonato.podeEditar ? '<button type="button" class="botao-apoio perigo" data-ep-remover="' + escapar(time.nome) + '">Desvincular</button>' : '')
            + '</div></article>';
        }).join('') + '</div>' + (!times.length ? '<div class="aviso">Nenhuma equipe vinculada neste campeonato.</div>' : '')
        + '<div id="timesFormArea"></div>';
      document.getElementById('epCampeonato').addEventListener('change', function () {
        campeonatoParticipantesAtual = this.value; carregarTimesCampeonato();
      });
      document.getElementById('epAtualizar').addEventListener('click', carregarTimesCampeonato);
      if (timesCampeonato.podeEditar) document.getElementById('epVincular').addEventListener('click', abrirVinculoEquipeParticipante);
      area.querySelectorAll('[data-elenco]').forEach(function (botao) {
        botao.addEventListener('click', function () { abrirElenco(campeonatoParticipantesAtual, botao.dataset.elenco); });
      });
      area.querySelectorAll('[data-ep-remover]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          if (botao.disabled || confirmacaoElencoAtual) return;
          const nome = botao.dataset.epRemover;
          const campeonatoId = campeonatoParticipantesAtual;
          const dadosOrigem = timesCampeonato;
          const campeonatoNome = (campeonatos.find(function (item) { return item.id === campeonatoId; }) || {}).nome || 'este campeonato';
          const naTela = function () {
            return moduloAtual === 'times-campeonato' && !elencoAtual && timesCampeonato === dadosOrigem
              && campeonatoParticipantesAtual === campeonatoId && botao.isConnected && !botao.disabled;
          };
          confirmarDescarteElenco_({
            titulo: 'Desvincular equipe do campeonato?',
            mensagem: 'A equipe "' + nome + '" deixará de participar de ' + campeonatoNome + '. '
              + 'Ela continua no Banco de Dados de Equipes e pode ser vinculada novamente. Equipes com atletas ou comissão vinculados não podem ser desvinculadas.',
            cancelar: 'Cancelar',
            confirmar: 'Desvincular equipe'
          }).then(function (confirmado) {
            if (!confirmado || !naTela()) return;
            botao.disabled = true;
            google.script.run.withSuccessHandler(function () {
              if (moduloAtual !== 'times-campeonato' || elencoAtual) return;
              carregarTimesCampeonato();
            })
              .withFailureHandler(function (erro) {
                botao.disabled = false;
                if (!area.isConnected || moduloAtual !== 'times-campeonato' || elencoAtual) return;
                area.insertAdjacentHTML('afterbegin', '<div class="erro">' + escapar(erro.message || erro) + '</div>');
              })
              .removerTimeCampeonato(campeonatoId, nome);
          });
        });
      });
    }

    function abrirVinculoEquipeParticipante() {
      const registro = (timesCampeonato.registros || []).find(function (item) { return item.campeonatoId === campeonatoParticipantesAtual; }) || {};
      const vinculados = (registro.timesDetalhados || []).map(function (item) { return item.id; });
      const disponiveis = (timesCampeonato.equipesGlobais || []).filter(function (item) {
        return !vinculados.includes(item.id) && !(registro.times || []).includes(item.nome);
      });
      document.getElementById('timesFormArea').innerHTML = '<section class="formulario campeonato-form vinculo-equipe-form"><h3>Vincular equipe existente</h3>'
        + '<div class="grupo"><h4>Equipe participante</h4><div class="campo cheio"><label for="epEquipe">Equipe do Banco de Dados de Equipes</label><select id="epEquipe">'
        + '<option value="">Selecione uma equipe disponível</option>'
        + disponiveis.map(function (item) { return '<option value="' + escapar(item.id) + '">' + escapar(item.nome) + '</option>'; }).join('')
        + '</select></div></div><div class="barra-acoes"><button type="button" class="botao-principal" id="epSalvar" disabled>Vincular</button>'
        + '<button type="button" class="botao-apoio" id="epCancelar">Cancelar</button></div><span id="epAviso" class="apoio" role="status" aria-live="polite">'
        + (!disponiveis.length ? 'Nenhuma equipe disponível. Cadastre no Banco de Dados de Equipes.' : 'Selecione uma equipe; equipes já vinculadas não aparecem nesta lista.') + '</span>'
        + '<div id="epLoading" hidden></div></section>';
      document.getElementById('epEquipe').addEventListener('change', function () {
        document.getElementById('epSalvar').disabled = !this.value;
      });
      document.getElementById('epCancelar').addEventListener('click', function () { document.getElementById('timesFormArea').innerHTML = ''; });
      document.getElementById('epSalvar').addEventListener('click', function () {
        if (!document.getElementById('epEquipe').value) return;
        const botao = this;
        const campeonatoId = campeonatoParticipantesAtual;
        const equipe = document.getElementById('epEquipe');
        const equipeId = equipe.value;
        const cancelar = document.getElementById('epCancelar');
        const aviso = document.getElementById('epAviso');
        const loading = document.getElementById('epLoading');
        botao.disabled = true;
        equipe.disabled = true;
        cancelar.disabled = true;
        aviso.textContent = 'Vinculando equipe...';
        loading.hidden = false;
        loading.innerHTML = blocoCarregando();
        google.script.run.withSuccessHandler(function (dados) {

              || document.getElementById('epSalvar') !== botao || elencoAtual) return;

          loading.innerHTML = '';

          equipe.disabled = false;

      });

    function abrirElenco(campeonatoId, equipeId) {
      const contexto = { campeonatoId: campeonatoId, equipeId: equipeId };

        if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
        cadastroPessoasCampeonato = dados;
        montarElenco();
      }).withFailureHandler(function (erro) {
        if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
        document.getElementById('areaTimesCampeonato').innerHTML = '<div class="erro">' + escapar(erro.message || erro) + '</div><button type="button" class="botao-apoio" id="elencoErroVoltar">Voltar às equipes</button>';

          : '<div class="elenco-vazio apoio">' + aba.nome + ' de ' + escapar(dados.equipe.nome) + ' em ' + escapar(registro.campeonatoNome) + ': área reservada para uma etapa futura. ' + (aba.tipo === 'jogos' ? 'A consulta e a operação dos jogos ainda não estão disponíveis nesta aba.' : 'As estatísticas ainda não estão disponíveis nesta aba.') + '</div>')
        + '</div>' + (cadastro ? '<div id="cadastroPessoasFormArea" class="elenco-painel" hidden></div>'
          + '<dialog class="elenco-detalhes-dialog" role="dialog" aria-modal="true" aria-labelledby="elencoDetalhesTitulo">'
          + '<div class="elenco-detalhes-conteudo"><div class="elenco-detalhes-marca">'
          + (CONFIG.logoUrl ? '<img src="' + escapar(CONFIG.logoUrl) + '" alt="Logo da AEUV">' : '')
          + '<span>AEUV — Identificação do elenco</span></div>'
          + '<div class="elenco-detalhes-topo"><h3 id="elencoDetalhesTitulo">Detalhes do cadastro</h3>'
          + '<button type="button" class="botao-apoio elenco-detalhes-fechar" data-elenco-fechar aria-label="Fechar detalhes">×</button></div>'
          + '<div class="elenco-detalhes-pessoa" data-elenco-detalhes-conteudo></div>'
          + (editavel ? '<div class="elenco-detalhes-acoes"><button type="button" class="botao-apoio" data-elenco-editar>Editar</button>'
          + '<button type="button" class="botao-apoio perigo" data-elenco-remover>Remover</button>'
          + '<p class="apoio elenco-remocao-motivo" id="elencoDetalhesRemocaoMotivo" data-elenco-remocao-motivo hidden></p></div>' : '') + '</div></dialog>' : '') + '</section>';
      const dialogo = cadastro ? area.querySelector('.elenco-detalhes-dialog') : null;
      if (dialogo) {
        dialogo.addEventListener('keydown', function (evento) {
          if (typeof dialogo.showModal === 'function' || evento.key !== 'Escape') return;

        });
        dialogo.addEventListener('close', function () {
          if (dialogo.dataset.naoRestaurarFoco === 'true') delete dialogo.dataset.naoRestaurarFoco;
          else if (dialogo._elencoOrigemFoco && dialogo._elencoOrigemFoco.isConnected) dialogo._elencoOrigemFoco.focus();
          dialogo._elencoOrigemFoco = null;
          if (dialogoDetalhesElencoAtual === dialogo) dialogoDetalhesElencoAtual = null;
          const conteudo = dialogo.querySelector('[data-elenco-detalhes-conteudo]');
          if (conteudo) conteudo.replaceChildren();
        });
        dialogo.addEventListener('click', function (evento) {
          if (evento.target === dialogo) fecharDetalhesPessoaElenco(true);
        });
        dialogo.querySelector('[data-elenco-fechar]').addEventListener('click', function () { fecharDetalhesPessoaElenco(true); });
      }
      document.getElementById('elencoVoltar').addEventListener('click', voltarEquipesElenco_);
      if (dados.podeBloquear) document.getElementById('elencoBloqueio').addEventListener('click', alternarBloqueioElenco_);
      if (cadastro && editavel) document.getElementById('elencoNovo').addEventListener('click', function () { abrirFormularioCadastroPessoa(elencoAtual.campeonatoId, abaElencoAtiva, ''); });
      if (cadastro && editavel) document.getElementById('elencoImportar').addEventListener('click', abrirImportacaoElenco);
      area.querySelectorAll('[data-elenco-aba]').forEach(function (botao) {
        botao.addEventListener('click', function () { if (botao.disabled) return; abaElencoAtiva = botao.dataset.elencoAba; montarElenco(); document.getElementById(botao.id).focus(); });
        botao.addEventListener('keydown', function (evento) {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(evento.key) || botao.disabled) return;
          evento.preventDefault();
          const indice = abas.findIndex(function (item) { return item.tipo === abaElencoAtiva; });
          const proxima = evento.key === 'Home' ? 0 : evento.key === 'End' ? abas.length - 1
            : (indice + (evento.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
          abaElencoAtiva = abas[proxima].tipo;
          montarElenco();
          document.getElementById(abas[proxima].id).focus();
        });
      });
      area.querySelectorAll('[data-elenco-detalhes]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          const pessoa = pessoas.find(function (item) { return item.id === botao.dataset.elencoDetalhes; });
          if (!pessoa || elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
          const conteudo = dialogo.querySelector('[data-elenco-detalhes-conteudo]');
          const foto = document.createElement('div');
          foto.className = 'elenco-detalhes-foto';
          foto.appendChild(document.createElement('span'));
          foto.firstChild.className = 'elenco-detalhes-placeholder';
          foto.firstChild.textContent = (String(pessoa.nome || '?').trim().charAt(0).toUpperCase() || '?');
          if (pessoa.foto) {
            const imagem = document.createElement('img');
            imagem.className = 'cadastro-foto-mini';
            imagem.src = pessoa.foto;
            imagem.alt = 'Foto de ' + String(pessoa.nome || 'cadastro');
            foto.replaceChildren(imagem);

          dadosPessoa.className = 'elenco-detalhes-dados';

            ['Nome', pessoa.nome],

            ['CPF', pessoa.cpf ? formatarCpf(pessoa.cpf) : ''],
            ['RG', pessoa.rg],
            [comissao ? 'Cargo' : 'Posição', comissao ? pessoa.cargo : pessoa.posicao],
            ['Apelido', comissao ? '' : pessoa.apelido],
            ['Número da camisa', comissao ? '' : pessoa.numero],
            ['Equipe', dados.equipe.nome],
            ['Campeonato', registro.campeonatoNome]
          ];
          campos.forEach(function (campo) {
            if (campo[1] === null || campo[1] === undefined || String(campo[1]).trim() === '') return;
            const item = document.createElement('div');
            const rotulo = document.createElement('dt');
            const valor = document.createElement('dd');
            rotulo.textContent = campo[0];
            valor.textContent = String(campo[1]);
            item.appendChild(rotulo);
            item.appendChild(valor);
            dadosPessoa.appendChild(item);
          });
          conteudo.replaceChildren(foto, dadosPessoa);
          dialogo.querySelector('#elencoDetalhesTitulo').textContent = 'Detalhes de ' + String(pessoa.nome || 'cadastro');
          const botaoEditar = dialogo.querySelector('[data-elenco-editar]');
          const botaoRemover = dialogo.querySelector('[data-elenco-remover]');
          if (botaoEditar) {
            botaoEditar.dataset.elencoEditar = pessoa.id;
            botaoEditar.setAttribute('aria-label', 'Editar ' + String(pessoa.nome || 'cadastro'));
          }
          if (botaoRemover) {
            const motivoRemocao = comissao ? '' : motivoBloqueioRemocaoAtleta_(pessoa);
            const ajudaRemocao = dialogo.querySelector('[data-elenco-remocao-motivo]');
            botaoRemover.dataset.elencoRemover = pessoa.id;
            botaoRemover.setAttribute('aria-label', 'Remover ' + String(pessoa.nome || 'cadastro'));
            botaoRemover.disabled = Boolean(motivoRemocao);
            if (motivoRemocao) {
              botaoRemover.title = motivoRemocao;
              botaoRemover.setAttribute('aria-describedby', ajudaRemocao.id);
            } else {
              botaoRemover.removeAttribute('title');
              botaoRemover.removeAttribute('aria-describedby');

            ajudaRemocao.hidden = !motivoRemocao;

          else {
            dialogo.setAttribute('open', '');

        });

      area.querySelectorAll('[data-elenco-editar]').forEach(function (botao) {

          const pessoaId = botao.dataset.elencoEditar;

          const pessoaId = botao.dataset.elencoRemover;
          if (botao.disabled || !pessoas.some(function (item) { return item.id === pessoaId; }) || elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
          removerCadastroPessoa(abaElencoAtiva, elencoAtual.campeonatoId, pessoaId);
        });
      });
      area.querySelectorAll('[data-elenco-transferir]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          const atleta = pessoas.find(function (item) { return item.id === botao.dataset.elencoTransferir; });

      if (dados.linkInscricao && cadastro) document.getElementById('elencoCopiar').addEventListener('click', function () {

    function abrirFormularioTransferenciaAtleta_(atleta) {
      if (!elencoAtual || cadastroPessoasCampeonato.podeTransferir !== true
          || atleta.participouCompeticao !== false
          || !(cadastroPessoasCampeonato.equipesDestinoTransferencia || []).length
          || !permitirEdicaoElenco_()) return;
      const estado = { contexto: elencoAtual, atletaId: atleta.id, salvando: false, recarregar: false };
      const destinos = cadastroPessoasCampeonato.equipesDestinoTransferencia;
      alternarFormularioElenco(true);
      const recadoAnterior = document.getElementById('elencoRecado');
      if (recadoAnterior) recadoAnterior.remove();
      const formulario = document.getElementById('cadastroPessoasFormArea');
      formulario.innerHTML = '<section class="grupo elenco-form"><h4>Transferir atleta</h4>'
        + '<p class="apoio"><strong>' + escapar(atleta.nome) + '</strong> — origem: '
        + escapar(cadastroPessoasCampeonato.equipe.nome) + ' / '
        + escapar(cadastroPessoasCampeonato.registros[0].campeonatoNome) + '.</p>'
        + '<label class="campo cheio" for="transferenciaEquipeDestino">Equipe de destino<select id="transferenciaEquipeDestino">'
        + '<option value="">Selecione outra equipe deste campeonato</option>'
        + destinos.map(function (item) { return '<option value="' + escapar(item.id) + '">' + escapar(item.nome) + '</option>'; }).join('')
        + '</select></label><div id="transferenciaAviso" role="status" aria-live="polite"></div>'
        + '<div class="barra-acoes"><button type="button" class="botao-principal" id="transferenciaConfirmar" disabled>Transferir atleta</button>'
        + '<button type="button" class="botao-apoio" id="transferenciaCancelar">Cancelar e voltar à lista</button></div></section>';
      const destino = document.getElementById('transferenciaEquipeDestino');
      const confirmar = document.getElementById('transferenciaConfirmar');
      const cancelar = document.getElementById('transferenciaCancelar');
      const aviso = document.getElementById('transferenciaAviso');
      destino.addEventListener('change', function () { confirmar.disabled = !destino.value || estado.salvando; });
      cancelar.addEventListener('click', function () {
        if (estado.salvando || elencoAtual !== estado.contexto) return;
        if (estado.recarregar) {
          abaElencoAtiva = 'atletas';
          abrirElenco(estado.contexto.campeonatoId, estado.contexto.equipeId);
        } else {
          montarElenco();
        }
      });
      confirmar.addEventListener('click', function () {
        if (confirmar.disabled || estado.salvando || elencoAtual !== estado.contexto || moduloAtual !== 'times-campeonato') return;
        const equipeDestinoId = destino.value;
        const equipeDestino = destinos.find(function (item) { return item.id === equipeDestinoId; });
        if (!equipeDestino) return;
        confirmarDescarteElenco_({
          titulo: 'Confirmar transferência?',
          mensagem: atleta.nome + ' será vinculado a ' + equipeDestino.nome + ' neste campeonato. O histórico desta equipe será preservado.',
          cancelar: 'Cancelar',
          confirmar: 'Transferir atleta',
          perigo: false
        }).then(function (aprovado) {
          if (!aprovado || elencoAtual !== estado.contexto || moduloAtual !== 'times-campeonato'
              || estado.salvando || !confirmar.isConnected) return;
          estado.salvando = true;
          marcarElencoPendente_(true);
          destino.disabled = true;
          confirmar.disabled = true;
          cancelar.disabled = true;
          aviso.textContent = 'Validando participação e transferindo atleta…';
          mostrarLoadingCadastroPessoa_(true);
          google.script.run.withSuccessHandler(function (dados) {
            if (elencoAtual !== estado.contexto || moduloAtual !== 'times-campeonato') return;
            mostrarLoadingCadastroPessoa_(false);
            estado.salvando = false;
            marcarElencoPendente_(false);
            cadastroPessoasCampeonato = dados;
            abaElencoAtiva = 'atletas';
            montarElenco(dados.recado);
          }).withFailureHandler(function (erro) {
            if (elencoAtual !== estado.contexto || moduloAtual !== 'times-campeonato') return;
            mostrarLoadingCadastroPessoa_(false);
            estado.salvando = false;
            estado.recarregar = true;
            marcarElencoPendente_(false);
            destino.disabled = true;
            confirmar.disabled = true;
            cancelar.disabled = false;
            cancelar.textContent = 'Atualizar elenco';
            aviso.innerHTML = '<span class="alerta">Não foi possível confirmar a transferência: '
              + escapar(erro && erro.message ? erro.message : erro)
              + ' Atualize o elenco antes de tentar novamente.</span>';
          }).transferirAtletaElenco({
            campeonatoId: estado.contexto.campeonatoId,
            equipeId: estado.contexto.equipeId,
            registroId: estado.atletaId,
            equipeDestinoId: equipeDestinoId
          });
        });
      });
    }

    function permitirEdicaoElenco_() {
      if (!elencoAtual) return true;
      if (elencoAtual.salvando) return false;
      if (cadastroPessoasCampeonato.podeEditar === true) return true;
      document.getElementById('elencoBloqueioAviso').textContent = 'Somente leitura — elenco bloqueado. Não é possível alterar ou importar cadastros.';
      return false;
    }

    function marcarElencoPendente_(pendente) {
      if (!elencoAtual) return;
      elencoAtual.salvando = pendente;
      document.getElementById('elencoVoltar').disabled = pendente;
      const bloqueio = document.getElementById('elencoBloqueio');
      if (bloqueio) bloqueio.disabled = pendente || document.getElementById('elencoLista').hidden;
      document.getElementById('areaTimesCampeonato').querySelectorAll('[data-elenco-aba]').forEach(function (botao) {
        botao.disabled = pendente || document.getElementById('elencoLista').hidden;
      });
    }

    let confirmacaoElencoAtual = null;

    function aprovacaoDescarteElencoValida_(aprovacao) {
      if (!aprovacao || aprovacao.tipo !== 'descarte-elenco' || aprovacao.usado) return false;
      aprovacao.usado = true;
      return aprovacao.elenco === elencoAtual && !elencoAtual.salvando && aprovacao.modulo === moduloAtual;
    }

    /**
     * Confirmacao propria (dialog nativo) do sistema: descarte do formulario
     * do elenco e remocoes de elenco/equipes. Resolve true so ao confirmar;
     * Esc, fundo e o botao de cancelar resolvem false e devolvem o foco a
     * origem. Opcoes: titulo, mensagem, confirmar, cancelar (padrao
     * "Continuar editando"), perigo (padrao true) e origemFoco.
     */
    function confirmarDescarteElenco_(opcoes) {
      if (confirmacaoElencoAtual) confirmacaoElencoAtual.finalizar(false);
      return new Promise(function (resolver) {
        const origem = opcoes.origemFoco || document.activeElement;
        const dialogo = document.createElement('dialog');
        const conteudo = document.createElement('div');
        const marca = document.createElement('div');
        const titulo = document.createElement('h3');
        const mensagem = document.createElement('p');
        const acoes = document.createElement('div');
        const cancelar = document.createElement('button');
        const confirmar = document.createElement('button');
        let finalizado = false;
        const registro = {};

        dialogo.className = 'elenco-confirmacao-dialog';
        dialogo.setAttribute('role', 'alertdialog');
        dialogo.setAttribute('aria-modal', 'true');
        dialogo.setAttribute('aria-labelledby', 'elencoConfirmacaoTitulo');
        dialogo.setAttribute('aria-describedby', 'elencoConfirmacaoMensagem');
        conteudo.className = 'elenco-confirmacao-conteudo';
        marca.className = 'elenco-detalhes-marca';
        if (CONFIG.logoUrl) {
          const logo = document.createElement('img');
          logo.src = CONFIG.logoUrl;
          logo.alt = '';
          marca.appendChild(logo);
        }
        marca.appendChild(document.createElement('span'));
        marca.lastChild.textContent = 'AEUV';
        titulo.id = 'elencoConfirmacaoTitulo';
        titulo.textContent = opcoes.titulo;
        mensagem.id = 'elencoConfirmacaoMensagem';
        mensagem.textContent = opcoes.mensagem || 'As alterações e seleções não salvas serão descartadas.';
        acoes.className = 'elenco-confirmacao-acoes';
        cancelar.type = 'button';
        cancelar.className = 'botao-apoio';
        cancelar.textContent = opcoes.cancelar || 'Continuar editando';
        cancelar.autofocus = true;
        confirmar.type = 'button';
        confirmar.className = opcoes.perigo === false ? 'botao-principal' : 'botao-apoio perigo';
        confirmar.textContent = opcoes.confirmar;
        acoes.appendChild(cancelar);
        acoes.appendChild(confirmar);
        conteudo.appendChild(marca);
        conteudo.appendChild(titulo);
        conteudo.appendChild(mensagem);
        conteudo.appendChild(acoes);
        dialogo.appendChild(conteudo);

        registro.finalizar = function (resultado) {
          if (finalizado) return;
          finalizado = true;
          if (confirmacaoElencoAtual === registro) confirmacaoElencoAtual = null;
          if (dialogo.open && typeof dialogo.close === 'function') dialogo.close();
          else dialogo.removeAttribute('open');
          if (dialogo.parentNode) dialogo.parentNode.removeChild(dialogo);
          if (!resultado && origem && origem.isConnected && typeof origem.focus === 'function') origem.focus();
          resolver(resultado);
        };
        confirmacaoElencoAtual = registro;

        cancelar.addEventListener('click', function () { registro.finalizar(false); });
        confirmar.addEventListener('click', function () { registro.finalizar(true); });
        dialogo.addEventListener('cancel', function (evento) {
          evento.preventDefault();
          registro.finalizar(false);
        });
        dialogo.addEventListener('keydown', function (evento) {
          if (evento.key !== 'Escape') return;
          evento.preventDefault();
          registro.finalizar(false);
        });
        dialogo.addEventListener('click', function (evento) {
          if (evento.target === dialogo) registro.finalizar(false);
        });
        dialogo.addEventListener('close', function () { registro.finalizar(false); });

        document.body.appendChild(dialogo);
        if (typeof dialogo.showModal === 'function') dialogo.showModal();
        else dialogo.setAttribute('open', '');
        cancelar.focus();
      });
    }

    function voltarEquipesElenco_() {
      if (!elencoAtual || elencoAtual.salvando || confirmacaoElencoAtual) return;
      const formulario = document.getElementById('cadastroPessoasFormArea');
      if (formulario && !formulario.hidden) {
        const contexto = elencoAtual;
        const moduloOrigem = moduloAtual;
        confirmarDescarteElenco_({
          titulo: 'Voltar às equipes participantes?',
          confirmar: 'Descartar e voltar'
        }).then(function (confirmado) {
          if (!confirmado || elencoAtual !== contexto || contexto.salvando || moduloAtual !== moduloOrigem) return;
          descartarVoltarEquipesElenco_();
        });
        return;
      }
      descartarVoltarEquipesElenco_();
    }

    function descartarVoltarEquipesElenco_() {
      campeonatoParticipantesAtual = elencoAtual.campeonatoId;
      importacaoElencoAtual = null;
      elencoAtual = null;
      fecharDetalhesPessoaElenco(false);
      carregarTimesCampeonato();
    }

    function alternarBloqueioElenco_() {
      if (!elencoAtual || elencoAtual.salvando || !cadastroPessoasCampeonato.podeBloquear) return;
      if (document.getElementById('elencoLista').hidden) return;
      const contexto = elencoAtual;
      const bloqueado = !cadastroPessoasCampeonato.bloqueado;
      marcarElencoPendente_(true);
      document.getElementById('areaTimesCampeonato').querySelectorAll('button').forEach(function (botao) { botao.disabled = true; });
      document.getElementById('elencoBloqueioAviso').textContent = 'Salvando bloqueio…';
      google.script.run.withSuccessHandler(function (dados) {
        if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
        cadastroPessoasCampeonato = dados;
        montarElenco(bloqueado ? 'Elenco bloqueado para o associado.' : 'Elenco desbloqueado.');
      }).withFailureHandler(function (erro) {
        if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
        montarElenco();
        document.getElementById('elencoBloqueioAviso').textContent = 'Não foi possível salvar o bloqueio: ' + (erro.message || erro) + ' Atualize o elenco antes de tentar novamente.';
      }).definirBloqueioElenco({ campeonatoId: contexto.campeonatoId, equipeId: contexto.equipeId, bloqueado: bloqueado });
    }

    function alternarFormularioElenco(aberto) {
      fecharDetalhesPessoaElenco(false);
      document.getElementById('elencoLista').hidden = aberto;
      document.getElementById('cadastroPessoasFormArea').hidden = !aberto;
      document.getElementById('elencoVoltar').disabled = !!(elencoAtual && elencoAtual.salvando);
      const bloqueio = document.getElementById('elencoBloqueio');
      if (bloqueio) bloqueio.disabled = aberto || !!(elencoAtual && elencoAtual.salvando);
      document.getElementById('areaTimesCampeonato').querySelectorAll('[data-elenco-aba]').forEach(function (botao) { botao.disabled = aberto; });
    }

    let importacaoElencoAtual = null;

    function abrirImportacaoElenco() {
      if (!elencoAtual || !permitirEdicaoElenco_() || !['atletas', 'comissao'].includes(abaElencoAtiva)) return;
      const estado = { contexto: elencoAtual, tipo: abaElencoAtiva, requisicao: 0, salvando: false };
      importacaoElencoAtual = estado;
      alternarFormularioElenco(true);
      document.getElementById('cadastroPessoasFormArea').innerHTML =
        '<section class="grupo elenco-form elenco-importacao"><h4>' + (estado.tipo === 'comissao' ? 'Importar comissão técnica' : 'Importar atletas') + '</h4>'
        + '<p class="apoio">Destino: ' + escapar(cadastroPessoasCampeonato.equipe.nome) + ' — ' + escapar(cadastroPessoasCampeonato.registros[0].campeonatoNome) + '. '
        + 'Escolha uma competição em que esta mesma equipe esteve inscrita, mesmo sem jogos. Os dados serão copiados sem alterar a origem.</p>'
        + '<label class="campo">Competição de origem<select id="importacaoOrigem" disabled><option value="">Carregando histórico…</option></select></label>'
        + '<div id="importacaoAviso" role="status" aria-live="polite"></div><div id="importacaoLoading" role="status" aria-label="Operação em andamento" hidden></div><div id="importacaoCandidatos" aria-busy="false"></div>'
        + '<p id="importacaoContagem" class="apoio" aria-live="polite">0 selecionados</p>'
        + '<div class="barra-acoes"><button type="button" class="botao-principal" id="importacaoSalvar" disabled>Importar selecionados</button>'
        + '<button type="button" class="botao-apoio" id="importacaoCancelar">Cancelar e voltar à lista</button></div></section>';
      document.getElementById('importacaoCancelar').addEventListener('click', function () {
        if (estado.salvando || !importacaoElencoVigente_(estado)) return;
        importacaoElencoAtual = null;
        if (estado.recarregar) {
          abrirElenco(estado.contexto.campeonatoId, estado.contexto.equipeId);
          abaElencoAtiva = estado.tipo;
        } else montarElenco();
      });
      document.getElementById('importacaoOrigem').addEventListener('change', function () { carregarOrigemImportacaoElenco_(estado, false); });
      document.getElementById('importacaoSalvar').addEventListener('click', function () { salvarImportacaoElenco_(estado); });
      carregarOrigemImportacaoElenco_(estado, true);
    }

    function importacaoElencoVigente_(estado) {
      return importacaoElencoAtual === estado && elencoAtual === estado.contexto && moduloAtual === 'times-campeonato';
    }

    function atualizarContagemImportacaoElenco_() {
      const quantidade = document.querySelectorAll('[data-importacao-id]:checked').length;
      document.getElementById('importacaoContagem').textContent = quantidade + ' selecionado(s)';
      document.getElementById('importacaoSalvar').disabled = !quantidade;
    }

    function mostrarLoadingImportacaoElenco_(ativo) {
      const loading = document.getElementById('importacaoLoading');
      loading.hidden = !ativo;
      loading.innerHTML = ativo ? blocoCarregando() : '';
      document.getElementById('importacaoCandidatos').setAttribute('aria-busy', String(ativo));
    }

    function carregarOrigemImportacaoElenco_(estado, inicial) {
      if (!importacaoElencoVigente_(estado) || estado.salvando) return;
      const origem = document.getElementById('importacaoOrigem');
      const origemId = inicial ? '' : origem.value;
      const requisicao = ++estado.requisicao;
      document.getElementById('importacaoSalvar').disabled = true;
      document.getElementById('importacaoContagem').textContent = '0 selecionados';
      document.getElementById('importacaoCandidatos').innerHTML = '';
      document.getElementById('importacaoAviso').textContent = 'Carregando histórico…';
      mostrarLoadingImportacaoElenco_(true);
      google.script.run.withSuccessHandler(function (dados) {
        if (!importacaoElencoVigente_(estado) || requisicao !== estado.requisicao) return;
        mostrarLoadingImportacaoElenco_(false);
        if (inicial) {
          origem.innerHTML = '<option value="">Selecione a competição de origem</option>' + dados.origens.map(function (item) {
            return '<option value="' + escapar(item.campeonatoId) + '">' + escapar(item.nome) + ' — ' + escapar(item.equipeNome) + '</option>';
          }).join('');
          origem.disabled = !dados.origens.length;
        }
        document.getElementById('importacaoAviso').textContent = !dados.origens.length
          ? 'Não há outras competições registradas para esta equipe. O histórico não reconstrói inscrições excluídas antes de sua ativação.'
          : origemId && !dados.candidatos.length ? 'Nenhuma inscrição deste tipo na origem selecionada.'
            : origemId ? 'Inscrições atuais e anteriores. Cadastros inválidos ou já inscritos no destino ficam indisponíveis.' : 'Selecione uma origem para consultar as inscrições.';
        document.getElementById('importacaoCandidatos').innerHTML = dados.candidatos.length
          ? '<label class="importacao-selecionar-todos"><input type="checkbox" id="importacaoTodos"> Selecionar todos os disponíveis</label>'
            + '<div class="tabela-rolagem"><table class="usuarios"><thead><tr><th>Selecionar</th><th>Nome / CPF</th><th>Função na origem</th><th>Inscrição na origem / impedimento</th></tr></thead><tbody>'
            + dados.candidatos.map(function (item) {
              return '<tr><td><input type="checkbox" data-importacao-id="' + escapar(item.id) + '" aria-label="Selecionar ' + escapar(item.nome) + '"' + (item.motivo ? ' disabled' : '') + '></td>'
                + '<td>' + escapar(item.nome) + '<br>' + escapar(formatarCpf(item.cpf)) + '</td><td>' + escapar(item.funcao) + '</td>'
                + '<td>' + (item.jaCadastrado
                  ? '<span class="pilula">Já cadastrado no destino</span><div class="apoio">Não precisa importar novamente.</div>'
                  : escapar(item.situacao) + (item.motivo ? '<br><span class="alerta">' + escapar(item.motivo) + '</span>' : '')) + '</td></tr>';
            }).join('') + '</tbody></table></div>' : '';
        document.querySelectorAll('[data-importacao-id]').forEach(function (checkbox) {
          checkbox.addEventListener('change', atualizarContagemImportacaoElenco_);
        });
        const todos = document.getElementById('importacaoTodos');
        if (todos) todos.addEventListener('change', function () {
          document.querySelectorAll('[data-importacao-id]:not(:disabled)').forEach(function (checkbox) { checkbox.checked = todos.checked; });
          atualizarContagemImportacaoElenco_();
        });
      }).withFailureHandler(function (erro) {
        if (!importacaoElencoVigente_(estado) || requisicao !== estado.requisicao) return;
        mostrarLoadingImportacaoElenco_(false);
        document.getElementById('importacaoAviso').textContent = 'Não foi possível consultar o histórico: ' + (erro.message || erro) + ' Cancele e tente novamente.';
      }).listarImportacaoElenco({
        campeonatoId: estado.contexto.campeonatoId, equipeId: estado.contexto.equipeId, tipo: estado.tipo, origemId: origemId
      });
    }

    function salvarImportacaoElenco_(estado) {
      if (!importacaoElencoVigente_(estado) || estado.salvando) return;
      const ids = Array.from(document.querySelectorAll('[data-importacao-id]:checked:not(:disabled)')).map(function (item) { return item.dataset.importacaoId; });
      if (!ids.length) return;
      const origemId = document.getElementById('importacaoOrigem').value;
      estado.salvando = true;
      marcarElencoPendente_(true);
      document.getElementById('cadastroPessoasFormArea').querySelectorAll('button, input, select').forEach(function (item) { item.disabled = true; });
      document.getElementById('importacaoAviso').textContent = 'Validando e importando ' + ids.length + ' cadastro(s)…';
      mostrarLoadingImportacaoElenco_(true);
      google.script.run.withSuccessHandler(function (resultado) {
        if (!importacaoElencoVigente_(estado)) return;
        document.getElementById('importacaoAviso').textContent = resultado.recado + ' Atualizando lista…';
        google.script.run.withSuccessHandler(function (dados) {
          if (!importacaoElencoVigente_(estado)) return;
          cadastroPessoasCampeonato = dados;
          montarElenco(resultado.recado);
        }).withFailureHandler(function (erro) {
          if (!importacaoElencoVigente_(estado)) return;
          falhaImportacaoElenco_(estado, 'A importação foi salva, mas a lista não pôde ser atualizada. ' + (erro.message || erro));
        }).listarElenco(estado.contexto.campeonatoId, estado.contexto.equipeId);
      }).withFailureHandler(function (erro) {
        if (!importacaoElencoVigente_(estado)) return;
        falhaImportacaoElenco_(estado, erro.message || erro);
      }).importarCadastrosElenco({
        campeonatoId: estado.contexto.campeonatoId, equipeId: estado.contexto.equipeId,
        tipo: estado.tipo, origemId: origemId, inscricaoIds: ids
      });
    }

    function falhaImportacaoElenco_(estado, mensagem) {
      estado.salvando = false;
      marcarElencoPendente_(false);
      estado.recarregar = true;
      mostrarLoadingImportacaoElenco_(false);
      document.getElementById('importacaoAviso').textContent = 'Erro: ' + mensagem + ' Volte à lista e atualize o elenco antes de tentar novamente.';
      document.getElementById('importacaoCancelar').disabled = false;
      // Do not offer an automatic retry after an uncertain Drive write.
    }

     /********* ATLETAS E COMISSÃO TÉCNICA *********/
     let cadastroPessoasCampeonato = { campeonatos: [], times: {}, registros: [], posicoes: [], podeEditar: false };
     let abaCadastroPessoasAtiva = 'atletas';
     let abaElencoAtiva = 'atletas';
     let modoEdicaoCadastroPessoas = false;

     function carregarCadastroPessoasCampeonato(abaInicial) {
       abaCadastroPessoasAtiva = abaInicial === 'comissao' ? 'comissao' : 'atletas';

       google.script.run
         .withSuccessHandler(function (dados) {
           if (moduloAtual !== 'atletas-campeonato' && moduloAtual !== 'comissao-campeonato') {
             return;
           }

           cadastroPessoasCampeonato = dados;
           montarTelaCadastroPessoasCampeonato();
         })
         .withFailureHandler(function (erro) {
           if (moduloAtual !== 'atletas-campeonato' && moduloAtual !== 'comissao-campeonato') {
             return;
           }

           document.getElementById('statusCadastroPessoasCampeonato').outerHTML =
             '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
         })
         .listarCadastroPessoasCampeonato();
     }

     function carregarComissaoTecnica() {
       carregarCadastroPessoasCampeonato('comissao');
     }

     function carregarAtletasCampeonato() {
       carregarCadastroPessoasCampeonato('atletas');
     }

     function rotuloAbaCadastroPessoa() {
       return abaCadastroPessoasAtiva === 'comissao' ? 'Comissão técnica' : 'Atletas';
     }

     function colecaoCadastroPessoaAtual() {
       return abaCadastroPessoasAtiva === 'comissao' ? 'comissao' : 'atletas';
     }

     function fotoCadastroPessoa_(pessoa) {
       if (pessoa && pessoa.foto) {
         return '<img class="cadastro-foto-mini" src="' + escapar(pessoa.foto) + '" alt="' + escapar(pessoa.nome || 'Foto') + '">';
       }

       const inicial = escapar(((pessoa && pessoa.nome) || '?').trim().charAt(0).toUpperCase() || '?');
       return '<div class="cadastro-foto-placeholder">' + inicial + '</div>';
     }

     function listarRegistrosCadastroPessoa(tipo) {
       const chave = tipo === 'comissao' ? 'comissao' : 'atletas';
       const linhas = [];

       (cadastroPessoasCampeonato.registros || []).forEach(function (registro) {
         (registro[chave] || []).forEach(function (pessoa) {
           linhas.push({
             campeonatoId: registro.campeonatoId,
             campeonatoNome: registro.campeonatoNome,
             pessoa: pessoa
           });
         });
       });

       return linhas.sort(function (a, b) {
         return String((a.pessoa && a.pessoa.nome) || '').localeCompare(String((b.pessoa && b.pessoa.nome) || ''), 'pt-BR');
       });
     }

     function montarTelaCadastroPessoasCampeonato(recado) {
       if (elencoAtual) {
         montarElenco(recado);
         return;
       }
       const area = document.getElementById('areaCadastroPessoasCampeonato');
       const registros = cadastroPessoasCampeonato.registros || [];
       const sucesso = recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '';

       if (!(cadastroPessoasCampeonato.campeonatos || []).length) {
         area.innerHTML = sucesso
           + '<div class="aviso"><strong>Cadastre um campeonato primeiro.</strong> Vincule times e depois cadastre atletas ou comissão técnica.</div>';
         return;
       }

       const resumoCampeonatos = registros.map(function (item) {
         return '<tr>'
           + '<td data-rotulo="Campeonato">' + escapar(item.campeonatoNome || '-') + '</td>'
           + '<td data-rotulo="Atletas">' + ((item.atletas || []).length) + '</td>'
           + '<td data-rotulo="Comissão">' + ((item.comissao || []).length) + '</td>'
           + '<td class="acoes-linha" data-rotulo="Ações"><button type="button" class="botao-apoio" data-gerenciar-cadastro="' + escapar(item.campeonatoId) + '">Gerenciar</button></td>'
           + '</tr>';
       }).join('');

       const linhasCadastro = listarRegistrosCadastroPessoa(colecaoCadastroPessoaAtual()).map(function (item, indice) {
         const pessoa = item.pessoa || {};
         const apelidoColuna = abaCadastroPessoasAtiva === 'atletas'
           ? '<td data-rotulo="Apelido">' + escapar(pessoa.apelido || '—') + '</td>'
           : '';
         const motivoRemocao = abaCadastroPessoasAtiva === 'atletas' ? motivoBloqueioRemocaoAtleta_(pessoa) : '';
         const ajudaRemocaoId = 'cadastroRemocaoMotivo' + indice;
         const acoes = modoEdicaoCadastroPessoas
           ? '<button type="button" class="botao-apoio" data-editar-cadastro data-tipo-cadastro="' + escapar(abaCadastroPessoasAtiva) + '" data-campeonato-id="' + escapar(item.campeonatoId) + '" data-registro-id="' + escapar(pessoa.id) + '">Editar</button>'
             + ' <button type="button" class="botao-apoio perigo" data-remover-cadastro data-tipo-cadastro="' + escapar(abaCadastroPessoasAtiva) + '" data-campeonato-id="' + escapar(item.campeonatoId) + '" data-registro-id="' + escapar(pessoa.id) + '"'
             + (motivoRemocao ? ' disabled title="' + escapar(motivoRemocao) + '" aria-describedby="' + ajudaRemocaoId + '"' : '') + '>Remover</button>'
             + (motivoRemocao ? '<p class="apoio elenco-remocao-motivo" id="' + ajudaRemocaoId + '">' + escapar(motivoRemocao) + '</p>' : '')
           : '<span class="apoio">Ative o modo edição</span>';

         return '<tr>'
           + '<td data-rotulo="Foto">' + fotoCadastroPessoa_(pessoa) + '</td>'

     function abrirFormularioCadastroPessoa(campeonatoId, tipo, registroId) {
       if (!permitirEdicaoElenco_()) return;

       const cargos = cadastroPessoasCampeonato.cargos || [];
