    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarSolicitacoes() {
      const busca = simplificar(document.getElementById('buscaSolicitacoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (solicitacoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaSolicitacao(registro)).indexOf(busca) !== -1;
      });

      desenharResumoSolicitacoes(filtrados);
      desenharLinhasSolicitacoes(filtrados);
    }

    /**
     * Junta o cabecalho e os nomes dos atletas para a busca livre
     * encontrar a solicitacao tambem por quem foi inscrito nela.
     */
    function textoDaSolicitacao(registro) {
      return [
        registro.protocolo,
        registro.dataHora,
        registro.situacao,
        registro.competicao,
        registro.equipe,
        registro.responsavel,
        registro.telefone
      ].concat((registro.pessoas || []).map(function (pessoa) {
        return pessoa.nome + ' ' + pessoa.cpf + ' ' + pessoa.acao + ' ' + pessoa.tipo;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     * Alem das solicitacoes, conta os atletas envolvidos nelas.
     */
    function desenharResumoSolicitacoes(registros) {
      const pessoas = registros.reduce(function (total, registro) {
        return total + registro.quantidade;
      }, 0);

      function porSituacao(situacao) {
        return registros.filter(function (registro) {
          return registro.situacao === situacao;
        }).length;
      }

      const itens = [
        ['', registros.length, 'Solicitações'],
        ['cumprir', porSituacao('Aguardando'), 'Aguardando'],
        ['cumprida', porSituacao('Processada'), 'Processadas'],
        ['pendente', porSituacao('Falha'), 'Com falha'],
        ['', pessoas, 'Registros']
      ];

      document.getElementById('resumoSolicitacoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (solicitacoes.registros || []).length;

      document.getElementById('contagemSolicitacoes').textContent = registros.length === total
        ? registros.length + ' solicitação(ões)'
        : registros.length + ' de ' + total + ' solicitação(ões)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha pode abrir uma segunda,
     * com os dados completos e a lista de atletas da solicitacao.
     */
    function desenharLinhasSolicitacoes(registros) {
      if (!registros.length) {
        document.getElementById('linhasSolicitacoes').innerHTML =
          '<tr><td colspan="7" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma solicita&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasSolicitacoes').innerHTML = registros.map(function (r) {
        const aberta = !!solicitacoesAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Situação', '<span class="' + classeSituacaoSolicitacao(r.situacao) + '">'
            + escapar(r.icone + ' ' + r.situacao) + '</span>')
          + celula('Protocolo', '<span class="protocolo">' + escapar(r.protocolo || '—') + '</span>')
          + celula('Enviada em', escapar(r.dataHora || '—')
            + '<div class="equipe-dado">' + escapar(r.competicao) + '</div>')
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Responsável', escapar(r.responsavel)
            + '<div class="equipe-dado">' + escapar(r.telefone) + '</div>')
          + celula('Registros', contagemPorAcao(r))
          + celula('Resultado', atalhoPdfDoResultado(r))
          + '</tr>';

        return linha + (aberta ? detalheSolicitacao(r) : '');
      }).join('');

      conteudo.querySelectorAll('.solicitacoes tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (solicitacoesAbertas[chave]) {
            delete solicitacoesAbertas[chave];
          } else {
            solicitacoesAbertas[chave] = true;
          }

          filtrarSolicitacoes();
        });
      });

      // O clique no link do resultado nao deve abrir ou fechar a linha junto.
      conteudo.querySelectorAll('#linhasSolicitacoes [data-nao-abre]').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.stopPropagation();
        });
      });
    }

    /**
     * Quantas pessoas de cada acao a solicitacao tem. Acoes zeradas
     * ficam de fora para a coluna nao virar uma lista de zeros.
     */
    function contagemPorAcao(registro) {
      const partes = (solicitacoes.acoes || []).filter(function (acao) {
        return registro.resumo[acao];
      }).map(function (acao) {
        return '<span><strong>' + registro.resumo[acao] + '</strong> ' + escapar(nomeAcao(acao)) + '</span>';
      });

      if (!partes.length) {
        return '<span class="equipe-dado">nenhum registro</span>';
      }

      return '<div class="contagem">' + partes.join('') + '</div>';
    }

    /**
     * O formulario grava as acoes sem acento; aqui elas voltam acentuadas.
     */
    function nomeAcao(acao) {
      const nomes = { Inclusao: 'inclusão', Remocao: 'remoção', Portabilidade: 'portabilidade' };

      return nomes[acao] || acao;
    }

    /**
     * O resultado em PDF, que e o documento de leitura. Fica na propria
     * linha; o TXT continua no detalhe, para quem precisa do arquivo bruto.
     */
    function atalhoPdfDoResultado(registro) {
      if (!registro.resultadoPdfUrl) {
        return registro.situacao === 'Aguardando'
          ? '<span class="equipe-dado">—</span>'
          : '<span class="equipe-dado">não publicado</span>';
      }

      return '<a class="botao-apoio destaque" data-nao-abre="1" href="'
        + escapar(registro.resultadoPdfUrl) + '" target="_blank" rel="noopener">Ver resultado</a>';
    }

    /**
     * Botoes do resultado da automacao, publicados pelo Python na pasta
     * "Resultados". Sao eles que mostram por que um registro falhou.
     *
     * O PDF fica na coluna "Resultado" da linha; aqui sobra o TXT, que e a
     * origem do que a automacao leu.
     *
     * Enquanto a automacao nao roda o resultado nao existe, e a solicitacao
     * aparece sem esses botoes — por isso o aviso so surge quando ja houve
     * processamento (situacao diferente de "Aguardando").
     */
    function linksResultado(registro) {
      const txt = registro.resultadoTxtUrl;

      if (!txt) {
        return registro.situacao === 'Aguardando' || registro.resultadoPdfUrl
          ? ''
          : '<span class="equipe-dado">Resultado ainda não publicado</span>';
      }

      return '<a class="botao-apoio" href="' + escapar(txt)
        + '" target="_blank" rel="noopener">Resultado (TXT)</a>';
    }

    /**
     * Linha extra com os dados completos e a tabela de atletas.
     */
    function detalheSolicitacao(registro) {
      const dados = [
        ['Competição', registro.competicao],
        ['Telefone', registro.telefone],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + (registro.comprovanteUrl
          ? '<a class="botao-apoio" href="' + escapar(registro.comprovanteUrl) + '" target="_blank" rel="noopener">Comprovante PIX</a>'
          : '<span class="equipe-dado">Sem comprovante anexado</span>')
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + linksResultado(registro)
        + '</div>';

      const pessoas = (registro.pessoas || []).map(function (p) {
        return '<tr>'
          + celula('Ação', escapar(nomeAcao(p.acao)))
          + celula('Tipo', escapar(p.tipo))
          + celula('Nome', '<span class="pessoa-nome">' + escapar(p.nome) + '</span>')
          + celula('Nascimento', escapar(p.nascimento || '—'))
          + celula('CPF', escapar(formatarCpf(p.cpf) || '—'))
          + celula('Competição anterior', escapar(p.competicaoAnterior || '—'))
          + '</tr>';
      }).join('');

      const tabela = pessoas
        ? '<table class="pessoas"><thead><tr><th>A&ccedil;&atilde;o</th><th>Tipo</th><th>Nome</th>'
          + '<th>Nascimento</th><th>CPF</th><th>Competi&ccedil;&atilde;o anterior</th></tr></thead>'
          + '<tbody>' + pessoas + '</tbody></table>'
        : '<p class="equipe-dado">Esta solicita&ccedil;&atilde;o n&atilde;o tem registros.</p>';

      return '<tr class="detalhe"><td colspan="7"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + tabela
        + links
        + '</div></td></tr>';
    }

    function classeSituacaoSolicitacao(situacao) {
      return 'pilula ' + simplificar(situacao);
    }

    /********* BANCO DE DADOS DE ATLETAS *********/

    /**
     * Le uma vez do servidor (elencos de todos os campeonatos, historico
     * permanente de inscricoes e fontes legadas) e filtra sobre essa copia.
     * O detalhe abre na propria tabela, como nas Sumulas Enviadas.
     */
    let atletasBd = { dados: null, abertos: {} };
    let atletasBdRequisicao = 0;

    function carregarAtletas() {
      const requisicao = ++atletasBdRequisicao;

      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'atletas' || requisicao !== atletasBdRequisicao) return;
          atletasBd = { dados: dados || { registros: [] }, abertos: {} };
          montarTelaAtletas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'atletas' || requisicao !== atletasBdRequisicao) return;
          const status = document.getElementById('statusAtletas');
          if (status) status.outerHTML = '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarAtletas();
    }

    function atletaBdValores_(registros) {
      const equipes = [];
      const competicoes = [];
      const incluir = function (lista, valor) {
        if (valor && lista.indexOf(valor) === -1) lista.push(valor);
      };

      registros.forEach(function (registro) {
        (registro.vinculos || []).forEach(function (vinculo) {
          incluir(equipes, vinculo.equipeNome);
          incluir(competicoes, vinculo.campeonatoNome);
        });
        (registro.equipesHistorico || []).forEach(function (valor) { incluir(equipes, valor); });
        (registro.competicoesHistorico || []).forEach(function (valor) { incluir(competicoes, valor); });
      });

      const ordenar = function (a, b) { return String(a).localeCompare(String(b), 'pt-BR'); };

      return { equipes: equipes.sort(ordenar), competicoes: competicoes.sort(ordenar) };
    }

    function montarTelaAtletas() {
      const status = document.getElementById('statusAtletas');
      const dados = atletasBd.dados || {};
      const registros = dados.registros || [];
      const fontes = dados.fontes || {};
      const termo = consumirBusca();

      if (!status) return;

      if (!registros.length) {
        status.outerHTML = '<div class="vazio">Nenhum atleta encontrado nos elencos dos campeonatos, no hist&oacute;rico '
          + 'de inscri&ccedil;&otilde;es ou nas solicita&ccedil;&otilde;es, puni&ccedil;&otilde;es e s&uacute;mulas.</div>';
        return;
      }

      const valores = atletaBdValores_(registros);
      const opcoes = function (lista) {
        return lista.map(function (valor) {
          return '<option value="' + escapar(valor) + '">' + escapar(valor) + '</option>';
        }).join('');
      };
      const recortes = [];

      if (Number(fontes.solicitacoesTotal || 0) > Number(fontes.solicitacoesLidas || 0)) {
        recortes.push('solicitações: ' + fontes.solicitacoesLidas + ' mais recentes de ' + fontes.solicitacoesTotal);
      }

      if (Number(fontes.sumulasTotal || 0) > Number(fontes.sumulasLidas || 0)) {
        recortes.push('súmulas: ' + fontes.sumulasLidas + ' mais recentes de ' + fontes.sumulasTotal);
      }

      status.outerHTML = ''
        + '<div class="resumo" id="resumoAtletas"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaAtletas" aria-label="Buscar atleta" placeholder="Buscar por nome, apelido ou CPF">'
        + '<select id="filtroEquipeAtletas" aria-label="Equipe"><option value="">Todas as equipes</option>' + opcoes(valores.equipes) + '</select>'
        + '<select id="filtroCompeticaoAtletas" aria-label="Competi&ccedil;&atilde;o"><option value="">Todas as competi&ccedil;&otilde;es</option>' + opcoes(valores.competicoes) + '</select>'
        + '<select id="filtroVinculoAtletas" aria-label="V&iacute;nculo no elenco">'
        + '<option value="">Todos os v&iacute;nculos</option>'
        + '<option value="atual">Com inscri&ccedil;&atilde;o atual</option>'
        + '<option value="historico">Com v&iacute;nculo anterior</option>'
        + '<option value="sem">Sem v&iacute;nculo no elenco</option>'
        + '</select>'
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemAtletas" aria-live="polite"></span>'
        + '<span class="espaco"></span>'
        + '<button type="button" class="botao-apoio" id="recarregarAtletas">Atualizar</button>'
        + '</div>'
        + '<p class="apoio">Inclui todos os atletas dos elencos de todos os campeonatos (inscri&ccedil;&otilde;es atuais e '
        + 'anteriores do hist&oacute;rico permanente) e as pessoas citadas em solicita&ccedil;&otilde;es, puni&ccedil;&otilde;es e s&uacute;mulas. '
        + 'Clique no atleta para ver o hist&oacute;rico de v&iacute;nculos.'
        + (recortes.length ? ' Fontes legadas parciais (' + escapar(recortes.join('; ')) + ').' : '')
        + '</p>'
        + '<div class="tabela-rolagem"><table class="solicitacoes atletas-bd"><thead><tr>'
        + '<th>Atleta</th><th>Situa&ccedil;&atilde;o</th><th>Equipe atual</th><th>Competi&ccedil;&atilde;o atual</th>'
        + '<th>V&iacute;nculos</th><th>Disciplina</th>'
        + '</tr></thead><tbody id="linhasAtletas"></tbody></table></div>';

      document.getElementById('buscaAtletas').addEventListener('input', filtrarAtletas);
      ['filtroEquipeAtletas', 'filtroCompeticaoAtletas', 'filtroVinculoAtletas'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', filtrarAtletas);
      });
      document.getElementById('recarregarAtletas').addEventListener('click', function () {
        abrirModulo('atletas');
      });
      document.getElementById('linhasAtletas').addEventListener('click', cliqueLinhasAtletas_);

      if (termo) {
        document.getElementById('buscaAtletas').value = termo;
      }

      filtrarAtletas();
    }

    function cliqueLinhasAtletas_(evento) {
      const alvo = evento && evento.target;

      if (!alvo || !alvo.closest) return;

      const atalho = alvo.closest('[data-atleta-atalho]');

      if (atalho) {
        abrirModulo(atalho.dataset.atletaAtalho, atalho.dataset.atletaBusca || '');
        return;
      }

      if (alvo.closest('a')) return;

      const linha = alvo.closest('[data-atleta-indice]');

      if (linha) alternarAtletaBd(Number(linha.dataset.atletaIndice));
    }

    function alternarAtletaBd(indice) {
      const registro = ((atletasBd.dados || {}).registros || [])[indice];

      if (!registro) return;

      if (atletasBd.abertos[registro.chave]) {
        delete atletasBd.abertos[registro.chave];
      } else {
        atletasBd.abertos[registro.chave] = true;
      }

      filtrarAtletas();

      const botao = document.getElementById('atletaBdBotao' + indice);

      if (botao) botao.focus();
    }

    function filtrosAtletasBd_() {
      const valor = function (id) {
        const campo = document.getElementById(id);
        return campo ? String(campo.value || '').trim() : '';
      };

      return {
        busca: valor('buscaAtletas'),
        equipe: valor('filtroEquipeAtletas'),
        competicao: valor('filtroCompeticaoAtletas'),
        vinculo: valor('filtroVinculoAtletas')
      };
    }

    function atletaBdPassa_(registro, filtros) {
      const vinculos = registro.vinculos || [];

      if (filtros.busca) {
        const texto = simplificar([registro.nome, registro.cpf].concat(vinculos.map(function (vinculo) {
          return vinculo.nome + ' ' + vinculo.apelido + ' ' + vinculo.cpf;
        })).join(' '));
        const digitos = filtros.busca.replace(/\D/g, '');
        const porTexto = texto.indexOf(simplificar(filtros.busca)) !== -1;
        const porCpf = digitos.length >= 3 && /^[\d.\-\s]+$/.test(filtros.busca) && texto.indexOf(digitos) !== -1;

        if (!porTexto && !porCpf) return false;
      }

      if (filtros.vinculo === 'sem') {
        if (vinculos.length) return false;
      }

      const exigeVinculo = filtros.vinculo === 'atual' || filtros.vinculo === 'historico';

      if (!filtros.equipe && !filtros.competicao && !exigeVinculo) return true;

      const combina = vinculos.some(function (vinculo) {
        return (!filtros.equipe || vinculo.equipeNome === filtros.equipe)
          && (!filtros.competicao || vinculo.campeonatoNome === filtros.competicao)
          && (filtros.vinculo !== 'atual' || vinculo.atual)
          && (filtros.vinculo !== 'historico' || !vinculo.atual);
      });

      if (combina) return true;
      if (exigeVinculo) return false;

      // Solicitações, punições e súmulas não têm vínculo de elenco: valem as listas consolidadas.
      return (!filtros.equipe || (registro.equipesHistorico || []).indexOf(filtros.equipe) !== -1)
        && (!filtros.competicao || (registro.competicoesHistorico || []).indexOf(filtros.competicao) !== -1);
    }

    function filtrarAtletas() {
      const registros = (atletasBd.dados || {}).registros || [];
      const filtros = filtrosAtletasBd_();
      const filtrados = [];

      registros.forEach(function (registro, indice) {
        if (atletaBdPassa_(registro, filtros)) filtrados.push({ registro: registro, indice: indice });
      });

      desenharResumoAtletas(filtrados, registros.length);
      desenharLinhasAtletas(filtrados);

      return filtrados;
    }

    function desenharResumoAtletas(filtrados, total) {
      const equipes = {};
      const competicoes = {};
      let atuais = 0;
      let historicos = 0;
      let suspensos = 0;

      filtrados.forEach(function (item) {
        const registro = item.registro;

        if (Number(registro.vinculosAtuais || 0) > 0) atuais++;
        else if (Number(registro.totalVinculos || 0) > 0) historicos++;
        if (registro.situacaoDisciplina === 'Suspenso') suspensos++;

        (registro.vinculos || []).forEach(function (vinculo) {
          if (!vinculo.atual) return;
          if (vinculo.equipeNome) equipes[vinculo.equipeNome] = true;
          if (vinculo.campeonatoNome) competicoes[vinculo.campeonatoNome] = true;
        });
      });

      const itens = [
        ['', filtrados.length, 'Atletas'],
        ['cumprida', atuais, 'Com inscrição atual'],
        ['', historicos, 'Somente histórico'],
        ['pendente', suspensos, 'Suspensos'],
        ['', Object.keys(equipes).length, 'Equipes atuais'],
        ['', Object.keys(competicoes).length, 'Competições atuais']
      ];
      const resumo = document.getElementById('resumoAtletas');
      const contagem = document.getElementById('contagemAtletas');

      if (resumo) {
        resumo.innerHTML = itens.map(function (item) {
          return '<div class="indicador ' + item[0] + '">'
            + '<div class="numero">' + escapar(item[1]) + '</div>'
            + '<div class="rotulo">' + escapar(item[2]) + '</div>'
            + '</div>';
        }).join('');
      }

      if (contagem) {
        contagem.textContent = filtrados.length === total
          ? total + ' atleta(s)'
          : filtrados.length + ' de ' + total + ' atleta(s)';
      }
    }

    function cpfMascaradoAtletaBd_(cpf) {
      const d = String(cpf || '').replace(/\D/g, '');

      return d.length === 11 ? '***.' + d.slice(3, 6) + '.' + d.slice(6, 9) + '-**' : '';
    }

    function dataAtletaBd_(iso) {
      const data = iso ? new Date(iso) : null;

      return data && !isNaN(data.getTime()) ? data.toLocaleDateString('pt-BR') : '';
    }

    function classeSituacaoAtletaBd_(situacao) {
      const mapa = {
        'Suspenso': 'alerta',
        'Regular': 'ativo',
        'Inscrito no elenco': 'ativo',
        'Aguardando inscrição': 'aguardando',
        'Aguardando atualização': 'aguardando',
        'Pena a definir': 'pendente',
        'Cadastro com falha': 'falha',
        'Falha recente': 'falha'
      };

      return 'pilula ' + (mapa[situacao] || 'suspenso');
    }

    function classeVinculoAtletaBd_(vinculo) {
      if (vinculo.atual) return vinculo.ativo ? 'pilula ativo' : 'pilula pendente';

      return vinculo.campeonatoExcluido ? 'pilula inativo' : 'pilula suspenso';
    }

    function desenharLinhasAtletas(filtrados) {
      const corpo = document.getElementById('linhasAtletas');

      if (!corpo) return;

      if (!filtrados.length) {
        corpo.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--apoio);">'
          + 'Nenhum atleta encontrado com os filtros atuais.</td></tr>';
        return;
      }

      corpo.innerHTML = filtrados.map(function (item) {
        const r = item.registro;
        const i = item.indice;
        const aberto = !!atletasBd.abertos[r.chave];
        const idDetalhe = 'atletaBdDetalhe' + i;
        const cpf = cpfMascaradoAtletaBd_(r.cpf);
        const equipes = (r.equipesAtuais || []).length ? r.equipesAtuais.join(', ') : (r.equipeAtual || '');
        const competicoes = (r.competicoesAtuais || []).length ? r.competicoesAtuais.join(', ') : (r.competicaoAtual || '');
        const atuais = Number(r.vinculosAtuais || 0);
        const anteriores = Number(r.totalVinculos || 0) - atuais;

        const linha = '<tr class="linha" data-atleta-indice="' + i + '">'
          + celula('Atleta', '<button type="button" class="atleta-bd-alternar" id="atletaBdBotao' + i + '"'
            + ' aria-expanded="' + (aberto ? 'true' : 'false') + '" aria-controls="' + idDetalhe + '">'
            + '<span aria-hidden="true">' + (aberto ? '▾' : '▸') + '</span> '
            + '<span class="pessoa-nome">' + escapar(r.nome || 'Atleta não identificado') + '</span></button>'
            + '<div class="equipe-dado">' + escapar(cpf ? 'CPF ' + cpf : 'CPF não informado') + '</div>')
          + celula('Situação', '<span class="' + classeSituacaoAtletaBd_(r.situacaoAtual) + '">'
            + escapar(r.situacaoAtual || '—') + '</span>'
            + '<div class="equipe-dado">Elenco: ' + escapar(r.situacaoElenco || 'Sem vínculo no elenco') + '</div>')
          + celula('Equipe atual', '<span class="equipe-nome">' + escapar(equipes || '—') + '</span>')
          + celula('Competição atual', escapar(competicoes || '—'))
          + celula('Vínculos', '<div class="contagem"><span><strong>' + atuais + '</strong> atual(is)</span>'
            + '<span><strong>' + anteriores + '</strong> anterior(es)</span></div>')
          + celula('Disciplina', escapar(r.situacaoDisciplina || '—')
            + (Number(r.totalPunicoes || 0) ? '<div class="equipe-dado">' + escapar(r.totalPunicoes + ' punição(ões)') + '</div>' : ''))
          + '</tr>';

        return linha + (aberto ? detalheAtletaBd_(r, idDetalhe) : '');
      }).join('');
    }

    function detalheAtletaBd_(r, idDetalhe) {
      const dados = [
        ['CPF', formatarCpf(r.cpf)],
        ['Nascimento', r.nascimento],
        ['Tipo', r.tipo],
        ['Equipes no histórico', (r.equipesHistorico || []).join(', ')],
        ['Competições no histórico', (r.competicoesHistorico || []).join(', ')]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const vinculos = (r.vinculos || []).map(function (v) {
        const statusCampeonato = { ativo: 'Em andamento', encerrado: 'Encerrado', rascunho: 'Rascunho', excluido: 'Excluída' }[v.campeonatoStatus] || '';
        const competicao = '<span class="equipe-nome">' + escapar(v.campeonatoNome || 'Competição sem nome') + '</span>'
          + '<div class="equipe-dado">' + escapar([v.temporada, statusCampeonato].filter(Boolean).join(' · ') || '—') + '</div>'
          + (v.campeonatoNomeRegistrado ? '<div class="equipe-dado">' + escapar('Registrada como ' + v.campeonatoNomeRegistrado) + '</div>' : '')
          + (v.campeonatoNomeOriginal ? '<div class="equipe-dado">' + escapar('Nome original: ' + v.campeonatoNomeOriginal) + '</div>' : '');
        const equipe = '<span class="equipe-nome">' + escapar(v.equipeNome || 'Sem equipe vinculada') + '</span>'
          + (v.equipeNomeRegistrado ? '<div class="equipe-dado">' + escapar('Registrada como ' + v.equipeNomeRegistrado) + '</div>' : '')
          + (v.equipeNomeOriginal ? '<div class="equipe-dado">' + escapar('Nome original: ' + v.equipeNomeOriginal) + '</div>' : '')
          + (v.equipeNome && !v.equipeAssociada ? '<div class="equipe-dado">Fora da lista atual de equipes</div>' : '');
        const inscricao = [
          v.numero !== '' && v.numero !== null && v.numero !== undefined ? 'Camisa ' + v.numero : '',
          v.posicao,
          v.apelido ? '"' + v.apelido + '"' : ''
        ].filter(Boolean).join(' · ');
        const nomeInscrito = v.nome && simplificar(v.nome) !== simplificar(r.nome) ? 'Inscrito como ' + v.nome : '';
        const registro = v.noHistorico
          ? escapar(dataAtletaBd_(v.registradoEm) || '—')
            + (v.atualizadoEm && v.atualizadoEm !== v.registradoEm
              ? '<div class="equipe-dado">' + escapar('Dados atualizados em ' + dataAtletaBd_(v.atualizadoEm)) + '</div>' : '')
          : '<span class="equipe-dado">Ainda sem registro no histórico (equipe não informada no elenco)</span>';

        return '<tr>'
          + celula('Situação', '<span class="' + classeVinculoAtletaBd_(v) + '">' + escapar(v.situacao) + '</span>')
          + celula('Competição', competicao)
          + celula('Equipe', equipe)
          + celula('Inscrição', escapar(inscricao || '—')
            + (nomeInscrito ? '<div class="equipe-dado">' + escapar(nomeInscrito) + '</div>' : ''))
          + celula('Registro no histórico', registro)
          + '</tr>';
      }).join('');

      const historico = '<h4 class="atleta-bd-titulo">Histórico de vínculos em elencos</h4>'
        + (vinculos
          ? '<table class="pessoas"><thead><tr><th>Situação</th><th>Competição</th><th>Equipe</th><th>Inscrição</th>'
            + '<th>Registro no histórico</th></tr></thead><tbody>' + vinculos + '</tbody></table>'
            + '<p class="apoio">Mais recentes primeiro. A data é a de entrada no histórico permanente: inscrições '
            + 'já existentes quando o histórico foi ativado mostram a data dessa primeira sincronização, não a data real '
            + 'de entrada no elenco. Datas de transferência não são deduzidas.</p>'
          : '<p class="equipe-dado">Sem vínculo nos elencos dos campeonatos; dados vindos apenas de solicitações, punições ou súmulas.</p>');

      const atalho = function (modulo, busca, texto) {
        return busca && moduloDisponivel(modulo)
          ? '<button type="button" class="botao-apoio" data-atleta-atalho="' + escapar(modulo) + '" data-atleta-busca="' + escapar(busca) + '">' + escapar(texto) + '</button>'
          : '';
      };
      const tabela = function (titulo, cabecalhos, linhas) {
        return linhas.length
          ? '<h4 class="atleta-bd-titulo">' + escapar(titulo) + '</h4><table class="pessoas"><thead><tr>'
            + cabecalhos.map(function (item) { return '<th>' + escapar(item) + '</th>'; }).join('')
            + '</tr></thead><tbody>' + linhas.join('') + '</tbody></table>'
          : '';
      };

      const solicitacoes = tabela('Solicitações de inscrição', ['Data', 'Ação', 'Equipe', 'Competição', 'Situação', 'Protocolo'],
        (r.movimentacoes || []).map(function (m) {
          return '<tr>' + celula('Data', escapar(m.dataHora || '—')) + celula('Ação', escapar(m.acao || '—'))
            + celula('Equipe', escapar(m.equipe || '—')) + celula('Competição', escapar(m.competicao || '—'))
            + celula('Situação', escapar(m.situacaoSolicitacao || '—'))
            + celula('Protocolo', escapar(m.protocolo || '—')) + '</tr>';
        }));
      const punicoes = tabela('Punições', ['Nota', 'Competição', 'Partida', 'Decisão', 'Situação'],
        (r.punicoes || []).map(function (p) {
          return '<tr>' + celula('Nota', escapar(p.nota || '—') + ' ' + atalho('punicoes', p.nota, 'Abrir'))
            + celula('Competição', escapar(p.competicao || '—')) + celula('Partida', escapar(p.partida || '—'))
            + celula('Decisão', escapar(p.decisao || '—')) + celula('Situação', escapar(p.situacao || p.status || '—')) + '</tr>';
        }));
      const sumulas = tabela('Súmulas', ['Data do jogo', 'Partida', 'Equipe', 'Situação', 'Protocolo'],
        (r.sumulas || []).map(function (s) {
          return '<tr>' + celula('Data do jogo', escapar(s.dataJogo || s.dataEnvio || '—')) + celula('Partida', escapar(s.confronto || '—'))
            + celula('Equipe', escapar(s.equipe || '—')) + celula('Situação', escapar(s.situacao || '—'))
            + celula('Protocolo', escapar(s.protocolo || '—') + ' ' + atalho('sumulas', s.protocolo, 'Abrir')) + '</tr>';
        }));

      return '<tr class="detalhe" id="' + idDetalhe + '"><td colspan="6"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + historico + solicitacoes + punicoes + sumulas
        + '</div></td></tr>';
    }

    /**
     * Estado da tela de sumulas. Mesma ideia das solicitacoes: le do
     * Drive uma vez e filtra sobre essa copia.
     */
    let sumulas = { registros: [], situacoes: [], equipes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Arquivos com o detalhe aberto. */
    let sumulasAbertas = {};

    /**
     * Busca no servidor as sumulas enviadas pela arbitragem.
     */
    function carregarSumulas() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'sumulas') {
            return;
          }

          sumulas = dados;
          sumulasAbertas = {};
          montarTelaSumulas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'sumulas') {
            return;
          }

          document.getElementById('statusSumulas').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarSumulas();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das sumulas.
     */
    function montarTelaSumulas() {
      const registros = sumulas.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusSumulas').outerHTML =
          '<div class="vazio">Nenhuma s&uacute;mula enviada at&eacute; o momento.</div>';
        return;
      }

      const recorte = sumulas.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + sumulas.total)
        : '';

      document.getElementById('statusSumulas').outerHTML = ''
        + '<div class="resumo" id="resumoSumulas"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaSumulas" placeholder="Buscar por protocolo, equipe, &aacute;rbitro, envolvido ou pelo relato">'
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('arbitro', 'Todos os &aacute;rbitros', registros)
        + filtroEquipeSumulas()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemSumulas"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarSumulas">Atualizar</button>'
        + (sumulas.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(sumulas.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes"><thead><tr>'
        + '<th>Situa&ccedil;&atilde;o</th><th>Protocolo</th><th>Enviada em</th><th>Partida</th>'
        + '<th>&Aacute;rbitro</th><th>Envolvidos</th>'
        + '</tr></thead><tbody id="linhasSumulas"></tbody></table></div>';

      document.getElementById('buscaSumulas').addEventListener('input', filtrarSumulas);
      document.getElementById('recarregarSumulas').addEventListener('click', function () {
        abrirModulo('sumulas');
      });

      conteudo.querySelectorAll('[data-filtro], #filtroEquipeSumulas').forEach(function (campo) {
        campo.addEventListener('change', filtrarSumulas);
      });

      if (termo) {
        document.getElementById('buscaSumulas').value = termo;
      }

      filtrarSumulas();
    }

    /**
     * A equipe nao e um campo unico da sumula: uma partida tem dois times e
     * os envolvidos podem ser de qualquer um deles. Por isso este filtro e
     * montado a parte, com a lista que o servidor ja devolveu pronta.
     */
    function filtroEquipeSumulas() {
      const opcoes = (sumulas.equipes || []).map(function (equipe) {
        return '<option value="' + escapar(equipe) + '">' + escapar(equipe) + '</option>';
      }).join('');

      return '<select id="filtroEquipeSumulas"><option value="">Todas as equipes</option>' + opcoes + '</select>';
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarSumulas() {
      const busca = simplificar(document.getElementById('buscaSumulas').value.trim());
      const equipe = document.getElementById('filtroEquipeSumulas').value;
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (sumulas.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (equipe && (registro.equipes || []).indexOf(equipe) === -1) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaSumula(registro)).indexOf(busca) !== -1;
      });

      desenharResumoSumulas(filtrados);
      desenharLinhasSumulas(filtrados);
    }

    /**
     * Junta tudo o que identifica a sumula, inclusive o relato: e comum
     * procurar por uma palavra que se lembra do texto, nao pelo protocolo.
     */
    function textoDaSumula(registro) {
      return [
        registro.protocolo,
        registro.dataEnvio,
        registro.situacao,
        registro.confronto,
        registro.arbitro,
        registro.documento,
        registro.dataJogo,
        registro.fatos
      ].concat(registro.notas || []).concat((registro.envolvidos || []).map(function (envolvido) {
        return envolvido.nome + ' ' + envolvido.equipe + ' ' + envolvido.tipo + ' ' + envolvido.camisa;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumoSumulas(registros) {
      const envolvidos = registros.reduce(function (total, registro) {
        return total + registro.quantidade;
      }, 0);

      function porSituacao(situacao) {
        return registros.filter(function (registro) {
          return registro.situacao === situacao;
        }).length;
      }

      const itens = [
        ['', registros.length, 'Súmulas'],
        ['cumprir', porSituacao('Aguardando'), 'Aguardando'],
        ['cumprida', porSituacao('Analisada'), 'Analisadas'],
        ['pendente', porSituacao('Falha'), 'Com falha'],
        ['', envolvidos, 'Envolvidos']
      ];

      document.getElementById('resumoSumulas').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (sumulas.registros || []).length;

      document.getElementById('contagemSumulas').textContent = registros.length === total
        ? registros.length + ' súmula(s)'
        : registros.length + ' de ' + total + ' súmula(s)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha abre uma segunda, com o
     * relato dos fatos e a lista de envolvidos.
     */
    function desenharLinhasSumulas(registros) {
      if (!registros.length) {
        document.getElementById('linhasSumulas').innerHTML =
          '<tr><td colspan="6" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma s&uacute;mula encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasSumulas').innerHTML = registros.map(function (r) {
        const aberta = !!sumulasAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Situação', '<span class="' + classeSituacaoSolicitacao(r.situacao) + '">'
            + escapar(r.icone + ' ' + r.situacao) + '</span>'
            + resumoNota(r))
          + celula('Protocolo', '<span class="protocolo">' + escapar(r.protocolo || '—') + '</span>')
          + celula('Enviada em', escapar(r.dataEnvio || '—'))
          + celula('Partida', '<span class="equipe-nome">' + escapar(r.confronto || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(dataHoraDoJogo(r)) + '</div>')
          + celula('Árbitro', escapar(r.arbitro || '—'))
          + celula('Envolvidos', contagemEnvolvidos(r))
          + '</tr>';

        return linha + (aberta ? detalheSumula(r) : '');
      }).join('');

      conteudo.querySelectorAll('#linhasSumulas tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (sumulasAbertas[chave]) {
            delete sumulasAbertas[chave];
          } else {
            sumulasAbertas[chave] = true;
          }

          filtrarSumulas();
        });
      });

      conteudo.querySelectorAll('#linhasSumulas .atalho-punicoes').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirModulo('punicoes', botao.dataset.sumula);
        });
      });
    }

    /**
     * Data e hora do jogo, com a data no formato brasileiro.
     * O formulario grava a data como o navegador devolve (AAAA-MM-DD).
     */
    function dataHoraDoJogo(registro) {
      const partes = String(registro.dataJogo || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const data = partes ? partes[3] + '/' + partes[2] + '/' + partes[1] : registro.dataJogo;

      return [data, registro.horaJogo].filter(Boolean).join(' às ') || '—';
    }

    /**
     * Quantos envolvidos de cada tipo a sumula tem.
     */
    function contagemEnvolvidos(registro) {
      const porTipo = {};

      (registro.envolvidos || []).forEach(function (envolvido) {
        const tipo = envolvido.tipo || 'Sem tipo';

        porTipo[tipo] = (porTipo[tipo] || 0) + 1;
      });

      const partes = Object.keys(porTipo).sort().map(function (tipo) {
        return '<span><strong>' + porTipo[tipo] + '</strong> ' + escapar(tipo.toLowerCase()) + '</span>';
      });

      if (!partes.length) {
        return '<span class="equipe-dado">ninguém citado</span>';
      }

      return '<div class="contagem">' + partes.join('') + '</div>';
    }

    /**
     * Linha extra com o relato da arbitragem e a lista de envolvidos.
     */
    function detalheSumula(registro) {
      const dados = [
        ['Partida', dataHoraDoJogo(registro)],
        ['Documento do árbitro', registro.documento],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1] && item[1] !== '—';
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      // O relato e o que a comissao de fato le. Fica em destaque, com as
      // quebras de linha preservadas como o arbitro escreveu.
      const fatos = registro.fatos
        ? '<div class="relato"><h4>Dos fatos</h4><p>' + escapar(registro.fatos) + '</p></div>'
        : '<p class="equipe-dado">Esta s&uacute;mula n&atilde;o traz relato.</p>';

      const linhas = (registro.envolvidos || []).map(function (e) {
        return '<tr>'
          + celula('Equipe', '<span class="equipe-nome">' + escapar(e.equipe || '—') + '</span>')
          + celula('Tipo', escapar(e.tipo || '—'))
          + celula('Nome', '<span class="pessoa-nome">' + escapar(e.nome || '—') + '</span>')
          + celula('Camisa', escapar(e.camisa || '—'))
          + '</tr>';
      }).join('');

      const tabela = linhas
        ? '<table class="pessoas"><thead><tr><th>Equipe</th><th>Tipo</th><th>Nome</th><th>Camisa</th></tr></thead>'
          + '<tbody>' + linhas + '</tbody></table>'
        : '<p class="equipe-dado">Nenhum atleta ou membro de comiss&atilde;o foi citado.</p>';

      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + (registro.pdfUrl
          ? '<a class="botao-apoio destaque" href="' + escapar(registro.pdfUrl) + '" target="_blank" rel="noopener">Súmula oficial (PDF)</a>'
          : '<span class="equipe-dado">Sem PDF oficial gerado</span>')
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + '</div>';

      return '<tr class="detalhe"><td colspan="6"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + fatos
        + tabela
        + blocoNota(registro)
        + links
        + '</div></td></tr>';
    }

    /**
     * Linha curta na tabela dizendo qual nota a sumula gerou.
     * O vinculo vem do controle de punicoes, que guarda o protocolo da
     * sumula ao lado do numero da nota.
     */
    function resumoNota(registro) {
      const notas = registro.notas || [];

      if (!notas.length) {
        return '';
      }

      return '<div class="equipe-dado">Nota ' + escapar(notas.join(', ')) + '</div>';
    }

    /**
     * Fecha o ciclo da sumula: o que a comissao decidiu a partir dela.
     *
     * Sumula ainda na fila nao tem decisao, e sumula analisada sem
     * infracao nao gera punicao nenhuma. Os dois casos sao normais e
     * aparecem com o texto correspondente, nunca como erro.
     */
    function blocoNota(registro) {
      const notas = registro.notas || [];
      const punidos = registro.punidos || [];

      if (!notas.length) {
        const aviso = registro.situacao === 'Analisada'
          ? 'S&uacute;mula analisada sem puni&ccedil;&atilde;o registrada no controle.'
          : 'A an&aacute;lise disciplinar desta s&uacute;mula ainda n&atilde;o foi feita.';

        return '<p class="equipe-dado" style="margin-top:12px;">' + aviso + '</p>';
      }

      const linhas = punidos.map(function (p) {
        return '<tr>'
          + celula('Punido', '<span class="pessoa-nome">' + escapar(p.nome || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(p.equipe || '—') + '</div>')
          + celula('Artigo', escapar(p.artigo || '—'))
          + celula('Decisão', escapar(p.decisao || '—'))
          + celula('Situação', '<span class="' + classeSituacao(p.situacao || '') + '">'
            + escapar(p.situacao || '—') + '</span>')
          + '</tr>';
      }).join('');

      const titulo = 'Nota oficial ' + escapar(notas.join(', '))
        + (registro.dataNota ? ' <span class="equipe-dado">· ' + escapar(registro.dataNota) + '</span>' : '');

      const atalho = moduloDisponivel('punicoes')
        ? '<div class="barra-acoes" style="margin-top:10px;">'
          + '<button type="button" class="botao-apoio atalho-punicoes" data-sumula="'
          + escapar(registro.protocolo) + '">Ver no controle de punições</button></div>'
        : '';

      return '<div class="relato" style="margin-top:14px;"><h4>Decis&atilde;o</h4>'
        + '<p style="font-family:inherit;white-space:normal;">' + titulo + '</p></div>'
        + '<table class="pessoas"><thead><tr>'
        + '<th>Punido</th><th>Artigo</th><th>Decis&atilde;o</th><th>Situa&ccedil;&atilde;o</th>'
        + '</tr></thead><tbody>' + linhas + '</tbody></table>'
        + atalho;
    }

    /**
     * Estado da tela de notas oficiais. Mesma ideia das demais consultas:
     * o servidor devolve tudo de uma vez e os filtros trabalham sobre a copia.
     */
    let notas = { registros: [], competicoes: [], equipes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Notas com o texto aberto. */
    let notasAbertas = {};

    /**
     * Busca no servidor as notas oficiais publicadas.
     */
    function carregarNotas() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'notas') {
            return;
          }

          notas = dados;
          notasAbertas = {};
          montarTelaNotas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'notas') {
            return;
          }

          document.getElementById('statusNotas').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarNotas();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das notas oficiais.
     */
    function montarTelaNotas() {
      const registros = notas.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusNotas').outerHTML =
          '<div class="vazio">Nenhuma nota oficial publicada at&eacute; o momento.</div>';
        return;
      }

      const recorte = notas.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + notas.total)
        : '';

      document.getElementById('statusNotas').outerHTML = ''
        + '<div class="resumo" id="resumoNotas"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaNotas" placeholder="Buscar por n&uacute;mero, partida, punido, artigo ou pelo texto da nota">'
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + filtroEquipeNotas()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemNotas"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarNotas">Atualizar</button>'
        + (notas.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(notas.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes notas"><thead><tr>'
        + '<th>Nota</th><th>Publicada em</th><th>Partida</th><th>Documento</th><th>Punidos</th>'
        + '</tr></thead><tbody id="linhasNotas"></tbody></table></div>';

      document.getElementById('buscaNotas').addEventListener('input', filtrarNotas);
      document.getElementById('recarregarNotas').addEventListener('click', function () {
        abrirModulo('notas');
      });

      conteudo.querySelectorAll('[data-filtro], #filtroEquipeNotas').forEach(function (campo) {
        campo.addEventListener('change', filtrarNotas);
      });

      if (termo) {
        document.getElementById('buscaNotas').value = termo;
      }

      filtrarNotas();
    }

    /**
     * A equipe da nota vem dos times da partida e da equipe de cada punido;
     * o servidor ja devolve a lista pronta.
     */
    function filtroEquipeNotas() {
      const opcoes = (notas.equipes || []).map(function (equipe) {
        return '<option value="' + escapar(equipe) + '">' + escapar(equipe) + '</option>';
      }).join('');

      return '<select id="filtroEquipeNotas"><option value="">Todas as equipes</option>' + opcoes + '</select>';
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarNotas() {
      const busca = simplificar(document.getElementById('buscaNotas').value.trim());
      const equipe = document.getElementById('filtroEquipeNotas').value;
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (notas.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (equipe && (registro.equipes || []).indexOf(equipe) === -1) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaNota(registro)).indexOf(busca) !== -1;
      });

      desenharResumoNotas(filtrados);
      desenharLinhasNotas(filtrados);
    }

    /**
     * Junta tudo o que identifica a nota, inclusive o texto inteiro: o
     * enquadramento e a fundamentacao so existem la dentro.
     */
    function textoDaNota(registro) {
      return [
        registro.numero,
        registro.competicao,
        registro.confronto,
        registro.dataJogo,
        registro.dataNota,
        registro.protocolo,
        registro.arbitro,
        registro.texto
      ].concat((registro.punidos || []).map(function (p) {
        return p.nome + ' ' + p.equipe + ' ' + p.artigo + ' ' + p.decisao;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumoNotas(registros) {
      const punidos = registros.reduce(function (total, registro) {
        return total + (registro.punidos || []).length;
      }, 0);

      function contarPunidos(situacao) {
        return registros.reduce(function (total, registro) {
          return total + (registro.punidos || []).filter(function (p) {
            return simplificar(p.situacao || '') === situacao;
          }).length;
        }, 0);
      }

      const itens = [
        ['', registros.length, 'Notas'],
        ['', punidos, 'Punidos'],
        ['cumprir', contarPunidos('a cumprir'), 'A cumprir'],
        ['cumprida', contarPunidos('cumprida'), 'Cumpridas']
      ];

      document.getElementById('resumoNotas').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (notas.registros || []).length;

      document.getElementById('contagemNotas').textContent = registros.length === total
        ? registros.length + ' nota(s)'
        : registros.length + ' de ' + total + ' nota(s)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha abre uma segunda, com o
     * texto completo da nota e os atalhos para a súmula e para o controle.
     */
    function desenharLinhasNotas(registros) {
      if (!registros.length) {
        document.getElementById('linhasNotas').innerHTML =
          '<tr><td colspan="5" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma nota encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasNotas').innerHTML = registros.map(function (r) {
        const aberta = !!notasAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Nota', '<span class="protocolo">' + escapar(r.numero || '—') + '</span>'
            + (r.pendente ? '<div class="equipe-dado">⚠️ com campos a definir</div>' : ''))
          + celula('Publicada em', escapar(r.dataNota || '—'))
          + celula('Partida', '<span class="equipe-nome">' + escapar(r.confronto || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(r.dataJogo || r.competicao || '—') + '</div>')
          + celula('Documento', atalhoPdfDaNota(r))
          + celula('Punidos', resumoPunidosDaNota(r))
          + '</tr>';

        return linha + (aberta ? detalheNota(r) : '');
      }).join('');

      conteudo.querySelectorAll('#linhasNotas tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (notasAbertas[chave]) {
            delete notasAbertas[chave];
          } else {
            notasAbertas[chave] = true;
          }

          filtrarNotas();
        });
      });

      // O clique nos atalhos nao deve abrir ou fechar a linha junto.
      conteudo.querySelectorAll('#linhasNotas [data-nao-abre]').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.stopPropagation();
        });
      });

      conteudo.querySelectorAll('#linhasNotas [data-ir-sumula]').forEach(function (botao) {
        botao.addEventListener('click', function (evento) {
          evento.stopPropagation();
          abrirModulo('sumulas', botao.dataset.irSumula);
        });
      });

      conteudo.querySelectorAll('#linhasNotas [data-ir-punicoes]').forEach(function (botao) {
        botao.addEventListener('click', function (evento) {
          evento.stopPropagation();
          abrirModulo('punicoes', botao.dataset.irPunicoes);
        });
      });
    }

    /**
     * A nota em PDF, que e o documento oficial. O clique nao deve abrir a
     * linha junto, por isso o stopPropagation no proprio link.
     */
    function atalhoPdfDaNota(registro) {
      if (!registro.pdfUrl) {
        return '<span class="equipe-dado">sem PDF</span>';
      }

      return '<a class="botao-apoio destaque" data-nao-abre="1" href="'
        + escapar(registro.pdfUrl) + '" target="_blank" rel="noopener">Ver nota</a>';
    }

    /**
     * Protocolo da sumula que originou a nota, com atalho para a tela de
     * súmulas quando ela estiver liberada para o perfil.
     */
    function atalhoSumulaDaNota(registro) {
      if (!registro.protocolo) {
        return '';
      }

      if (!moduloDisponivel('sumulas')) {
        return '<span class="equipe-dado">Súmula: <strong>'
          + escapar(registro.protocolo) + '</strong></span>';
      }

      return '<button type="button" class="botao-apoio" data-ir-sumula="'
        + escapar(registro.protocolo) + '" title="' + escapar(registro.protocolo) + '">Ver súmula</button>';
    }

    /**
     * Quem foi punido pela nota, resumido em uma célula.
     */
    function resumoPunidosDaNota(registro) {
      const punidos = registro.punidos || [];

      if (!punidos.length) {
        return '<span class="equipe-dado">sem punição registrada</span>';
      }

      const nomes = punidos.slice(0, 2).map(function (p) {
        return '<span><strong>' + escapar(p.nome || '—') + '</strong> ' + escapar(p.equipe || '') + '</span>';
      });

      if (punidos.length > nomes.length) {
        nomes.push('<span>e mais ' + (punidos.length - nomes.length) + '</span>');
      }

      return '<div class="contagem">' + nomes.join('') + '</div>';
    }

    /**
     * Linha extra com o texto integral da nota, a lista de punidos e os links.
     */
    function detalheNota(registro) {
      const dados = [
        ['Competição', registro.competicao],
        ['Data do jogo', registro.dataJogo],
        ['Árbitro da partida', registro.arbitro],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const linhas = (registro.punidos || []).map(function (p) {
        return '<tr>'
          + celula('Punido', '<span class="pessoa-nome">' + escapar(p.nome || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(p.equipe || '—') + '</div>')
          + celula('Artigo', escapar(p.artigo || '—'))
          + celula('Decisão', escapar(p.decisao || '—'))
          + celula('Situação', '<span class="' + classeSituacao(p.situacao || '') + '">'
            + escapar(p.situacao || '—') + '</span>')
          + '</tr>';
      }).join('');

      const tabela = linhas
        ? '<table class="pessoas"><thead><tr>'
          + '<th>Punido</th><th>Artigo</th><th>Decis&atilde;o</th><th>Situa&ccedil;&atilde;o</th>'
          + '</tr></thead><tbody>' + linhas + '</tbody></table>'
        : '<p class="equipe-dado">Esta nota n&atilde;o registrou punidos no controle.</p>';

      // O PDF e o documento oficial; o texto aqui serve para ler e buscar
      // sem sair da tela.
      const corpo = registro.texto
        ? '<div class="relato"><h4>Texto da nota</h4><p>' + escapar(registro.texto) + '</p></div>'
        : '';

      // O PDF ja esta na coluna "Documento" da linha; aqui ficam os
      // atalhos para o que veio antes (a sumula) e depois (o controle).
      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + atalhoSumulaDaNota(registro)
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + (registro.numero && moduloDisponivel('punicoes')
          ? '<button type="button" class="botao-apoio" data-ir-punicoes="' + escapar(registro.numero)
            + '">Ver no controle de punições</button>'
          : '')
        + '</div>';

      return '<tr class="detalhe"><td colspan="5"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + tabela
        + corpo
        + links
        + '</div></td></tr>';
    }

    /**
     * Estado da tela de regulamentos.
     */
    let regulamentos = { registros: [], total: 0, limite: 0, pastaUrl: '' };

    /**
     * Abre a solicitacao nativa do Drive ou prepara o pedido de publicacao.
     */
    function botaoSolicitarAcessoAssociado(modulo) {
      if (CONFIG.usuario.perfil !== 'associado') {
        return '';
      }

      if (modulo === 'Regulamentos') {
        return CONFIG.regulamentosPastaUrl
          ? '<div class="barra-acoes"><a class="botao-apoio destaque" href="'
            + escapar(CONFIG.regulamentosPastaUrl)
            + '" target="_blank" rel="noopener">Solicitar acesso como Leitor no Drive</a></div>'
          : '';
      }

      const assunto = 'AEUV - Publicar cadastro da minha equipe';
      const corpo = 'Olá, preciso consultar o cadastro da minha equipe no sistema interno da AEUV.\n'
        + 'Conta Google: ' + CONFIG.usuario.email + '\n'
        + 'Equipe: ' + (CONFIG.usuario.equipe || 'não vinculada') + '\n\n'
        + 'Se a equipe já estiver cadastrada na planilha AEUV - Associados, '
        + 'execute publicarCadastrosAssociados() no editor do Apps Script. '
        + 'Caso contrário, cadastre a equipe antes de publicar a consulta.';
      const url = 'mailto:' + encodeURIComponent(CONFIG.emailSuporte)
        + '?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo);

      return '<div class="barra-acoes"><a class="botao-apoio destaque" href="'
        + escapar(url) + '">Solicitar publicação do cadastro</a></div>';
    }

    /**
     * Busca no servidor os regulamentos publicados.
     */
    function carregarRegulamentos() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'regulamentos') {
            return;
          }

          regulamentos = dados;
          montarTelaRegulamentos();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'regulamentos') {
            return;
          }

          const mensagem = erro && erro.message ? erro.message : String(erro);
          document.getElementById('statusRegulamentos').outerHTML =
            '<div class="erro">' + escapar(mensagem) + '</div>'
            + (/Não foi possível abrir a pasta "Regulamentos"/.test(mensagem)
              ? botaoSolicitarAcessoAssociado('Regulamentos') : '');
        })
        .listarRegulamentos();
    }

    /**
     * Lista os regulamentos em cartoes.
     *
     * Sao poucos arquivos e o uso e sempre o mesmo - abrir o PDF -, entao
     * aqui nao ha tabela nem filtro: cada regulamento e um cartao com os
     * dois botoes de acesso.
     */
    function montarTelaRegulamentos() {
      const registros = regulamentos.registros || [];

      if (!registros.length) {
        document.getElementById('statusRegulamentos').outerHTML =
          '<div class="vazio">Nenhum regulamento publicado at&eacute; o momento.</div>';
        return;
      }

      const cartoes = registros.map(function (r) {
        return '<div class="regulamento">'
          + '<div class="regulamento-titulo"><span class="icone">📕</span>'
          + '<h3>' + escapar(r.titulo) + '</h3></div>'
          + '<p class="equipe-dado">Atualizado em ' + escapar(r.atualizadoEm) + ' · ' + escapar(r.tamanho) + '</p>'
          + '<div class="barra-acoes">'
          + '<a class="botao-apoio destaque" href="' + escapar(r.url) + '" target="_blank" rel="noopener">Abrir PDF</a>'
          + '<a class="botao-apoio" href="' + escapar(r.downloadUrl) + '" target="_blank" rel="noopener">Baixar</a>'
          + '</div></div>';
      }).join('');

      document.getElementById('statusRegulamentos').outerHTML = ''
        + '<div class="barra-acoes">'
        + '<span>' + registros.length + ' regulamento(s)</span>'
        + '<span class="espaco"></span>'
        + '<button type="button" class="botao-apoio" id="recarregarRegulamentos">Atualizar</button>'
        + (regulamentos.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(regulamentos.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="regulamentos">' + cartoes + '</div>';

      document.getElementById('recarregarRegulamentos').addEventListener('click', function () {
        abrirModulo('regulamentos');
      });
    }

    /**
     * Estado da tela de associados. A lista e lida uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let associados = {
      registros: [],
      equipes: [],
      status: [],
      documentos: [],
      podeEditar: false,
      somenteMinhaEquipe: false,
      minhaEquipe: '',
      planilhaUrl: ''
    };

    /**
     * Busca no servidor o cadastro de associados.
     */
    function carregarAssociados() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'associados') {
            return;
          }

          associados = dados;
          montarTelaAssociados();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'associados') {
            return;
          }

          const mensagem = erro && erro.message ? erro.message : String(erro);
          document.getElementById('areaAssociados').innerHTML =
            '<div class="erro">' + escapar(mensagem) + '</div>'
            + (/O cadastro da sua equipe ainda não foi publicado/.test(mensagem)
              ? botaoSolicitarAcessoAssociado('Associados') : '');
        })
        .listarAssociados();
    }

    /**
     * Monta os indicadores, os filtros e a tabela dos associados.
     */
    function montarTelaAssociados() {
      const registros = associados.registros || [];

      // Quem enxerga uma equipe so vai direto ao cadastro dela: lista,
      // busca e filtro de situacao nao servem para um registro unico.
      if (associados.somenteMinhaEquipe) {
        if (registros.length) {
          abrirFormularioAssociado(registros[0].equipe);
        } else {
          document.getElementById('areaAssociados').innerHTML = '<div class="vazio">'
            + 'A equipe <strong>' + escapar(associados.minhaEquipe || '') + '</strong> ainda n&atilde;o tem '
            + 'cadastro. Procure a diretoria para fazer o cadastro inicial.</div>';
        }

        return;
      }

      const novo = associados.podeEditar
        ? '<button type="button" class="botao-apoio" id="novoAssociado">+ Novo cadastro</button>'
        : '';

      const planilha = associados.planilhaUrl
        ? '<a class="botao-apoio" href="' + escapar(associados.planilhaUrl) + '" target="_blank" rel="noopener">Abrir planilha</a>'
        : '';

      const painel = '<div id="painelAssociados">'
        + '<div class="resumo" id="resumoAssociados"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaAssociados" placeholder="Buscar por equipe, representante, CPF ou e-mail">'
        + opcoesFiltroAssociados()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span class="espaco"></span>' + novo + planilha
        + '</div>'
        + '<div class="tabela-rolagem"><table class="associados">'
        + '<thead><tr><th>Equipe</th><th>Situação</th><th>Representante</th>'
        + '<th>Contato</th><th>Cidade</th><th>Docs.</th></tr></thead>'
        + '<tbody id="linhasAssociados"></tbody></table></div>'
        + '</div>';

      const vazio = '<div id="painelAssociados">'
        + '<div class="barra-acoes"><span class="espaco"></span>' + novo + planilha + '</div>'
        + '<div class="vazio">Nenhuma equipe associada cadastrada at&eacute; o momento.'
        + (associados.podeEditar ? ' Use o bot&atilde;o acima para come&ccedil;ar.' : '')
        + '</div></div>';

      document.getElementById('areaAssociados').innerHTML = registros.length ? painel : vazio;

      if (registros.length) {
        desenharResumoAssociados(registros);
        desenharLinhasAssociados(registros);

        document.getElementById('buscaAssociados').addEventListener('input', filtrarAssociados);
        document.getElementById('filtroStatus').addEventListener('change', filtrarAssociados);
      }

      const botaoNovo = document.getElementById('novoAssociado');

      if (botaoNovo) {
        botaoNovo.addEventListener('click', function () {
          abrirFormularioAssociado(null);
        });
      }
    }

    /**
     * Filtro de situacao, montado a partir das opcoes do servidor.
     */
    function opcoesFiltroAssociados() {
      const opcoes = (associados.status || []).map(function (item) {
        return '<option value="' + escapar(item.id) + '">' + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      return '<select id="filtroStatus"><option value="">Todas as situa&ccedil;&otilde;es</option>' + opcoes + '</select>';
    }

    /**
     * Aplica busca e filtro de situacao sobre a lista carregada.
     */
    function filtrarAssociados() {
      const termo = simplificar(document.getElementById('buscaAssociados').value);
      const status = document.getElementById('filtroStatus').value;

      const filtrados = (associados.registros || []).filter(function (registro) {
        if (status && registro.status !== status) {
          return false;
        }

        if (!termo) {
          return true;
        }

        return simplificar([
          registro.equipe, registro.nome, registro.email, registro.cpf, registro.cidade
        ].join(' ')).indexOf(termo) !== -1;
      });

      desenharResumoAssociados(filtrados);
      desenharLinhasAssociados(filtrados);
    }

    /**
     * Indicadores por situacao, mais a contagem de documentos pendentes.
     */
    function desenharResumoAssociados(registros) {
      const itens = (associados.status || []).map(function (item) {
        return {
          numero: registros.filter(function (r) { return r.status === item.id; }).length,
          rotulo: item.icone + ' ' + item.nome
        };
      });

      itens.push({
        numero: registros.filter(function (r) { return r.pendencias > 0; }).length,
        rotulo: '📎 Com documento pendente'
      });

      document.getElementById('resumoAssociados').innerHTML = itens.map(function (item) {
        return '<div class="indicador"><span class="numero">' + item.numero + '</span>'
          + '<span class="rotulo">' + escapar(item.rotulo) + '</span></div>';
      }).join('');
    }

    /**
     * Desenha as linhas da tabela. Clicar numa linha abre o cadastro.
     */
    function desenharLinhasAssociados(registros) {
      const corpo = document.getElementById('linhasAssociados');

      if (!registros.length) {
        corpo.innerHTML = '<tr><td colspan="6"><div class="vazio">'
          + 'Nenhum associado encontrado com esses filtros.</div></td></tr>';
        return;
      }

      corpo.innerHTML = registros.map(function (r) {
        const situacao = nomeStatus(r.status);
        const docs = r.pendencias
          ? '<span class="pilula pendente">' + r.pendencias + ' pendente' + (r.pendencias > 1 ? 's' : '') + '</span>'
          : '<span class="pilula ativo">Completo</span>';

        return '<tr data-equipe="' + escapar(r.equipe) + '">'
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Situação', '<span class="pilula ' + escapar(r.status) + '">'
            + escapar(situacao.icone + ' ' + situacao.nome) + '</span>')
          + celula('Representante', escapar(r.nome)
            + '<div class="equipe-dado">' + escapar(formatarCpf(r.cpf)) + '</div>')
          + celula('Contato', escapar(formatarTelefone(r.telefone))
            + '<div class="equipe-dado">' + escapar(r.email) + '</div>')
          + celula('Cidade', escapar(r.cidade + (r.uf ? '/' + r.uf : '')))
          + celula('Documentos', docs)
          + '</tr>';
      }).join('');

      corpo.querySelectorAll('tr[data-equipe]').forEach(function (linha) {
        linha.addEventListener('click', function () {
          abrirFormularioAssociado(linha.dataset.equipe);
        });
      });
    }

    /**
     * Abre o cadastro de uma equipe. Sem equipe, abre em branco.
     * Quem nao pode editar ve os mesmos dados, apenas para leitura.
     */
    function abrirFormularioAssociado(equipe) {
      const registro = (associados.registros || []).filter(function (r) {
        return r.equipe === equipe;
      })[0] || null;

      const somenteLeitura = !associados.podeEditar;
      const trava = somenteLeitura ? ' disabled' : '';

      const equipes = (associados.equipes || []).slice();

      // Equipe ja cadastrada fora da lista padrao continua aparecendo.
      if (registro && equipes.indexOf(registro.equipe) === -1) {
        equipes.push(registro.equipe);
      }

      const opcoesEquipe = equipes.sort().map(function (nome) {
        const jaTem = (associados.registros || []).some(function (r) { return r.equipe === nome; });
        const selecionada = registro && registro.equipe === nome;

        // Sem registro aberto, esconde as equipes que ja tem cadastro:
        // cada equipe entra uma vez so.
        if (jaTem && !selecionada) {
          return '';
        }

        return '<option value="' + escapar(nome) + '"' + (selecionada ? ' selected' : '') + '>'
          + escapar(nome) + '</option>';
      }).join('');

      const opcoesStatus = (associados.status || []).map(function (item) {
        const selecionado = registro ? registro.status === item.id : item.id === 'pendente';

        return '<option value="' + escapar(item.id) + '"' + (selecionado ? ' selected' : '') + '>'
          + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      const documentos = (associados.documentos || []).map(function (documento) {
        const url = registro ? registro[documento.id] : '';
        const situacao = url
          ? '<span class="situacao entregue">Entregue</span> '
            + '<a href="' + escapar(url) + '" target="_blank" rel="noopener">abrir arquivo</a>'
          : '<span class="situacao falta">Ainda n&atilde;o enviado</span>';

        const envio = somenteLeitura
          ? ''
          : '<input type="file" data-documento="' + escapar(documento.id) + '" '
            + 'accept=".pdf,.jpg,.jpeg,.png,.webp">';

        return '<div class="documento">'
          + '<span class="titulo">' + escapar(documento.nome) + '</span>'
          + '<span class="dica">' + escapar(documento.apoio) + '</span>'
          + '<span>' + situacao + '</span>'
          + envio
          + '</div>';
      }).join('');

      const titulo = registro
        ? (somenteLeitura ? 'Cadastro de ' + registro.equipe : 'Editar ' + registro.equipe)
        : 'Novo associado';

      const historico = registro && registro.atualizadoEm
        ? '<p class="apoio">&Uacute;ltima altera&ccedil;&atilde;o em ' + escapar(registro.atualizadoEm)
          + (registro.atualizadoPor ? ' por ' + escapar(registro.atualizadoPor) : '') + '.</p>'
        : '';

      const gravar = somenteLeitura
        ? '<p class="apoio">O seu perfil permite consultar, mas n&atilde;o alterar o cadastro.</p>'
        : '<button type="button" class="botao-principal" id="gravarAssociado">Salvar cadastro</button>';

      // Sem lista para onde voltar, o botao nao tem destino.
      const voltar = associados.somenteMinhaEquipe
        ? ''
        : '<button type="button" class="botao-apoio" id="voltarAssociados">Voltar &agrave; lista</button>';

      document.getElementById('areaAssociados').innerHTML = '<div class="formulario">'

        + historico
        + '<div class="grupo"><h4>Equipe</h4><div class="campos">'
        + '<div class="campo largo"><label for="fEquipe">Equipe associada</label>'
        + '<select id="fEquipe"' + trava + '>'
        + (registro ? '' : '<option value="">Selecione</option>') + opcoesEquipe + '</select>'
        + (somenteLeitura ? '' : '<span class="dica">Equipe e CPF do representante devem ser exclusivos entre os associados.</span>')
        + '</div>'
        + '<div class="campo largo"><label for="fStatus">Situa&ccedil;&atilde;o</label>'
        + '<select id="fStatus"' + trava + '>' + opcoesStatus + '</select></div>'
        + '</div></div>'
        + '<div class="grupo"><h4>Representante legal</h4><div class="campos">'
        + campoTexto('fNome', 'Nome completo', registro ? registro.nome : '', 'cheio', trava, 'text')
        + campoTexto('fNascimento', 'Data de nascimento', paraDataInput(registro ? registro.nascimento : ''), '', trava, 'date')
        + campoTexto('fCpf', 'CPF', formatarCpf(registro ? registro.cpf : ''), '', trava, 'text')
        + campoTexto('fRg', 'RG', registro ? registro.rg : '', '', trava, 'text')
        + campoTexto('fEmail', 'E-mail', registro ? registro.email : '', 'largo', trava, 'email')
        + campoTexto('fTelefone', 'Telefone com DDD', formatarTelefone(registro ? registro.telefone : ''), 'largo', trava, 'tel')
        + '</div></div>'
        + '<div class="grupo"><h4>Endere&ccedil;o</h4><div class="campos">'
        + campoTexto('fCep', 'CEP', formatarCep(registro ? registro.cep : ''), 'curto', trava, 'text')
        + campoTexto('fLogradouro', 'Logradouro', registro ? registro.logradouro : '', 'largo', trava, 'text')
        + campoTexto('fNumero', 'Número', registro ? registro.numero : '', 'curto', trava, 'text')
        + campoTexto('fComplemento', 'Complemento', registro ? registro.complemento : '', '', trava, 'text')
        + campoTexto('fBairro', 'Bairro', registro ? registro.bairro : '', '', trava, 'text')
        + campoTexto('fCidade', 'Cidade', registro ? registro.cidade : '', 'curto', trava, 'text')
        + campoTexto('fUf', 'UF', registro ? registro.uf : '', 'mini', trava, 'text')
        + '</div></div>'
        + '<div class="grupo"><h4>Documenta&ccedil;&atilde;o</h4>'
        + '<p class="apoio">Arquivos PDF, JPG, PNG ou WEBP, de at&eacute; 5 MB cada. '
        + 'Enviar um arquivo novo substitui o anterior.</p>'
        + '<div class="campos">' + documentos + '</div></div>'
        + '<div class="acoes-formulario">'
        + gravar
        + voltar
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoAssociado"></span>'
        + '</div></div>';

      const botaoVoltar = document.getElementById('voltarAssociados');

      if (botaoVoltar) {
        botaoVoltar.addEventListener('click', montarTelaAssociados);
      }

      const botaoGravar = document.getElementById('gravarAssociado');

      if (botaoGravar) {
        botaoGravar.addEventListener('click', function () {
          gravarAssociado(registro);
        });

        ligarMascaras();
