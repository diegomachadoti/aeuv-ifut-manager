    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumoNotas(registros) {
      const punidos = registros.reduce(function (total, registro) {
        return total + (registro.punidos || []).length;
      }, 0);

      function contarPunidos(situacao) {
        return registros.reduce(function (total, registro) {
          return total + (registro.punidos || []).filter(function (p) {
            return simplificar(p.situacao || '') === situacao;
          }).length;
        }, 0);
      }

      const itens = [
        ['', registros.length, 'Notas'],
        ['', punidos, 'Punidos'],
        ['cumprir', contarPunidos('a cumprir'), 'A cumprir'],
        ['cumprida', contarPunidos('cumprida'), 'Cumpridas']
      ];

      document.getElementById('resumoNotas').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (notas.registros || []).length;

      document.getElementById('contagemNotas').textContent = registros.length === total
        ? registros.length + ' nota(s)'
        : registros.length + ' de ' + total + ' nota(s)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha abre uma segunda, com o
     * texto completo da nota e os atalhos para a súmula e para o controle.
     */
    function desenharLinhasNotas(registros) {
      if (!registros.length) {
        document.getElementById('linhasNotas').innerHTML =
          '<tr><td colspan="5" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma nota encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasNotas').innerHTML = registros.map(function (r) {
        const aberta = !!notasAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Nota', '<span class="protocolo">' + escapar(r.numero || '—') + '</span>'
            + (r.pendente ? '<div class="equipe-dado">⚠️ com campos a definir</div>' : ''))
          + celula('Publicada em', escapar(r.dataNota || '—'))
          + celula('Partida', '<span class="equipe-nome">' + escapar(r.confronto || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(r.dataJogo || r.competicao || '—') + '</div>')
          + celula('Documento', atalhoPdfDaNota(r))
          + celula('Punidos', resumoPunidosDaNota(r))
          + '</tr>';

        return linha + (aberta ? detalheNota(r) : '');
      }).join('');

      conteudo.querySelectorAll('#linhasNotas tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (notasAbertas[chave]) {
            delete notasAbertas[chave];
          } else {
            notasAbertas[chave] = true;
          }

          filtrarNotas();
        });
      });

      // O clique nos atalhos nao deve abrir ou fechar a linha junto.
      conteudo.querySelectorAll('#linhasNotas [data-nao-abre]').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.stopPropagation();
        });
      });

      conteudo.querySelectorAll('#linhasNotas [data-ir-sumula]').forEach(function (botao) {
        botao.addEventListener('click', function (evento) {
          evento.stopPropagation();
          abrirModulo('sumulas', botao.dataset.irSumula);
        });
      });

      conteudo.querySelectorAll('#linhasNotas [data-ir-punicoes]').forEach(function (botao) {
        botao.addEventListener('click', function (evento) {
          evento.stopPropagation();
          abrirModulo('punicoes', botao.dataset.irPunicoes);
        });
      });
    }

    /**
     * A nota em PDF, que e o documento oficial. O clique nao deve abrir a
     * linha junto, por isso o stopPropagation no proprio link.
     */
    function atalhoPdfDaNota(registro) {
      if (!registro.pdfUrl) {
        return '<span class="equipe-dado">sem PDF</span>';
      }

      return '<a class="botao-apoio destaque" data-nao-abre="1" href="'
        + escapar(registro.pdfUrl) + '" target="_blank" rel="noopener">Ver nota</a>';
    }

    /**
     * Protocolo da sumula que originou a nota, com atalho para a tela de
     * súmulas quando ela estiver liberada para o perfil.
     */
    function atalhoSumulaDaNota(registro) {
      if (!registro.protocolo) {
        return '';
      }

      if (!moduloDisponivel('sumulas')) {
        return '<span class="equipe-dado">Súmula: <strong>'
          + escapar(registro.protocolo) + '</strong></span>';
      }

      return '<button type="button" class="botao-apoio" data-ir-sumula="'
        + escapar(registro.protocolo) + '" title="' + escapar(registro.protocolo) + '">Ver súmula</button>';
    }

    /**
     * Quem foi punido pela nota, resumido em uma célula.
     */
    function resumoPunidosDaNota(registro) {
      const punidos = registro.punidos || [];

      if (!punidos.length) {
        return '<span class="equipe-dado">sem punição registrada</span>';
      }

      const nomes = punidos.slice(0, 2).map(function (p) {
        return '<span><strong>' + escapar(p.nome || '—') + '</strong> ' + escapar(p.equipe || '') + '</span>';
      });

      if (punidos.length > nomes.length) {
        nomes.push('<span>e mais ' + (punidos.length - nomes.length) + '</span>');
      }

      return '<div class="contagem">' + nomes.join('') + '</div>';
    }

    /**
     * Linha extra com o texto integral da nota, a lista de punidos e os links.
     */
    function detalheNota(registro) {
      const dados = [
        ['Competição', registro.competicao],
        ['Data do jogo', registro.dataJogo],
        ['Árbitro da partida', registro.arbitro],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const linhas = (registro.punidos || []).map(function (p) {
        return '<tr>'
          + celula('Punido', '<span class="pessoa-nome">' + escapar(p.nome || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(p.equipe || '—') + '</div>')
          + celula('Artigo', escapar(p.artigo || '—'))
          + celula('Decisão', escapar(p.decisao || '—'))
          + celula('Situação', '<span class="' + classeSituacao(p.situacao || '') + '">'
            + escapar(p.situacao || '—') + '</span>')
          + '</tr>';
      }).join('');

      const tabela = linhas
        ? '<table class="pessoas"><thead><tr>'
          + '<th>Punido</th><th>Artigo</th><th>Decis&atilde;o</th><th>Situa&ccedil;&atilde;o</th>'
          + '</tr></thead><tbody>' + linhas + '</tbody></table>'
        : '<p class="equipe-dado">Esta nota n&atilde;o registrou punidos no controle.</p>';

      // O PDF e o documento oficial; o texto aqui serve para ler e buscar
      // sem sair da tela.
      const corpo = registro.texto
        ? '<div class="relato"><h4>Texto da nota</h4><p>' + escapar(registro.texto) + '</p></div>'
        : '';

      // O PDF ja esta na coluna "Documento" da linha; aqui ficam os
      // atalhos para o que veio antes (a sumula) e depois (o controle).
      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + atalhoSumulaDaNota(registro)
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + (registro.numero && moduloDisponivel('punicoes')
          ? '<button type="button" class="botao-apoio" data-ir-punicoes="' + escapar(registro.numero)
            + '">Ver no controle de punições</button>'
          : '')
        + '</div>';

      return '<tr class="detalhe"><td colspan="5"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + tabela
        + corpo
        + links
        + '</div></td></tr>';
    }

    /**
     * Estado da tela de regulamentos.
     */
    let regulamentos = { registros: [], total: 0, limite: 0, pastaUrl: '' };

    /**
     * Abre a solicitacao nativa do Drive ou prepara o pedido de publicacao.
     */
    function botaoSolicitarAcessoAssociado(modulo) {
      if (CONFIG.usuario.perfil !== 'associado') {
        return '';
      }

      if (modulo === 'Regulamentos') {
        return CONFIG.regulamentosPastaUrl
          ? '<div class="barra-acoes"><a class="botao-apoio destaque" href="'
            + escapar(CONFIG.regulamentosPastaUrl)
            + '" target="_blank" rel="noopener">Solicitar acesso como Leitor no Drive</a></div>'
          : '';
      }

      const assunto = 'AEUV - Publicar cadastro da minha equipe';
      const corpo = 'Olá, preciso consultar o cadastro da minha equipe no sistema interno da AEUV.\n'
        + 'Conta Google: ' + CONFIG.usuario.email + '\n'
        + 'Equipe: ' + (CONFIG.usuario.equipe || 'não vinculada') + '\n\n'
        + 'Se a equipe já estiver cadastrada na planilha AEUV - Associados, '
        + 'execute publicarCadastrosAssociados() no editor do Apps Script. '
        + 'Caso contrário, cadastre a equipe antes de publicar a consulta.';
      const url = 'mailto:' + encodeURIComponent(CONFIG.emailSuporte)
        + '?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo);

      return '<div class="barra-acoes"><a class="botao-apoio destaque" href="'
        + escapar(url) + '">Solicitar publicação do cadastro</a></div>';
    }

    /**
     * Busca no servidor os regulamentos publicados.
     */
    function carregarRegulamentos() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'regulamentos') {
            return;
          }

          regulamentos = dados;
          montarTelaRegulamentos();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'regulamentos') {
            return;
          }

          const mensagem = erro && erro.message ? erro.message : String(erro);
          document.getElementById('statusRegulamentos').outerHTML =
            '<div class="erro">' + escapar(mensagem) + '</div>'
            + (/Não foi possível abrir a pasta "Regulamentos"/.test(mensagem)
              ? botaoSolicitarAcessoAssociado('Regulamentos') : '');
        })
        .listarRegulamentos();
    }

    /**
     * Lista os regulamentos em cartoes.
     *
     * Sao poucos arquivos e o uso e sempre o mesmo - abrir o PDF -, entao
     * aqui nao ha tabela nem filtro: cada regulamento e um cartao com os
     * dois botoes de acesso.
     */
    function montarTelaRegulamentos() {
      const registros = regulamentos.registros || [];

      if (!registros.length) {
        document.getElementById('statusRegulamentos').outerHTML =
          '<div class="vazio">Nenhum regulamento publicado at&eacute; o momento.</div>';
        return;
      }

      const cartoes = registros.map(function (r) {
        return '<div class="regulamento">'
          + '<div class="regulamento-titulo"><span class="icone">📕</span>'
          + '<h3>' + escapar(r.titulo) + '</h3></div>'
          + '<p class="equipe-dado">Atualizado em ' + escapar(r.atualizadoEm) + ' · ' + escapar(r.tamanho) + '</p>'
          + '<div class="barra-acoes">'
          + '<a class="botao-apoio destaque" href="' + escapar(r.url) + '" target="_blank" rel="noopener">Abrir PDF</a>'
          + '<a class="botao-apoio" href="' + escapar(r.downloadUrl) + '" target="_blank" rel="noopener">Baixar</a>'
          + '</div></div>';
      }).join('');

      document.getElementById('statusRegulamentos').outerHTML = ''
        + '<div class="barra-acoes">'
        + '<span>' + registros.length + ' regulamento(s)</span>'
        + '<span class="espaco"></span>'
        + '<button type="button" class="botao-apoio" id="recarregarRegulamentos">Atualizar</button>'
        + (regulamentos.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(regulamentos.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="regulamentos">' + cartoes + '</div>';

      document.getElementById('recarregarRegulamentos').addEventListener('click', function () {
        abrirModulo('regulamentos');
      });
    }

    /**
     * Estado da tela de associados. A lista e lida uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let associados = {
      registros: [],
      equipes: [],
      status: [],
      documentos: [],
      podeEditar: false,
      somenteMinhaEquipe: false,
      minhaEquipe: '',
      planilhaUrl: ''
    };

    /**
     * Busca no servidor o cadastro de associados.
     */
    function carregarAssociados() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'associados') {
            return;
          }

          associados = dados;
          montarTelaAssociados();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'associados') {
            return;
          }

          const mensagem = erro && erro.message ? erro.message : String(erro);
          document.getElementById('areaAssociados').innerHTML =
            '<div class="erro">' + escapar(mensagem) + '</div>'
            + (/O cadastro da sua equipe ainda não foi publicado/.test(mensagem)
              ? botaoSolicitarAcessoAssociado('Associados') : '');
        })
        .listarAssociados();
    }

    /**
     * Monta os indicadores, os filtros e a tabela dos associados.
     */
    function montarTelaAssociados() {
      const registros = associados.registros || [];

      // Quem enxerga uma equipe so vai direto ao cadastro dela: lista,
      // busca e filtro de situacao nao servem para um registro unico.
      if (associados.somenteMinhaEquipe) {
        if (registros.length) {
          abrirFormularioAssociado(registros[0].equipe);
        } else {
          document.getElementById('areaAssociados').innerHTML = '<div class="vazio">'
            + 'A equipe <strong>' + escapar(associados.minhaEquipe || '') + '</strong> ainda n&atilde;o tem '
            + 'cadastro. Procure a diretoria para fazer o cadastro inicial.</div>';
        }

        return;
      }

      const novo = associados.podeEditar
        ? '<button type="button" class="botao-apoio" id="novoAssociado">+ Novo cadastro</button>'
        : '';

      const planilha = associados.planilhaUrl
        ? '<a class="botao-apoio" href="' + escapar(associados.planilhaUrl) + '" target="_blank" rel="noopener">Abrir planilha</a>'
        : '';

      const painel = '<div id="painelAssociados">'
        + '<div class="resumo" id="resumoAssociados"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaAssociados" placeholder="Buscar por equipe, representante, CPF ou e-mail">'
        + opcoesFiltroAssociados()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span class="espaco"></span>' + novo + planilha
        + '</div>'
        + '<div class="tabela-rolagem"><table class="associados">'
        + '<thead><tr><th>Equipe</th><th>Situação</th><th>Representante</th>'
        + '<th>Contato</th><th>Cidade</th><th>Docs.</th></tr></thead>'
        + '<tbody id="linhasAssociados"></tbody></table></div>'
        + '</div>';

      const vazio = '<div id="painelAssociados">'
        + '<div class="barra-acoes"><span class="espaco"></span>' + novo + planilha + '</div>'
        + '<div class="vazio">Nenhuma equipe associada cadastrada at&eacute; o momento.'
        + (associados.podeEditar ? ' Use o bot&atilde;o acima para come&ccedil;ar.' : '')
        + '</div></div>';

      document.getElementById('areaAssociados').innerHTML = registros.length ? painel : vazio;

      if (registros.length) {
        desenharResumoAssociados(registros);
        desenharLinhasAssociados(registros);

        document.getElementById('buscaAssociados').addEventListener('input', filtrarAssociados);
        document.getElementById('filtroStatus').addEventListener('change', filtrarAssociados);
      }

      const botaoNovo = document.getElementById('novoAssociado');

      if (botaoNovo) {
        botaoNovo.addEventListener('click', function () {
          abrirFormularioAssociado(null);
        });
      }
    }

    /**
     * Filtro de situacao, montado a partir das opcoes do servidor.
     */
    function opcoesFiltroAssociados() {
      const opcoes = (associados.status || []).map(function (item) {
        return '<option value="' + escapar(item.id) + '">' + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      return '<select id="filtroStatus"><option value="">Todas as situa&ccedil;&otilde;es</option>' + opcoes + '</select>';
    }

    /**
     * Aplica busca e filtro de situacao sobre a lista carregada.
     */
    function filtrarAssociados() {
      const termo = simplificar(document.getElementById('buscaAssociados').value);
      const status = document.getElementById('filtroStatus').value;

      const filtrados = (associados.registros || []).filter(function (registro) {
        if (status && registro.status !== status) {
          return false;
        }

        if (!termo) {
          return true;
        }

        return simplificar([
          registro.equipe, registro.nome, registro.email, registro.cpf, registro.cidade
        ].join(' ')).indexOf(termo) !== -1;
      });

      desenharResumoAssociados(filtrados);
      desenharLinhasAssociados(filtrados);
    }

    /**
     * Indicadores por situacao, mais a contagem de documentos pendentes.
     */
    function desenharResumoAssociados(registros) {
      const itens = (associados.status || []).map(function (item) {
        return {
          numero: registros.filter(function (r) { return r.status === item.id; }).length,
          rotulo: item.icone + ' ' + item.nome
        };
      });

      itens.push({
        numero: registros.filter(function (r) { return r.pendencias > 0; }).length,
        rotulo: '📎 Com documento pendente'
      });

      document.getElementById('resumoAssociados').innerHTML = itens.map(function (item) {
        return '<div class="indicador"><span class="numero">' + item.numero + '</span>'
          + '<span class="rotulo">' + escapar(item.rotulo) + '</span></div>';
      }).join('');
    }

    /**
     * Desenha as linhas da tabela. Clicar numa linha abre o cadastro.
     */
    function desenharLinhasAssociados(registros) {
      const corpo = document.getElementById('linhasAssociados');

      if (!registros.length) {
        corpo.innerHTML = '<tr><td colspan="6"><div class="vazio">'
          + 'Nenhum associado encontrado com esses filtros.</div></td></tr>';
        return;
      }

      corpo.innerHTML = registros.map(function (r) {
        const situacao = nomeStatus(r.status);
        const docs = r.pendencias
          ? '<span class="pilula pendente">' + r.pendencias + ' pendente' + (r.pendencias > 1 ? 's' : '') + '</span>'
          : '<span class="pilula ativo">Completo</span>';

        return '<tr data-equipe="' + escapar(r.equipe) + '">'
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Situação', '<span class="pilula ' + escapar(r.status) + '">'
            + escapar(situacao.icone + ' ' + situacao.nome) + '</span>')
          + celula('Representante', escapar(r.nome)
            + '<div class="equipe-dado">' + escapar(formatarCpf(r.cpf)) + '</div>')
          + celula('Contato', escapar(formatarTelefone(r.telefone))
            + '<div class="equipe-dado">' + escapar(r.email) + '</div>')
          + celula('Cidade', escapar(r.cidade + (r.uf ? '/' + r.uf : '')))
          + celula('Documentos', docs)
          + '</tr>';
      }).join('');

      corpo.querySelectorAll('tr[data-equipe]').forEach(function (linha) {
        linha.addEventListener('click', function () {
          abrirFormularioAssociado(linha.dataset.equipe);
        });
      });
    }

    /**
     * Abre o cadastro de uma equipe. Sem equipe, abre em branco.
     * Quem nao pode editar ve os mesmos dados, apenas para leitura.
     */
    function abrirFormularioAssociado(equipe) {
      const registro = (associados.registros || []).filter(function (r) {
        return r.equipe === equipe;
      })[0] || null;

      const somenteLeitura = !associados.podeEditar;
      const trava = somenteLeitura ? ' disabled' : '';

      const equipes = (associados.equipes || []).slice();

      // Equipe ja cadastrada fora da lista padrao continua aparecendo.
      if (registro && equipes.indexOf(registro.equipe) === -1) {
        equipes.push(registro.equipe);
      }

      const opcoesEquipe = equipes.sort().map(function (nome) {
        const jaTem = (associados.registros || []).some(function (r) { return r.equipe === nome; });
        const selecionada = registro && registro.equipe === nome;

        // Sem registro aberto, esconde as equipes que ja tem cadastro:
        // cada equipe entra uma vez so.
        if (!registro && jaTem) {
          return '';
        }

        return '<option value="' + escapar(nome) + '"' + (selecionada ? ' selected' : '') + '>'
          + escapar(nome) + '</option>';
      }).join('');

      const opcoesStatus = (associados.status || []).map(function (item) {
        const selecionado = registro ? registro.status === item.id : item.id === 'pendente';

        return '<option value="' + escapar(item.id) + '"' + (selecionado ? ' selected' : '') + '>'
          + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      const documentos = (associados.documentos || []).map(function (documento) {
        const url = registro ? registro[documento.id] : '';
        const situacao = url
          ? '<span class="situacao entregue">Entregue</span> '
            + '<a href="' + escapar(url) + '" target="_blank" rel="noopener">abrir arquivo</a>'
          : '<span class="situacao falta">Ainda n&atilde;o enviado</span>';

        const envio = somenteLeitura
          ? ''
          : '<input type="file" data-documento="' + escapar(documento.id) + '" '
            + 'accept=".pdf,.jpg,.jpeg,.png,.webp">';

        return '<div class="documento">'
          + '<span class="titulo">' + escapar(documento.nome) + '</span>'
          + '<span class="dica">' + escapar(documento.apoio) + '</span>'
          + '<span>' + situacao + '</span>'
          + envio
          + '</div>';
      }).join('');

      const titulo = registro
        ? (somenteLeitura ? 'Cadastro de ' + registro.equipe : 'Editar ' + registro.equipe)
        : 'Novo associado';

      const historico = registro && registro.atualizadoEm
        ? '<p class="apoio">&Uacute;ltima altera&ccedil;&atilde;o em ' + escapar(registro.atualizadoEm)
          + (registro.atualizadoPor ? ' por ' + escapar(registro.atualizadoPor) : '') + '.</p>'
        : '';

      const gravar = somenteLeitura
        ? '<p class="apoio">O seu perfil permite consultar, mas n&atilde;o alterar o cadastro.</p>'
        : '<button type="button" class="botao-principal" id="gravarAssociado">Salvar cadastro</button>';

      // Sem lista para onde voltar, o botao nao tem destino.
      const voltar = associados.somenteMinhaEquipe
        ? ''
        : '<button type="button" class="botao-apoio" id="voltarAssociados">Voltar &agrave; lista</button>';

      document.getElementById('areaAssociados').innerHTML = '<div class="formulario">'
        + '<h3>' + escapar(titulo) + '</h3>'
        + historico
        + '<div class="grupo"><h4>Equipe</h4><div class="campos">'
        + '<div class="campo largo"><label for="fEquipe">Equipe associada</label>'
        + '<select id="fEquipe"' + (registro ? ' disabled' : trava) + '>'
        + (registro ? '' : '<option value="">Selecione</option>') + opcoesEquipe + '</select>'
        + (registro ? '<span class="dica">A equipe n&atilde;o muda depois de cadastrada.</span>' : '')
        + '</div>'
        + '<div class="campo largo"><label for="fStatus">Situa&ccedil;&atilde;o</label>'
        + '<select id="fStatus"' + trava + '>' + opcoesStatus + '</select></div>'
        + '</div></div>'
        + '<div class="grupo"><h4>Representante legal</h4><div class="campos">'
        + campoTexto('fNome', 'Nome completo', registro ? registro.nome : '', 'cheio', trava, 'text')
        + campoTexto('fNascimento', 'Data de nascimento', paraDataInput(registro ? registro.nascimento : ''), '', trava, 'date')
        + campoTexto('fCpf', 'CPF', formatarCpf(registro ? registro.cpf : ''), '', trava, 'text')
        + campoTexto('fRg', 'RG', registro ? registro.rg : '', '', trava, 'text')
        + campoTexto('fEmail', 'E-mail', registro ? registro.email : '', 'largo', trava, 'email')
        + campoTexto('fTelefone', 'Telefone com DDD', formatarTelefone(registro ? registro.telefone : ''), 'largo', trava, 'tel')
        + '</div></div>'
        + '<div class="grupo"><h4>Endere&ccedil;o</h4><div class="campos">'
        + campoTexto('fCep', 'CEP', formatarCep(registro ? registro.cep : ''), 'curto', trava, 'text')
        + campoTexto('fLogradouro', 'Logradouro', registro ? registro.logradouro : '', 'largo', trava, 'text')
        + campoTexto('fNumero', 'Número', registro ? registro.numero : '', 'curto', trava, 'text')
        + campoTexto('fComplemento', 'Complemento', registro ? registro.complemento : '', '', trava, 'text')
        + campoTexto('fBairro', 'Bairro', registro ? registro.bairro : '', '', trava, 'text')
        + campoTexto('fCidade', 'Cidade', registro ? registro.cidade : '', 'curto', trava, 'text')
        + campoTexto('fUf', 'UF', registro ? registro.uf : '', 'mini', trava, 'text')
        + '</div></div>'
        + '<div class="grupo"><h4>Documenta&ccedil;&atilde;o</h4>'
        + '<p class="apoio">Arquivos PDF, JPG, PNG ou WEBP, de at&eacute; 5 MB cada. '
        + 'Enviar um arquivo novo substitui o anterior.</p>'
        + '<div class="campos">' + documentos + '</div></div>'
        + '<div class="acoes-formulario">'
        + gravar
        + voltar
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoAssociado"></span>'
        + '</div></div>';

      const botaoVoltar = document.getElementById('voltarAssociados');

      if (botaoVoltar) {
        botaoVoltar.addEventListener('click', montarTelaAssociados);
      }

      const botaoGravar = document.getElementById('gravarAssociado');

      if (botaoGravar) {
        botaoGravar.addEventListener('click', function () {
          gravarAssociado(registro);
        });

        ligarMascaras();
      }
    }

    /**
     * Monta um campo de texto do formulario.
     */
    function campoTexto(id, rotulo, valor, largura, trava, tipo) {
      return '<div class="campo ' + largura + '">'
        + '<label for="' + id + '">' + escapar(rotulo) + '</label>'
        + '<input type="' + tipo + '" id="' + id + '" value="' + escapar(valor || '') + '"' + trava + '>'
        + '</div>';
    }

    /**
     * Formata CPF, telefone e CEP enquanto a pessoa digita.
     */
    function ligarMascaras() {
      mascara('fCpf', 11, function (d) {
        return d.replace(/^(\d{3})(\d{3})?(\d{3})?(\d{0,2})?$/, function (t, a, b, c, e) {
          return a + (b ? '.' + b : '') + (c ? '.' + c : '') + (e ? '-' + e : '');
        });
      });

      mascara('fCep', 8, function (d) {
        return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
      });

      mascara('fTelefone', 11, function (d) {
        if (d.length <= 2) {
          return d;
        }

        const corte = d.length > 10 ? 7 : 6;

        return '(' + d.slice(0, 2) + ') ' + d.slice(2, corte)
          + (d.length > corte ? '-' + d.slice(corte) : '');
      });

      const uf = document.getElementById('fUf');

      uf.addEventListener('input', function () {
        uf.value = uf.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
      });
    }

    /**
     * Prende um campo a um formato, mantendo apenas digitos por baixo.
     */
    function mascara(id, digitos, formatar) {
      const campo = document.getElementById(id);

      campo.addEventListener('input', function () {
        const limpo = campo.value.replace(/\D/g, '').slice(0, digitos);
        campo.value = limpo ? formatar(limpo) : '';
      });
    }

    /**
     * Le o formulario, envia os anexos e grava no servidor.
     */
    function gravarAssociado(registro) {
      const botao = document.getElementById('gravarAssociado');
      const aviso = document.getElementById('avisoAssociado');

      botao.disabled = true;
      aviso.textContent = 'Enviando...';

      const payload = {
        equipe: registro ? registro.equipe : document.getElementById('fEquipe').value,
        status: document.getElementById('fStatus').value,
        nome: document.getElementById('fNome').value,
        nascimento: document.getElementById('fNascimento').value,
        email: document.getElementById('fEmail').value,
        telefone: document.getElementById('fTelefone').value,
        cep: document.getElementById('fCep').value,
        logradouro: document.getElementById('fLogradouro').value,
        numero: document.getElementById('fNumero').value,
        complemento: document.getElementById('fComplemento').value,
        bairro: document.getElementById('fBairro').value,
        cidade: document.getElementById('fCidade').value,
        uf: document.getElementById('fUf').value,
        rg: document.getElementById('fRg').value,
        cpf: document.getElementById('fCpf').value
      };

      lerAnexos().then(function (arquivos) {
        payload.arquivos = arquivos;

        google.script.run
          .withSuccessHandler(function (resposta) {
            carregarAssociados();

            document.getElementById('areaAssociados').insertAdjacentHTML('beforebegin',
              '<div class="sucesso" id="sucessoAssociado">' + escapar(resposta.equipe)
              + (resposta.novo ? ' cadastrada' : ' atualizada') + ' com sucesso.</div>');

            setTimeout(function () {
              const recado = document.getElementById('sucessoAssociado');

              if (recado) {
                recado.remove();
              }
            }, 6000);
          })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            aviso.innerHTML = '<span style="color:#922b21;">'
              + escapar(erro && erro.message ? erro.message : erro) + '</span>';
          })
          .salvarAssociado(payload);
      }).catch(function (erro) {
        botao.disabled = false;
        aviso.innerHTML = '<span style="color:#922b21;">'
          + escapar(erro && erro.message ? erro.message : erro) + '</span>';
      });
    }

    /**
     * Converte os arquivos escolhidos em base64 para envio ao servidor.
     */
    function lerAnexos() {
      const campos = Array.prototype.slice.call(
        document.querySelectorAll('[data-documento]')
      ).filter(function (campo) {
        return campo.files && campo.files.length;
      });

      return Promise.all(campos.map(function (campo) {
        const arquivo = campo.files[0];

        if (arquivo.size > 5 * 1024 * 1024) {
          return Promise.reject(new Error('O arquivo "' + arquivo.name + '" passa de 5 MB.'));
        }

        return new Promise(function (resolve, reject) {
          const leitor = new FileReader();

          leitor.onload = function () {
            resolve({
              campo: campo.dataset.documento,
              nome: arquivo.name,
              tipo: arquivo.type,
              tamanho: arquivo.size,
              base64: String(leitor.result).split(',')[1]
            });
          };

          leitor.onerror = function () {
            reject(new Error('Não foi possível ler o arquivo "' + arquivo.name + '".'));
          };

          leitor.readAsDataURL(arquivo);
        });
      })).then(function (lidos) {
        const arquivos = {};

        lidos.forEach(function (item) {
          arquivos[item.campo] = item;
        });

        return arquivos;
      });
    }

    /**
     * Situacao pelo id, com o circulo colorido.
     */
    function nomeStatus(id) {
      return (associados.status || []).filter(function (item) {
        return item.id === id;
      })[0] || { icone: '', nome: id || '-' };
    }

    function formatarCpf(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (valor || '');
    }

    function formatarTelefone(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      if (d.length === 11) {
        return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      }

      return d.length === 10 ? d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3') : (valor || '');
    }

    function formatarCep(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, '$1-$2') : (valor || '');
    }

    /**
     * Converte dd/mm/aaaa da planilha para aaaa-mm-dd do campo de data.
     */
    function paraDataInput(valor) {
      const partes = String(valor || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

      return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
    }

    /******************************************************
     * ATAS DE REUNIOES (CLIENTE)
     ******************************************************/

    let atasDados = null;
    let ataEmEdicao = null;
    let ataAlterada = false;
    let ataOcupada = false;

    function podeSairDaAta() {
      if (ataOcupada) return false;
      if (!ataAlterada) return true;
      const sair = window.confirm('Existem alterações não salvas na ata. Deseja descartá-las?');
      if (sair) ataAlterada = false;
      return sair;
    }

    window.addEventListener('beforeunload', function (evento) {
      if (moduloAtual === 'atas' && ataAlterada) {
        evento.preventDefault();
        evento.returnValue = '';
      }
    });

    function carregarAtas(editarId) {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'atas') return;
          atasDados = dados;
          ataAlterada = false;
          montarListaAtas();
          if (editarId && dados.podeEditar) abrirEditorAta(editarId);
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'atas') return;
          document.getElementById('areaAtas').innerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarAtas();
    }

    function montarListaAtas() {
      ataEmEdicao = null;
      const area = document.getElementById('areaAtas');
      const registros = atasDados.registros || [];
      area.innerHTML = '<div class="barra-acoes">'

      if (cartao) {
        cartao.querySelectorAll('button').forEach(function (acao) { acao.disabled = true; });
        destino.insertAdjacentHTML('beforeend', '<div class="ata-progresso" role="status" aria-live="polite">'
          + escapar(rotulo) + '</div>');
        return destino.querySelector('.ata-progresso');
      }
      destino.innerHTML = '<div class="ata-progresso" role="status" aria-live="polite">'
        + escapar(rotulo) + '</div>';
      if (botao) botao.disabled = true;
      return destino.querySelector('.ata-progresso');

    function formatarMoedaJs(num) {
      return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function pad2Fin(n) {
      var s = String(n);
      return s.length === 1 ? '0' + s : s;
    }

    function extrairYmdFin(val) {
      if (!val) return '';
      if (Object.prototype.toString.call(val) === '[object Date]' && !isNaN(val.getTime())) {
        return String(val.getFullYear()) + pad2Fin(val.getMonth() + 1) + pad2Fin(val.getDate());
      }
      var s = String(val).trim();
      var mBr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (mBr) {
        return mBr[3] + pad2Fin(mBr[2]) + pad2Fin(mBr[1]);
      }
      var mIso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (mIso) {
        return mIso[1] + pad2Fin(mIso[2]) + pad2Fin(mIso[3]);
      }
      var t = Date.parse(s);
      if (!isNaN(t)) {
        var dt = new Date(t);
        return String(dt.getFullYear()) + pad2Fin(dt.getMonth() + 1) + pad2Fin(dt.getDate());
      }
      return '';
    }

    // Datas digitadas no filtro so valem quando completas (dd/mm/aaaa ou aaaa-mm-dd);
    // evita que Date.parse interprete valores parciais como datas erradas.
    function ymdFiltroDigitadoFin(val) {
      var s = String(val || '').trim();
      var mBr = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (mBr) return mBr[3] + mBr[2] + mBr[1];
      var mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (mIso) return mIso[1] + mIso[2] + mIso[3];
      return '';
    }

    function aplicarMascaraDataBr(input, onValChange) {
      if (!input) return;
      input.addEventListener('input', function() {
        var v = this.value.replace(/\D/g, '').slice(0, 8);
        if (v.length >= 5) {
          this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
        } else if (v.length >= 3) {
          this.value = v.slice(0, 2) + '/' + v.slice(2);
        } else {
          this.value = v;
        }
        if (onValChange) onValChange(this.value);
      });
      input.addEventListener('change', function() {
        if (onValChange) onValChange(this.value);
      });
    }

    function vincularPickerData(btnId, pickerId, inputId, onValChange) {
      var btn = document.getElementById(btnId);
      var picker = document.getElementById(pickerId);
      var txt = document.getElementById(inputId);
      if (!btn || !picker || !txt) return;

      btn.addEventListener('click', function() {
        try {
          if (typeof picker.showPicker === 'function') {
            picker.showPicker();
          } else {
            picker.focus();
            picker.click();
          }
        } catch (e) {
          picker.focus();
          picker.click();
        }
      });

      picker.addEventListener('change', function() {
        if (this.value) {
          txt.value = formatarDataBr(this.value);
          if (onValChange) onValChange(txt.value);
        }
      });
    }

      document.getElementById('btnRelatorioGeral').addEventListener('click', function() {
        emitirRelatorioPrompt('geral');
      });
      document.getElementById('btnRelatorioEmenda').addEventListener('click', function() {
        emitirRelatorioPrompt('emenda');
      });
      document.getElementById('btnRelatorioCompeticao').addEventListener('click', function() {
        emitirRelatorioPrompt('competicao');
      });

      document.getElementById('filtroFinBusca').addEventListener('input', function() {
        financeiroFiltros.busca = this.value;
        renderizarLinhasFinanceiro();
      });

      var selPeriodo = document.getElementById('filtroFinPeriodo');
      var containerDatas = document.getElementById('finLinhaDatas');
      var inputDataInicio = document.getElementById('filtroFinDataInicio');
      var inputDataFim = document.getElementById('filtroFinDataFim');

      selPeriodo.addEventListener('change', function() {
        financeiroFiltros.periodo = this.value;
        // Qualquer troca de periodo descarta o intervalo anterior e refaz a consulta.
        inputDataInicio.value = '';
        inputDataFim.value = '';
        financeiroFiltros.dataInicio = '';
        financeiroFiltros.dataFim = '';
        var pkIni = document.getElementById('filtroFinPickerInicio');
        var pkFim = document.getElementById('filtroFinPickerFim');
        if (pkIni) pkIni.value = '';
        if (pkFim) pkFim.value = '';
        containerDatas.style.display = this.value === 'custom' ? 'flex' : 'none';
        renderizarLinhasFinanceiro();
      });

      aplicarMascaraDataBr(inputDataInicio, function(val) {
        financeiroFiltros.dataInicio = val;
        renderizarLinhasFinanceiro();
      });

      aplicarMascaraDataBr(inputDataFim, function(val) {
        financeiroFiltros.dataFim = val;
        renderizarLinhasFinanceiro();
      });

      vincularPickerData('btnPickerInicio', 'filtroFinPickerInicio', 'filtroFinDataInicio', function(val) {
        financeiroFiltros.dataInicio = val;
        renderizarLinhasFinanceiro();
      });

      vincularPickerData('btnPickerFim', 'filtroFinPickerFim', 'filtroFinDataFim', function(val) {
        financeiroFiltros.dataFim = val;
        renderizarLinhasFinanceiro();
      });

      document.getElementById('btnFinHoje').addEventListener('click', function() {
        var agora = new Date();
        var dtHoje = pad2Fin(agora.getDate()) + '/' + pad2Fin(agora.getMonth() + 1) + '/' + agora.getFullYear();
        inputDataInicio.value = dtHoje;
        inputDataFim.value = dtHoje;
        financeiroFiltros.dataInicio = dtHoje;
        financeiroFiltros.dataFim = dtHoje;
        renderizarLinhasFinanceiro();
      });

      document.getElementById('btnFinEsteMes').addEventListener('click', function() {
        var agora = new Date();
        var diaFim = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
        var mesStr = pad2Fin(agora.getMonth() + 1);
        var dtIni = '01/' + mesStr + '/' + agora.getFullYear();
        var dtFim = pad2Fin(diaFim) + '/' + mesStr + '/' + agora.getFullYear();
        inputDataInicio.value = dtIni;
        inputDataFim.value = dtFim;
        financeiroFiltros.dataInicio = dtIni;
        financeiroFiltros.dataFim = dtFim;
        renderizarLinhasFinanceiro();
      });

      document.getElementById('btnFinLimparDatas').addEventListener('click', function() {
        inputDataInicio.value = '';
        inputDataFim.value = '';
        financeiroFiltros.dataInicio = '';
        financeiroFiltros.dataFim = '';
        renderizarLinhasFinanceiro();
      });

      document.getElementById('filtroFinTipo').addEventListener('change', function() {
        financeiroFiltros.tipo = this.value;
        renderizarLinhasFinanceiro();
      });
      document.getElementById('filtroFinOrigem').addEventListener('change', function() {
        financeiroFiltros.origem = this.value;
        renderizarLinhasFinanceiro();
      });
      document.getElementById('filtroFinCategoria').addEventListener('change', function() {
        financeiroFiltros.categoria = this.value;
        renderizarLinhasFinanceiro();
      });

      renderizarLinhasFinanceiro();
    }

    function limparTodosFiltrosFinanceiro() {
      financeiroFiltros.busca = '';
      financeiroFiltros.periodo = '';
      financeiroFiltros.dataInicio = '';
      financeiroFiltros.dataFim = '';
      financeiroFiltros.tipo = '';
      financeiroFiltros.origem = '';
      financeiroFiltros.categoria = '';
      var elBusca = document.getElementById('filtroFinBusca');
      var elPeriodo = document.getElementById('filtroFinPeriodo');
      var elTipo = document.getElementById('filtroFinTipo');
      var elOrigem = document.getElementById('filtroFinOrigem');
      var elCat = document.getElementById('filtroFinCategoria');
      var elIni = document.getElementById('filtroFinDataInicio');
      var elFim = document.getElementById('filtroFinDataFim');
      var containerDatas = document.getElementById('finLinhaDatas');
      if (elBusca) elBusca.value = '';
      if (elPeriodo) elPeriodo.value = '';
      if (elTipo) elTipo.value = '';
      if (elOrigem) elOrigem.value = '';
      if (elCat) elCat.value = '';
      if (elIni) elIni.value = '';
      if (elFim) elFim.value = '';
      if (containerDatas) containerDatas.style.display = 'none';
      renderizarLinhasFinanceiro();
    }

    function renderizarLinhasFinanceiro() {
      var tbody = document.getElementById('linhasFinanceiro');
      if (!tbody) return;

      var d = financeiroDados || {};
      var podeExcluir = d.podeEditar;
      var lista = d.lancamentos || [];

      // Determina limites de data (formato YYYYMMDD comparavel)
      var ymdInicio = '';
      var ymdFim = '';
      var hoje = new Date();

      if (financeiroFiltros.periodo === 'hoje') {
        ymdInicio = extrairYmdFin(hoje);
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === 'mes_atual') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
        ymdFim = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0));
      } else if (financeiroFiltros.periodo === '3m') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() - 3, hoje.getDate()));
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === '6m') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() - 6, hoje.getDate()));
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === 'anual') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), 0, 1));
        ymdFim = extrairYmdFin(new Date(hoje.getFullYear(), 11, 31));
      } else if (financeiroFiltros.periodo === 'custom') {
        ymdInicio = ymdFiltroDigitadoFin(financeiroFiltros.dataInicio);
        ymdFim = ymdFiltroDigitadoFin(financeiroFiltros.dataFim);
      }

      var filtrados = lista.filter(function (l) {
        var busca = (financeiroFiltros.busca || '').toLowerCase();
        if (busca) {
          var textoGeral = (l.descricao + ' ' + l.favorecidoPagador + ' ' + l.documento + ' ' + l.emenda + ' ' + l.idLancamento).toLowerCase();
          if (textoGeral.indexOf(busca) === -1) return false;
        }
        if (financeiroFiltros.tipo && l.tipo.toLowerCase() !== financeiroFiltros.tipo.toLowerCase()) return false;
        if (financeiroFiltros.origem && l.origem.toLowerCase() !== financeiroFiltros.origem.toLowerCase()) return false;
        if (financeiroFiltros.categoria && l.categoria.toLowerCase() !== financeiroFiltros.categoria.toLowerCase()) return false;

        if (ymdInicio || ymdFim) {
          var ymdMov = extrairYmdFin(l.dataMovimentacao);
          if (ymdMov) {
            if (ymdInicio && ymdMov < ymdInicio) return false;
            if (ymdFim && ymdMov > ymdFim) return false;
          }
        }

        return true;
      });

      // Recalcula totais dos cartoes de acordo com os filtros aplicados
      var somaEntradas = 0;
      var somaSaidas = 0;
      for (var f = 0; f < filtrados.length; f++) {
        var it = filtrados[f];
        if (it.tipo.toLowerCase() === 'entrada') {
          somaEntradas += Number(it.valor || 0);
        } else {
          somaSaidas += Number(it.valor || 0);
        }
      }
      var elCardEntradas = document.getElementById('cardFinTotalEntradas');
      var elCardSaidas = document.getElementById('cardFinTotalSaidas');
      var elCardSaldo = document.getElementById('cardFinSaldoAtual');
      var elRotuloSaldo = document.getElementById('cardFinRotuloSaldo');
      if (elCardEntradas) elCardEntradas.textContent = formatarMoedaJs(somaEntradas);
      if (elCardSaidas) elCardSaidas.textContent = formatarMoedaJs(somaSaidas);
      if (elCardSaldo) {
        var saldoCalc = somaEntradas - somaSaidas;
        elCardSaldo.textContent = formatarMoedaJs(saldoCalc);
        elCardSaldo.style.color = saldoCalc >= 0 ? '#14213d' : '#b3261e';
      }
      if (elRotuloSaldo) {
        var temFiltroAtivo = financeiroFiltros.busca || financeiroFiltros.tipo || financeiroFiltros.origem || financeiroFiltros.categoria || financeiroFiltros.periodo;
        elRotuloSaldo.textContent = temFiltroAtivo ? 'Saldo do Período Filtrado' : 'Saldo em Caixa';
      }

      var numCols = podeExcluir ? 9 : 8;
      if (!filtrados.length) {
        tbody.innerHTML = '<tr><td colspan="' + numCols + '" style="text-align:center;padding:32px 16px;color:var(--apoio);">'
          + '<div style="font-size:26px;margin-bottom:6px;">🔍</div>'
          + '<div style="font-weight:600;color:var(--azul);font-size:14px;">Nenhuma movimentação encontrada com os filtros informados.</div>'
          + '<div style="font-size:12px;margin-top:4px;">Verifique os filtros selecionados ou limpe as datas para ver todas as movimentações.</div>'
          + '<button type="button" class="botao-apoio" id="btnFinLimparFiltrosVazio" style="margin-top:12px;display:inline-block;">Limpar Filtros</button>'
          + '</td></tr>';
        var btnLimparVazio = document.getElementById('btnFinLimparFiltrosVazio');
        if (btnLimparVazio) {
          btnLimparVazio.addEventListener('click', limparTodosFiltrosFinanceiro);
        }
        return;
      }

      var linhasHtml = filtrados.map(function (item) {
        var ehEntrada = item.tipo.toLowerCase() === 'entrada';
        var corTipo = ehEntrada ? '#1e7b34' : '#b3261e';
        var bgTipo = ehEntrada ? '#eefbf0' : '#fdf2f2';
        var sinal = ehEntrada ? '+ ' : '- ';

        var docInfo = [];
        if (item.favorecidoPagador) docInfo.push('<strong>' + escapar(item.favorecidoPagador) + '</strong>');
        if (item.documento) docInfo.push('Doc: ' + escapar(item.documento));
        if (item.idTransacaoBancaria) docInfo.push('<span style="color:#555;font-size:11px;">🏦 Extrato: <strong>' + escapar(item.idTransacaoBancaria) + '</strong></span>');
        if (item.emenda) docInfo.push('<span class="etiqueta" style="background:#eef4fd;color:#14213d;">' + escapar(item.emenda) + '</span>');

        var compLink = item.comprovanteUrl
          ? '<a class="btn-anexo-fin" href="' + escapar(item.comprovanteUrl) + '" target="_blank" rel="noopener" title="Ver comprovante anexado">📎</a>'
          : '<span style="color:#aaa;">—</span>';

        var btnExcluirHtml = podeExcluir
          ? '<td class="fin-col-acoes"><div class="fin-acoes-linha">'
            + '<button type="button" class="btn-acao-editar" title="Editar Lançamento" data-id="' + escapar(item.idLancamento) + '">✏️</button>'
            + '<button type="button" class="btn-acao-excluir" title="Excluir Lançamento" data-id="' + escapar(item.idLancamento) + '" data-desc="' + escapar(item.descricao) + '" data-valor="' + formatarMoedaJs(item.valor) + '">🗑️</button>'
            + '</div></td>'
          : '';

        return '<tr>'
          + '<td style="white-space:nowrap;font-weight:600;">' + escapar(formatarDataBr(item.dataMovimentacao)) + '</td>'
          + '<td><span style="background:' + bgTipo + ';color:' + corTipo + ';font-weight:bold;padding:3px 7px;border-radius:4px;font-size:11px;">' + escapar(item.tipo) + '</span></td>'
          + '<td title="' + escapar(item.origem || 'Geral') + '">' + escapar(item.origem || 'Geral') + '</td>'
          + '<td title="' + escapar(item.categoria) + '">' + escapar(item.categoria) + '</td>'
          + '<td><span class="fin-desc-texto">' + escapar(item.descricao) + '</span><small class="fin-desc-id">' + escapar(item.idLancamento) + '</small></td>'
          + '<td>' + (docInfo.join('<br>') || '—') + '</td>'
          + '<td style="text-align:center;">' + compLink + '</td>'
          + '<td style="text-align:right;white-space:nowrap;font-weight:bold;color:' + corTipo + ';">' + sinal + formatarMoedaJs(item.valor) + '</td>'
          + btnExcluirHtml
          + '</tr>';
      }).join('');

      tbody.innerHTML = linhasHtml;

      if (podeExcluir) {
        tbody.querySelectorAll('.btn-acao-excluir').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var id = this.getAttribute('data-id');
            var desc = this.getAttribute('data-desc');
            var val = this.getAttribute('data-valor');
            confirmarExclusaoFinanceiro(id, desc, val);
          });
        });
        tbody.querySelectorAll('.btn-acao-editar').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var id = this.getAttribute('data-id');
            var alvo = (financeiroDados.lancamentos || []).filter(function(l) { return l.idLancamento === id; })[0];
            if (alvo) abrirModalNovoLancamento(alvo);
          });
        });
      }
    }

        + '      </select>'

        + '      <div class="fin-campo">'

        + '        <input type="text" id="finDoc" placeholder="Ex: NF-e 004.821 / Recibo 12">'
        + '      </div>'
        + '    </div>'

        + '        <input type="text" id="finIdTransacao" placeholder="Ex: PIX E123... / Lote TED 489 / Linha 12">'
        + '      </div>'
        + '      <div class="fin-campo">'
        + '        <label for="finEmenda">Emenda Impositiva / Termo Fomento</label>'

        + '      </div>'
        + '    </div>'

        + '      <label>Comprovante de Pagamento / Recibo</label>'
        + (edicao && edicao.comprovanteUrl
            ? '      <div class="fin-comprovante-atual">'
              + '        <a href="' + escapar(edicao.comprovanteUrl) + '" target="_blank" rel="noopener">📄 Ver comprovante atual</a>'
              + '        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:normal;"><input type="checkbox" id="finRemoverComp"> Remover comprovante</label>'
              + '      </div>'
            : '')
        + '      <label class="fin-upload-area" for="finArquivo">'

        + '        <span class="fin-upload-icone">📎</span>'

        + '        <span class="fin-upload-ajuda">Formatos aceitos: PDF ou Imagem (JPG, PNG) até 8 MB</span>'
        + '        <span id="finNomeArquivo" class="fin-upload-nome"></span>'

        + '</div>';

      modal.innerHTML = formHtml;
      document.body.appendChild(modal);

      var selTipo = document.getElementById('finTipo');
      var selCat = document.getElementById('finCategoria');
      var inputValor = document.getElementById('finValor');
      var arquivoInput = document.getElementById('finArquivo');
      var nomeArquivoSpan = document.getElementById('finNomeArquivo');

      // Atualiza o nome do arquivo anexado visualmente
      arquivoInput.addEventListener('change', function () {
        if (arquivoInput.files && arquivoInput.files.length) {
          var f = arquivoInput.files[0];
          var mb = (f.size / (1024 * 1024)).toFixed(2);
          nomeArquivoSpan.textContent = '📄 ' + f.name + ' (' + mb + ' MB)';
          nomeArquivoSpan.style.display = 'inline-block';
        } else {
          nomeArquivoSpan.textContent = '';
          nomeArquivoSpan.style.display = 'none';
        }
      });

      // Mascara dinamica de moeda conforme digitacao (BRL)
      inputValor.addEventListener('input', function (e) {
        var v = inputValor.value.replace(/\D/g, '');
        if (!v) {
          inputValor.value = '';
          return;
        }
        var num = (parseInt(v, 10) / 100);
        inputValor.value = num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      });

      function atualizarCategorias() {
        var ehEntrada = selTipo.value === 'Entrada';
        var cats = ehEntrada ? (d.categoriasEntrada || []) : (d.categoriasSaida || []);
        selCat.innerHTML = cats.map(function(c) { return '<option value="' + escapar(c) + '">' + escapar(c) + '</option>'; }).join('');
      }

      selTipo.addEventListener('change', atualizarCategorias);
      atualizarCategorias();

      if (edicao) {
        var garantirOpcao = function(sel, valor) {
          if (!valor) return;
          var existe = Array.prototype.some.call(sel.options, function(o) { return o.value === valor; });
          if (!existe) {
            var opt = document.createElement('option');
            opt.value = valor;
            opt.textContent = valor;
            sel.appendChild(opt);
          }
          sel.value = valor;
        };
        selTipo.value = String(edicao.tipo).toLowerCase() === 'entrada' ? 'Entrada' : 'Saída';
        atualizarCategorias();
        garantirOpcao(selCat, edicao.categoria);
        garantirOpcao(document.getElementById('finOrigem'), edicao.origem);
        document.getElementById('finDesc').value = edicao.descricao || '';
        inputValor.value = formatarMoedaJs(edicao.valor);

        document.getElementById('finDoc').value = edicao.documento || '';
        document.getElementById('finIdTransacao').value = edicao.idTransacaoBancaria || '';
        document.getElementById('finEmenda').value = edicao.emenda || '';

        if (e.target === modal) fecharModal();
      });

      document.getElementById('formNovoLancamento').addEventListener('submit', function(ev) {
        ev.preventDefault();

        var statusDiv = document.getElementById('finStatusEnvio');
        statusDiv.innerHTML = '';

        // Extrai valor numerico da mascara de moeda
        var valorLimpo = inputValor.value.replace(/[^\d]/g, '');
        var valorNum = valorLimpo ? (parseInt(valorLimpo, 10) / 100) : 0;
        if (!valorNum || valorNum <= 0) {
          statusDiv.innerHTML = '<span style="color:#b3261e;font-weight:bold;">⚠️ Por favor, informe um valor monetário válido maior que zero.</span>';
          inputValor.focus();
          return;
        }

        var btnSubmit = document.getElementById('btnSalvaFin');
        btnSubmit.disabled = true;
        statusDiv.innerHTML = '<span style="color:var(--azul);font-weight:bold;">⏳ Gravando lançamento e enviando comprovante para o Google Drive...</span>';

        var arquivoInput = document.getElementById('finArquivo');
        var processarEnvio = function(compObj) {
          var payload = {
            dataMovimentacao: formatarDataBr(document.getElementById('finData').value),
            tipo: selTipo.value,
            origem: document.getElementById('finOrigem').value,
            categoria: selCat.value,
            descricao: document.getElementById('finDesc').value,
            valor: valorNum,
            favorecidoPagador: document.getElementById('finFav').value,
            documento: document.getElementById('finDoc').value,
            idTransacaoBancaria: document.getElementById('finIdTransacao').value,
            emenda: document.getElementById('finEmenda').value,
            comprovante: compObj
          };
          if (edicao) {
            var chkRemover = document.getElementById('finRemoverComp');
            payload.idLancamento = edicao.idLancamento;
            payload.removerComprovante = !!(chkRemover && chkRemover.checked);
          }

          google.script.run
            .withSuccessHandler(function (res) {
              modal.remove();
              carregarFinanceiro();
            })
            .withFailureHandler(function (err) {
              btnSubmit.disabled = false;
              statusDiv.innerHTML = '<span style="color:#b3261e;font-weight:bold;">❌ ' + escapar(err && err.message ? err.message : err) + '</span>';
            })
            .salvarLancamentoFinanceiro(payload);
        };

        if (arquivoInput.files && arquivoInput.files.length) {
          var file = arquivoInput.files[0];
          if (file.size > 8 * 1024 * 1024) {
            btnSubmit.disabled = false;
            statusDiv.innerHTML = '<span style="color:#b3261e;font-weight:bold;">❌ O arquivo ultrapassa o limite máximo de 8 MB.</span>';
            return;
          }
          var reader = new FileReader();
          reader.onload = function() {
            var b64 = String(reader.result).split(',')[1];
            processarEnvio({ nome: file.name, tipo: file.type, base64: b64 });
          };
          reader.onerror = function() {
            btnSubmit.disabled = false;
            statusDiv.innerHTML = '<span style="color:#b3261e;">Erro ao ler o arquivo selecionado.</span>';
          };
          reader.readAsDataURL(file);
        } else {
          processarEnvio(null);
        }
      });
    }

    function formatarDataBr(isoDate) {
      if (!isoDate) return '';
      var p = isoDate.split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : isoDate;
    }

    function emitirRelatorioPrompt(tipo) {
      var d = financeiroDados;
      var titulo = '';
      var subtitulo = '';
      var icone = '';
      var camposFiltroHtml = '';

      // Adiciona flag de periodo se ativo
      var extraPeriodoArg = '';
      if (financeiroFiltros.periodo === 'hoje' || financeiroFiltros.periodo === 'mes_atual' || financeiroFiltros.periodo === '3m' || financeiroFiltros.periodo === '6m' || financeiroFiltros.periodo === 'anual') {
        extraPeriodoArg = ' --periodo ' + financeiroFiltros.periodo;
      } else if (financeiroFiltros.periodo === 'custom') {
        if (financeiroFiltros.dataInicio) extraPeriodoArg += ' --data-inicio ' + formatarDataBr(financeiroFiltros.dataInicio);
        if (financeiroFiltros.dataFim) extraPeriodoArg += ' --data-fim ' + formatarDataBr(financeiroFiltros.dataFim);
      }

      if (tipo === 'competicao') {
        titulo = 'Prestação de Contas por Competição';
        subtitulo = 'Gera o demonstrativo financeiro filtrado especificamente para as equipes participantes de um campeonato.';
        icone = '🏆';
        var opts = (d.competicoes || []).filter(function(c) {
          return c.toLowerCase().indexOf('geral') === -1 && c.toLowerCase().indexOf('outras') === -1;
        }).map(function(c) {
          return '<option value="' + escapar(c) + '">' + escapar(c) + '</option>';
        }).join('');
        camposFiltroHtml = '<div class="fin-campo" style="margin-bottom:12px;">'
          + '<label for="pdfSelCompeticao">Selecione a Competição *</label>'
          + '<select id="pdfSelCompeticao" style="font-weight:bold;">' + opts + '</select>'
          + '</div>';
      } else if (tipo === 'emenda') {
        titulo = 'Prestação de Contas para Emenda Impositiva';
        subtitulo = 'Relatório analítico exigido por órgãos públicos e vereadores, contendo CNPJ/CPF, número de nota/recibo e link direto aos comprovantes.';
        icone = '🏛️';
        camposFiltroHtml = '<div class="fin-campo" style="margin-bottom:12px;">'
          + '<label for="pdfTxtEmenda">Número da Emenda / Termo de Fomento *</label>'
          + '<input type="text" id="pdfTxtEmenda" value="Emenda 042/2026 - Termo 008/2026" placeholder="Ex: Emenda 042/2026">'
          + '</div>';
      } else {
        titulo = 'Relatório Financeiro Geral (Assembleias e Diretoria)';
        subtitulo = 'Demonstrativo completo de entradas, saídas e saldo consolidado com assinatura oficial do Presidente da AEUV.';
        icone = '📄';
      }

      function gerarComandoCli() {
        var base = 'python main.py --gerar-pdf-financeiro';
        if (tipo === 'competicao') {
          var selComp = document.getElementById('pdfSelCompeticao');
          var compNome = selComp ? selComp.value : '';
          return base + ' competicao --origem "' + compNome + '"' + extraPeriodoArg;
        } else if (tipo === 'emenda') {
          var txtEm = document.getElementById('pdfTxtEmenda');
          var emNome = txtEm ? txtEm.value : '';
          return base + ' emenda --emenda "' + emNome + '"' + extraPeriodoArg;
        } else {
          return base + ' geral' + extraPeriodoArg;
        }
      }

      var modal = document.createElement('div');
      modal.className = 'modal-fin-overlay';

      var html = '<div class="modal-fin-caixa">'
        + '  <div class="modal-fin-cabecalho">'
        + '    <h3><span style="font-size:22px;">' + icone + '</span> ' + escapar(titulo) + '</h3>'
        + '    <button type="button" class="modal-fin-fechar" id="btnFecharPdfModal">&times;</button>'
        + '  </div>'
        + '  <div class="modal-pdf-guia">'
        + '    <strong>Como funciona a emissão oficial:</strong>'
        + '    <p style="margin:6px 0 0;">' + escapar(subtitulo) + '</p>'
        + '    <ol class="modal-pdf-passos">'
        + '      <li>Os relatórios em PDF oficiais da AEUV são gerados com assinatura digital do Presidente, cabeçalho institucional e links clicáveis para auditoria.</li>'
        + '      <li>Os dados cadastrados nesta tela já ficam consolidados na planilha do Google Drive da associação.</li>'
        + '      <li>Para emitir uma nova remessa em PDF atualizada, a automação lê a planilha e gera os PDFs prontos na pasta de relatórios.</li>'
        + '    </ol>'
        + '  </div>'
        + camposFiltroHtml
        + '  <div style="margin-bottom:14px;">'
        + '    <label style="font-size:12px;font-weight:bold;color:var(--azul);">Comando de geração no terminal (Python):</label>'
        + '    <code class="codigo-terminal" id="codigoPdfCmd">' + escapar(gerarComandoCli()) + '</code>'
        + '    <span style="font-size:11px;color:var(--apoio);">Os arquivos são gerados em formato A4 Paisagem dentro de <code>downloads/financeiro/</code> e publicados na pasta do Drive.</span>'
        + '  </div>'
        + '  <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--borda);">'
        + (d.planilhaUrl ? '<a href="' + escapar(d.planilhaUrl) + '" target="_blank" rel="noopener" class="botao-apoio">Ver Dados na Planilha</a>' : '')
        + '    <button type="button" class="botao-principal" id="btnEntendidoPdf">Entendido</button>'
        + '  </div>'
        + '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);

      var elCmd = document.getElementById('codigoPdfCmd');
      var selCompEl = document.getElementById('pdfSelCompeticao');
      var txtEmEl = document.getElementById('pdfTxtEmenda');
      if (selCompEl && elCmd) {
        selCompEl.addEventListener('change', function() {
          elCmd.textContent = gerarComandoCli();
        });
      }
      if (txtEmEl && elCmd) {
        txtEmEl.addEventListener('input', function() {
          elCmd.textContent = gerarComandoCli();
        });
      }

      function fechar() {
        modal.remove();
      }

      document.getElementById('btnFecharPdfModal').addEventListener('click', fechar);
      document.getElementById('btnEntendidoPdf').addEventListener('click', fechar);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) fechar();
      });
    }

    /**
     * Modal estilizado de confirmação antes de excluir lançamento financeiro.
     */
    function confirmarExclusaoFinanceiro(idLancamento, descricao, valorFormatado) {
      var modal = document.createElement('div');
      modal.className = 'modal-fin-overlay';

      var html = '<div class="modal-fin-caixa" style="max-width:460px;">'
        + '  <div class="modal-fin-cabecalho">'
        + '    <h3 style="color:#b3261e;"><span style="font-size:22px;">⚠️</span> Confirmar Exclusão</h3>'
        + '    <button type="button" class="modal-fin-fechar" id="btnFecharConfirmaX">&times;</button>'
        + '  </div>'
        + '  <div style="font-size:14px;color:var(--texto);line-height:1.55;margin:10px 0 16px;">'
        + '    <p style="margin:0 0 10px;">Tem certeza que deseja excluir permanentemente o seguinte lançamento?</p>'
        + '    <div style="background:#fdf2f2;border:1px solid #f8c8c8;border-radius:8px;padding:12px 14px;">'
        + '      <div><strong>Protocolo:</strong> ' + escapar(idLancamento) + '</div>'
        + '      <div style="margin-top:4px;"><strong>Descrição:</strong> ' + escapar(descricao) + '</div>'
        + '      <div style="margin-top:4px;"><strong>Valor:</strong> ' + escapar(valorFormatado) + '</div>'
        + '    </div>'
        + '    <p style="font-size:12px;color:#b3261e;margin:10px 0 0;">Esta ação removerá a linha da planilha de prestação de contas do Google Drive e não poderá ser desfeita.</p>'
        + '  </div>'
        + '  <div id="finStatusExclusao" style="font-size:13px;min-height:18px;margin-bottom:10px;"></div>'
        + '  <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--borda);">'
        + '    <button type="button" class="botao-apoio" id="btnCancelaExclusao">Cancelar</button>'
        + '    <button type="button" class="botao-principal" id="btnConfirmaExclusao" style="background:#b3261e;border-color:#b3261e;">🗑️ Sim, Excluir</button>'
        + '  </div>'
        + '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);

      function fechar() {
        modal.remove();
      }

      document.getElementById('btnFecharConfirmaX').addEventListener('click', fechar);
      document.getElementById('btnCancelaExclusao').addEventListener('click', fechar);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) fechar();
      });

      document.getElementById('btnConfirmaExclusao').addEventListener('click', function() {
        var btnSim = document.getElementById('btnConfirmaExclusao');
        var btnNao = document.getElementById('btnCancelaExclusao');
        var statusDiv = document.getElementById('finStatusExclusao');

        btnSim.disabled = true;
        btnNao.disabled = true;
        statusDiv.innerHTML = '<span style="color:var(--azul);font-weight:bold;">⏳ Removendo registro da planilha...</span>';

        google.script.run
          .withSuccessHandler(function (res) {
            modal.remove();
            carregarFinanceiro();
          })
          .withFailureHandler(function (err) {
            btnSim.disabled = false;
            btnNao.disabled = false;
            statusDiv.innerHTML = '<span style="color:#b3261e;font-weight:bold;">❌ ' + escapar(err && err.message ? err.message : err) + '</span>';
          })
          .removerLancamentoFinanceiro(idLancamento);
      });
    }

    /**
     * Abre e fecha o menu no celular.
     */
    function alternarMenu() {
      menu.classList.toggle('aberto');
    }

    window.addEventListener('hashchange', function () {
      const id = window.location.hash.replace('#', '');

      if (id && id !== moduloAtual) {
        abrirModulo(id);
      }
    });

    montarUsuario();
    montarMenu();
    abrirModulo(window.location.hash.replace('#', '') || MODULOS[0].id);
  </script>
