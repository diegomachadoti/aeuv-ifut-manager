<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <?!= include_('Estilos') ?>
  <?!= include_('Ponte') ?>
  <style>
    /* ---------- Identificacao do usuario no cabecalho ---------- */

    .usuario {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      padding: 6px 8px 6px 6px;
    }

    .inicial {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: var(--dourado);
      color: var(--azul);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    .usuario-dados { line-height: 1.3; min-width: 0; }
    .usuario-nome { font-size: 13px; font-weight: bold; }

    .usuario-perfil {
      font-size: 11px;
      opacity: .8;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .sair {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      white-space: nowrap;
    }

    .sair:hover { background: rgba(255, 255, 255, .22); }

    /* ---------- Estrutura menu + conteudo ---------- */

    .layout {
      display: grid;
      grid-template-columns: 258px 1fr;
      gap: 20px;
      align-items: start;
    }

    .menu {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 10px;
      position: sticky;
      top: 16px;
      box-shadow: 0 2px 10px rgba(20, 33, 61, .05);
    }

    .menu-titulo {
      font-size: 11px;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--apoio);
      padding: 8px 10px 10px;
    }

    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      margin-bottom: 2px;
      background: transparent;
      color: var(--texto);
      text-align: left;
      font-size: 14px;
      transition: background .15s ease;
    }

    .menu button:hover { background: var(--fundo); }

    .menu button.ativo {
      background: var(--azul);
      color: #fff;
      font-weight: bold;
    }

    .menu .icone { font-size: 17px; line-height: 1; flex: 0 0 auto; }
    .menu .rotulo { flex: 1; min-width: 0; }

    .etiqueta {
      font-size: 10px;
      letter-spacing: .4px;
      text-transform: uppercase;
      background: #e9eef8;
      color: var(--apoio);
      border-radius: 999px;
      padding: 3px 7px;
    }

    .menu button.ativo .etiqueta { background: rgba(255, 255, 255, .22); color: #fff; }

    /* ---------- Submenu ---------- */

    .grupo-menu { margin-bottom: 2px; }

    .titulo-grupo .seta {
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--apoio);
      transition: transform .15s ease;
    }

    .grupo-menu.aberto .titulo-grupo .seta { transform: rotate(180deg); }

    /* Quando o submenu esta fechado, um tracinho lembra que ha um item
       em uso escondido ali dentro. */
    .grupo-menu.com-ativo .titulo-grupo .rotulo::after {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-left: 7px;
      border-radius: 50%;
      background: var(--azul);
      vertical-align: middle;
    }

    .grupo-menu.aberto.com-ativo .titulo-grupo .rotulo::after { display: none; }

    .itens-grupo { display: none; padding-left: 12px; }
    .grupo-menu.aberto .itens-grupo { display: block; }

    .itens-grupo button { font-size: 13px; padding: 9px 12px; }
    .itens-grupo .icone { font-size: 15px; }

    .abrir-menu {
      display: none;
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--borda);
      color: var(--azul);
      font-weight: bold;
      text-align: left;
    }

    /* ---------- Conteudo ---------- */

    .conteudo { min-width: 0; }

    .cabecalho-modulo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .cabecalho-modulo .icone { font-size: 26px; line-height: 1; }

    .cartoes {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: 14px;
    }

    .cartao {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 16px;
      background: #fff;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .cartao:hover {
      transform: translateY(-2px);
      border-color: var(--dourado);
      box-shadow: 0 8px 20px rgba(20, 33, 61, .1);
    }

    .cartao .icone { font-size: 24px; line-height: 1; }

    .cartao h3 {
      margin: 10px 0 6px;
      font-size: 15px;
      color: var(--azul);
    }

    .cartao p { margin: 0; font-size: 13px; color: var(--apoio); line-height: 1.5; }

    .cartao.inativo { opacity: .62; cursor: default; }
    .cartao.inativo:hover { transform: none; border-color: var(--borda); box-shadow: none; }

    .saudacao {
      background: linear-gradient(120deg, var(--azul), var(--azul-claro));
      color: #fff;
      border-radius: 12px;
      padding: 22px;
    }

    .saudacao h2 { color: #fff; margin: 0 0 6px; }
    .saudacao p { margin: 0; opacity: .85; font-size: 14px; line-height: 1.55; }

    .aviso {
      margin-top: 18px;
      border-left: 4px solid var(--dourado);
      background: #fff8e9;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.55;
    }

    .botao-link {
      display: inline-block;
      margin-top: 16px;
      padding: 11px 18px;
      background: var(--dourado);
      color: var(--azul);
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
    }

    /* ---------- Tabela de usuarios ---------- */

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--borda);
      text-align: left;
    }

    th {
      background: var(--azul);
      color: #fff;
      font-size: 13px;
    }

    th:first-child { border-radius: 8px 0 0 0; }
    th:last-child { border-radius: 0 8px 0 0; }

    td.email { word-break: break-all; }

    .pilula {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      background: #e9eef8;
      color: var(--azul);
    }

    .pilula.admin { background: var(--dourado); color: var(--azul); font-weight: bold; }

    .carregando { color: var(--apoio); font-size: 14px; margin-top: 16px; }

    /* ---------- Controle de punicoes ---------- */

    .resumo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .indicador {
      border: 1px solid var(--borda);
      border-left: 4px solid var(--azul);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
    }

    .indicador .numero {
      font-size: 24px;
      font-weight: bold;
      color: var(--azul);
      line-height: 1.1;
    }

    .indicador .rotulo {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--apoio);
      margin-top: 2px;
    }

    .indicador.cumprir { border-left-color: var(--dourado); }
    .indicador.cumprida { border-left-color: #1e8449; }
    .indicador.pendente { border-left-color: #c0392b; }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .filtros input, .filtros select {
      flex: 1 1 170px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--texto);
    }

    .filtros input { flex: 2 1 240px; }

    .barra-acoes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--apoio);
    }

    .barra-acoes .espaco { flex: 1; }

    .botao-apoio {
      padding: 8px 14px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: #fff;
      color: var(--azul);
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .botao-apoio:hover { background: var(--fundo); }

    .tabela-rolagem { overflow-x: auto; }

    /* Larguras fixas: a tabela cabe na tela sem empurrar as colunas curtas. */
    .punicoes { table-layout: fixed; font-size: 13px; }
    .punicoes th, .punicoes td { padding: 9px 10px; }

    .punicoes th:nth-child(1) { width: 9%; }
    .punicoes th:nth-child(2) { width: 19%; }
    .punicoes th:nth-child(3) { width: 11%; }
    .punicoes th:nth-child(4) { width: 15%; }
    .punicoes th:nth-child(5) { width: 10%; }
    .punicoes th:nth-child(6) { width: 12%; }
    .punicoes th:nth-child(7) { width: 11%; }
    .punicoes th:nth-child(8) { width: 13%; }

    .punicoes td:nth-child(1),
    .punicoes td:nth-child(5) { white-space: nowrap; }

    .punido-nome { font-weight: bold; color: var(--azul); }
    .punido-dado { font-size: 12px; color: var(--apoio); }

    .pilula.cumprir { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.cumprida { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.alerta { background: #fdecea; color: #922b21; font-weight: bold; }
    .pilula.definida { background: #e4f4e9; color: #1e8449; }

    /* ----- Solicitações de inscrição ----- */

    .solicitacoes { table-layout: fixed; font-size: 13px; }
    .solicitacoes th, .solicitacoes td { padding: 9px 10px; }

    .solicitacoes th:nth-child(1) { width: 13%; }
    .solicitacoes th:nth-child(2) { width: 17%; }
    .solicitacoes th:nth-child(3) { width: 16%; }
    .solicitacoes th:nth-child(4) { width: 18%; }
    .solicitacoes th:nth-child(5) { width: 22%; }
    .solicitacoes th:nth-child(6) { width: 14%; }

    .solicitacoes tbody tr.linha { cursor: pointer; }
    .solicitacoes tbody tr.linha:hover { background: var(--fundo); }

    .protocolo { font-weight: bold; color: var(--azul); font-family: monospace; }

    .pilula.aguardando { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.processada { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.falha { background: #fdecea; color: #922b21; font-weight: bold; }

    /* Contagem por ação, exibida na coluna de registros. */
    .contagem { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
    .contagem span { white-space: nowrap; color: var(--apoio); }
    .contagem strong { color: var(--texto); }

    .detalhe { background: var(--fundo); }
    .detalhe > td { padding: 0 10px 14px; }

    .detalhe-caixa {
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: #fff;
      padding: 14px 16px;
    }

    .detalhe-dados {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 22px;
      font-size: 12px;
      color: var(--apoio);
      margin-bottom: 12px;
    }

    .detalhe-dados strong { color: var(--texto); font-weight: normal; }

    table.pessoas { font-size: 12px; margin: 0; }
    table.pessoas th, table.pessoas td { padding: 7px 8px; }
    table.pessoas th { font-size: 11px; }
    .pessoa-nome { font-weight: bold; color: var(--azul); }

    .vazio {
      margin-top: 16px;
      padding: 18px;
      border: 1px dashed var(--borda);
      border-radius: 10px;
      text-align: center;
      color: var(--apoio);
      font-size: 14px;
    }

    /* ----- Cadastro de associados ----- */

    .associados { table-layout: fixed; font-size: 13px; }
    .associados th, .associados td { padding: 9px 10px; }

    .associados th:nth-child(1) { width: 22%; }
    .associados th:nth-child(2) { width: 13%; }
    .associados th:nth-child(3) { width: 23%; }
    .associados th:nth-child(4) { width: 18%; }
    .associados th:nth-child(5) { width: 15%; }
    .associados th:nth-child(6) { width: 9%; }

    .associados tbody tr { cursor: pointer; }
    .associados tbody tr:hover { background: var(--fundo); }

    .equipe-nome { font-weight: bold; color: var(--azul); }
    .equipe-dado { font-size: 12px; color: var(--apoio); }

    .pilula.ativo { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.pendente { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.inativo { background: #fdecea; color: #922b21; font-weight: bold; }
    .pilula.suspenso { background: #e6e8ec; color: #3b4254; font-weight: bold; }

    .formulario {
      margin-top: 18px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 18px;
      background: #fff;
    }

    .formulario h3 {
      margin: 0 0 4px;
      font-size: 16px;
      color: var(--azul);
    }

    .grupo {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--borda);
    }

    .grupo:first-of-type { border-top: 0; padding-top: 0; }

    .grupo h4 {
      margin: 0 0 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--apoio);
    }

    .campos {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .campo { grid-column: span 4; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .campo.largo { grid-column: span 6; }
    .campo.cheio { grid-column: span 12; }
    .campo.curto { grid-column: span 3; }
    .campo.mini { grid-column: span 2; }

    .campo label { font-size: 12px; font-weight: bold; color: var(--azul); }
    .campo .dica { font-size: 11px; color: var(--apoio); }

    .campo input, .campo select {
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--texto);
      background: #fff;
      min-width: 0;
    }

    .campo input:focus, .campo select:focus {
      outline: 2px solid var(--dourado);
      outline-offset: 1px;
    }

    .campo input[type="file"] { padding: 7px; font-size: 12px; }
    .campo input:disabled, .campo select:disabled { background: var(--fundo); color: var(--apoio); }

    .documento {
      grid-column: span 6;
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .documento .titulo { font-size: 13px; font-weight: bold; color: var(--azul); }
    .documento .dica { font-size: 11px; color: var(--apoio); }

    .documento .situacao { font-size: 12px; }
    .documento .situacao.entregue { color: #1e8449; font-weight: bold; }
    .documento .situacao.falta { color: #8a5a00; }

    .acoes-formulario {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--borda);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .botao-principal {
      background: var(--azul);
      color: #fff;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .botao-principal:hover { background: var(--azul-claro); }
    .botao-principal:disabled { opacity: .6; cursor: default; }

    .sucesso {
      margin-top: 16px;
      border-left: 4px solid #1e8449;
      background: #e4f4e9;
      color: #14683a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
    }

    @media (max-width: 760px) {
      /* A tabela vira uma lista de fichas, uma por punicao. */
      table, thead, tbody, tr, th, td { display: block; }

      thead { display: none; }

      .punicoes { min-width: 0; table-layout: auto; font-size: 14px; }

      .punicoes td:nth-child(1),
      .punicoes td:nth-child(5) { white-space: normal; }

      .punicoes tr {
        border: 1px solid var(--borda);
        border-radius: 10px;
        margin-bottom: 12px;
        padding: 6px 4px;
        background: #fff;
      }

      .punicoes td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px dashed var(--borda);
        padding: 8px 10px;
      }

      .punicoes tr td:last-child { border-bottom: 0; }

      .punicoes td::before {
        content: attr(data-rotulo);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .4px;
        color: var(--apoio);
        flex: 0 0 38%;
      }

      .associados { min-width: 0; table-layout: auto; font-size: 14px; }

      .associados tr {
        border: 1px solid var(--borda);
        border-radius: 10px;
        margin-bottom: 12px;
        padding: 6px 4px;
        background: #fff;
      }

      .associados td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px dashed var(--borda);
        padding: 8px 10px;
      }

      .associados tr td:last-child { border-bottom: 0; }

      .associados td::before {
        content: attr(data-rotulo);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .4px;
        color: var(--apoio);
        flex: 0 0 38%;
      }

      /* Numa tela estreita cada campo ocupa a linha inteira. */
      .campo, .campo.largo, .campo.curto, .campo.mini, .documento { grid-column: span 12; }

      .solicitacoes { min-width: 0; table-layout: auto; font-size: 14px; }

      .solicitacoes tr.linha {
        border: 1px solid var(--borda);
        border-radius: 10px;
        margin-bottom: 12px;
        padding: 6px 4px;
        background: #fff;
      }

      .solicitacoes tr.linha td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px dashed var(--borda);
        padding: 8px 10px;
      }

      .solicitacoes tr.linha td:last-child { border-bottom: 0; }

      .solicitacoes tr.linha td::before {
        content: attr(data-rotulo);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .4px;
        color: var(--apoio);
        flex: 0 0 38%;
      }

      /* O detalhe ja e uma ficha: fica colado na linha que o abriu. */
      .detalhe > td { padding: 0 0 12px; }
      .detalhe-caixa { padding: 12px; }

      table.pessoas tr {
        border: 1px solid var(--borda);
        border-radius: 8px;
        margin-bottom: 10px;
        padding: 4px 2px;
      }

      table.pessoas tr:last-child { margin-bottom: 0; }

      table.pessoas td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px dashed var(--borda);
        padding: 7px 9px;
      }

      table.pessoas tr td:last-child { border-bottom: 0; }

      table.pessoas td::before {
        content: attr(data-rotulo);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .4px;
        color: var(--apoio);
        flex: 0 0 38%;
      }
    }

    .erro {
      margin-top: 16px;
      border-left: 4px solid #c0392b;
      background: #fdecea;
      color: #922b21;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }

      .abrir-menu { display: block; }

      .menu { position: static; display: none; margin-bottom: 14px; }
      .menu.aberto { display: block; }
    }

    @media (max-width: 700px) {
      .topo-conteudo { flex-wrap: wrap; }
      .usuario { width: 100%; justify-content: flex-start; }
      .usuario-dados { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="brasao">
        <img src="<?!= config.logoUrl ?>" alt="Logomarca da AEUV">
      </div>
      <div class="topo-identidade">
        <h1><?= config.associacao ?></h1>
        <p>Sistema Interno &middot; &Aacute;rea restrita da associa&ccedil;&atilde;o</p>
      </div>
      <div class="usuario">
        <div class="inicial" id="inicial"></div>
        <div class="usuario-dados">
          <div class="usuario-nome" id="usuarioNome"></div>
          <div class="usuario-perfil" id="usuarioPerfil"></div>
        </div>
        <a class="sair" href="https://accounts.google.com/Logout" target="_blank" rel="noopener">Sair</a>
      </div>
    </div>
  </header>

  <main class="container">
    <button type="button" class="abrir-menu" id="abrirMenu" onclick="alternarMenu()">&#9776; Menu do sistema</button>

    <div class="layout">
      <nav class="menu" id="menu">
        <div class="menu-titulo">Funcionalidades</div>
        <div id="menuItens"></div>
      </nav>

      <section class="conteudo">
        <div class="card" id="conteudo"></div>
      </section>
    </div>
  </main>

  <script>
    const CONFIG = <?!= JSON.stringify(config) ?>;
    const MODULOS = CONFIG.modulos;

    const menuItens = document.getElementById('menuItens');
    const menu = document.getElementById('menu');
    const conteudo = document.getElementById('conteudo');

    let moduloAtual = '';

    /**
     * Escapa texto vindo do servidor antes de injetar no HTML.
     */
    function escapar(valor) {
      return String(valor === null || valor === undefined ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * Preenche a identificacao do usuario no cabecalho.
     */
    function montarUsuario() {
      const nome = CONFIG.usuario.nome || CONFIG.usuario.email;

      document.getElementById('inicial').textContent = nome.trim().charAt(0).toUpperCase();
      document.getElementById('usuarioNome').textContent = nome;
      document.getElementById('usuarioPerfil').textContent = CONFIG.usuario.perfilNome;
    }

    /**
     * Monta o menu lateral com os modulos liberados para o perfil.
     * Modulos do mesmo grupo entram num submenu que abre e fecha.
     */
    function montarMenu() {
      const blocos = [];

      MODULOS.forEach(function (modulo) {
        const ultimo = blocos[blocos.length - 1];

        if (modulo.grupo && ultimo && ultimo.grupo === modulo.grupo) {
          ultimo.itens.push(modulo);
          return;
        }

        blocos.push({ grupo: modulo.grupo || '', itens: [modulo] });
      });

      menuItens.innerHTML = blocos.map(function (bloco) {
        const itens = bloco.itens.map(botaoMenu).join('');

        if (!bloco.grupo) {
          return itens;
        }

        const grupo = descricaoGrupo(bloco.grupo);

        return '<div class="grupo-menu" data-grupo="' + escapar(bloco.grupo) + '">'
          + '<button type="button" class="titulo-grupo" data-abrir-grupo="' + escapar(bloco.grupo) + '">'
          + '<span class="icone">' + escapar(grupo.icone) + '</span>'
          + '<span class="rotulo">' + escapar(grupo.nome) + '</span>'
          + '<span class="seta">&#9662;</span>'
          + '</button>'
          + '<div class="itens-grupo">' + itens + '</div>'
          + '</div>';
      }).join('');

      menuItens.querySelectorAll('[data-abrir-grupo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          const id = botao.dataset.abrirGrupo;

          gruposAbertos[id] = !gruposAbertos[id];
          aplicarGrupos();
        });
      });

      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirModulo(botao.dataset.modulo);
        });
      });

      aplicarGrupos();
    }

    /**
     * Botao de um modulo no menu.
     */
    function botaoMenu(modulo) {
      const etiqueta = modulo.tipo === 'breve'
        ? '<span class="etiqueta">em breve</span>'
        : (modulo.tipo === 'link' ? '<span class="etiqueta">abre fora</span>' : '');

      return '<button type="button" data-modulo="' + escapar(modulo.id) + '">'
        + '<span class="icone">' + escapar(modulo.icone) + '</span>'
        + '<span class="rotulo">' + escapar(modulo.nome) + '</span>'
        + etiqueta
        + '</button>';
    }

    /**
     * Nome e icone de um grupo. Grupo nao declarado em GRUPOS ainda
     * aparece, usando o proprio id, para nao sumir com os modulos dele.
     */
    function descricaoGrupo(id) {
      const achado = (CONFIG.grupos || []).filter(function (grupo) {
        return grupo.id === id;
      })[0];

      return achado || { id: id, nome: id, icone: '📁' };
    }

    /** Submenus abertos. Comecam fechados para encurtar o menu. */
    let gruposAbertos = {};

    /**
     * Aplica o estado de aberto/fechado dos submenus.
     */
    function aplicarGrupos() {
      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        bloco.classList.toggle('aberto', !!gruposAbertos[bloco.dataset.grupo]);
      });
    }

    /**
     * Marca o item ativo do menu e abre o submenu que o contem, para
     * o item em uso nunca ficar escondido.
     */
    function destacarMenu(id) {
      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.classList.toggle('ativo', botao.dataset.modulo === id);
      });

      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (modulo && modulo.grupo) {
        gruposAbertos[modulo.grupo] = true;
      }

      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        const contem = !!bloco.querySelector('[data-modulo].ativo');

        bloco.classList.toggle('com-ativo', contem);
      });

      aplicarGrupos();
    }

    /**
     * Abre um modulo e registra o endereco na barra do navegador.
     */
    function abrirModulo(id) {
      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (!modulo) {
        return abrirModulo(MODULOS[0].id);
      }

      moduloAtual = id;
      destacarMenu(id);
      renderizarModulo(modulo);

      if (window.innerWidth <= 900) {
        menu.classList.remove('aberto');
      }

      if (window.location.hash !== '#' + id) {
        window.location.hash = id;
      }
    }

    /**
     * Desenha a tela de um modulo. Novas funcionalidades entram aqui.
     */
    function renderizarModulo(modulo) {
      const cabecalho = '<div class="cabecalho-modulo">'
        + '<span class="icone">' + escapar(modulo.icone) + '</span>'
        + '<h2>' + escapar(modulo.nome) + '</h2>'
        + '</div><p class="apoio">' + escapar(modulo.descricao) + '</p>';

      if (modulo.tipo === 'painel') {
        return renderizarPainel();
      }

      if (modulo.tipo === 'link') {
        conteudo.innerHTML = cabecalho
          + '<p class="apoio" style="margin-top:14px;">O formul&aacute;rio abre em uma nova aba, '
          + 'no endere&ccedil;o oficial da associa&ccedil;&atilde;o.</p>'
          + '<a class="botao-link" href="' + escapar(modulo.url) + '" target="_blank" rel="noopener">Abrir '
          + escapar(modulo.nome) + '</a>';
        return;
      }

      if (modulo.tipo === 'usuarios') {
        conteudo.innerHTML = cabecalho + '<p class="carregando" id="statusUsuarios">Carregando a lista de acessos...</p>';
        carregarUsuarios();
        return;
      }

      if (modulo.tipo === 'punicoes') {
        conteudo.innerHTML = cabecalho + '<p class="carregando" id="statusPunicoes">Carregando o controle de puni&ccedil;&otilde;es...</p>';
        carregarPunicoes();
        return;
      }

      if (modulo.tipo === 'solicitacoes') {
        conteudo.innerHTML = cabecalho
          + '<p class="carregando" id="statusSolicitacoes">Carregando as solicita&ccedil;&otilde;es de inscri&ccedil;&atilde;o...</p>';
        carregarSolicitacoes();
        return;
      }

      if (modulo.tipo === 'associados') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaAssociados"><p class="carregando">Carregando o cadastro de associados...</p></div>';
        carregarAssociados();
        return;
      }

      conteudo.innerHTML = cabecalho
        + '<div class="aviso"><strong>Em desenvolvimento.</strong> Esta funcionalidade j&aacute; est&aacute; '
        + 'prevista no sistema e ser&aacute; liberada em uma pr&oacute;xima vers&atilde;o.</div>';
    }

    /**
     * Tela inicial: saudacao e atalhos para os demais modulos.
     */
    function renderizarPainel() {
      const hora = new Date().getHours();
      const saudacao = hora < 12 ? 'Bom dia' : (hora < 18 ? 'Boa tarde' : 'Boa noite');
      const primeiroNome = (CONFIG.usuario.nome || '').split(' ')[0] || CONFIG.usuario.email;

      const atalhos = MODULOS.filter(function (modulo) {
        return modulo.tipo !== 'painel';
      }).map(function (modulo) {
        const corpo = '<span class="icone">' + escapar(modulo.icone) + '</span>'
          + '<h3>' + escapar(modulo.nome) + '</h3>'
          + '<p>' + escapar(modulo.descricao) + '</p>';

        if (modulo.tipo === 'breve') {
          return '<div class="cartao inativo">' + corpo + '</div>';
        }

        return '<button type="button" class="cartao" data-atalho="' + escapar(modulo.id) + '">' + corpo + '</button>';
      }).join('');

      conteudo.innerHTML = '<div class="saudacao">'
        + '<h2>' + saudacao + ', ' + escapar(primeiroNome) + '!</h2>'
        + '<p>Voc&ecirc; est&aacute; na &aacute;rea interna da AEUV. Escolha abaixo uma das '
        + 'funcionalidades liberadas para o seu perfil.</p>'
        + '</div>'
        + '<div class="cartoes">' + atalhos + '</div>';

      conteudo.querySelectorAll('[data-atalho]').forEach(function (cartao) {
        cartao.addEventListener('click', function () {
          abrirModulo(cartao.dataset.atalho);
        });
      });
    }

    /**
     * Busca no servidor a lista de autorizados (somente admin).
     */
    function carregarUsuarios() {
      google.script.run
        .withSuccessHandler(function (lista) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          const linhas = lista.map(function (usuario) {
            const classe = usuario.perfil === 'admin' ? 'pilula admin' : 'pilula';

            return '<tr>'
              + '<td>' + escapar(usuario.nome || '-') + '</td>'
              + '<td class="email">' + escapar(usuario.email) + '</td>'
              + '<td><span class="' + classe + '">' + escapar(usuario.perfilNome) + '</span></td>'
              + '</tr>';
          }).join('');

          document.getElementById('statusUsuarios').outerHTML =
            '<table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr></thead>'
            + '<tbody>' + linhas + '</tbody></table>'
            + '<div class="aviso">Para incluir ou remover algu&eacute;m, ajuste a fun&ccedil;&atilde;o '
            + '<strong>definirUsuariosAutorizados()</strong> no editor do Apps Script e execute-a. '
            + 'A mudan&ccedil;a vale na hora, sem publicar nova vers&atilde;o.</div>';
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          document.getElementById('statusUsuarios').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarUsuarios();
    }

    /**
     * Estado da tela de punicoes: o arquivo e lido uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let punicoes = { registros: [], atualizadoEm: '', arquivoUrl: '' };

    /**
     * Busca no servidor o controle de punicoes publicado no Drive.
     */
    function carregarPunicoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          punicoes = dados;
          montarTelaPunicoes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          document.getElementById('statusPunicoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarPunicoes();
    }

    /**
     * Monta os indicadores, os filtros e a tabela do controle de punicoes.
     */
    function montarTelaPunicoes() {
      const registros = punicoes.registros || [];

      if (!registros.length) {
        document.getElementById('statusPunicoes').outerHTML =
          '<div class="vazio">Nenhuma puni&ccedil;&atilde;o registrada at&eacute; o momento.</div>';
        return;
      }

      const atualizacao = punicoes.atualizadoEm
        ? 'Atualizado em ' + escapar(punicoes.atualizadoEm)
        : 'Dados lidos do arquivo de controle';

      document.getElementById('statusPunicoes').outerHTML = ''
        + '<div class="resumo" id="resumoPunicoes"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaPunicoes" placeholder="Buscar por atleta, equipe, nota ou artigo">'
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + opcoesFiltro('equipe', 'Todas as equipes', registros)
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('status', 'Todos os status', registros)
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemPunicoes"></span>'
        + '<span class="espaco"></span>'
        + '<span>' + atualizacao + '</span>'
        + '<button type="button" class="botao-apoio" id="recarregarPunicoes">Atualizar</button>'
        + (punicoes.arquivoUrl
          ? '<a class="botao-apoio" href="' + escapar(punicoes.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="punicoes"><thead><tr>'
        + '<th>Nota</th><th>Punido</th><th>Equipe</th><th>Partida</th><th>Artigo</th>'
        + '<th>Suspens&atilde;o</th><th>Status</th><th>Situa&ccedil;&atilde;o</th>'
        + '</tr></thead><tbody id="linhasPunicoes"></tbody></table></div>';

      document.getElementById('buscaPunicoes').addEventListener('input', filtrarPunicoes);
      document.getElementById('recarregarPunicoes').addEventListener('click', function () {
        abrirModulo('punicoes');
      });

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        campo.addEventListener('change', filtrarPunicoes);
      });

      filtrarPunicoes();
    }

    /**
     * Cria um seletor com os valores distintos de uma coluna.
     */
    function opcoesFiltro(campo, rotuloTodos, registros) {
      const valores = [];

      registros.forEach(function (registro) {
        const valor = registro[campo];

        if (valor && valor !== '-' && valores.indexOf(valor) === -1) {
          valores.push(valor);
        }
      });

      valores.sort();

      return '<select data-filtro="' + campo + '"><option value="">' + rotuloTodos + '</option>'
        + valores.map(function (valor) {
          return '<option value="' + escapar(valor) + '">' + escapar(valor) + '</option>';
        }).join('') + '</select>';
    }

    /**
     * Tira acentos e maiusculas para a busca livre nao depender da digitacao.
     */
    function simplificar(texto) {
      return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarPunicoes() {
      const busca = simplificar(document.getElementById('buscaPunicoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (punicoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(Object.keys(registro).map(function (campo) {
          return registro[campo];
        }).join(' ')).indexOf(busca) !== -1;
      });

      desenharResumo(filtrados);
      desenharLinhas(filtrados);
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumo(registros) {
      const cumprir = registros.filter(function (r) { return r.situacao.indexOf('A CUMPRIR') === 0; }).length;
      const cumpridas = registros.filter(function (r) { return r.situacao.indexOf('CUMPRIDA') === 0; }).length;
      const pendentes = registros.filter(function (r) { return r.status !== 'DEFINIDA'; }).length;

      const itens = [
        ['', registros.length, 'Punições'],
        ['cumprir', cumprir, 'A cumprir'],
        ['cumprida', cumpridas, 'Cumpridas'],
        ['pendente', pendentes, 'Pena a definir']
      ];

      document.getElementById('resumoPunicoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      document.getElementById('contagemPunicoes').textContent = registros.length === (punicoes.registros || []).length
        ? registros.length + ' registro(s)'
        : registros.length + ' de ' + punicoes.registros.length + ' registro(s)';
    }

    /**
     * Desenha as linhas da tabela (fichas empilhadas no celular).
     */
    function desenharLinhas(registros) {
      if (!registros.length) {
        document.getElementById('linhasPunicoes').innerHTML =
          '<tr><td colspan="8" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma puni&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasPunicoes').innerHTML = registros.map(function (r) {
        const detalhe = r.tipo + (r.camisa && r.camisa !== '-' ? ' · camisa ' + r.camisa : '')
          + (r.cartaoVermelho === 'Sim' ? ' · cartão vermelho' : '');

        return '<tr>'
          + celula('Nota', escapar(r.nota) + '<div class="punido-dado">' + escapar(r.dataNota) + '</div>')
          + celula('Punido', '<span class="punido-nome">' + escapar(r.punido) + '</span>'
            + '<div class="punido-dado">' + escapar(detalhe) + '</div>')
          + celula('Equipe', escapar(r.equipe))
          + celula('Partida', escapar(r.partida) + '<div class="punido-dado">' + escapar(r.dataJogo) + '</div>')
          + celula('Artigo', escapar(r.artigo))
          + celula('Suspensão', escapar(suspensao(r)))
          + celula('Status', '<span class="' + classeStatus(r.status) + '">' + escapar(r.status) + '</span>')
          + celula('Situação', '<span class="' + classeSituacao(r.situacao) + '">' + escapar(r.situacao) + '</span>')
          + '</tr>';
      }).join('');
    }

    /**
     * Celula com rotulo, usado no layout de ficha do celular.
     */
    function celula(rotulo, html) {
      return '<td data-rotulo="' + escapar(rotulo) + '">' + html + '</td>';
    }

    /**
     * Suspensao adicional aplicada na nota. Quando nao ha partidas nem prazo,
     * mostra a decisao escrita na nota (por exemplo, pena ainda a definir).
     */
    function suspensao(registro) {
      const partes = [];

      if (registro.partidas && registro.partidas !== '-') {
        partes.push(registro.partidas + (registro.partidas === '1' ? ' partida' : ' partidas'));
      }

      if (registro.tempo && registro.tempo !== '-') {
        partes.push(registro.tempo);
      }

      if (partes.length) {
        return partes.join(' + ');
      }

      return registro.decisao && registro.decisao !== '-' ? registro.decisao : '-';
    }

    function classeStatus(status) {
      return 'pilula ' + (status === 'DEFINIDA' ? 'definida' : 'alerta');
    }

    function classeSituacao(situacao) {
      if (situacao.indexOf('CUMPRIDA') === 0) {
        return 'pilula cumprida';
      }

      return situacao.indexOf('A CUMPRIR') === 0 ? 'pilula cumprir' : 'pilula';
    }

    /**
     * Estado da tela de solicitacoes. A leitura do Drive e cara, entao
     * acontece uma vez so e os filtros trabalham sobre essa copia.
     */
    let solicitacoes = { registros: [], situacoes: [], acoes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Protocolos com o detalhe aberto. */
    let solicitacoesAbertas = {};

    /**
     * Busca no servidor as solicitacoes enviadas pelas equipes.
     */
    function carregarSolicitacoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'solicitacoes') {
            return;
          }

          solicitacoes = dados;
          solicitacoesAbertas = {};
          montarTelaSolicitacoes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'solicitacoes') {
            return;
          }

          document.getElementById('statusSolicitacoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarSolicitacoes();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das solicitacoes.
     */
    function montarTelaSolicitacoes() {
      const registros = solicitacoes.registros || [];

      if (!registros.length) {
        document.getElementById('statusSolicitacoes').outerHTML =
          '<div class="vazio">Nenhuma solicita&ccedil;&atilde;o enviada at&eacute; o momento.</div>';
        return;
      }

      const recorte = solicitacoes.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + solicitacoes.total)
        : '';

      document.getElementById('statusSolicitacoes').outerHTML = ''
        + '<div class="resumo" id="resumoSolicitacoes"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaSolicitacoes" placeholder="Buscar por protocolo, equipe, respons&aacute;vel ou atleta">'
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + opcoesFiltro('equipe', 'Todas as equipes', registros)
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemSolicitacoes"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarSolicitacoes">Atualizar</button>'
        + (solicitacoes.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(solicitacoes.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes"><thead><tr>'
        + '<th>Situa&ccedil;&atilde;o</th><th>Protocolo</th><th>Enviada em</th><th>Equipe</th>'
        + '<th>Respons&aacute;vel</th><th>Registros</th>'
        + '</tr></thead><tbody id="linhasSolicitacoes"></tbody></table></div>';

      document.getElementById('buscaSolicitacoes').addEventListener('input', filtrarSolicitacoes);
      document.getElementById('recarregarSolicitacoes').addEventListener('click', function () {
        abrirModulo('solicitacoes');
      });

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        campo.addEventListener('change', filtrarSolicitacoes);
      });

      filtrarSolicitacoes();
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarSolicitacoes() {
      const busca = simplificar(document.getElementById('buscaSolicitacoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (solicitacoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaSolicitacao(registro)).indexOf(busca) !== -1;
      });

      desenharResumoSolicitacoes(filtrados);
      desenharLinhasSolicitacoes(filtrados);
    }

    /**
     * Junta o cabecalho e os nomes dos atletas para a busca livre
     * encontrar a solicitacao tambem por quem foi inscrito nela.
     */
    function textoDaSolicitacao(registro) {
      return [
        registro.protocolo,
        registro.dataHora,
        registro.situacao,
        registro.competicao,
        registro.equipe,
        registro.responsavel,
        registro.telefone
      ].concat((registro.pessoas || []).map(function (pessoa) {
        return pessoa.nome + ' ' + pessoa.cpf + ' ' + pessoa.acao + ' ' + pessoa.tipo;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     * Alem das solicitacoes, conta os atletas envolvidos nelas.
     */
    function desenharResumoSolicitacoes(registros) {
      const pessoas = registros.reduce(function (total, registro) {
        return total + registro.quantidade;
      }, 0);

      function porSituacao(situacao) {
        return registros.filter(function (registro) {
          return registro.situacao === situacao;
        }).length;
      }

      const itens = [
        ['', registros.length, 'Solicitações'],
        ['cumprir', porSituacao('Aguardando'), 'Aguardando'],
        ['cumprida', porSituacao('Processada'), 'Processadas'],
        ['pendente', porSituacao('Falha'), 'Com falha'],
        ['', pessoas, 'Registros']
      ];

      document.getElementById('resumoSolicitacoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (solicitacoes.registros || []).length;

      document.getElementById('contagemSolicitacoes').textContent = registros.length === total
        ? registros.length + ' solicitação(ões)'
        : registros.length + ' de ' + total + ' solicitação(ões)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha pode abrir uma segunda,
     * com os dados completos e a lista de atletas da solicitacao.
     */
    function desenharLinhasSolicitacoes(registros) {
      if (!registros.length) {
        document.getElementById('linhasSolicitacoes').innerHTML =
          '<tr><td colspan="6" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma solicita&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasSolicitacoes').innerHTML = registros.map(function (r) {
        const aberta = !!solicitacoesAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Situação', '<span class="' + classeSituacaoSolicitacao(r.situacao) + '">'
            + escapar(r.icone + ' ' + r.situacao) + '</span>')
          + celula('Protocolo', '<span class="protocolo">' + escapar(r.protocolo || '—') + '</span>')
          + celula('Enviada em', escapar(r.dataHora || '—')
            + '<div class="equipe-dado">' + escapar(r.competicao) + '</div>')
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Responsável', escapar(r.responsavel)
            + '<div class="equipe-dado">' + escapar(r.telefone) + '</div>')
          + celula('Registros', contagemPorAcao(r))
          + '</tr>';

        return linha + (aberta ? detalheSolicitacao(r) : '');
      }).join('');

      conteudo.querySelectorAll('.solicitacoes tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (solicitacoesAbertas[chave]) {
            delete solicitacoesAbertas[chave];
          } else {
            solicitacoesAbertas[chave] = true;
          }

          filtrarSolicitacoes();
        });
      });
    }

    /**
     * Quantas pessoas de cada acao a solicitacao tem. Acoes zeradas
     * ficam de fora para a coluna nao virar uma lista de zeros.
     */
    function contagemPorAcao(registro) {
      const partes = (solicitacoes.acoes || []).filter(function (acao) {
        return registro.resumo[acao];
      }).map(function (acao) {
        return '<span><strong>' + registro.resumo[acao] + '</strong> ' + escapar(nomeAcao(acao)) + '</span>';
      });

      if (!partes.length) {
        return '<span class="equipe-dado">nenhum registro</span>';
      }

      return '<div class="contagem">' + partes.join('') + '</div>';
    }

    /**
     * O formulario grava as acoes sem acento; aqui elas voltam acentuadas.
     */
    function nomeAcao(acao) {
      const nomes = { Inclusao: 'inclusão', Remocao: 'remoção', Portabilidade: 'portabilidade' };

      return nomes[acao] || acao;
    }

    /**
     * Linha extra com os dados completos e a tabela de atletas.
     */
    function detalheSolicitacao(registro) {
      const dados = [
        ['Competição', registro.competicao],
        ['Telefone', registro.telefone],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + (registro.comprovanteUrl
          ? '<a class="botao-apoio" href="' + escapar(registro.comprovanteUrl) + '" target="_blank" rel="noopener">Comprovante PIX</a>'
          : '<span class="equipe-dado">Sem comprovante anexado</span>')
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + '</div>';

      const pessoas = (registro.pessoas || []).map(function (p) {
        return '<tr>'
          + celula('Ação', escapar(nomeAcao(p.acao)))
          + celula('Tipo', escapar(p.tipo))
          + celula('Nome', '<span class="pessoa-nome">' + escapar(p.nome) + '</span>')
          + celula('Nascimento', escapar(p.nascimento || '—'))
          + celula('CPF', escapar(formatarCpf(p.cpf) || '—'))
          + celula('Competição anterior', escapar(p.competicaoAnterior || '—'))
          + '</tr>';
      }).join('');

      const tabela = pessoas
        ? '<table class="pessoas"><thead><tr><th>A&ccedil;&atilde;o</th><th>Tipo</th><th>Nome</th>'
          + '<th>Nascimento</th><th>CPF</th><th>Competi&ccedil;&atilde;o anterior</th></tr></thead>'
          + '<tbody>' + pessoas + '</tbody></table>'
        : '<p class="equipe-dado">Esta solicita&ccedil;&atilde;o n&atilde;o tem registros.</p>';

      return '<tr class="detalhe"><td colspan="6"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + tabela
        + links
        + '</div></td></tr>';
    }

    function classeSituacaoSolicitacao(situacao) {
      return 'pilula ' + simplificar(situacao);
    }

    /**
     * Estado da tela de associados. A lista e lida uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let associados = {
      registros: [],
      equipes: [],
      status: [],
      documentos: [],
      podeEditar: false,
      planilhaUrl: ''
    };

    /**
     * Busca no servidor o cadastro de associados.
     */
    function carregarAssociados() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'associados') {
            return;
          }

          associados = dados;
          montarTelaAssociados();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'associados') {
            return;
          }

          document.getElementById('areaAssociados').innerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarAssociados();
    }

    /**
     * Monta os indicadores, os filtros e a tabela dos associados.
     */
    function montarTelaAssociados() {
      const registros = associados.registros || [];

      const novo = associados.podeEditar
        ? '<button type="button" class="botao-apoio" id="novoAssociado">+ Novo cadastro</button>'
        : '';

      const planilha = associados.planilhaUrl
        ? '<a class="botao-apoio" href="' + escapar(associados.planilhaUrl) + '" target="_blank" rel="noopener">Abrir planilha</a>'
        : '';

      const painel = '<div id="painelAssociados">'
        + '<div class="resumo" id="resumoAssociados"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaAssociados" placeholder="Buscar por equipe, representante, CPF ou e-mail">'
        + opcoesFiltroAssociados()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span class="espaco"></span>' + novo + planilha
        + '</div>'
        + '<div class="tabela-rolagem"><table class="associados">'
        + '<thead><tr><th>Equipe</th><th>Situação</th><th>Representante</th>'
        + '<th>Contato</th><th>Cidade</th><th>Docs.</th></tr></thead>'
        + '<tbody id="linhasAssociados"></tbody></table></div>'
        + '</div>';

      const vazio = '<div id="painelAssociados">'
        + '<div class="barra-acoes"><span class="espaco"></span>' + novo + planilha + '</div>'
        + '<div class="vazio">Nenhuma equipe associada cadastrada at&eacute; o momento.'
        + (associados.podeEditar ? ' Use o bot&atilde;o acima para come&ccedil;ar.' : '')
        + '</div></div>';

      document.getElementById('areaAssociados').innerHTML = registros.length ? painel : vazio;

      if (registros.length) {
        desenharResumoAssociados(registros);
        desenharLinhasAssociados(registros);

        document.getElementById('buscaAssociados').addEventListener('input', filtrarAssociados);
        document.getElementById('filtroStatus').addEventListener('change', filtrarAssociados);
      }

      const botaoNovo = document.getElementById('novoAssociado');

      if (botaoNovo) {
        botaoNovo.addEventListener('click', function () {
          abrirFormularioAssociado(null);
        });
      }
    }

    /**
     * Filtro de situacao, montado a partir das opcoes do servidor.
     */
    function opcoesFiltroAssociados() {
      const opcoes = (associados.status || []).map(function (item) {
        return '<option value="' + escapar(item.id) + '">' + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      return '<select id="filtroStatus"><option value="">Todas as situa&ccedil;&otilde;es</option>' + opcoes + '</select>';
    }

    /**
     * Aplica busca e filtro de situacao sobre a lista carregada.
     */
    function filtrarAssociados() {
      const termo = simplificar(document.getElementById('buscaAssociados').value);
      const status = document.getElementById('filtroStatus').value;

      const filtrados = (associados.registros || []).filter(function (registro) {
        if (status && registro.status !== status) {
          return false;
        }

        if (!termo) {
          return true;
        }

        return simplificar([
          registro.equipe, registro.nome, registro.email, registro.cpf, registro.cidade
        ].join(' ')).indexOf(termo) !== -1;
      });

      desenharResumoAssociados(filtrados);
      desenharLinhasAssociados(filtrados);
    }

    /**
     * Indicadores por situacao, mais a contagem de documentos pendentes.
     */
    function desenharResumoAssociados(registros) {
      const itens = (associados.status || []).map(function (item) {
        return {
          numero: registros.filter(function (r) { return r.status === item.id; }).length,
          rotulo: item.icone + ' ' + item.nome
        };
      });

      itens.push({
        numero: registros.filter(function (r) { return r.pendencias > 0; }).length,
        rotulo: '📎 Com documento pendente'
      });

      document.getElementById('resumoAssociados').innerHTML = itens.map(function (item) {
        return '<div class="indicador"><span class="numero">' + item.numero + '</span>'
          + '<span class="rotulo">' + escapar(item.rotulo) + '</span></div>';
      }).join('');
    }

    /**
     * Desenha as linhas da tabela. Clicar numa linha abre o cadastro.
     */
    function desenharLinhasAssociados(registros) {
      const corpo = document.getElementById('linhasAssociados');

      if (!registros.length) {
        corpo.innerHTML = '<tr><td colspan="6"><div class="vazio">'
          + 'Nenhum associado encontrado com esses filtros.</div></td></tr>';
        return;
      }

      corpo.innerHTML = registros.map(function (r) {
        const situacao = nomeStatus(r.status);
        const docs = r.pendencias
          ? '<span class="pilula pendente">' + r.pendencias + ' pendente' + (r.pendencias > 1 ? 's' : '') + '</span>'
          : '<span class="pilula ativo">Completo</span>';

        return '<tr data-equipe="' + escapar(r.equipe) + '">'
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Situação', '<span class="pilula ' + escapar(r.status) + '">'
            + escapar(situacao.icone + ' ' + situacao.nome) + '</span>')
          + celula('Representante', escapar(r.nome)
            + '<div class="equipe-dado">' + escapar(formatarCpf(r.cpf)) + '</div>')
          + celula('Contato', escapar(formatarTelefone(r.telefone))
            + '<div class="equipe-dado">' + escapar(r.email) + '</div>')
          + celula('Cidade', escapar(r.cidade + (r.uf ? '/' + r.uf : '')))
          + celula('Documentos', docs)
          + '</tr>';
      }).join('');

      corpo.querySelectorAll('tr[data-equipe]').forEach(function (linha) {
        linha.addEventListener('click', function () {
          abrirFormularioAssociado(linha.dataset.equipe);
        });
      });
    }

    /**
     * Abre o cadastro de uma equipe. Sem equipe, abre em branco.
     * Quem nao pode editar ve os mesmos dados, apenas para leitura.
     */
    function abrirFormularioAssociado(equipe) {
      const registro = (associados.registros || []).filter(function (r) {
        return r.equipe === equipe;
      })[0] || null;

      const somenteLeitura = !associados.podeEditar;
      const trava = somenteLeitura ? ' disabled' : '';

      const equipes = (associados.equipes || []).slice();

      // Equipe ja cadastrada fora da lista padrao continua aparecendo.
      if (registro && equipes.indexOf(registro.equipe) === -1) {
        equipes.push(registro.equipe);
      }

      const opcoesEquipe = equipes.sort().map(function (nome) {
        const jaTem = (associados.registros || []).some(function (r) { return r.equipe === nome; });
        const selecionada = registro && registro.equipe === nome;

        // Sem registro aberto, esconde as equipes que ja tem cadastro:
        // cada equipe entra uma vez so.
        if (!registro && jaTem) {
          return '';
        }

        return '<option value="' + escapar(nome) + '"' + (selecionada ? ' selected' : '') + '>'
          + escapar(nome) + '</option>';
      }).join('');

      const opcoesStatus = (associados.status || []).map(function (item) {
        const selecionado = registro ? registro.status === item.id : item.id === 'pendente';

        return '<option value="' + escapar(item.id) + '"' + (selecionado ? ' selected' : '') + '>'
          + escapar(item.icone + ' ' + item.nome) + '</option>';
      }).join('');

      const documentos = (associados.documentos || []).map(function (documento) {
        const url = registro ? registro[documento.id] : '';
        const situacao = url
          ? '<span class="situacao entregue">Entregue</span> '
            + '<a href="' + escapar(url) + '" target="_blank" rel="noopener">abrir arquivo</a>'
          : '<span class="situacao falta">Ainda n&atilde;o enviado</span>';

        const envio = somenteLeitura
          ? ''
          : '<input type="file" data-documento="' + escapar(documento.id) + '" '
            + 'accept=".pdf,.jpg,.jpeg,.png,.webp">';

        return '<div class="documento">'
          + '<span class="titulo">' + escapar(documento.nome) + '</span>'
          + '<span class="dica">' + escapar(documento.apoio) + '</span>'
          + '<span>' + situacao + '</span>'
          + envio
          + '</div>';
      }).join('');

      const titulo = registro
        ? (somenteLeitura ? 'Cadastro de ' + registro.equipe : 'Editar ' + registro.equipe)
        : 'Novo associado';

      const historico = registro && registro.atualizadoEm
        ? '<p class="apoio">&Uacute;ltima altera&ccedil;&atilde;o em ' + escapar(registro.atualizadoEm)
          + (registro.atualizadoPor ? ' por ' + escapar(registro.atualizadoPor) : '') + '.</p>'
        : '';

      const gravar = somenteLeitura
        ? '<p class="apoio">O seu perfil permite consultar, mas n&atilde;o alterar o cadastro.</p>'
        : '<button type="button" class="botao-principal" id="gravarAssociado">Salvar cadastro</button>';

      document.getElementById('areaAssociados').innerHTML = '<div class="formulario">'
        + '<h3>' + escapar(titulo) + '</h3>'
        + historico
        + '<div class="grupo"><h4>Equipe</h4><div class="campos">'
        + '<div class="campo largo"><label for="fEquipe">Equipe associada</label>'
        + '<select id="fEquipe"' + (registro ? ' disabled' : trava) + '>'
        + (registro ? '' : '<option value="">Selecione</option>') + opcoesEquipe + '</select>'
        + (registro ? '<span class="dica">A equipe n&atilde;o muda depois de cadastrada.</span>' : '')
        + '</div>'
        + '<div class="campo largo"><label for="fStatus">Situa&ccedil;&atilde;o</label>'
        + '<select id="fStatus"' + trava + '>' + opcoesStatus + '</select></div>'
        + '</div></div>'
        + '<div class="grupo"><h4>Representante legal</h4><div class="campos">'
        + campoTexto('fNome', 'Nome completo', registro ? registro.nome : '', 'cheio', trava, 'text')
        + campoTexto('fNascimento', 'Data de nascimento', paraDataInput(registro ? registro.nascimento : ''), '', trava, 'date')
        + campoTexto('fCpf', 'CPF', formatarCpf(registro ? registro.cpf : ''), '', trava, 'text')
        + campoTexto('fRg', 'RG', registro ? registro.rg : '', '', trava, 'text')
        + campoTexto('fEmail', 'E-mail', registro ? registro.email : '', 'largo', trava, 'email')
        + campoTexto('fTelefone', 'Telefone com DDD', formatarTelefone(registro ? registro.telefone : ''), 'largo', trava, 'tel')
        + '</div></div>'
        + '<div class="grupo"><h4>Endere&ccedil;o</h4><div class="campos">'
        + campoTexto('fCep', 'CEP', formatarCep(registro ? registro.cep : ''), 'curto', trava, 'text')
        + campoTexto('fLogradouro', 'Logradouro', registro ? registro.logradouro : '', 'largo', trava, 'text')
        + campoTexto('fNumero', 'Número', registro ? registro.numero : '', 'curto', trava, 'text')
        + campoTexto('fComplemento', 'Complemento', registro ? registro.complemento : '', '', trava, 'text')
        + campoTexto('fBairro', 'Bairro', registro ? registro.bairro : '', '', trava, 'text')
        + campoTexto('fCidade', 'Cidade', registro ? registro.cidade : '', 'curto', trava, 'text')
        + campoTexto('fUf', 'UF', registro ? registro.uf : '', 'mini', trava, 'text')
        + '</div></div>'
        + '<div class="grupo"><h4>Documenta&ccedil;&atilde;o</h4>'
        + '<p class="apoio">Arquivos PDF, JPG, PNG ou WEBP, de at&eacute; 5 MB cada. '
        + 'Enviar um arquivo novo substitui o anterior.</p>'
        + '<div class="campos">' + documentos + '</div></div>'
        + '<div class="acoes-formulario">'
        + gravar
        + '<button type="button" class="botao-apoio" id="voltarAssociados">Voltar &agrave; lista</button>'
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoAssociado"></span>'
        + '</div></div>';

      document.getElementById('voltarAssociados').addEventListener('click', montarTelaAssociados);

      const botaoGravar = document.getElementById('gravarAssociado');

      if (botaoGravar) {
        botaoGravar.addEventListener('click', function () {
          gravarAssociado(registro);
        });

        ligarMascaras();
      }
    }

    /**
     * Monta um campo de texto do formulario.
     */
    function campoTexto(id, rotulo, valor, largura, trava, tipo) {
      return '<div class="campo ' + largura + '">'
        + '<label for="' + id + '">' + escapar(rotulo) + '</label>'
        + '<input type="' + tipo + '" id="' + id + '" value="' + escapar(valor || '') + '"' + trava + '>'
        + '</div>';
    }

    /**
     * Formata CPF, telefone e CEP enquanto a pessoa digita.
     */
    function ligarMascaras() {
      mascara('fCpf', 11, function (d) {
        return d.replace(/^(\d{3})(\d{3})?(\d{3})?(\d{0,2})?$/, function (t, a, b, c, e) {
          return a + (b ? '.' + b : '') + (c ? '.' + c : '') + (e ? '-' + e : '');
        });
      });

      mascara('fCep', 8, function (d) {
        return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
      });

      mascara('fTelefone', 11, function (d) {
        if (d.length <= 2) {
          return d;
        }

        const corte = d.length > 10 ? 7 : 6;

        return '(' + d.slice(0, 2) + ') ' + d.slice(2, corte)
          + (d.length > corte ? '-' + d.slice(corte) : '');
      });

      const uf = document.getElementById('fUf');

      uf.addEventListener('input', function () {
        uf.value = uf.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
      });
    }

    /**
     * Prende um campo a um formato, mantendo apenas digitos por baixo.
     */
    function mascara(id, digitos, formatar) {
      const campo = document.getElementById(id);

      campo.addEventListener('input', function () {
        const limpo = campo.value.replace(/\D/g, '').slice(0, digitos);
        campo.value = limpo ? formatar(limpo) : '';
      });
    }

    /**
     * Le o formulario, envia os anexos e grava no servidor.
     */
    function gravarAssociado(registro) {
      const botao = document.getElementById('gravarAssociado');
      const aviso = document.getElementById('avisoAssociado');

      botao.disabled = true;
      aviso.textContent = 'Enviando...';

      const payload = {
        equipe: registro ? registro.equipe : document.getElementById('fEquipe').value,
        status: document.getElementById('fStatus').value,
        nome: document.getElementById('fNome').value,
        nascimento: document.getElementById('fNascimento').value,
        email: document.getElementById('fEmail').value,
        telefone: document.getElementById('fTelefone').value,
        cep: document.getElementById('fCep').value,
        logradouro: document.getElementById('fLogradouro').value,
        numero: document.getElementById('fNumero').value,
        complemento: document.getElementById('fComplemento').value,
        bairro: document.getElementById('fBairro').value,
        cidade: document.getElementById('fCidade').value,
        uf: document.getElementById('fUf').value,
        rg: document.getElementById('fRg').value,
        cpf: document.getElementById('fCpf').value
      };

      lerAnexos().then(function (arquivos) {
        payload.arquivos = arquivos;

        google.script.run
          .withSuccessHandler(function (resposta) {
            carregarAssociados();

            document.getElementById('areaAssociados').insertAdjacentHTML('beforebegin',
              '<div class="sucesso" id="sucessoAssociado">' + escapar(resposta.equipe)
              + (resposta.novo ? ' cadastrada' : ' atualizada') + ' com sucesso.</div>');

            setTimeout(function () {
              const recado = document.getElementById('sucessoAssociado');

              if (recado) {
                recado.remove();
              }
            }, 6000);
          })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            aviso.innerHTML = '<span style="color:#922b21;">'
              + escapar(erro && erro.message ? erro.message : erro) + '</span>';
          })
          .salvarAssociado(payload);
      }).catch(function (erro) {
        botao.disabled = false;
        aviso.innerHTML = '<span style="color:#922b21;">'
          + escapar(erro && erro.message ? erro.message : erro) + '</span>';
      });
    }

    /**
     * Converte os arquivos escolhidos em base64 para envio ao servidor.
     */
    function lerAnexos() {
      const campos = Array.prototype.slice.call(
        document.querySelectorAll('[data-documento]')
      ).filter(function (campo) {
        return campo.files && campo.files.length;
      });

      return Promise.all(campos.map(function (campo) {
        const arquivo = campo.files[0];

        if (arquivo.size > 5 * 1024 * 1024) {
          return Promise.reject(new Error('O arquivo "' + arquivo.name + '" passa de 5 MB.'));
        }

        return new Promise(function (resolve, reject) {
          const leitor = new FileReader();

          leitor.onload = function () {
            resolve({
              campo: campo.dataset.documento,
              nome: arquivo.name,
              tipo: arquivo.type,
              tamanho: arquivo.size,
              base64: String(leitor.result).split(',')[1]
            });
          };

          leitor.onerror = function () {
            reject(new Error('Não foi possível ler o arquivo "' + arquivo.name + '".'));
          };

          leitor.readAsDataURL(arquivo);
        });
      })).then(function (lidos) {
        const arquivos = {};

        lidos.forEach(function (item) {
          arquivos[item.campo] = item;
        });

        return arquivos;
      });
    }

    /**
     * Situacao pelo id, com o circulo colorido.
     */
    function nomeStatus(id) {
      return (associados.status || []).filter(function (item) {
        return item.id === id;
      })[0] || { icone: '', nome: id || '-' };
    }

    function formatarCpf(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (valor || '');
    }

    function formatarTelefone(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      if (d.length === 11) {
        return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      }

      return d.length === 10 ? d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3') : (valor || '');
    }

    function formatarCep(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, '$1-$2') : (valor || '');
    }

    /**
     * Converte dd/mm/aaaa da planilha para aaaa-mm-dd do campo de data.
     */
    function paraDataInput(valor) {
      const partes = String(valor || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

      return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
    }

    /**
     * Abre e fecha o menu no celular.
     */
    function alternarMenu() {
      menu.classList.toggle('aberto');
    }

    window.addEventListener('hashchange', function () {
      const id = window.location.hash.replace('#', '');

      if (id && id !== moduloAtual) {
        abrirModulo(id);
      }
    });

    montarUsuario();
    montarMenu();
    abrirModulo(window.location.hash.replace('#', '') || MODULOS[0].id);
  </script>
