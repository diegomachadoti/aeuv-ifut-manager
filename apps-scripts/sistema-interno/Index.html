    /**
     * Monta um campo de texto do formulario.
     */
    function campoTexto(id, rotulo, valor, largura, trava, tipo, classeExtra) {
      return '<div class="campo ' + largura + (classeExtra ? ' ' + classeExtra : '') + '">'
        + '<label for="' + id + '">' + escapar(rotulo) + '</label>'
        + '<input id="' + id + '" '
        + (tipo === 'date' || (tipo === 'time' && id === 'tjHora') ? atributosDataHora_(tipo, valor)
          : 'type="' + tipo + '" value="' + escapar(valor || '') + '"') + (trava || '') + '>'
        + '</div>';
    }

    /**
     * Formata CPF, telefone e CEP enquanto a pessoa digita.
     */
    function ligarMascaras() {
      mascara('fCpf', 11, function (d) {
        return d.replace(/^(\d{3})(\d{3})?(\d{3})?(\d{0,2})?$/, function (t, a, b, c, e) {
          return a + (b ? '.' + b : '') + (c ? '.' + c : '') + (e ? '-' + e : '');
        });
      });

      mascara('fCep', 8, function (d) {
        return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
      });

      mascara('fTelefone', 11, function (d) {
        if (d.length <= 2) {
          return d;
        }

        const corte = d.length > 10 ? 7 : 6;

        return '(' + d.slice(0, 2) + ') ' + d.slice(2, corte)
          + (d.length > corte ? '-' + d.slice(corte) : '');
      });

      const uf = document.getElementById('fUf');

      uf.addEventListener('input', function () {
        uf.value = uf.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
      });
    }

    /**
     * Prende um campo a um formato, mantendo apenas digitos por baixo.
     */
    function mascara(id, digitos, formatar) {
      const campo = document.getElementById(id);

      campo.addEventListener('input', function () {
        const limpo = campo.value.replace(/\D/g, '').slice(0, digitos);
        campo.value = limpo ? formatar(limpo) : '';
      });
    }

    /**
     * Le o formulario, envia os anexos e grava no servidor.
     */
    function gravarAssociado(registro) {
      const botao = document.getElementById('gravarAssociado');
      const aviso = document.getElementById('avisoAssociado');
      if (!validarCamposDataHora_(['fNascimento'], aviso)) return;

      botao.disabled = true;
      aviso.textContent = 'Enviando...';

      const payload = {
        equipe: document.getElementById('fEquipe').value,
        equipeOriginal: registro ? registro.equipe : '',
        status: document.getElementById('fStatus').value,
        nome: document.getElementById('fNome').value,
        nascimento: lerDataFormulario_('fNascimento'),
        email: document.getElementById('fEmail').value,
        telefone: document.getElementById('fTelefone').value,
        cep: document.getElementById('fCep').value,
        logradouro: document.getElementById('fLogradouro').value,
        numero: document.getElementById('fNumero').value,
        complemento: document.getElementById('fComplemento').value,
        bairro: document.getElementById('fBairro').value,
        cidade: document.getElementById('fCidade').value,
        uf: document.getElementById('fUf').value,
        rg: document.getElementById('fRg').value,
        cpf: document.getElementById('fCpf').value
      };

      lerAnexos().then(function (arquivos) {
        payload.arquivos = arquivos;

        google.script.run
          .withSuccessHandler(function (resposta) {
            carregarAssociados();

            document.getElementById('areaAssociados').insertAdjacentHTML('beforebegin',
              '<div class="sucesso" id="sucessoAssociado">' + escapar(resposta.equipe)
              + (resposta.novo ? ' cadastrada' : ' atualizada') + ' com sucesso.</div>');

            setTimeout(function () {
              const recado = document.getElementById('sucessoAssociado');

              if (recado) {
                recado.remove();
              }
            }, 6000);
          })
          .withFailureHandler(function (erro) {
            botao.disabled = false;
            aviso.innerHTML = '<span style="color:#922b21;">'
              + escapar(erro && erro.message ? erro.message : erro) + '</span>';
          })
          .salvarAssociado(payload);
      }).catch(function (erro) {
        botao.disabled = false;
        aviso.innerHTML = '<span style="color:#922b21;">'
          + escapar(erro && erro.message ? erro.message : erro) + '</span>';
      });
    }

    /**
     * Converte os arquivos escolhidos em base64 para envio ao servidor.
     */
    function lerAnexos() {
      const campos = Array.prototype.slice.call(
        document.querySelectorAll('[data-documento]')
      ).filter(function (campo) {
        return campo.files && campo.files.length;
      });

      return Promise.all(campos.map(function (campo) {
        const arquivo = campo.files[0];

        if (arquivo.size > 5 * 1024 * 1024) {
          return Promise.reject(new Error('O arquivo "' + arquivo.name + '" passa de 5 MB.'));
        }

        return new Promise(function (resolve, reject) {
          const leitor = new FileReader();

          leitor.onload = function () {
            resolve({
              campo: campo.dataset.documento,
              nome: arquivo.name,
              tipo: arquivo.type,
              tamanho: arquivo.size,
              base64: String(leitor.result).split(',')[1]
            });
          };

          leitor.onerror = function () {
            reject(new Error('Não foi possível ler o arquivo "' + arquivo.name + '".'));
          };

          leitor.readAsDataURL(arquivo);
        });
      })).then(function (lidos) {
        const arquivos = {};

        lidos.forEach(function (item) {
          arquivos[item.campo] = item;
        });

        return arquivos;
      });
    }

    /**
     * Situacao pelo id, com o circulo colorido.
     */
    function nomeStatus(id) {
      return (associados.status || []).filter(function (item) {
        return item.id === id;
      })[0] || { icone: '', nome: id || '-' };
    }

    function formatarCpf(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (valor || '');
    }

    function formatarTelefone(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      if (d.length === 11) {
        return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      }

      return d.length === 10 ? d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3') : (valor || '');
    }

    function formatarCep(valor) {
      const d = String(valor || '').replace(/\D/g, '');

      return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, '$1-$2') : (valor || '');
    }

    /**
     * Converte dd/mm/aaaa da planilha para aaaa-mm-dd do campo de data.
     */
    function paraDataInput(valor) {
      const partes = String(valor || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

      return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
    }

    /******************************************************
     * ATAS DE REUNIOES (CLIENTE)
     ******************************************************/

    let atasDados = null;
    let ataEmEdicao = null;
    let ataAlterada = false;
    let ataOcupada = false;

    function podeSairDaAta() {
      if (ataOcupada) return false;
      if (!ataAlterada) return true;
      const sair = window.confirm('Existem alterações não salvas na ata. Deseja descartá-las?');
      if (sair) ataAlterada = false;
      return sair;
    }

    window.addEventListener('beforeunload', function (evento) {
      if (moduloAtual === 'atas' && ataAlterada) {
        evento.preventDefault();
        evento.returnValue = '';
      }
    });

    function carregarAtas() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'atas') return;
          atasDados = dados;
          ataAlterada = false;
          montarListaAtas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'atas') return;
          document.getElementById('areaAtas').innerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarAtas();
    }

    function montarListaAtas() {
      ataEmEdicao = null;
      const area = document.getElementById('areaAtas');
      const registros = atasDados.registros || [];
      area.innerHTML = '<div class="barra-acoes">'
        + '<button type="button" class="botao-principal" id="novaAta">+ Nova ata</button>'
        + '<button type="button" class="botao-apoio" id="atualizarAtas">Atualizar lista</button>'
        + '</div><div id="avisoAtas"></div>'
        + (registros.length
          ? '<div class="atas-lista">' + registros.map(function (ata) {
              return '<div class="ata-item">'
                + '<h3>' + escapar(ata.titulo) + '</h3>'
                + '<span class="apoio">' + escapar(ata.data.split('-').reverse().join('/'))
                + ' · ' + (ata.tipo === 'campeonato' ? 'Campeonato' : 'Associação')
                + (ata.competicao ? ' · ' + escapar(ata.competicao) : '')
                + ' · Atualizada em ' + escapar(ata.atualizadoEm) + '</span>'
                + '<div class="barra-acoes">'
                + '<button type="button" class="botao-apoio" data-ver-ata="'
                + escapar(ata.id) + '">Visualizar</button>'
                + (atasDados.podeEditar ? '<button type="button" class="botao-apoio" data-editar-ata="'
                  + escapar(ata.id) + '">Editar</button>' : '')
                + '<button type="button" class="botao-apoio" data-exportar-ata="'
                + escapar(ata.id) + '">Exportar PDF</button>'
                + (ata.pdfUrl ? '<a class="botao-apoio" data-pdf-ata="' + escapar(ata.id)
                  + '" href="' + escapar(ata.pdfUrl)
                  + '" target="_blank" rel="noopener">Abrir PDF</a>' : '')
                + (atasDados.podeExcluir ? '<button type="button" class="botao-apoio" data-excluir-ata="'
                  + escapar(ata.id) + '">Excluir</button>' : '')
                + '</div></div>';
            }).join('') + '</div>'
          : '<div class="vazio">Nenhuma ata salva ainda.</div>');

      document.getElementById('novaAta').addEventListener('click', function () { abrirEditorAta(); });

        if (!ataOcupada) carregarAtas();
      });

        botao.addEventListener('click', function () { abrirEditorAta(botao.dataset.editarAta); });
      });
      area.querySelectorAll('[data-ver-ata]').forEach(function (botao) {
        botao.addEventListener('click', function () { abrirEditorAta(botao.dataset.verAta, true); });
      });
      area.querySelectorAll('[data-exportar-ata]').forEach(function (botao) {
        botao.addEventListener('click', function () { exportarAta(botao.dataset.exportarAta); });
      });
      area.querySelectorAll('[data-excluir-ata]').forEach(function (botao) {
        botao.addEventListener('click', function () { excluirAtaDaLista(botao.dataset.excluirAta); });
      });
    }

    function progressoAta(rotulo, botao) {
      const cartao = botao && botao.closest('.ata-item');
      const destino = cartao || document.getElementById('statusAta');
      if (!destino) return null;
      if (cartao) {
        cartao.querySelectorAll('button').forEach(function (acao) { acao.disabled = true; });
        destino.insertAdjacentHTML('beforeend', '<div class="ata-progresso" role="status" aria-live="polite">'
          + escapar(rotulo) + '</div>');
        return destino.querySelector('.ata-progresso');
      }
      destino.innerHTML = '<div class="ata-progresso" role="status" aria-live="polite">'
        + escapar(rotulo) + '</div>';
      if (botao) botao.disabled = true;
      return destino.querySelector('.ata-progresso');
    }

    function concluirProgressoAta(progresso, mensagem, falhou) {
      if (!progresso) return;
      const cartao = progresso.closest('.ata-item');
      if (cartao) {
        cartao.querySelectorAll('button').forEach(function (acao) { acao.disabled = false; });
      }
      progresso.outerHTML = mensagem
        ? '<div class="' + (falhou ? 'erro' : 'sucesso') + '" role="status">' + mensagem + '</div>'
        : '';
    }

    function abrirEditorAta(id, visualizar) {
      if (!podeSairDaAta()) return;
      const ata = id && (atasDados.registros || []).filter(function (item) { return item.id === id; })[0];
      if (id && !ata) {
        document.getElementById('avisoAtas').innerHTML = '<div class="erro">Ata não encontrada. Atualize a lista.</div>';
        return;
      }
      if (id && !visualizar && !atasDados.podeEditar) return;
      if (ata && ata.texto === undefined) {
        ataOcupada = true;
        const botao = document.querySelector('[data-' + (visualizar ? 'ver' : 'editar') + '-ata="' + id + '"]');
        const progresso = progressoAta('Carregando ata...', botao);
        google.script.run
          .withSuccessHandler(function (completa) {
            ataOcupada = false;
            if (moduloAtual !== 'atas') return;
            const indice = atasDados.registros.findIndex(function (item) { return item.id === id; });
            if (indice < 0) return;
            atasDados.registros[indice] = completa;
            concluirProgressoAta(progresso);
            abrirEditorAta(id, visualizar);
          })
          .withFailureHandler(function (erro) {
            ataOcupada = false;
            if (moduloAtual !== 'atas') return;
            concluirProgressoAta(progresso, escapar(erro && erro.message ? erro.message : erro), true);
          })
          .obterAta(id);
        return;
      }
      const somenteLeitura = !!id && (visualizar || !atasDados.podeEditar);
      const competicoes = (atasDados.competicoes || []).slice();
      if (ata && ata.competicao && competicoes.indexOf(ata.competicao) === -1) {
        competicoes.push(ata.competicao);
      }
      ataAlterada = false;
      ataEmEdicao = ata || null;
      const area = document.getElementById('areaAtas');
      area.innerHTML = '<div class="barra-acoes"><button type="button" class="botao-apoio" id="voltarAtas">← Voltar à lista</button></div>'
        + '<form class="ata-editor" id="formAta">'
        + '<h3>' + (somenteLeitura ? 'Consultar ata' : ata ? 'Editar ata' : 'Nova ata') + '</h3>'
        + '<div class="campos">'
        + '<div class="campo largo"><label for="ataTitulo">Título *</label><input id="ataTitulo" maxlength="160" required value="'
        + escapar(ata ? ata.titulo : '') + '"></div>'
        + '<div class="campo curto"><label for="ataTipo">Reunião *</label><select id="ataTipo">'
        + '<option value="associacao"' + (ata && ata.tipo === 'campeonato' ? '' : ' selected') + '>Associação</option>'
        + '<option value="campeonato"' + (ata && ata.tipo === 'campeonato' ? ' selected' : '') + '>Campeonato</option></select></div>'
        + '<div class="campo curto"><label for="ataData">Data *</label><input id="ataData" required '
        + atributosDataHora_('date', ata ? ata.data : new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
          .toISOString().slice(0, 10)) + '></div>'
        + '<div class="campo largo" id="ataCampoCompeticao"'
        + (ata && ata.tipo === 'campeonato' ? '' : ' hidden')
        + '><label for="ataCompeticao">Competição *</label><select id="ataCompeticao">'
        + '<option value="">Selecione a competição</option>'
        + competicoes.map(function (nome) {
          return '<option value="' + escapar(nome) + '"'
            + (ata && ata.competicao === nome ? ' selected' : '') + '>' + escapar(nome) + '</option>';
        }).join('') + '</select></div>'
        + '<div class="campo largo"><label for="ataLocal">Local</label><input id="ataLocal" maxlength="200" value="'
        + escapar(ata ? ata.local : '') + '"></div>'
        + '<div class="campo cheio"><label for="ataParticipantes">Participantes</label><textarea id="ataParticipantes" maxlength="5000" style="min-height:70px;">'
        + escapar(ata ? ata.participantes : '') + '</textarea></div>'
        + '<div class="campo cheio"><label for="ataTexto">Texto da ata *</label><textarea id="ataTexto" maxlength="40000" required>'
        + escapar(ata ? ata.texto : '') + '</textarea></div>'
        + '</div><div class="acoes-formulario">'
        + (somenteLeitura ? '' : '<button type="submit" class="botao-principal" id="salvarAta">Salvar ata</button>')
        + (ata ? '<button type="button" class="botao-apoio" id="exportarAtaEditor">Exportar PDF</button>' : '')
        + (somenteLeitura ? '' : '<span class="apoio">Salve sempre que quiser guardar o andamento da redação.</span>')
        + '</div>'
        + '<div id="statusAta" role="status"></div></form>';
      document.getElementById('voltarAtas').addEventListener('click', function () {
        if (podeSairDaAta()) montarListaAtas();
      });
      document.getElementById('formAta').addEventListener('input', function () { ataAlterada = true; });
      document.getElementById('formAta').addEventListener('change', function () { ataAlterada = true; });
      document.getElementById('ataTipo').addEventListener('change', function () {
        const campeonato = this.value === 'campeonato';
        document.getElementById('ataCampoCompeticao').hidden = !campeonato;
        const seletor = document.getElementById('ataCompeticao');
        seletor.required = campeonato;

    function formatarMoedaJs(num) {
      return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function pad2Fin(n) {
      var s = String(n);
      return s.length === 1 ? '0' + s : s;
    }

    function extrairYmdFin(val) {
      if (!val) return '';
      if (Object.prototype.toString.call(val) === '[object Date]' && !isNaN(val.getTime())) {
        return String(val.getFullYear()) + pad2Fin(val.getMonth() + 1) + pad2Fin(val.getDate());
      }
      var s = String(val).trim();
      var mBr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (mBr) {
        return mBr[3] + pad2Fin(mBr[2]) + pad2Fin(mBr[1]);
      }
      var mIso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (mIso) {
        return mIso[1] + pad2Fin(mIso[2]) + pad2Fin(mIso[3]);
      }
      var t = Date.parse(s);
      if (!isNaN(t)) {
        var dt = new Date(t);
        return String(dt.getFullYear()) + pad2Fin(dt.getMonth() + 1) + pad2Fin(dt.getDate());
      }
      return '';
    }

    // Datas digitadas no filtro so valem quando completas (dd/mm/aaaa ou aaaa-mm-dd);
    // evita que Date.parse interprete valores parciais como datas erradas.
    function ymdFiltroDigitadoFin(val) {
      var s = String(val || '').trim();
      var mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      try {
        return dataBrParaIso_(mIso ? formatarDataBr(s) : s).replace(/-/g, '');
      } catch (erro) {
        return '';
      }
    }

    function aplicarMascaraDataBr(input, onValChange) {
      if (!input) return;
      input.addEventListener('input', function() {
        if (!validarCampoDataHora_(this) && onValChange) onValChange(this.value);
      });
      input.addEventListener('change', function() {
        if (!validarCampoDataHora_(this)) {
          if (onValChange) onValChange(this.value);
        } else this.reportValidity();
      });
    }

    function vincularPickerData(btnId, pickerId, inputId, onValChange) {
      var btn = document.getElementById(btnId);
      var picker = document.getElementById(pickerId);
      var txt = document.getElementById(inputId);
      if (!btn || !picker || !txt) return;

      btn.addEventListener('click', function() {
        try {
          if (typeof picker.showPicker === 'function') {
            picker.showPicker();
          } else {
            picker.focus();
            picker.click();
          }
        } catch (e) {
          picker.focus();
          picker.click();
        }
      });

      picker.addEventListener('change', function() {
        if (this.value) {
          txt.value = formatarDataBr(this.value);
          validarCampoDataHora_(txt);
          if (onValChange) onValChange(txt.value);
        }
      });
    }

    function renderizarLinhasFinanceiro() {
      var tbody = document.getElementById('linhasFinanceiro');
      if (!tbody) return;

      var d = financeiroDados || {};
      var podeExcluir = d.podeEditar;
      var lista = d.lancamentos || [];

      // Determina limites de data (formato YYYYMMDD comparavel)
      var ymdInicio = '';
      var ymdFim = '';
      var hoje = new Date();

      if (financeiroFiltros.periodo === 'hoje') {
        ymdInicio = extrairYmdFin(hoje);
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === 'mes_atual') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
        ymdFim = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0));
      } else if (financeiroFiltros.periodo === '3m') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() - 3, hoje.getDate()));
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === '6m') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), hoje.getMonth() - 6, hoje.getDate()));
        ymdFim = extrairYmdFin(hoje);
      } else if (financeiroFiltros.periodo === 'anual') {
        ymdInicio = extrairYmdFin(new Date(hoje.getFullYear(), 0, 1));
        ymdFim = extrairYmdFin(new Date(hoje.getFullYear(), 11, 31));
      } else if (financeiroFiltros.periodo === 'custom') {
        ymdInicio = ymdFiltroDigitadoFin(financeiroFiltros.dataInicio);
        ymdFim = ymdFiltroDigitadoFin(financeiroFiltros.dataFim);
      }

      var filtrados = lista.filter(function (l) {
        var busca = (financeiroFiltros.busca || '').toLowerCase();
        if (busca) {
          var textoGeral = (l.descricao + ' ' + l.favorecidoPagador + ' ' + l.documento + ' ' + l.emenda + ' ' + l.idLancamento).toLowerCase();
          if (textoGeral.indexOf(busca) === -1) return false;
        }
        if (financeiroFiltros.tipo && l.tipo.toLowerCase() !== financeiroFiltros.tipo.toLowerCase()) return false;
        if (financeiroFiltros.origem && l.origem.toLowerCase() !== financeiroFiltros.origem.toLowerCase()) return false;
        if (financeiroFiltros.categoria && l.categoria.toLowerCase() !== financeiroFiltros.categoria.toLowerCase()) return false;

            if (ymdFim && ymdMov > ymdFim) return false;

        return true;

            categoria: selCat.value,

            .withFailureHandler(function (err) {

            .salvarLancamentoFinanceiro(payload);

          reader.onerror = function() {
            btnSubmit.disabled = false;

          };
          reader.readAsDataURL(file);

    function formatarDataBr(isoDate) {
      if (!isoDate) return '';
      var p = isoDate.split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : isoDate;
    }

    function formatarDataHoraBr_(valor) {
      if (!valor) return '';
      const texto = String(valor);
      if (!/^\d{4}-\d{2}-\d{2}T/.test(texto)) return texto;
      const data = new Date(texto);
      if (isNaN(data.getTime())) return texto;
      return new Intl.DateTimeFormat('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      }).format(data);
    }

        + '    <p style="margin:6px 0 0;">' + escapar(subtitulo) + '</p>'
        + '    <ol class="modal-pdf-passos">'
        + '      <li>Os relatórios em PDF oficiais da AEUV são gerados com assinatura digital do Presidente, cabeçalho institucional e links clicáveis para auditoria.</li>'
        + '      <li>Os dados cadastrados nesta tela já ficam consolidados na planilha do Google Drive da associação.</li>'
        + '      <li>Para emitir uma nova remessa em PDF atualizada, a automação lê a planilha e gera os PDFs prontos na pasta de relatórios.</li>'
        + '    </ol>'
        + '  </div>'
        + camposFiltroHtml
        + '  <div style="margin-bottom:14px;">'
        + '    <label style="font-size:12px;font-weight:bold;color:var(--azul);">Comando de geração no terminal (Python):</label>'
        + '    <code class="codigo-terminal" id="codigoPdfCmd">' + escapar(gerarComandoCli()) + '</code>'
        + '    <span style="font-size:11px;color:var(--apoio);">Os arquivos são gerados em formato A4 Paisagem dentro de <code>downloads/financeiro/</code> e publicados na pasta do Drive.</span>'
        + '  </div>'
        + '  <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--borda);">'
        + (d.planilhaUrl ? '<a href="' + escapar(d.planilhaUrl) + '" target="_blank" rel="noopener" class="botao-apoio">Ver Dados na Planilha</a>' : '')
        + '    <button type="button" class="botao-principal" id="btnEntendidoPdf">Entendido</button>'
        + '  </div>'
        + '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);

      var elCmd = document.getElementById('codigoPdfCmd');
      var selCompEl = document.getElementById('pdfSelCompeticao');
      var txtEmEl = document.getElementById('pdfTxtEmenda');
      if (selCompEl && elCmd) {
        selCompEl.addEventListener('change', function() {
          elCmd.textContent = gerarComandoCli();
        });
      }
      if (txtEmEl && elCmd) {
        txtEmEl.addEventListener('input', function() {
          elCmd.textContent = gerarComandoCli();
        });
      }

      function fechar() {
        modal.remove();
      }

      document.getElementById('btnFecharPdfModal').addEventListener('click', fechar);
      document.getElementById('btnEntendidoPdf').addEventListener('click', fechar);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) fechar();
      });
    }

    /**
     * Modal estilizado de confirmação antes de excluir lançamento financeiro.
     */
    function confirmarExclusaoFinanceiro(idLancamento, descricao, valorFormatado) {
      var modal = document.createElement('div');
      modal.className = 'modal-fin-overlay';

      var html = '<div class="modal-fin-caixa" style="max-width:460px;">'
        + '  <div class="modal-fin-cabecalho">'
        + '    <h3 style="color:#b3261e;"><span style="font-size:22px;">⚠️</span> Confirmar Exclusão</h3>'
        + '    <button type="button" class="modal-fin-fechar" id="btnFecharConfirmaX">&times;</button>'
        + '  </div>'
        + '  <div style="font-size:14px;color:var(--texto);line-height:1.55;margin:10px 0 16px;">'
        + '    <p style="margin:0 0 10px;">Tem certeza que deseja excluir permanentemente o seguinte lançamento?</p>'
        + '    <div style="background:#fdf2f2;border:1px solid #f8c8c8;border-radius:8px;padding:12px 14px;">'
        + '      <div><strong>Protocolo:</strong> ' + escapar(idLancamento) + '</div>'
        + '      <div style="margin-top:4px;"><strong>Descrição:</strong> ' + escapar(descricao) + '</div>'
        + '      <div style="margin-top:4px;"><strong>Valor:</strong> ' + escapar(valorFormatado) + '</div>'
        + '    </div>'
        + '    <p style="font-size:12px;color:#b3261e;margin:10px 0 0;">Esta ação removerá a linha da planilha de prestação de contas do Google Drive e não poderá ser desfeita.</p>'
        + '  </div>'
        + '  <div id="finStatusExclusao" style="font-size:13px;min-height:18px;margin-bottom:10px;"></div>'
        + '  <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--borda);">'
        + '    <button type="button" class="botao-apoio" id="btnCancelaExclusao">Cancelar</button>'
        + '    <button type="button" class="botao-principal" id="btnConfirmaExclusao" style="background:#b3261e;border-color:#b3261e;">🗑️ Sim, Excluir</button>'
        + '  </div>'
        + '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);

      function fechar() {
        modal.remove();
      }

      document.getElementById('btnFecharConfirmaX').addEventListener('click', fechar);
      document.getElementById('btnCancelaExclusao').addEventListener('click', fechar);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) fechar();
      });

      document.getElementById('btnConfirmaExclusao').addEventListener('click', function() {
        var btnSim = document.getElementById('btnConfirmaExclusao');
        var btnNao = document.getElementById('btnCancelaExclusao');
        var statusDiv = document.getElementById('finStatusExclusao');

        btnSim.disabled = true;
        btnNao.disabled = true;
        statusDiv.innerHTML = '<span style="color:var(--azul);font-weight:bold;">⏳ Removendo registro da planilha...</span>';

        google.script.run
          .withSuccessHandler(function (res) {
            modal.remove();
            carregarFinanceiro();
          })
          .withFailureHandler(function (err) {
            btnSim.disabled = false;
            btnNao.disabled = false;
            statusDiv.innerHTML = '<span style="color:#b3261e;font-weight:bold;">❌ ' + escapar(err && err.message ? err.message : err) + '</span>';
          })
          .removerLancamentoFinanceiro(idLancamento);
      });
    }

    /**
     * Abre e fecha o menu no celular.
     */
    function alternarMenu() {
      menu.classList.toggle('aberto');
    }

    window.addEventListener('hashchange', function () {
      const id = window.location.hash.replace('#', '');

      if (id && id !== moduloAtual) {
        abrirModulo(id);
      }
    });

    acompanharFocoCarregamento();
    montarUsuario();
    montarMenu();
    abrirModulo(rotaElencoPendente ? 'times-campeonato' : (window.location.hash.replace('#', '') || MODULOS[0].id));
  </script>
</body>
</html>
