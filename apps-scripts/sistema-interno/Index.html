         + '<option value="comissao"' + (tipoAtual === 'comissao' ? ' selected' : '') + '>Comissão técnica</option>'
         + '</select></div>'
         + '<div class="campo largo"><label for="cpCampeonato">Campeonato</label><select id="cpCampeonato"' + trava + '>'
         + opcoesSelect(cadastroPessoasCampeonato.campeonatos, selecionado, '') + '</select></div>'
             + '<div class="campo largo"><label for="cpTime">Time vinculado *</label><select id="cpTime"></select><span class="apoio" id="cpAvisoTime"></span></div>'
             + '</div></div>')
         + '<div class="grupo"><h4>Dados pessoais</h4><div class="campos">'
         + campoTexto('cpNome', 'Nome *', pessoaEmEdicao ? pessoaEmEdicao.nome : '', 'largo', '', 'text')
         + campoTexto('cpCpf', 'CPF *', formatarCpf(pessoaEmEdicao ? pessoaEmEdicao.cpf : ''), 'curto', '', 'text')
         + campoTexto('cpNascimento', 'Data de nascimento *', pessoaEmEdicao ? pessoaEmEdicao.dataNascimento : '', 'curto', '', 'date')
         + campoTexto('cpRg', 'RG (opcional)', pessoaEmEdicao ? pessoaEmEdicao.rg : '', 'curto', '', 'text')
         + '</div></div>'
         + '<div class="grupo cadastro-campo-atleta"><h4>Dados do atleta</h4><div class="campos">'
         + '<div class="campo curto"><label for="cpPosicao">Posição *</label><select id="cpPosicao">'
         + posicoes.map(function (pos) {
           const selecionada = pessoaEmEdicao && pessoaEmEdicao.posicao === pos;
           return '<option value="' + escapar(pos) + '"' + (selecionada ? ' selected' : '') + '>' + escapar(pos) + '</option>';
         }).join('') + '</select></div>'
         + campoTexto('cpApelido', 'Apelido (opcional)', pessoaEmEdicao ? pessoaEmEdicao.apelido : '', 'curto', '', 'text')
         + campoTexto('cpNumero', 'Número da camisa (opcional)', pessoaEmEdicao ? pessoaEmEdicao.numero : '', 'curto', '', 'number')
         + '</div></div>'
         + '<div class="grupo cadastro-campo-comissao"><h4>Dados do membro da comissão</h4><div class="campos">'
         + '<div class="campo curto"><label for="cpCargo">Cargo *</label><select id="cpCargo">'
         + '<option value="">Selecione um cargo</option>' + cargoAnterior
         + cargos.map(function (cargo) {
           return '<option value="' + escapar(cargo) + '"' + (cargoAtual === cargo ? ' selected' : '') + '>' + escapar(cargo) + '</option>';
         }).join('') + '</select></div>'
         + '</div></div>'
         + '<div class="grupo"><h4>Foto</h4><div class="campos">'
         + '<div class="campo cheio">'
         + '<input type="hidden" id="cpFotoAtual" value="' + escapar(pessoaEmEdicao ? (pessoaEmEdicao.foto || '') : '') + '">'
         + imagemUpload('cpFoto', 'Foto *', {
           accept: 'image/*',
           ajuda: 'Arquivo de imagem. ' + (pessoaEmEdicao ? 'Selecione somente para substituir a foto atual.' : 'Selecione para identificar a pessoa no elenco.'),
           atual: pessoaEmEdicao ? pessoaEmEdicao.foto : '',
           alt: pessoaEmEdicao ? 'Foto de ' + pessoaEmEdicao.nome : 'Foto'
         })
         + '</div>'
         + '</div></div>'
         + '<p class="apoio">* Campos obrigatórios. ' + (tipoAtual === 'atletas' ? 'Apelido e número da camisa são opcionais.' : 'Selecione o cargo do membro da comissão técnica.') + '</p>'
         + '<div class="acoes-formulario">'
         + '<button type="button" class="botao-principal" id="gravarCadastroPessoa">' + (pessoaEmEdicao ? 'Salvar alterações' : (tipoAtual === 'comissao' ? 'Adicionar membro da comissão' : 'Adicionar atleta')) + '</button>'
         + '<button type="button" class="botao-apoio" id="voltarCadastroPessoa">Cancelar e voltar à lista</button>'
         + '<span class="espaco"></span>'
         + '<span class="apoio" id="avisoCadastroPessoa" role="status" aria-live="polite"></span>'
         + '</div></div>';

       if (!elencoAtual) preencherTimesCadastroPessoa(selecionado, pessoaEmEdicao ? pessoaEmEdicao.timeVinculado : '');
       if (pessoaEmEdicao && tipoAtual === 'atletas' && pessoaEmEdicao.participouCompeticao === true) {
         // O servidor também recusa a troca; aqui apenas evitamos uma edição que seria rejeitada.
         const campoCpf = document.getElementById('cpCpf');
         campoCpf.disabled = true;
         campoCpf.setAttribute('aria-describedby', 'cpAvisoVinculoCompeticao');
         const campoTime = document.getElementById('cpTime');
         if (campoTime.tagName === 'SELECT') {
           campoTime.disabled = true;
           campoTime.setAttribute('aria-describedby', 'cpAvisoVinculoCompeticao');
         }
         campoCpf.closest('.grupo').insertAdjacentHTML('beforeend', '<p class="apoio" id="cpAvisoVinculoCompeticao">'
           + 'Atleta com participação em jogo deste campeonato: o CPF e a equipe ficam bloqueados para preservar o elenco histórico. '
           + 'Nome, número, posição e foto podem ser corrigidos.</p>');
       }
       atualizarCamposTipoCadastroPessoa();
       configurarMascaraCpfCadastroPessoa();
       configurarPreviewFotoCadastroPessoa();
       if (elencoAtual) alternarFormularioElenco(true);
       document.getElementById('elencoFormTitulo').focus();

       document.getElementById('voltarCadastroPessoa').addEventListener('click', function () {
         if (elencoAtual && elencoAtual.salvando) return;
         document.getElementById('cadastroPessoasFormArea').innerHTML = '';
         if (elencoAtual) {
           alternarFormularioElenco(false);
           document.getElementById('elencoNovo').focus();
         }
       });

       document.getElementById('gravarCadastroPessoa').addEventListener('click', function () {
         gravarCadastroPessoa(registroId);
       });

       if (!pessoaEmEdicao && !elencoAtual) {
         document.getElementById('cpCampeonato').addEventListener('change', function () {
           preencherTimesCadastroPessoa(this.value, '');
         });

         document.getElementById('cpTipo').addEventListener('change', function () {
           atualizarCamposTipoCadastroPessoa();
         });
       }
     }

     function preencherTimesCadastroPessoa(campeonatoId, selecionado) {
       const campo = document.getElementById('cpTime');
       const aviso = document.getElementById('cpAvisoTime');
       const times = (cadastroPessoasCampeonato.times || {})[campeonatoId] || [];
       campo.innerHTML = '<option value="">Selecione um time</option>' + times.map(function (time) {
         return '<option value="' + escapar(time) + '"' + (String(time) === String(selecionado) ? ' selected' : '') + '>' + escapar(time) + '</option>';
       }).join('');
       if (aviso) {
         aviso.textContent = times.length ? '' : 'Vincule um time neste campeonato antes de salvar o cadastro.';
       }
     }

     function atualizarCamposTipoCadastroPessoa() {
       const tipo = document.getElementById('cpTipo').value;
       document.querySelectorAll('.cadastro-campo-atleta').forEach(function (campo) {
         campo.style.display = tipo === 'atletas' ? '' : 'none';
       });
       document.querySelectorAll('.cadastro-campo-comissao').forEach(function (campo) {
         campo.style.display = tipo === 'comissao' ? '' : 'none';
       });
     }

     function configurarMascaraCpfCadastroPessoa() {
       const campo = document.getElementById('cpCpf');
       if (!campo) return;

       campo.addEventListener('input', function (e) {
         let valor = e.target.value.replace(/\D/g, '');
         if (valor.length > 11) valor = valor.substring(0, 11);
         if (valor.length > 9) {
           valor = valor.substring(0, 3) + '.' + valor.substring(3, 6) + '.' + valor.substring(6, 9) + '-' + valor.substring(9);
         } else if (valor.length > 6) {
           valor = valor.substring(0, 3) + '.' + valor.substring(3, 6) + '.' + valor.substring(6);
         } else if (valor.length > 3) {
           valor = valor.substring(0, 3) + '.' + valor.substring(3);
         }
         e.target.value = valor;
       });
     }

     function configurarPreviewFotoCadastroPessoa() {
       inicializarImagemUpload('cpFoto', function (mensagem) {
         exibirErroCadastroPessoa(mensagem,
           document.getElementById('gravarCadastroPessoa'), document.getElementById('avisoCadastroPessoa'));
       });
     }

     function gravarCadastroPessoa(registroId) {
       if (!permitirEdicaoElenco_()) return;
       const contextoSalvar = elencoAtual;
       const botao = document.getElementById('gravarCadastroPessoa');
       const aviso = document.getElementById('avisoCadastroPessoa');
       if (!validarCamposDataHora_(['cpNascimento'], aviso)) return;
       const tipo = document.getElementById('cpTipo').value === 'comissao' ? 'comissao' : 'atletas';
       const campeonatoId = document.getElementById('cpCampeonato').value;
       const payload = {
         campeonatoId: campeonatoId,
         nome: document.getElementById('cpNome').value,
         cpf: document.getElementById('cpCpf').value.replace(/\D/g, ''),
         rg: document.getElementById('cpRg').value,
         dataNascimento: lerDataFormulario_('cpNascimento'),
         timeVinculado: document.getElementById('cpTime').value,
         foto: document.getElementById('cpFotoAtual').value || ''
       };

       if (tipo === 'atletas') {
         payload.apelido = document.getElementById('cpApelido').value;
         payload.numero = document.getElementById('cpNumero').value;
         payload.posicao = document.getElementById('cpPosicao').value;
         if (registroId) payload.atletaId = registroId;
       } else {
         payload.cargo = document.getElementById('cpCargo').value;
         if (registroId) payload.membroId = registroId;
       }

       botao.disabled = true;
       marcarElencoPendente_(true);
       document.getElementById('voltarCadastroPessoa').disabled = true;
       aviso.textContent = 'Gravando...';

       const inputFoto = document.getElementById('cpFoto');
       mostrarLoadingCadastroPessoa_(true);
       if (inputFoto && inputFoto.files && inputFoto.files[0]) {
         const leitor = new FileReader();
         leitor.onload = function (e) {
           payload.foto = e.target.result;
           enviarCadastroPessoa(tipo, registroId, payload, botao, aviso, contextoSalvar);
         };
         leitor.onerror = leitor.onabort = function () {
           exibirErroCadastroPessoa('Não foi possível ler a foto. Selecione o arquivo novamente.', botao, aviso);
         };
         leitor.readAsDataURL(inputFoto.files[0]);
       } else {
         enviarCadastroPessoa(tipo, registroId, payload, botao, aviso, contextoSalvar);
       }
     }

     function mostrarLoadingCadastroPessoa_(ativo) {
       const existente = document.getElementById('cadastroPessoaLoading');
       if (existente) existente.remove();
       if (!ativo) return;
       const formulario = document.getElementById('cadastroPessoasFormArea');
       const area = formulario && !formulario.hidden && formulario.children.length
         ? formulario
         : document.getElementById(elencoAtual ? 'elencoLista' : 'areaCadastroPessoasCampeonato');
       if (area) {
         area.insertAdjacentHTML('afterbegin', '<div id="cadastroPessoaLoading" role="status" aria-live="polite">' + blocoCarregando() + '</div>');
       }
     }

     function exibirErroCadastroPessoa(erro, botao, aviso) {
       if (botao && botao !== document.getElementById('gravarCadastroPessoa')) return;
       mostrarLoadingCadastroPessoa_(false);
       marcarElencoPendente_(false);
       if (botao) botao.disabled = false;
       const cancelar = document.getElementById('voltarCadastroPessoa');
       if (cancelar && botao === document.getElementById('gravarCadastroPessoa')) cancelar.disabled = false;
       if (aviso) {
         aviso.innerHTML = '<span class="alerta">'
           + escapar(erro && erro.message ? erro.message : erro) + '</span>';
       }
     }

     function enviarCadastroPessoa(tipo, registroId, payload, botao, aviso, contextoSalvar) {
       if (contextoSalvar !== elencoAtual) return;
       if (elencoAtual) {
         if (moduloAtual !== 'times-campeonato') return;
         const contexto = elencoAtual;
         payload.campeonatoId = contexto.campeonatoId;
         payload.equipeId = contexto.equipeId;
         payload.tipo = tipo;
         payload.registroId = registroId || '';
         google.script.run.withSuccessHandler(function (dados) {
           if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
           cadastroPessoasCampeonato = dados;
           abaElencoAtiva = tipo;
           montarElenco(dados.recado);
         }).withFailureHandler(function (erro) {
           if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
           exibirErroCadastroPessoa(erro, botao, aviso);
         })
           .salvarCadastroElenco(payload);
         return;
       }
       const funcao = tipo === 'comissao'
         ? (registroId ? 'atualizarMembroComissao' : 'salvarMembroComissao')
         : (registroId ? 'atualizarAtletaCampeonato' : 'salvarAtletaCampeonato');
       const moduloSalvar = moduloAtual;

       google.script.run
         .withSuccessHandler(function (dados) {
           if (elencoAtual !== contextoSalvar || moduloAtual !== moduloSalvar) return;
           cadastroPessoasCampeonato = dados;
           abaCadastroPessoasAtiva = tipo;
           montarTelaCadastroPessoasCampeonato(dados.recado);
         })
         .withFailureHandler(function (erro) {
           if (elencoAtual !== contextoSalvar || moduloAtual !== moduloSalvar) return;
           exibirErroCadastroPessoa(erro, botao, aviso);
         })[funcao](payload);
     }

     function gravarAtleta(campeonatoId, atletaId) {
       abrirFormularioCadastroPessoa(campeonatoId, 'atletas', atletaId);
     }

     function gravarMembroComissao(campeonatoId, membroId) {
       abrirFormularioCadastroPessoa(campeonatoId, 'comissao', membroId);
     }

     function localizarCadastroPessoa_(tipo, campeonatoId, registroId) {
       const registros = (cadastroPessoasCampeonato && cadastroPessoasCampeonato.registros) || [];
       const registro = elencoAtual ? registros[0] : registros.find(function (item) { return item.campeonatoId === campeonatoId; });
       const lista = registro && (tipo === 'comissao' ? registro.comissao : tipo === 'atletas' ? registro.atletas : null);
       const pessoa = (lista || []).find(function (item) { return item.id === registroId; });
       return pessoa ? { registro: registro, pessoa: pessoa } : null;
     }

     // Somente sinalização na interface; o servidor revalida a participação sob o lock.
     function motivoBloqueioRemocaoAtleta_(pessoa) {
       if (pessoa && pessoa.podeRemover === true) return '';
       return String((pessoa && pessoa.motivoRemocao) || '')
         || 'Remoção indisponível: a participação deste atleta na competição não foi confirmada pelo servidor. Atualize a lista.';
     }

     function avisarRemocaoAtletaBloqueada_(motivo) {
       const area = document.getElementById(elencoAtual ? 'areaTimesCampeonato' : 'areaCadastroPessoasCampeonato');
       const anterior = document.getElementById('avisoRemocaoBloqueada');
       if (anterior) anterior.remove();
       if (area) area.insertAdjacentHTML('afterbegin', '<div class="erro" id="avisoRemocaoBloqueada" role="alert">' + escapar(motivo) + '</div>');
     }

     function removerCadastroPessoa(tipo, campeonatoId, registroId) {
       if (confirmacaoElencoAtual || !permitirEdicaoElenco_()) return;
       const encontrado = localizarCadastroPessoa_(tipo, campeonatoId, registroId);
       if (!encontrado) return;
       const motivoBloqueio = tipo === 'atletas' ? motivoBloqueioRemocaoAtleta_(encontrado.pessoa) : '';
       if (motivoBloqueio) {
         avisarRemocaoAtletaBloqueada_(motivoBloqueio);
         return;
       }
       const contextoOrigem = elencoAtual;
       const moduloOrigem = moduloAtual;
       const dadosOrigem = cadastroPessoasCampeonato;
       const comissao = tipo === 'comissao';
       const nome = String(encontrado.pessoa.nome || (comissao ? 'Membro sem nome' : 'Atleta sem nome'));
       const equipeNome = contextoOrigem && dadosOrigem.equipe ? dadosOrigem.equipe.nome : encontrado.pessoa.timeVinculado;
       const detalhes = dialogoDetalhesElencoAtual;
       const origemFoco = detalhes && detalhes._elencoOrigemFoco && detalhes._elencoOrigemFoco.isConnected ? detalhes._elencoOrigemFoco : null;
       fecharDetalhesPessoaElenco(false);

       confirmarDescarteElenco_({
         titulo: comissao ? 'Remover membro da comissão?' : 'Remover atleta?',
         mensagem: '"' + nome + '" será removido ' + (comissao ? 'da comissão técnica' : 'do elenco')
           + (equipeNome ? ' de ' + equipeNome : '') + ' em ' + (encontrado.registro.campeonatoNome || 'este campeonato') + '. '
           + 'O histórico de inscrições já registrado é mantido.',
         cancelar: 'Cancelar',
         confirmar: comissao ? 'Remover membro' : 'Remover atleta',
         origemFoco: origemFoco
       }).then(function (confirmado) {
         if (!confirmado || elencoAtual !== contextoOrigem || moduloAtual !== moduloOrigem || cadastroPessoasCampeonato !== dadosOrigem) return;
         if (contextoOrigem ? abaElencoAtiva !== tipo : abaCadastroPessoasAtiva !== tipo) return;
         if (!localizarCadastroPessoa_(tipo, campeonatoId, registroId) || !permitirEdicaoElenco_()) return;
         executarRemocaoCadastroPessoa_(tipo, campeonatoId, registroId);
       });
     }

     function executarRemocaoCadastroPessoa_(tipo, campeonatoId, registroId) {
       if (elencoAtual) {
         const contexto = elencoAtual;
         fecharDetalhesPessoaElenco(false);
         marcarElencoPendente_(true);
         mostrarLoadingCadastroPessoa_(true);
         document.getElementById('areaTimesCampeonato').querySelectorAll('[data-elenco-remover]').forEach(function (botao) { botao.disabled = true; });
         google.script.run.withSuccessHandler(function (dados) {
           if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
           cadastroPessoasCampeonato = dados;
           abaElencoAtiva = tipo;
           montarElenco(dados.recado);
         }).withFailureHandler(function (erro) {
           if (elencoAtual !== contexto || moduloAtual !== 'times-campeonato') return;
           montarElenco();
           document.getElementById('areaTimesCampeonato').insertAdjacentHTML('afterbegin', '<div class="erro">' + escapar(erro.message || erro) + '</div>');
         }).removerCadastroElenco({
           campeonatoId: contexto.campeonatoId, equipeId: contexto.equipeId,
           tipo: tipo, registroId: registroId
         });
         return;
       }

       const funcao = tipo === 'comissao' ? 'removerMembroComissao' : 'removerAtletaCampeonato';
       const moduloRemover = moduloAtual;
       mostrarLoadingCadastroPessoa_(true);

       google.script.run
         .withSuccessHandler(function (dados) {
           if (elencoAtual || moduloAtual !== moduloRemover) return;
           cadastroPessoasCampeonato = dados;
           abaCadastroPessoasAtiva = tipo;
           montarTelaCadastroPessoasCampeonato(dados.recado);
         })
         .withFailureHandler(function (erro) {
           if (elencoAtual || moduloAtual !== moduloRemover) return;
           mostrarLoadingCadastroPessoa_(false);
           alert('Erro: ' + (erro && erro.message ? erro.message : erro));
         })[funcao](campeonatoId, registroId);
     }

     function removerMembroComissao(campeonatoId, membroId) {
       removerCadastroPessoa('comissao', campeonatoId, membroId);
     }

     function removerAtletaCampeonato(campeonatoId, atletaId) {
       removerCadastroPessoa('atletas', campeonatoId, atletaId);
     }

    /**
     * Estado da tela de punicoes: o arquivo e lido uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let punicoes = { registros: [], atualizadoEm: '', arquivoUrl: '' };

    /**
     * Busca no servidor o controle de punicoes publicado no Drive.
     */
    function carregarPunicoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          punicoes = dados;
          montarTelaPunicoes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          document.getElementById('statusPunicoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarPunicoes();
    }

    /**
     * Monta os indicadores, os filtros e a tabela do controle de punicoes.
     */
    function montarTelaPunicoes() {
      const registros = punicoes.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusPunicoes').outerHTML =

      }

      const atualizacao = punicoes.atualizadoEm
        ? 'Atualizado em ' + escapar(punicoes.atualizadoEm)

      document.getElementById('statusPunicoes').outerHTML = ''
        + '<div class="resumo" id="resumoPunicoes"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaPunicoes" placeholder="Buscar por atleta, equipe, nota ou artigo">'
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + opcoesFiltro('equipe', 'Todas as equipes', registros)
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('status', 'Todos os status', registros)
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemPunicoes"></span>'
        + '<span class="espaco"></span>'
        + '<span>' + atualizacao + '</span>'
        + '<button type="button" class="botao-apoio" id="recarregarPunicoes">Atualizar</button>'
        + (punicoes.arquivoUrl
          ? '<a class="botao-apoio" href="' + escapar(punicoes.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="punicoes"><thead><tr>'
        + '<th>Nota</th><th>Punido</th><th>Equipe</th><th>Partida</th><th>Artigo</th>'
        + '<th>Suspens&atilde;o</th><th>Status</th><th>Situa&ccedil;&atilde;o</th>'
        + '</tr></thead><tbody id="linhasPunicoes"></tbody></table></div>';

      document.getElementById('buscaPunicoes').addEventListener('input', filtrarPunicoes);
      document.getElementById('recarregarPunicoes').addEventListener('click', function () {
        abrirModulo('punicoes');
      });

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        campo.addEventListener('change', filtrarPunicoes);
      });

      if (termo) {
        document.getElementById('buscaPunicoes').value = termo;
      }

      filtrarPunicoes();
    }

    /**
     * Cria um seletor com os valores distintos de uma coluna.
     */
    function opcoesFiltro(campo, rotuloTodos, registros) {
      const valores = [];

      registros.forEach(function (registro) {
        const valor = registro[campo];

        if (valor && valor !== '-' && valores.indexOf(valor) === -1) {
          valores.push(valor);
        }
      });

      valores.sort();

      return '<select data-filtro="' + campo + '"><option value="">' + rotuloTodos + '</option>'
        + valores.map(function (valor) {
          return '<option value="' + escapar(valor) + '">' + escapar(valor) + '</option>';
        }).join('') + '</select>';
    }

    /**
     * Tira acentos e maiusculas para a busca livre nao depender da digitacao.
     */
    function simplificar(texto) {
      return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarPunicoes() {
      const busca = simplificar(document.getElementById('buscaPunicoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (punicoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(Object.keys(registro).map(function (campo) {
          return registro[campo];
        }).join(' ')).indexOf(busca) !== -1;
      });

      desenharResumo(filtrados);
      desenharLinhas(filtrados);
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumo(registros) {
      const cumprir = registros.filter(function (r) { return r.situacao.indexOf('A CUMPRIR') === 0; }).length;
      const cumpridas = registros.filter(function (r) { return r.situacao.indexOf('CUMPRIDA') === 0; }).length;
      const pendentes = registros.filter(function (r) { return r.status !== 'DEFINIDA'; }).length;

      const itens = [
        ['', registros.length, 'Punições'],
        ['cumprir', cumprir, 'A cumprir'],
        ['cumprida', cumpridas, 'Cumpridas'],
        ['pendente', pendentes, 'Pena a definir']
      ];

      document.getElementById('resumoPunicoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      document.getElementById('contagemPunicoes').textContent = registros.length === (punicoes.registros || []).length
        ? registros.length + ' registro(s)'
        : registros.length + ' de ' + punicoes.registros.length + ' registro(s)';
    }

    /**
     * Desenha as linhas da tabela (fichas empilhadas no celular).
     */
    function desenharLinhas(registros) {
      if (!registros.length) {
        document.getElementById('linhasPunicoes').innerHTML =
          '<tr><td colspan="8" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma puni&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasPunicoes').innerHTML = registros.map(function (r) {
        const detalhe = r.tipo + (r.camisa && r.camisa !== '-' ? ' · camisa ' + r.camisa : '')
          + (r.cartaoVermelho === 'Sim' ? ' · cartão vermelho' : '');

        // A sumula e a origem da punicao: o link leva direto ao relato do
        // arbitro que motivou a decisao. O rotulo e curto porque a coluna
        // e estreita; o protocolo inteiro fica no title.
        const origem = r.sumula && r.sumula !== '-' && moduloDisponivel('sumulas')
          ? '<div class="punido-dado origem-sumula"><a href="#" class="atalho-sumula" title="Súmula '
            + escapar(r.sumula) + '" data-sumula="' + escapar(r.sumula) + '">Ver súmula</a></div>'
          : '';

        return '<tr>'
          + celula('Nota', escapar(r.nota) + '<div class="punido-dado">' + escapar(r.dataNota) + '</div>' + origem)
          + celula('Punido', '<span class="punido-nome">' + escapar(r.punido) + '</span>'
            + '<div class="punido-dado">' + escapar(detalhe) + '</div>')
          + celula('Equipe', escapar(r.equipe))
          + celula('Partida', escapar(r.partida) + '<div class="punido-dado">' + escapar(r.dataJogo) + '</div>')
          + celula('Artigo', escapar(r.artigo))
          + celula('Suspensão', escapar(suspensao(r)))
          + celula('Status', '<span class="' + classeStatus(r.status) + '">' + escapar(r.status) + '</span>')
          + celula('Situação', '<span class="' + classeSituacao(r.situacao) + '">' + escapar(r.situacao) + '</span>')
          + '</tr>';
      }).join('');

      conteudo.querySelectorAll('#linhasPunicoes .atalho-sumula').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.preventDefault();
          abrirModulo('sumulas', link.dataset.sumula);
        });
      });
    }

    /**
     * Celula com rotulo, usado no layout de ficha do celular.
     */
    function celula(rotulo, html) {
      return '<td data-rotulo="' + escapar(rotulo) + '">' + html + '</td>';
    }

    /**
     * Suspensao adicional aplicada na nota. Quando nao ha partidas nem prazo,
     * mostra a decisao escrita na nota (por exemplo, pena ainda a definir).
     */
    function suspensao(registro) {
      const partes = [];

      if (registro.partidas && registro.partidas !== '-') {
        partes.push(registro.partidas + (registro.partidas === '1' ? ' partida' : ' partidas'));
      }

      if (registro.tempo && registro.tempo !== '-') {
        partes.push(registro.tempo);
      }

      if (partes.length) {
        return partes.join(' + ');
      }

      return registro.decisao && registro.decisao !== '-' ? registro.decisao : '-';
    }

    function classeStatus(status) {
      return 'pilula ' + (status === 'DEFINIDA' ? 'definida' : 'alerta');
    }

    function classeSituacao(situacao) {
      if (situacao.indexOf('CUMPRIDA') === 0) {
        return 'pilula cumprida';
      }

      return situacao.indexOf('A CUMPRIR') === 0 ? 'pilula cumprir' : 'pilula';
    }

    /**
     * Estado da tela de solicitacoes. A leitura do Drive e cara, entao

    let solicitacoes = { registros: [], situacoes: [], acoes: [], total: 0, limite: 0, pastaUrl: '' };

    let solicitacoesAbertas = {};

    /**
     * Busca no servidor as solicitacoes enviadas pelas equipes.

    function carregarSolicitacoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'solicitacoes') {
            return;
          }

          solicitacoes = dados;
          solicitacoesAbertas = {};
          montarTelaSolicitacoes();
        })
        .withFailureHandler(function (erro) {

            return;
          }

          document.getElementById('statusSolicitacoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';

        .listarSolicitacoes();

    /**
     * Monta os indicadores, os filtros e a tabela das solicitacoes.
     */
    function montarTelaSolicitacoes() {
      const registros = solicitacoes.registros || [];

      if (!registros.length) {

          '<div class="vazio">Nenhuma solicita&ccedil;&atilde;o enviada at&eacute; o momento.</div>';

        + '<div class="resumo" id="resumoSolicitacoes"></div>'

        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)

        + '</div>'
        + '<div class="barra-acoes">'

        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes"><thead><tr>'
        + '<th>Situa&ccedil;&atilde;o</th><th>Protocolo</th><th>Enviada em</th><th>Equipe</th>'
        + '<th>Respons&aacute;vel</th><th>Registros</th><th>Resultado</th>'
        + '</tr></thead><tbody id="linhasSolicitacoes"></tbody></table></div>';

      document.getElementById('buscaSolicitacoes').addEventListener('input', filtrarSolicitacoes);
      document.getElementById('recarregarSolicitacoes').addEventListener('click', function () {
        abrirModulo('solicitacoes');

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
