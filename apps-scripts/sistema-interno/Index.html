    .menu .icone { font-size: 17px; line-height: 1; flex: 0 0 auto; }

    .menu button.ativo .etiqueta { background: rgba(255, 255, 255, .22); color: #fff; }

    /* ---------- Submenu ---------- */

    .grupo-menu { margin-bottom: 2px; }

    .titulo-grupo .seta {

    /* ---------- Tabela de usuarios ---------- */

    /* ---------- Carregamento ----------
       Mesma identidade da portaria (docs/sistema/index.html): anel girando
       ao redor da logomarca, reticências animadas e barra indeterminada.
       Toda tela usa este bloco, com o mesmo texto: o tempo depende do
       Drive, não da funcionalidade, então a mensagem não precisa variar. */
    .carregando {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 38px 24px 44px;
      color: var(--apoio);
    }

    .carregando .marca {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
    }

    .carregando .marca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--borda);
      border-top-color: var(--dourado);
      border-right-color: var(--dourado);
      animation: girar 1.1s linear infinite;
    }

    .carregando .marca img {
      width: 66px;
      height: 66px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    .carregando .rotulo {
      margin: 16px 0 0;
      font-size: 14px;
      color: var(--texto);
    }

    .carregando .rotulo::after {
      content: '';
      animation: reticencias 1.4s steps(4, end) infinite;
    }

    .carregando .barra {
      position: relative;
      width: 190px;
      height: 5px;
      margin-top: 16px;
      border-radius: 4px;
      background: var(--borda);
      overflow: hidden;
    }

    .carregando .barra span {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffc45c, var(--dourado));
      animation: correr 1.3s ease-in-out infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    @keyframes correr {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes reticencias {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* Quem pediu menos movimento vê o mesmo bloco, parado. */
    @media (prefers-reduced-motion: reduce) {
      .carregando .marca::before,
      .carregando .marca img,
      .carregando .barra span,
      .carregando .rotulo::after { animation: none; }

      .carregando .barra span { width: 100%; left: 0; }
    }

    /* ---------- Controle de punicoes ---------- */

    .resumo {

    .indicador.cumprir { border-left-color: var(--dourado); }

    .indicador.pendente { border-left-color: #c0392b; }

    .filtros {

    .filtros input, .filtros select {

    }

    .filtros input { flex: 2 1 240px; }

    .barra-acoes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      margin-top: 14px;
      font-size: 13px;
      color: var(--apoio);
    }

    .barra-acoes .espaco { flex: 1; }

    .botao-apoio {
      padding: 8px 14px;

      color: var(--azul);

      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .botao-apoio:hover { background: var(--fundo); }

    /* O resultado da automacao e o que o usuario mais procura no detalhe. */
    .botao-apoio.destaque {
      background: var(--azul);
      border-color: var(--azul);
      color: #fff;
    }

    .botao-apoio.destaque:hover { background: #17325c; }

    .tabela-rolagem { overflow-x: auto; }

    /* Larguras fixas: a tabela cabe na tela sem empurrar as colunas curtas. */
    .punicoes { table-layout: fixed; font-size: 13px; }
    .punicoes th, .punicoes td { padding: 9px 10px; }

    .punicoes th:nth-child(1) { width: 11%; }
    .punicoes th:nth-child(2) { width: 17%; }
    .punicoes th:nth-child(3) { width: 11%; }
    .punicoes th:nth-child(4) { width: 15%; }
    .punicoes th:nth-child(5) { width: 10%; }
    .punicoes th:nth-child(6) { width: 12%; }
    .punicoes th:nth-child(7) { width: 11%; }
    .punicoes th:nth-child(8) { width: 13%; }

    .punicoes td:nth-child(1),
    .punicoes td:nth-child(5) { white-space: nowrap; }

    /* O protocolo da súmula é longo e a coluna da nota é estreita: o
       atalho mostra um rótulo curto, com o protocolo no title. */
    .origem-sumula { white-space: normal; margin-top: 2px; }

    .punido-nome { font-weight: bold; color: var(--azul); }
    .punido-dado { font-size: 12px; color: var(--apoio); }

    .pilula.cumprir { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.cumprida { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.alerta { background: #fdecea; color: #922b21; font-weight: bold; }
    .pilula.definida { background: #e4f4e9; color: #1e8449; }

    /* ----- Solicitações de inscrição ----- */

    .solicitacoes { table-layout: fixed; font-size: 13px; }
    .solicitacoes th, .solicitacoes td { padding: 9px 10px; }

    .solicitacoes th:nth-child(1) { width: 15%; }
    .solicitacoes th:nth-child(2) { width: 15%; }
    .solicitacoes th:nth-child(3) { width: 14%; }
    .solicitacoes th:nth-child(4) { width: 13%; }
    .solicitacoes th:nth-child(5) { width: 17%; }
    .solicitacoes th:nth-child(6) { width: 13%; }
    .solicitacoes th:nth-child(7) { width: 13%; }

    .solicitacoes tbody tr.linha { cursor: pointer; }
    .solicitacoes tbody tr.linha:hover { background: var(--fundo); }

    /* ----- Banco de Dados de Atletas ----- */

    .atletas-bd th:nth-child(1) { width: 24%; }
    .atletas-bd th:nth-child(2) { width: 17%; }
    .atletas-bd th:nth-child(3) { width: 17%; }
    .atletas-bd th:nth-child(4) { width: 17%; }
    .atletas-bd th:nth-child(5) { width: 13%; }

    .atleta-bd-alternar {

      color: inherit;
      text-align: left;

    }

    .atleta-bd-alternar:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

    .atleta-bd-titulo {
      margin: 14px 0 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--apoio);
    }

    .atleta-bd-titulo:first-child { margin-top: 0; }

    /* ----- Notas oficiais ----- */

    /* Cinco colunas: número e data são curtos, a partida e os punidos
       precisam de espaço para caber dois nomes. */
    .notas th:nth-child(1) { width: 12%; }
    .notas th:nth-child(2) { width: 16%; }
    .notas th:nth-child(3) { width: 26%; }
    .notas th:nth-child(4) { width: 16%; }
    .notas th:nth-child(5) { width: 30%; }

    /* A coluna de punidos traz nome e equipe: precisa quebrar linha, ao
       contrário da contagem por ação das outras tabelas. */
    .notas .contagem { flex-direction: column; gap: 2px; }
    .notas .contagem span { white-space: normal; }

    /* ----- Regulamentos ----- */

    .regulamentos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .regulamento {
      border: 1px solid var(--borda);
      border-radius: 12px;
      background: #fff;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .regulamento-titulo { display: flex; align-items: flex-start; gap: 10px; }
    .regulamento-titulo .icone { font-size: 22px; line-height: 1.2; }
    .regulamento-titulo h3 { margin: 0; font-size: 15px; color: var(--azul); }
    .regulamento .barra-acoes { margin-top: auto; }

    .protocolo { font-weight: bold; color: var(--azul); font-family: monospace; }

    .pilula.aguardando { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.processada { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.analisada { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.falha { background: #fdecea; color: #922b21; font-weight: bold; }

    /* Contagem por ação, exibida na coluna de registros. */
    .contagem { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
    .contagem span { white-space: nowrap; color: var(--apoio); }
    .contagem strong { color: var(--texto); }

    .detalhe { background: var(--fundo); }
    .detalhe > td { padding: 0 10px 14px; }

    .detalhe-caixa {
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: #fff;
      padding: 14px 16px;
    }

    .detalhe-dados {

      color: var(--apoio);
      margin-bottom: 12px;

    .detalhe-dados strong { color: var(--texto); font-weight: normal; }

    /* Relato da arbitragem. Texto corrido, lido de ponta a ponta pela

    .relato {

    }

    table.pessoas th { font-size: 11px; }

    /* Atalho de uma tela para a outra (súmula ⇄ nota no controle). */

    .atalho-sumula:hover { text-decoration: none; opacity: 0.75; }

    .vazio {

    /* ----- Cadastro de associados ----- */

    .associados th, .associados td { padding: 9px 10px; }

    .associados th:nth-child(1) { width: 22%; }

    .associados th:nth-child(4) { width: 18%; }
    .associados th:nth-child(5) { width: 15%; }
    .associados th:nth-child(6) { width: 9%; }

    .associados tbody tr { cursor: pointer; }
    .associados tbody tr:hover { background: var(--fundo); }

    .equipe-nome { font-weight: bold; color: var(--azul); }
    .equipe-dado { font-size: 12px; color: var(--apoio); }

    .pilula.ativo { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.pendente { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.inativo { background: #fdecea; color: #922b21; font-weight: bold; }

    .formulario {
      margin-top: 18px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 18px;
      background: #fff;
    }

    .formulario h3 {
      margin: 0 0 4px;
      font-size: 16px;
      color: var(--azul);

  </script>

      <div class="usuario">
        <div class="inicial" id="inicial"></div>
        <div class="usuario-dados">

  <main class="container">
    <button type="button" class="abrir-menu" id="abrirMenu" onclick="alternarMenu()">&#9776; Menu do sistema</button>

    <div class="layout">
      <nav class="menu" id="menu">
        <div class="menu-titulo">Funcionalidades</div>
        <div id="menuItens"></div>
      </nav>

      <section class="conteudo">

    </div>
  </main>

  <script>
    const CONFIG = <?!= JSON.stringify(config).replace(/</g, '\\u003c') ?>;
    const MODULOS = CONFIG.modulos;

    (function configurarAlternanciaTema() {
      var botao = document.getElementById('alternarTema');
      function sincronizar() {
        var escuro = document.body.classList.contains('tema-escuro');
        botao.textContent = escuro ? '☀️' : '🌙';
        botao.title = escuro ? 'Voltar ao modo claro' : 'Ativar modo escuro';
        botao.setAttribute('aria-pressed', escuro ? 'true' : 'false');
      }
      botao.addEventListener('click', function () {
        var escuro = document.body.classList.toggle('tema-escuro');
        try { localStorage.setItem('aeuv-interno-tema', escuro ? 'escuro' : 'claro'); } catch (e) {}
        sincronizar();
      });
      sincronizar();
    })();

    const menuItens = document.getElementById('menuItens');
    const menu = document.getElementById('menu');
    const conteudo = document.getElementById('conteudo');

    let moduloAtual = '';

    /**
     * Bloco de carregamento, igual em todas as telas.
     *
     * A espera e sempre a mesma coisa - o servidor indo ao Drive - entao
     * o texto nao varia por funcionalidade: o nome do modulo ja esta no
     * cabecalho logo acima. Segue a identidade da portaria
     * (docs/sistema/index.html), para a transicao nao mudar de cara.
     *
     * @param {string} [id] Id do elemento, quando a tela precisa
     *   substitui-lo depois que os dados chegam.
     */
    function blocoCarregando(id) {
      return '<div class="carregando" tabindex="-1" role="status" aria-label="Carregando, aguarde"'
        + (id ? ' id="' + escapar(id) + '"' : '') + '>'
        + '<div class="marca">'
        + (CONFIG.logoUrl
          ? '<img src="' + escapar(CONFIG.logoUrl) + '" alt="">'
          : '')
        + '</div>'
        + '<p class="rotulo">Carregando</p>'
        + '<div class="barra"><span></span></div>'
        + '</div>';
    }

    function acompanharFocoCarregamento() {
      let visiveis = new Set();
      let agendado = false;
      function atualizar() {
        agendado = false;
        const atuais = Array.from(conteudo.querySelectorAll('.carregando')).filter(function (bloco) {
          return !bloco.closest('[hidden]') && bloco.getClientRects().length > 0;
        });
        const novo = atuais.find(function (bloco) { return !visiveis.has(bloco); });
        visiveis = new Set(atuais);
        if (!novo) return;
        novo.focus({ preventScroll: true });
        novo.scrollIntoView({
          block: 'center',
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
        });
      }
      const observador = new MutationObserver(function () {
        if (agendado) return;
        agendado = true;
        window.requestAnimationFrame(atualizar);
      });
      observador.observe(conteudo, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
    }

    /**
     * Escapa texto vindo do servidor antes de injetar no HTML.
     */
    function escapar(valor) {
      return String(valor === null || valor === undefined ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function imagemUpload(id, titulo, opcoes) {
      const atual = opcoes.atual || '';
      return '<label class="imagem-upload" for="' + escapar(id) + '">'
        + '<input class="imagem-upload-input" type="file" id="' + escapar(id) + '" accept="' + escapar(opcoes.accept) + '"'
        + ' aria-labelledby="' + escapar(id + 'Titulo') + ' ' + escapar(id + 'Acao') + '"'
        + ' aria-describedby="' + escapar(id + 'Ajuda') + ' ' + escapar(id + 'Status') + '">'
        + '<span class="imagem-upload-preview" id="' + escapar(id + 'Preview') + '">'
        + (atual ? '<img src="' + escapar(atual) + '" alt="' + escapar(opcoes.alt || titulo) + '">'
          : '<span aria-hidden="true">' + escapar(opcoes.placeholder || '📷') + '</span>')
        + '</span><span class="imagem-upload-texto">'
        + '<span class="imagem-upload-titulo" id="' + escapar(id + 'Titulo') + '">' + escapar(titulo) + '</span>'
        + '<strong class="imagem-upload-acao" id="' + escapar(id + 'Acao') + '">' + (atual ? 'Trocar imagem' : 'Selecionar imagem') + '</strong>'
        + '<span class="imagem-upload-ajuda" id="' + escapar(id + 'Ajuda') + '">' + escapar(opcoes.ajuda) + '</span>'
        + '<span class="imagem-upload-status" id="' + escapar(id + 'Status') + '" role="status" aria-live="polite" aria-atomic="true">'
        + (atual ? 'Imagem atual mantida.' : 'Nenhuma imagem selecionada.')
        + '</span></span></label>';
    }

    function inicializarImagemUpload(id, aoErro) {
      const input = document.getElementById(id);
      const preview = document.getElementById(id + 'Preview');
      const acao = document.getElementById(id + 'Acao');
      const status = document.getElementById(id + 'Status');
      if (!input || !preview || !acao || !status) return;
      const previewOriginal = preview.innerHTML;
      const acaoOriginal = acao.textContent;
      const statusOriginal = status.textContent;
      let selecao = 0;

      function atualizar() {
        const versao = ++selecao;
        const arquivo = input.files && input.files[0];
        status.classList.remove('alerta');
        if (!arquivo) {
          preview.innerHTML = previewOriginal;
          acao.textContent = acaoOriginal;
          status.textContent = statusOriginal;
          return;
        }
        acao.textContent = 'Trocar imagem';
        status.textContent = 'Lendo imagem: ' + arquivo.name;
        const leitor = new FileReader();
        leitor.onload = function () {
          if (versao !== selecao) return;
          preview.innerHTML = '<img src="' + escapar(leitor.result) + '" alt="Prévia da imagem selecionada">';
          status.textContent = 'Imagem selecionada: ' + arquivo.name;
        };
        leitor.onerror = leitor.onabort = function () {
          if (versao !== selecao) return;
          preview.innerHTML = previewOriginal;
          const mensagem = 'Não foi possível ler a imagem. Selecione o arquivo novamente.';
          status.textContent = mensagem + ' Arquivo: ' + arquivo.name;
          status.classList.add('alerta');
          if (aoErro) aoErro(mensagem);
        };
        leitor.readAsDataURL(arquivo);
      }

      input.addEventListener('change', atualizar);
      input.addEventListener('cancel', function () {
        if (!input.files || !input.files[0]) atualizar();
      });
    }

    /**
     * Preenche a identificacao do usuario no cabecalho.
     */
    function montarUsuario() {
      const nome = CONFIG.usuario.nome || CONFIG.usuario.email;

      document.getElementById('inicial').textContent = nome.trim().charAt(0).toUpperCase();
      document.getElementById('usuarioNome').textContent = nome;
      document.getElementById('usuarioPerfil').textContent = CONFIG.usuario.perfilNome;
    }

    /**
     * Monta o menu lateral com os modulos liberados para o perfil.
     * Modulos do mesmo grupo entram num submenu que abre e fecha.
     */
    function montarMenu() {
      const blocos = [];

      MODULOS.forEach(function (modulo) {
        const ultimo = blocos[blocos.length - 1];

        if (modulo.grupo && ultimo && ultimo.grupo === modulo.grupo) {
          ultimo.itens.push(modulo);
          return;
        }

        blocos.push({ grupo: modulo.grupo || '', itens: [modulo] });
      });

      menuItens.innerHTML = blocos.map(function (bloco) {
        const itens = bloco.itens.map(botaoMenu).join('');

        if (!bloco.grupo) {
          return itens;
        }

        const grupo = descricaoGrupo(bloco.grupo);

        return '<div class="grupo-menu" data-grupo="' + escapar(bloco.grupo) + '">'
          + '<button type="button" class="titulo-grupo" data-abrir-grupo="' + escapar(bloco.grupo) + '">'
          + '<span class="icone">' + escapar(grupo.icone) + '</span>'
          + '<span class="rotulo">' + escapar(grupo.nome) + '</span>'
          + '<span class="seta">&#9662;</span>'
          + '</button>'
          + '<div class="itens-grupo">' + itens + '</div>'
          + '</div>';
      }).join('');

      menuItens.querySelectorAll('[data-abrir-grupo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          const id = botao.dataset.abrirGrupo;

          gruposAbertos[id] = !gruposAbertos[id];
          aplicarGrupos();
        });
      });

      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirModulo(botao.dataset.modulo);
        });
      });

      aplicarGrupos();
    }

    /**
     * Botao de um modulo no menu.
     */
    function botaoMenu(modulo) {
      const etiqueta = modulo.tipo === 'breve'
        ? '<span class="etiqueta">em breve</span>'
        : (modulo.tipo === 'link' ? '<span class="etiqueta">abre fora</span>' : '');

      return '<button type="button" data-modulo="' + escapar(modulo.id) + '">'
        + '<span class="icone">' + escapar(modulo.icone) + '</span>'
        + '<span class="rotulo">' + escapar(modulo.nome) + '</span>'
        + etiqueta
        + '</button>';
    }

    /**
     * Nome e icone de um grupo. Grupo nao declarado em GRUPOS ainda
     * aparece, usando o proprio id, para nao sumir com os modulos dele.
     */
    function descricaoGrupo(id) {
      const achado = (CONFIG.grupos || []).filter(function (grupo) {
        return grupo.id === id;
      })[0];

      return achado || { id: id, nome: id, icone: '📁' };
    }

    /** Submenus abertos. Comecam fechados para encurtar o menu. */
    let gruposAbertos = {};

    /**
     * Aplica o estado de aberto/fechado dos submenus.
     */
    function aplicarGrupos() {
      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        bloco.classList.toggle('aberto', !!gruposAbertos[bloco.dataset.grupo]);
      });
    }

    /**
     * Marca o item ativo do menu e abre o submenu que o contem, para
     * o item em uso nunca ficar escondido.
     */
    function destacarMenu(id) {
      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.classList.toggle('ativo', botao.dataset.modulo === id);
      });

      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (modulo && modulo.grupo) {
        gruposAbertos[modulo.grupo] = true;
      }

      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        const contem = !!bloco.querySelector('[data-modulo].ativo');

        bloco.classList.toggle('com-ativo', contem);
      });

      aplicarGrupos();
    }

    /**
     * Termo que a proxima tela deve trazer ja preenchido na busca.
     * Consumido uma vez so, por consumirBusca().
     */
    let buscaPendente = '';

    /**
     * Le e limpa o termo pendente. Limpar na leitura evita que ele
     * reapareca quando a tela for aberta de novo pelo menu.
     */
    function consumirBusca() {
      const termo = buscaPendente;

      buscaPendente = '';

      return termo;
    }

    /**
     * Diz se o perfil do usuario tem acesso ao modulo. Os atalhos entre
     * telas so aparecem quando o destino esta no menu dele.
     */
    function moduloDisponivel(id) {
      return MODULOS.some(function (item) { return item.id === id; });
    }

    /**
     * Abre um modulo e registra o endereco na barra do navegador.
     * O segundo argumento pre-preenche a busca da tela, usado para ir da
     * sumula para a nota no controle de punicoes e vice-versa. O terceiro
     * e interno: aprovacao de uso unico do descarte do elenco.
     */
    function abrirModulo(id, busca, aprovacaoDescarte) {
      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (!modulo) {
        return abrirModulo(MODULOS[0].id);
      }

      if (confirmacaoElencoAtual) {
        if (moduloAtual && window.location.hash !== '#' + moduloAtual) window.location.hash = moduloAtual;
        return;
      }

      if (tabelaModuloAtivo_() && (tabelaEstado.ocupado || tabelaEstado.sujo)) {
        if (window.location.hash !== '#' + moduloAtual) window.location.hash = moduloAtual;
        tabelaNavegar_(function () { abrirModulo(id, busca); });
        return;
      }

      if (moduloAtual === 'atas' && !podeSairDaAta()) {
        if (window.location.hash !== '#atas') window.location.hash = 'atas';
        return;
      }

      if (elencoAtual) {
        const formulario = document.getElementById('cadastroPessoasFormArea');
        const descartar = formulario && !formulario.hidden;
        const aprovado = descartar && aprovacaoDescarteElencoValida_(aprovacaoDescarte);
        if (elencoAtual.salvando || (descartar && !aprovado)) {
          if (window.location.hash !== '#' + moduloAtual) window.location.hash = moduloAtual;
          if (elencoAtual.salvando) return;
          const contexto = elencoAtual;
          const moduloOrigem = moduloAtual;
          confirmarDescarteElenco_({
            titulo: 'Sair do elenco?',
            confirmar: 'Descartar e sair'
          }).then(function (confirmado) {
            if (!confirmado || elencoAtual !== contexto || contexto.salvando || moduloAtual !== moduloOrigem) return;
            abrirModulo(id, busca, { tipo: 'descarte-elenco', elenco: contexto, modulo: moduloOrigem, usado: false });
          });
          return;
        }
        importacaoElencoAtual = null;
      }

      if (moduloAtual === 'sumula-campeonato') sumulasRestaurarTabela_();
      moduloAtual = id;

      // Sempre reatribuido: abrir a tela sem termo tem de limpar o que
      // tiver sobrado de uma navegacao anterior.
      buscaPendente = busca || '';
      destacarMenu(id);
      renderizarModulo(modulo);

      if (window.innerWidth <= 900) {
        menu.classList.remove('aberto');
      }

      if (window.location.hash !== '#' + id) {
        window.location.hash = id;
      }
    }

    /**

      document.body.classList.toggle('modulo-tabela', modulo.id === 'jogos-campeonato' || modulo.id === 'sumula-campeonato');

        tabelaFecharFormulario_();

       if (modulo.id === 'times-campeonato') {

       if (modulo.id === 'atletas-campeonato' || modulo.id === 'comissao-campeonato') {

    /**
     * Tela inicial: saudacao e atalhos para os demais modulos.
     */
    function renderizarPainel() {
      const hora = new Date().getHours();
      const saudacao = hora < 12 ? 'Bom dia' : (hora < 18 ? 'Boa tarde' : 'Boa noite');
      const primeiroNome = (CONFIG.usuario.nome || '').split(' ')[0] || CONFIG.usuario.email;

      const atalhos = MODULOS.filter(function (modulo) {
        return modulo.tipo !== 'painel';
      }).map(function (modulo) {
        const corpo = '<span class="icone">' + escapar(modulo.icone) + '</span>'
          + '<h3>' + escapar(modulo.nome) + '</h3>'
          + '<p>' + escapar(modulo.descricao) + '</p>';

        if (modulo.tipo === 'breve') {
          return '<div class="cartao inativo">' + corpo + '</div>';
        }

        return '<button type="button" class="cartao" data-atalho="' + escapar(modulo.id) + '">' + corpo + '</button>';
      }).join('');

      conteudo.innerHTML = '<div class="saudacao">'
        + '<h2>' + saudacao + ', ' + escapar(primeiroNome) + '!</h2>'
        + '<p>Voc&ecirc; est&aacute; na &aacute;rea interna da AEUV. Escolha abaixo uma das '
        + 'funcionalidades liberadas para o seu perfil.</p>'
        + '</div>'
        + '<div class="cartoes">' + atalhos + '</div>';

      conteudo.querySelectorAll('[data-atalho]').forEach(function (cartao) {
        cartao.addEventListener('click', function () {
          abrirModulo(cartao.dataset.atalho);
        });
      });
    }

    /**
     * Quem tem acesso e com qual perfil. So o admin chega ate aqui, e o
     * servidor refaz essa checagem a cada chamada.
     */
    let usuarios = { registros: [], perfis: [], equipes: [], emailAtual: '' };

    /**
     * Busca no servidor a lista de autorizados (somente admin).
     */
    function carregarUsuarios() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          usuarios = dados;
          montarTelaUsuarios();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          document.getElementById('statusUsuarios').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarUsuarios();
    }

    /**
     * Lista dos acessos, com os botoes de conceder, editar e remover.
     * @param {string} recado Mensagem de sucesso da ultima gravacao.
     */
    function montarTelaUsuarios(recado) {
      const linhas = (usuarios.registros || []).map(function (usuario) {
        const eu = usuario.email === usuarios.emailAtual;

        const acoes = eu
          ? '<span class="apoio">voc&ecirc;</span>'
          : '<button type="button" class="botao-apoio" data-editar="' + escapar(usuario.email) + '">Editar</button>'
            + ' <button type="button" class="botao-apoio perigo" data-remover="' + escapar(usuario.email) + '">Remover</button>';

        const perfilTexto = usuario.equipe
          ? escapar(usuario.perfilNome) + ' · ' + escapar(usuario.equipe)
          : escapar(usuario.perfilNome);

        return '<tr>'
          + '<td data-rotulo="Nome">' + escapar(usuario.nome || '-') + '</td>'
          + '<td class="email" data-rotulo="E-mail">' + escapar(usuario.email) + '</td>'
          + '<td data-rotulo="Perfil"><span class="pilula ' + escapar(usuario.perfil) + '">'
          + perfilTexto + '</span></td>'
          + '<td class="acoes-linha" data-rotulo="Ações">' + acoes + '</td>'
          + '</tr>';
      }).join('');

      const sucesso = recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '';

      document.getElementById('areaUsuarios').innerHTML = sucesso
        + '<div class="barra-acoes">'
        + '<button type="button" class="botao-principal" id="novoUsuario">Conceder acesso</button>'
        + '</div>'
        + '<table class="usuarios"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>A&ccedil;&otilde;es</th></tr></thead>'
        + '<tbody>' + linhas + '</tbody></table>'
        + legendaPerfis()
        + '<div class="aviso">As mudan&ccedil;as valem na hora, sem publicar nova vers&atilde;o. '
        + 'Quem estiver com o sistema aberto passa a ver o novo perfil ao recarregar a p&aacute;gina.</div>';

      document.getElementById('novoUsuario').addEventListener('click', function () {
        abrirFormularioUsuario('');
      });

      document.querySelectorAll('[data-editar]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirFormularioUsuario(botao.dataset.editar);
        });
      });

      document.querySelectorAll('[data-remover]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          removerUsuarioDoSistema(botao.dataset.remover);
        });
      });
    }

    /**
     * O que cada perfil enxerga. Fica visivel na tela porque a escolha
     * do perfil so faz sentido sabendo o que ela libera.
     */
    function legendaPerfis() {
      const itens = (usuarios.perfis || []).map(function (perfil) {
        return '<div class="perfil-legenda">'
          + '<span class="pilula ' + escapar(perfil.id) + '">' + escapar(perfil.nome) + '</span>'
          + '<span class="apoio">' + escapar((perfil.modulos || []).join(', ')) + '</span>'
          + '</div>';
      }).join('');

      return '<h3 class="titulo-secao">O que cada perfil enxerga</h3>'
        + '<div class="perfis-legenda">' + itens + '</div>';
    }

    /**
     * Formulario de um acesso. Sem e-mail, abre em branco.
     * @param {string} email
     */
    function abrirFormularioUsuario(email) {
      const registro = (usuarios.registros || []).filter(function (u) {
        return u.email === email;
      })[0] || null;

      const opcoes = (usuarios.perfis || []).map(function (perfil) {
        const escolhido = registro && registro.perfil === perfil.id;

        return '<option value="' + escapar(perfil.id) + '"' + (escolhido ? ' selected' : '') + '>'
          + escapar(perfil.nome) + '</option>';
      }).join('');

      const opcoesEquipe = (usuarios.equipes || []).map(function (nome) {
        const escolhida = registro && registro.equipe === nome;

        return '<option value="' + escapar(nome) + '"' + (escolhida ? ' selected' : '') + '>'
          + escapar(nome) + '</option>';
      }).join('');

      document.getElementById('areaUsuarios').innerHTML = '<div class="formulario">'
        + '<h3>' + (registro ? 'Editar acesso' : 'Conceder acesso') + '</h3>'
        + '<p class="apoio">O e-mail precisa ser a conta Google com que a pessoa vai entrar.</p>'
        + '<div class="grupo"><div class="campos">'
        + campoTexto('uNome', 'Nome', registro ? registro.nome : '', 'largo', '', 'text')
        + campoTexto('uEmail', 'E-mail', registro ? registro.email : '', 'largo', '', 'email')
        + '<div class="campo largo"><label for="uPerfil">Perfil</label>'
        + '<select id="uPerfil">' + opcoes + '</select>'
        + '<span class="dica" id="uDica"></span></div>'
        + '<div class="campo largo" id="campoEquipe"><label for="uEquipe">Equipe</label>'
        + '<select id="uEquipe"><option value="">Selecione</option>' + opcoesEquipe + '</select>'
        + '<span class="dica">Este acesso s&oacute; enxerga o cadastro da equipe escolhida.</span></div>'
        + '</div></div>'
        + '<div class="acoes-formulario">'
        + '<button type="button" class="botao-principal" id="gravarUsuario">'
        + (registro ? 'Salvar' : 'Conceder acesso') + '</button>'
        + '<button type="button" class="botao-apoio" id="voltarUsuarios">Voltar &agrave; lista</button>'
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoUsuario"></span>'
        + '</div></div>';

      const seletor = document.getElementById('uPerfil');

      /** A equipe so aparece para o perfil que enxerga uma equipe so. */
      function ajustarPerfil() {
        const perfil = (usuarios.perfis || []).filter(function (p) {
          return p.id === seletor.value;
        })[0];

        document.getElementById('uDica').textContent = perfil
          ? 'Vai enxergar: ' + (perfil.modulos || []).join(', ')
          : '';

        document.getElementById('campoEquipe').style.display =
          perfil && perfil.exigeEquipe ? '' : 'none';
      }

      seletor.addEventListener('change', ajustarPerfil);
      ajustarPerfil();

      document.getElementById('voltarUsuarios').addEventListener('click', function () {
        montarTelaUsuarios();
      });

      document.getElementById('gravarUsuario').addEventListener('click', function () {
        gravarUsuario(registro ? registro.email : '');
      });
    }

    /**
     * Envia o acesso ao servidor, que e quem valida de verdade.
     * @param {string} emailOriginal Vazio quando e um acesso novo.
     */
    function gravarUsuario(emailOriginal) {
      const botao = document.getElementById('gravarUsuario');
      const aviso = document.getElementById('avisoUsuario');

    /**
     * Envia a equipe ao servidor, que e quem valida de verdade.

      const botao = document.getElementById('gravarEquipe');
      const aviso = document.getElementById('avisoEquipe');

      botao.disabled = true;
      aviso.textContent = 'Gravando...';

      const payload = {
        nomeOriginal: nomeOriginal, nome: document.getElementById('eNome').value,
        escudo: document.getElementById('eEscudoAtual').value
      };
      const enviar = function () { google.script.run
        .withSuccessHandler(function (dados) {
          equipes = dados;
          montarTelaEquipes(dados.recado);
        })
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          aviso.innerHTML = '<span class="alerta">'
            + escapar(erro && erro.message ? erro.message : erro) + '</span>';
        })
        .salvarEquipe(payload); };
      const arquivo = document.getElementById('eEscudo').files[0];
      if (!arquivo) return enviar();
      if (!['image/png', 'image/jpeg', 'image/webp'].includes(arquivo.type) || arquivo.size > 1.5 * 1024 * 1024) {
        botao.disabled = false;
        aviso.textContent = 'Envie um escudo PNG, JPEG ou WebP de até 1,5 MB.';
        return;
      }
      otimizarImagemEscudo_(arquivo).then(function (escudo) {
        payload.escudo = escudo; enviar();
      }).catch(function (erro) {
        botao.disabled = false; aviso.textContent = erro.message;
      });
    }

    function otimizarImagemEscudo_(origem) {
      return new Promise(function (resolve, reject) {
        const imagem = new Image();
        const url = typeof origem === 'string' ? origem : URL.createObjectURL(origem);
        const liberar = function () { if (typeof origem !== 'string') URL.revokeObjectURL(url); };
        imagem.onerror = function () { liberar(); reject(new Error('Nao foi possivel carregar o escudo.')); };
        imagem.onload = function () {
          liberar();
          try {
            const proporcao = Math.min(1, 256 / Math.max(imagem.naturalWidth, imagem.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(imagem.naturalWidth * proporcao));
            canvas.height = Math.max(1, Math.round(imagem.naturalHeight * proporcao));
            const contexto = canvas.getContext('2d');
            if (!contexto) throw new Error('Seu navegador nao permite otimizar imagens.');
            contexto.drawImage(imagem, 0, 0, canvas.width, canvas.height);
            const webp = canvas.toDataURL('image/webp', 0.85);
            const png = canvas.toDataURL('image/png');
            let resultado = webp.length < png.length ? webp : png;
            if (typeof origem === 'string' && origem.length < resultado.length) resultado = origem;
            if (resultado.length > 100 * 1024) throw new Error('O escudo continua acima de 100 KB. Use uma imagem mais simples.');
            resolve(resultado);
          } catch (erro) { reject(erro); }
        };
        imagem.src = url;
      });
    }

    async function otimizarEscudosExistentes_() {
      if (confirmacaoElencoAtual || moduloAtual !== 'equipes' || !equipes.podeEditar) return;
      const dadosOrigem = equipes;
      const botao = document.getElementById('otimizarEscudos');
      const aviso = document.getElementById('avisoOtimizacaoEscudos');
      const confirmado = await confirmarDescarteElenco_({
        titulo: 'Otimizar escudos das equipes?',
        mensagem: 'Os escudos serao redimensionados para ate 256 pixels e comprimidos, mantendo transparencia. '
          + 'Pode haver pequena perda de qualidade. Os originais serao preservados em um backup no Drive. Nomes e vinculos nao mudam.',
        confirmar: 'Otimizar escudos'
      });
      if (!confirmado || moduloAtual !== 'equipes' || equipes !== dadosOrigem || !botao.isConnected) return;
      const area = document.getElementById('areaEquipes');
      area.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
      aviso.textContent = 'Preparando escudos...';
      try {
        const escudos = [];
        for (const equipe of dadosOrigem.equipes) {
          if (!equipe.escudo) continue;
          const escudo = await otimizarImagemEscudo_(equipe.escudo);
          if (escudo.length < equipe.escudo.length) {
            escudos.push({ id: equipe.id, assinatura: equipe.assinaturaEscudo, escudo: escudo });
          }
        }
        if (moduloAtual !== 'equipes' || equipes !== dadosOrigem || !botao.isConnected) return;
        if (!escudos.length) { aviso.textContent = 'Os escudos ja estao otimizados.'; return; }
        aviso.textContent = 'Salvando ' + escudos.length + ' escudo(s)...';
        await new Promise(function (resolve, reject) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).otimizarEscudosEquipes({ escudos: escudos });
        });
        if (moduloAtual === 'equipes' && botao.isConnected) {
          aviso.textContent = 'Escudos otimizados. Atualizando a lista...';
          carregarEquipes();
        }
      } catch (erro) {
        if (botao.isConnected) aviso.textContent = erro.message || String(erro);
      } finally {
        if (botao.isConnected) area.querySelectorAll('button').forEach(function (item) { item.disabled = false; });
      }
    }

          + 'Equipes que ainda tenham cadastros ou acessos não podem ser removidas.',
        cancelar: 'Cancelar',

      }).then(function (confirmado) {

          .removerEquipe(nome);

    /**
     * Gestão do campeonato: primeiro bloco funcional do MVP.

    let campeonatos = { registros: [], status: [], modalidades: [], visibilidades: [], formatos: [], podeEditar: false, podeExcluir: false };

    const tabelaEstado = {

    const sumulasEstado = {

    };

        tabelaOcupada_(false);
        sumulasEstado.dados = dados;
        montarSumulasCampeonato_(recado);
      }).withFailureHandler(function (erro) {
        if (requisicao !== tabelaEstado.requisicao || moduloAtual !== 'sumula-campeonato') return;
        tabelaOcupada_(false);
        if (sumulasEstado.dados) montarSumulasCampeonato_();

    function sumulasJogosFiltrados_(ignorarRodada) {
      return sumulasEstado.dados.jogos.filter(function (jogo) {
        return (!sumulasEstado.campeonato || jogo.campeonatoId === sumulasEstado.campeonato)
          && (!sumulasEstado.equipe || jogo.mandanteId === sumulasEstado.equipe || jogo.visitanteId === sumulasEstado.equipe)
          && (!sumulasEstado.data || jogo.data === sumulasEstado.data)
          && (ignorarRodada || !sumulasEstado.rodada || String(jogo.rodada) === sumulasEstado.rodada);

    function montarSumulasCampeonato_(recado) {

      const rodadas = Array.from(new Set(sumulasJogosFiltrados_(true).map(function (jogo) { return jogo.rodada; })))
        .sort(function (a, b) { return a - b; }).map(function (rodada) { return { id: String(rodada), nome: 'Rodada ' + rodada }; });
      if (!rodadas.some(function (item) { return item.id === sumulasEstado.rodada; })) sumulasEstado.rodada = '';

            + '<div class="apoio tabela-jogo-local">' + escapar(formatarDataBr(jogo.data)) + ' · ' + escapar(jogo.hora) + '<br>' + escapar(jogo.campoNome) + '</div>'

            + '<button type="button" class="botao-apoio" data-sumula-id="' + escapar(jogo.id) + '" data-sumula-campeonato="' + escapar(jogo.campeonatoId) + '" data-sumula-consulta="sim">Consultar</button>'
            + (dados.podeEditar ? '<button type="button" class="botao-apoio" data-sumula-id="' + escapar(jogo.id) + '" data-sumula-campeonato="' + escapar(jogo.campeonatoId) + '" data-sumula-consulta="nao">Editar resultado</button>' : '')

    }

    function tabelaVoltarLista_(recado) {
      if (moduloAtual === 'sumula-campeonato') montarSumulasCampeonato_(recado);
      else montarTabelaCampeonato_(recado);
    }
    try {
      const selecaoTabela = JSON.parse(sessionStorage.getItem('aeuv-tabela-selecao') || '{}');
      if (typeof selecaoTabela.campeonatoId === 'string') tabelaEstado.campeonatoId = selecaoTabela.campeonatoId;
      if (['jogos', 'classificacao', 'grupos', 'campos', 'criterios'].indexOf(selecaoTabela.aba) >= 0) tabelaEstado.aba = selecaoTabela.aba;
    } catch (erro) {
      console.warn('Não foi possível recuperar a seleção anterior da tabela.', erro);
    }

    function tabelaFecharFormulario_() {
      tabelaEstado.sujo = false;
      tabelaEstado.formulario = '';
      tabelaEstado.resultado = null;
      const formulario = document.getElementById('tabelaFormArea');
      if (formulario) formulario.innerHTML = '';
    }

    function tabelaNavegar_(acao) {
      if (tabelaEstado.ocupado || confirmacaoElencoAtual) return;
      if (!tabelaEstado.sujo) {
        tabelaFecharFormulario_();
        acao();
        return;
      }
      const requisicao = tabelaEstado.requisicao, modulo = moduloAtual;
      confirmarDescarteElenco_({ titulo: 'Descartar alterações da tabela?', confirmar: 'Descartar e continuar' }).then(function (confirmado) {
        if (!confirmado || tabelaEstado.ocupado || requisicao !== tabelaEstado.requisicao || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaFecharFormulario_();
        acao();
      });
    }

    function tabelaErro_(erro) {
      const area = document.getElementById('tabelaMensagem');
      if (area) {
        const listaSumulas = moduloAtual === 'sumula-campeonato' && !tabelaEstado.resultado;
        area.innerHTML = '<div class="erro" role="alert">' + escapar(erro && erro.message ? erro.message : erro)
          + (listaSumulas ? '<p>A lista pode estar desatualizada. Atualize antes de consultar ou editar novamente.</p>'
            : '<p>Suas alterações não foram descartadas. Se os dados estiverem desatualizados, use Atualizar e confirme o descarte antes de tentar novamente.</p>')
          + '<button type="button" class="botao-apoio" id="tabelaRecarregarLista">'
          + (tabelaEstado.resultado ? 'Recarregar resultado' : (listaSumulas ? 'Recarregar lista de súmulas' : 'Recarregar lista de campeonatos')) + '</button></div>';
        document.getElementById('tabelaRecarregarLista').onclick = function () {
          const resultadoId = tabelaEstado.resultado && tabelaEstado.resultado.jogo.id;
          tabelaNavegar_(function () {
            if (resultadoId) abrirTabelaResultado_(resultadoId);
            else if (moduloAtual === 'sumula-campeonato') carregarSumulasCampeonato_();
            else carregarTabelaCampeonato_('');
          });
        };
      }
    }

    function tabelaOcupada_(ativo) {
      tabelaEstado.ocupado = ativo;
      const area = document.getElementById('areaTabelaCampeonato');
      if (!area) return;
      const loading = document.getElementById('tabelaLoading');
      if (loading) loading.innerHTML = ativo ? blocoCarregando('statusTabelaCampeonato') : '';
      area.setAttribute('aria-busy', ativo ? 'true' : 'false');
      area.querySelectorAll('button,input,select,textarea').forEach(function (elemento) {
        if (ativo) {
          elemento.dataset.tabelaDisabled = elemento.disabled ? 'sim' : 'nao';
          elemento.disabled = true;
        } else if (elemento.dataset.tabelaDisabled) {
          elemento.disabled = elemento.dataset.tabelaDisabled === 'sim';
          delete elemento.dataset.tabelaDisabled;
        }
      });
    }

    function carregarTabelaCampeonato_(id, resultadoId, recado) {
      if (tabelaEstado.ocupado) return;
      const area = document.getElementById('areaTabelaCampeonato');
      if (!area) return;
      const requisicao = ++tabelaEstado.requisicao, modulo = moduloAtual;
      area.innerHTML = '<div id="tabelaLoading"></div><div id="tabelaMensagem"></div>';
      tabelaOcupada_(true);
      google.script.run.withSuccessHandler(function (dados) {
        if (requisicao !== tabelaEstado.requisicao || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaOcupada_(false);
        if (tabelaEstado.campeonatoId !== dados.campeonatoId) {
          tabelaEstado.fase = ''; tabelaEstado.grupo = ''; tabelaEstado.rodada = '';
        }
        tabelaEstado.dados = dados;
        tabelaEstado.campeonatoId = dados.campeonatoId || '';
        tabelaEstado.sujo = false;
        tabelaEstado.formulario = '';
        tabelaEstado.resultado = null;
        if (modulo === 'sumula-campeonato' && resultadoId) abrirTabelaResultado_(resultadoId);
        else tabelaVoltarLista_(recado);
      }).withFailureHandler(function (erro) {
        if (requisicao !== tabelaEstado.requisicao || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaOcupada_(false);
        if (modulo === 'sumula-campeonato' && sumulasEstado.dados) montarSumulasCampeonato_();
        else if (tabelaEstado.dados) montarTabelaCampeonato_();
        else area.innerHTML = '<div id="tabelaLoading"></div><div id="tabelaMensagem"></div><button type="button" class="botao-apoio" id="tabelaTentar">Tentar novamente</button>';
        const tentar = document.getElementById('tabelaTentar');
        if (tentar) tentar.onclick = function () { carregarTabelaCampeonato_(id, resultadoId); };
        tabelaErro_(erro);
      }).listarTabelaCampeonato(id || '');
    }

    function tabelaExecutar_(metodo, payload, pdf) {
      const salvandoResultado = metodo === 'salvarResultadoJogoCampeonato';
      if (tabelaEstado.ocupado || !tabelaEstado.dados || (!pdf && !(salvandoResultado
        ? tabelaEstado.resultado && tabelaEstado.resultado.podeEditar : tabelaEstado.dados.podeEditar))) return;
      payload.campeonatoId = tabelaEstado.campeonatoId;
      if (!pdf && !Object.prototype.hasOwnProperty.call(payload, 'revisao')) payload.revisao = tabelaEstado.dados.revisao;
      const requisicao = ++tabelaEstado.requisicao;
      const campeonatoId = tabelaEstado.campeonatoId, modulo = moduloAtual;
      document.getElementById('tabelaMensagem').innerHTML = '';
      tabelaOcupada_(true);
      google.script.run.withSuccessHandler(function (dados) {
        if (requisicao !== tabelaEstado.requisicao || campeonatoId !== tabelaEstado.campeonatoId || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaOcupada_(false);
        if (pdf) {
          try {
            if (!dados || dados.mimeType !== 'application/pdf' || !dados.base64) throw new Error('A súmula PDF não foi retornada. Tente novamente.');
            const binario = atob(dados.base64);
            const bytes = new Uint8Array(binario.length);
            for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
            const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
            const link = document.createElement('a');
            link.href = url; link.download = dados.nome || 'sumula.pdf'; link.target = '_self';
            document.body.appendChild(link); link.click(); link.remove();
            window.setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            document.getElementById('tabelaMensagem').innerHTML = '<div class="sucesso" role="status">Súmula PDF gerada com os elencos atuais. Download iniciado.</div>';
            tabelaNavegar_(function () {
              if (modulo === 'sumula-campeonato') carregarSumulasCampeonato_('Súmula PDF gerada. Download iniciado.');
              else carregarTabelaCampeonato_(campeonatoId, '', 'Súmula PDF gerada. Download iniciado.');
            });
          } catch (erro) { tabelaErro_(erro); }
          return;
        }
        tabelaEstado.dados = dados;
        tabelaEstado.campeonatoId = dados.campeonatoId || campeonatoId;
        tabelaEstado.sujo = false;
        tabelaEstado.formulario = '';
        tabelaEstado.resultado = null;
        if (modulo === 'sumula-campeonato') carregarSumulasCampeonato_(dados.recado || 'Alterações salvas.');
        else montarTabelaCampeonato_(dados.recado || 'Alterações salvas.');
      }).withFailureHandler(function (erro) {
        if (requisicao !== tabelaEstado.requisicao || campeonatoId !== tabelaEstado.campeonatoId || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaOcupada_(false);
        tabelaErro_(erro);
      })[metodo](payload);
    }

    function tabelaBotao_(texto, acao, id, perigo) {
      return '<button type="button" class="botao-apoio' + (perigo ? ' perigo' : '') + '" data-tabela-acao="' + acao
        + '" data-id="' + escapar(id || '') + '">' + escapar(texto) + '</button>';
    }

    function tabelaSelect_(id, rotulo, lista, valor, vazio) {
      return '<div class="campo"><label for="' + id + '">' + escapar(rotulo) + '</label><select id="' + id + '">'
        + opcoesSelect(lista, valor, vazio) + '</select></div>';
    }

    function tabelaRodadas_(fase) {
      const quantidade = Math.max(1, Math.min(99, Number(fase && fase.rodadas) || 1));
      return Array.from({ length: quantidade }, function (_, i) { return { id: String(i + 1), nome: 'Rodada ' + (i + 1) }; });
    }

    function tabelaNormalizarFiltros_() {
      const dados = tabelaEstado.dados;
      const fases = dados.fases || [];
      if (!fases.some(function (fase) { return fase.id === tabelaEstado.fase; })) tabelaEstado.fase = '';
      const fase = fases.find(function (item) { return item.id === tabelaEstado.fase; });
      if (!dados.grupos.some(function (grupo) { return grupo.id === tabelaEstado.grupo; }) || (fase && fase.tipo === 'eliminatoria')) tabelaEstado.grupo = '';
      const rodadas = fase ? tabelaRodadas_(fase) : [];
      if (!rodadas.some(function (rodada) { return rodada.id === tabelaEstado.rodada; })) tabelaEstado.rodada = '';
    }

    function montarTabelaCampeonato_(recado) {
      const dados = tabelaEstado.dados;
      const area = document.getElementById('areaTabelaCampeonato');
      if (!area || !dados) return;
      tabelaNormalizarFiltros_();
      try {
        sessionStorage.setItem('aeuv-tabela-selecao', JSON.stringify({ campeonatoId: tabelaEstado.campeonatoId, aba: tabelaEstado.aba }));
      } catch (erro) {
        console.warn('Não foi possível guardar a seleção da tabela neste navegador.', erro);
      }
      const abas = [['jogos', 'Jogos e rodadas'], ['classificacao', 'Classificação'], ['grupos', 'Grupos e fases'], ['campos', 'Campos'], ['criterios', 'Critérios']];
      area.innerHTML = '<div class="tabela-barra">'
        + tabelaSelect_('tabelaCampeonato', 'Campeonato', (dados.campeonatos || []).map(function (item) { return { id: item.id, nome: item.nome + (item.temporada ? ' · ' + item.temporada : '') }; }), tabelaEstado.campeonatoId, dados.campeonatos.length ? '' : 'Nenhum campeonato')
        + tabelaBotao_('Atualizar', 'atualizar') + '</div><div id="tabelaLoading"></div><div id="tabelaMensagem" aria-live="polite">'
        + (recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '') + tabelaAvisosHTML_(dados.avisos || []) + '</div>'
        + (dados.campeonato ? '<div class="tabela-abas" aria-label="Seções da tabela">' + abas.map(function (aba) {
          return '<button type="button" class="botao-apoio" data-tabela-aba="' + aba[0] + '" aria-pressed="' + (tabelaEstado.aba === aba[0] ? 'true' : 'false') + '">' + aba[1] + '</button>';
        }).join('') + '</div><div id="tabelaPainel"></div><div id="tabelaFormArea" class="tabela-form"></div>'
          : '<div class="vazio">Nenhum campeonato cadastrado. Cadastre um campeonato e vincule os times para começar.</div>'
            + (moduloDisponivel('campeonatos') ? tabelaBotao_('Cadastrar campeonato', 'campeonatos') : ''));
      area.querySelector('#tabelaCampeonato').onchange = function (evento) {
        const id = evento.target.value;
        evento.target.value = tabelaEstado.campeonatoId;
        tabelaNavegar_(function () { carregarTabelaCampeonato_(id); });
      };
      area.querySelectorAll('[data-tabela-aba]').forEach(function (botao) {
        botao.onclick = function () { tabelaNavegar_(function () { tabelaEstado.aba = botao.dataset.tabelaAba; montarTabelaCampeonato_(); }); };
      });
      tabelaLigarTecladoAbas_(area, '[data-tabela-aba]');
      const abaSelecionada = area.querySelector('[data-tabela-aba="' + tabelaEstado.aba + '"]');
      if (abaSelecionada) abaSelecionada.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (dados.campeonato) {
        const painel = document.getElementById('tabelaPainel');
        if (tabelaEstado.aba === 'jogos') painel.innerHTML = tabelaJogosHTML_();
        if (tabelaEstado.aba === 'classificacao') painel.innerHTML = tabelaClassificacaoHTML_();
        if (tabelaEstado.aba === 'grupos') painel.innerHTML = tabelaGruposHTML_();
        if (tabelaEstado.aba === 'campos') painel.innerHTML = tabelaCamposHTML_();
        if (tabelaEstado.aba === 'criterios') painel.innerHTML = tabelaCriteriosHTML_();
      }
      tabelaLigarAcoes_(area);
      ['Fase', 'Grupo', 'Rodada'].forEach(function (nome) {
        const select = document.getElementById('tabelaFiltro' + nome);
        if (select) select.onchange = function () {
          const valor = select.value;
          tabelaNavegar_(function () {
            tabelaEstado[nome.toLowerCase()] = valor;
            if (nome === 'Fase') { tabelaEstado.grupo = ''; tabelaEstado.rodada = ''; }
            montarTabelaCampeonato_();
          });
          if (tabelaEstado.sujo) select.value = tabelaEstado[nome.toLowerCase()];
        };
      });
    }

    function tabelaJogosHTML_() {
      const dados = tabelaEstado.dados;
      const faseSelecionada = dados.fases.find(function (fase) { return fase.id === tabelaEstado.fase; });
      let html = '<div class="tabela-barra">'
        + tabelaSelect_('tabelaFiltroFase', 'Fase', dados.fases, tabelaEstado.fase, 'Todas as fases')
        + tabelaSelect_('tabelaFiltroGrupo', 'Grupo', faseSelecionada && faseSelecionada.tipo === 'eliminatoria' ? [] : dados.grupos, tabelaEstado.grupo, 'Todos os grupos')
        + tabelaSelect_('tabelaFiltroRodada', 'Rodada', faseSelecionada ? tabelaRodadas_(faseSelecionada) : [], tabelaEstado.rodada, faseSelecionada ? 'Todas as rodadas' : 'Selecione uma fase')
        + (dados.podeEditar && dados.fases.length && dados.equipes.length >= 2 ? tabelaBotao_('Novo jogo', 'novo-jogo') : '') + '</div>';
      if (!dados.estrutura || !dados.fases.length) html += '<div class="aviso">Configure a forma de disputa e selecione suas fases no cadastro do campeonato. Nenhum jogo é gerado automaticamente.</div>'
        + (moduloDisponivel('campeonatos') ? tabelaBotao_('Configurar campeonato', 'campeonatos') : '');
      if (dados.equipes.length < 2) html += '<div class="aviso">Vincule pelo menos dois times ao campeonato para cadastrar jogos.</div>'
        + (moduloDisponivel('times-campeonato') ? tabelaBotao_('Vincular times', 'times-campeonato') : '');
      if (!dados.campos.some(function (campo) { return campo.ativo; })) html += '<div class="aviso">Nenhum campo ativo. Cadastre um local na aba Campos antes de agendar jogos.</div>' + tabelaBotao_('Ir para Campos', 'ir-campos');
      html += '<p class="apoio">Cadastre os confrontos manualmente após o sorteio externo. Só jogos encerrados da fase de classificação entram na classificação; fases eliminatórias não geram avanço automático.</p>';
      if (faseSelecionada) {
        const rodadaAtual = Number(tabelaEstado.rodada || 0);
        html += '<nav class="tabela-rodada-navegacao" aria-label="Navegação das rodadas">'
          + '<button type="button" class="botao-apoio" data-tabela-acao="rodada-anterior" aria-label="Rodada anterior"' + (rodadaAtual <= 1 ? ' disabled' : '') + '>&lsaquo;</button>'
          + '<strong>' + escapar(rodadaAtual ? 'Rodada ' + rodadaAtual + ' de ' + faseSelecionada.rodadas : 'Todas as rodadas') + '</strong>'
          + '<button type="button" class="botao-apoio" data-tabela-acao="rodada-proxima" aria-label="Próxima rodada"' + (rodadaAtual >= faseSelecionada.rodadas ? ' disabled' : '') + '>&rsaquo;</button></nav>';
      } else {
        html += '<p class="apoio">Selecione uma fase para navegar pelas rodadas com as setas.</p>';
      }
      dados.fases.filter(function (fase) { return !tabelaEstado.fase || fase.id === tabelaEstado.fase; }).forEach(function (fase) {
        html += '<section class="tabela-painel"><h3>' + escapar(fase.nome) + '</h3><p class="apoio">'
          + (fase.tipo === 'eliminatoria' ? 'Eliminatória · cruzamentos manuais' : 'Fase de classificação') + ' · ' + fase.rodadas + ' rodada(s)</p>';
        tabelaRodadas_(fase).filter(function (rodada) { return !tabelaEstado.rodada || rodada.id === tabelaEstado.rodada; }).forEach(function (rodada) {
          const jogos = dados.jogos.filter(function (jogo) {
            return jogo.faseId === fase.id && String(jogo.rodada) === rodada.id && (!tabelaEstado.grupo || jogo.grupoId === tabelaEstado.grupo);
          }).slice().sort(function (a, b) { return (a.data + a.hora).localeCompare(b.data + b.hora); });
          html += '<section class="tabela-rodada"><header class="tabela-rodada-cabecalho"><h4>' + escapar(rodada.nome) + '</h4><span class="apoio">'
            + jogos.length + ' jogo(s)</span></header>' + (jogos.length ? '<div class="tabela-grade">' + jogos.map(tabelaJogoHTML_).join('') + '</div>' : '<div class="vazio">Nenhum jogo cadastrado nesta rodada.</div>') + '</section>';
        });
        html += '</section>';
      });
      return html;
    }

    function tabelaJogoHTML_(jogo) {
      const dados = tabelaEstado.dados;
      function nome(lista, id, vazio) { return (lista.find(function (item) { return item.id === id; }) || {}).nome || vazio; }
      function time(id) {
        const equipe = dados.equipes.find(function (item) { return item.id === id; });
        const equipeNome = equipe ? equipe.nome : 'Time não encontrado';
        const iniciais = equipeNome.trim().split(/\s+/).slice(0, 2).map(function (parte) { return parte.charAt(0); }).join('').toUpperCase();
        return '<div class="tabela-jogo-time"><div class="tabela-jogo-escudo">'
          + (equipe && equipe.escudo
            ? '<img src="' + escapar(equipe.escudo) + '" alt="Escudo de ' + escapar(equipeNome) + '" loading="lazy">'
            : '<span class="tabela-jogo-sem-escudo" aria-hidden="true">' + escapar(iniciais) + '</span>')
          + '</div><span class="tabela-jogo-time-nome">' + escapar(equipeNome) + '</span></div>';
      }
      const encerrado = jogo.status === 'encerrado';
      const placar = (encerrado ? '<span class="tabela-jogo-gols">' + escapar(jogo.golsMandante) + '</span>' : '')
        + '<span class="tabela-jogo-versus">×</span>'
        + (encerrado ? '<span class="tabela-jogo-gols">' + escapar(jogo.golsVisitante) + '</span>' : '');
      const status = { agendado: 'Agendado', encerrado: 'Encerrado', adiado: 'Adiado', cancelado: 'Cancelado' };
      return '<article class="tabela-jogo tabela-jogo-partida"><div class="tabela-jogo-cabecalho">'
        + '<strong class="apoio">' + escapar(nome(dados.grupos, jogo.grupoId, 'Sem grupo')) + '</strong>'
        + '<span class="tabela-jogo-status">' + escapar(status[jogo.status] || jogo.status) + '</span></div>'
        + '<div class="apoio tabela-jogo-local">' + escapar(jogo.data ? formatarDataBr(jogo.data) : 'Data a definir') + (jogo.hora ? ' · ' + escapar(jogo.hora) : '')
        + '<br>' + escapar(nome(dados.campos, jogo.campoId, 'Campo a definir')) + '</div>'
        + '<div class="tabela-jogo-times tabela-jogo-confronto">' + time(jogo.mandanteId)
        + '<div class="tabela-jogo-placar" aria-label="' + escapar(encerrado ? 'Placar: ' + jogo.golsMandante + ' a ' + jogo.golsVisitante : 'Partida sem placar') + '">' + placar + '</div>'
        + time(jogo.visitanteId) + '</div><div class="tabela-acoes">'
        + tabelaBotao_('Súmula PDF', 'pdf', jogo.id)
        + tabelaBotao_(dados.podeEditar ? (jogo.status === 'encerrado' ? 'Editar resultado' : 'Lançar resultado') : 'Ver resultado', 'resultado-jogo', jogo.id)
        + (dados.podeEditar ? tabelaBotao_('Editar', 'editar-jogo', jogo.id) + tabelaBotao_('Remover', 'remover-jogo', jogo.id, true) : '') + '</div></article>';
    }

    function tabelaClassificacaoHTML_() {
      const classificacao = tabelaEstado.dados.classificacao || { geral: [], grupos: [] };
      return '<div class="aviso">Somente jogos encerrados da primeira fase de classificação, com placar final, pontuam. Eliminatórias não entram. Empates após os critérios esportivos, sem decisão da organização, compartilham a posição; não há desempate alfabético nem classificação automática para outra fase. Consulte as decisões na aba Critérios.</div>'
        + tabelaRankingHTML_('Classificação geral', classificacao.geral || [])
        + (classificacao.grupos || []).map(function (grupo) { return tabelaRankingHTML_(grupo.nome, grupo.linhas || []); }).join('')
        + '<p class="apoio">P: pontos · J: jogos · V: vitórias · E: empates · D: derrotas · GP/GC: gols pró/contra · SG: saldo · %: aproveitamento · CA/CV: cartões amarelos/vermelhos de atletas e comissão em jogos encerrados da primeira fase de classificação.</p>';
    }

    function tabelaRankingHTML_(titulo, linhas) {
      return '<section class="tabela-painel"><div class="tabela-scroll" tabindex="0" role="region" aria-label="' + escapar(titulo) + ' — role horizontalmente para ver todas as colunas"><table class="tabela-classificacao"><caption>' + escapar(titulo) + '</caption>'
        + '<thead><tr>' + ['Pos.', 'Equipe', 'P', 'J', 'V', 'E', 'D', 'GP', 'GC', 'SG', '%', 'CA', 'CV'].map(function (coluna) { return '<th scope="col">' + coluna + '</th>'; }).join('') + '</tr></thead><tbody>'
        + (linhas.length ? linhas.map(function (linha) {
          const equipe = tabelaEstado.dados.equipes.find(function (item) { return item.id === linha.equipeId; });

    function tabelaLigarAcoes_(area) {
      area.querySelectorAll('[data-tabela-acao]').forEach(function (botao) {
        botao.onclick = function () {
          if (tabelaEstado.ocupado || confirmacaoElencoAtual) return;
          const acao = botao.dataset.tabelaAcao, id = botao.dataset.id;
          if (acao === 'rodada-anterior' || acao === 'rodada-proxima') {
            const fase = tabelaEstado.dados.fases.find(function (item) { return item.id === tabelaEstado.fase; });
            const destino = Number(tabelaEstado.rodada || 0) + (acao === 'rodada-proxima' ? 1 : -1);
            if (!fase || destino < 1 || destino > fase.rodadas) return;
            return tabelaNavegar_(function () { tabelaEstado.rodada = String(destino); montarTabelaCampeonato_(); });
          }
          if (acao === 'atualizar') return tabelaNavegar_(function () { carregarTabelaCampeonato_(tabelaEstado.campeonatoId); });
          if (acao === 'campeonatos' || acao === 'times-campeonato') return abrirModulo(acao);
          if (acao === 'ir-campos') return tabelaNavegar_(function () { tabelaEstado.aba = 'campos'; montarTabelaCampeonato_(); });
          if (acao === 'pdf') return tabelaExecutar_('gerarSumulaJogoCampeonato', { id: id }, true);
          if (acao === 'resultado-jogo') return tabelaNavegar_(function () { abrirTabelaResultado_(id); });
          if (!tabelaEstado.dados.podeEditar) return;
          if (acao === 'editar-desempate-organizacao' || acao === 'remover-desempate-organizacao') {
            const dados = tabelaEstado.dados;
            const indice = Number(id);
            if (!/^\d+$/.test(id) || !Number.isSafeInteger(indice) || !(dados.empatesOrganizacao || [])[indice]) return;
            return tabelaNavegar_(function () {
              if (dados !== tabelaEstado.dados) return;
              if (acao === 'editar-desempate-organizacao') abrirTabelaDesempateOrganizacao_(indice);
              else removerTabelaDesempateOrganizacao_(indice);
            });
          }
          if (acao === 'remover-jogo' || acao === 'remover-campo') {
            return tabelaNavegar_(function () {
              confirmarDescarteElenco_({
                titulo: acao === 'remover-jogo' ? 'Remover este jogo?' : 'Remover este campo global?',
                mensagem: acao === 'remover-jogo' ? 'O jogo será excluído e a classificação recalculada. Esta ação não pode ser desfeita.' : 'Este local será removido de todos os campeonatos. Campos utilizados em jogos não podem ser removidos.',
                confirmar: 'Remover', cancelar: 'Cancelar'
              }).then(function (confirmado) {
                if (confirmado && moduloAtual === 'jogos-campeonato' && !tabelaEstado.ocupado) tabelaExecutar_(acao === 'remover-jogo' ? 'removerJogoCampeonato' : 'removerCampoCampeonato', { id: id });
              });
            });
          }
          tabelaNavegar_(function () {
            if (acao === 'novo-jogo' || acao === 'editar-jogo') abrirTabelaJogo_(id);
            if (acao === 'novo-campo' || acao === 'editar-campo') abrirTabelaCampo_(id);
            if (acao === 'editar-grupos') abrirTabelaGrupos_();
            if (acao === 'editar-criterios') abrirTabelaCriterios_();
          });
        };
      });
    }

    function tabelaMontarFormulario_(titulo, html, salvar) {
      tabelaEstado.formulario = titulo;
      tabelaEstado.sujo = false;
      const area = document.getElementById('tabelaFormArea');
      area.innerHTML = '<form id="tabelaFormulario" class="formulario tabela-painel"><h3>' + escapar(titulo) + '</h3>'
        + html + '<div class="tabela-acoes"><button type="submit" class="botao-principal">Salvar</button>'
        + '<button type="button" class="botao-apoio" id="tabelaCancelar">Cancelar</button></div><div id="tabelaFormErro" role="alert"></div></form>';
      const form = document.getElementById('tabelaFormulario');
      form.oninput = form.onchange = function () { tabelaEstado.sujo = true; };
      form.onsubmit = function (evento) {
        evento.preventDefault();
        if (tabelaEstado.ocupado || !form.reportValidity()) return;
        document.getElementById('tabelaFormErro').innerHTML = '';
        try { salvar(); } catch (erro) { document.getElementById('tabelaFormErro').innerHTML = '<div class="erro">' + escapar(erro.message) + '</div>'; }
      };
      document.getElementById('tabelaCancelar').onclick = function () {
        tabelaNavegar_(function () { area.innerHTML = ''; });
      };
      area.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const primeiro = form.querySelector('input,select');
      if (primeiro) primeiro.focus({ preventScroll: true });
    }

    function tabelaLigarTecladoAbas_(area, seletor) {
      const abas = Array.from(area.querySelectorAll(seletor));
      abas.forEach(function (aba, indice) {
        aba.onkeydown = function (evento) {
          if (tabelaEstado.ocupado || confirmacaoElencoAtual) return;
          let destino;
          if (evento.key === 'ArrowRight') destino = (indice + 1) % abas.length;
          else if (evento.key === 'ArrowLeft') destino = (indice + abas.length - 1) % abas.length;
          else if (evento.key === 'Home') destino = 0;
          else if (evento.key === 'End') destino = abas.length - 1;
          else return;
          evento.preventDefault();
          abas[destino].focus({ preventScroll: true });
          abas[destino].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        };
      });
    }

    function abrirTabelaJogo_(id) {
      const dados = tabelaEstado.dados;
      const jogo = dados.jogos.find(function (item) { return item.id === id; }) || {
        id: '', faseId: tabelaEstado.fase || (dados.fases[0] || {}).id || '', grupoId: tabelaEstado.grupo,
        rodada: tabelaEstado.rodada || 1, mandanteId: '', visitanteId: '', campoId: '', data: '', hora: '', status: 'agendado'
      };
      if (!dados.fases.length || dados.equipes.length < 2) return;
      tabelaMontarFormulario_(id ? 'Editar jogo' : 'Novo jogo',
        '<div class="campos">' + tabelaSelect_('tjFase', 'Fase', dados.fases, jogo.faseId, '')
        + tabelaSelect_('tjGrupo', 'Grupo', dados.grupos, jogo.grupoId, 'Selecione o grupo')
        + tabelaSelect_('tjRodada', 'Rodada', [], '', '')
        + tabelaSelect_('tjMandante', 'Mandante', [], '', 'Selecione')
        + tabelaSelect_('tjVisitante', 'Visitante', [], '', 'Selecione')
        + tabelaSelect_('tjCampo', 'Campo', dados.campos.filter(function (campo) { return campo.ativo || campo.id === jogo.campoId; }).map(function (campo) {
          return { id: campo.id, nome: campo.nome + (campo.ativo ? '' : ' (inativo)') };
        }), jogo.campoId, 'Selecione o campo')
        + campoTexto('tjData', 'Data', jogo.data, '', '', 'date') + campoTexto('tjHora', 'Horário', jogo.hora, '', '', 'time')
        + tabelaSelect_('tjStatus', 'Status', jogo.status === 'encerrado' ? [{ id: 'encerrado', nome: 'Encerrado — altere o placar em Editar resultado' }]
          : [{ id: 'agendado', nome: 'Agendado' }, { id: 'adiado', nome: 'Adiado' }, { id: 'cancelado', nome: 'Cancelado' }], jogo.status, '') + '</div>'
        + '<p class="apoio" id="tjAjudaTimes"></p><p class="apoio">Esta tela altera somente o agendamento. Use Lançar resultado para finalizar a partida. Grupos limitam os participantes na classificação; eliminatórias são preenchidas manualmente.</p>',
        function () {
          const fase = dados.fases.find(function (item) { return item.id === valor('tjFase'); });
          const grupoId = jogo.status === 'encerrado' ? jogo.grupoId : (fase.tipo === 'classificacao' && dados.grupos.length ? valor('tjGrupo') : '');
          if (jogo.status !== 'encerrado') {
            if (fase.tipo === 'classificacao' && dados.grupos.length && !grupoId) throw new Error('Selecione um grupo para a fase de classificação.');
            if (!valor('tjMandante') || !valor('tjVisitante')) throw new Error('Selecione os dois times.');
            if (valor('tjMandante') === valor('tjVisitante')) throw new Error('Mandante e visitante devem ser diferentes.');
          }
          if (!valor('tjCampo') || !valor('tjData').trim() || !valor('tjHora').trim()) throw new Error('Informe o campo, a data e o horário do jogo.');
          tabelaExecutar_('salvarJogoCampeonato', {
            id: jogo.id, faseId: jogo.status === 'encerrado' ? jogo.faseId : fase.id, grupoId: grupoId, rodada: Number(valor('tjRodada')),
            mandanteId: jogo.status === 'encerrado' ? jogo.mandanteId : valor('tjMandante'), visitanteId: jogo.status === 'encerrado' ? jogo.visitanteId : valor('tjVisitante'), campoId: valor('tjCampo'),
            data: lerDataFormulario_('tjData'), hora: lerHorarioFormulario_('tjHora'), status: jogo.status === 'encerrado' ? 'encerrado' : valor('tjStatus')
          });
        });
      function valor(campo) { return document.getElementById(campo).value; }
      ['tjCampo', 'tjData', 'tjHora'].forEach(function (campo) { document.getElementById(campo).required = true; });
      function atualizarTimes() {
        const fase = dados.fases.find(function (item) { return item.id === valor('tjFase'); });
        const usaGrupo = fase.tipo === 'classificacao' && dados.grupos.length > 0;
        const selectGrupo = document.getElementById('tjGrupo');
        selectGrupo.parentElement.hidden = !usaGrupo;
        selectGrupo.disabled = !usaGrupo;
        selectGrupo.required = usaGrupo;
        const grupo = dados.grupos.find(function (item) { return item.id === selectGrupo.value; });
        const equipes = jogo.status === 'encerrado' ? dados.equipes.slice()
          : (usaGrupo ? dados.equipes.filter(function (equipe) { return grupo && grupo.equipeIds.indexOf(equipe.id) >= 0; }) : dados.equipes);
        if (jogo.status === 'encerrado') [jogo.mandanteId, jogo.visitanteId].forEach(function (equipeId) {
          if (!equipes.some(function (equipe) { return equipe.id === equipeId; })) equipes.push({ id: equipeId, nome: 'Equipe anterior (' + equipeId + ')' });
        });
        ['tjMandante', 'tjVisitante'].forEach(function (campo) {
          const select = document.getElementById(campo);
          const atual = select.value;
          select.innerHTML = opcoesSelect(equipes, atual, 'Selecione');
          select.required = true;
        });
        document.getElementById('tjAjudaTimes').textContent = usaGrupo && equipes.length < 2
          ? 'Selecione um grupo com pelo menos dois times. Distribua os times na aba Grupos e fases antes de cadastrar este confronto.' : '';
      }
      function atualizarFase() {
        const fase = dados.fases.find(function (item) { return item.id === valor('tjFase'); });
        const select = document.getElementById('tjRodada'), atual = select.value;
        select.innerHTML = opcoesSelect(tabelaRodadas_(fase), atual, '');
        atualizarTimes();
      }
      atualizarFase();
      document.getElementById('tjRodada').value = String(jogo.rodada);
      document.getElementById('tjMandante').value = jogo.mandanteId;
      document.getElementById('tjVisitante').value = jogo.visitanteId;
      document.getElementById('tjFase').addEventListener('change', atualizarFase);
      document.getElementById('tjGrupo').addEventListener('change', atualizarTimes);
      if (jogo.status === 'encerrado') {
        ['tjFase', 'tjGrupo', 'tjMandante', 'tjVisitante', 'tjStatus'].forEach(function (campo) { document.getElementById(campo).disabled = true; });
      }
    }

    function abrirTabelaResultado_(id) {
      if (tabelaEstado.ocupado || !tabelaEstado.dados) return;
      const area = document.getElementById('areaTabelaCampeonato');
      if (!area) return;
      const campeonatoId = tabelaEstado.campeonatoId, requisicao = ++tabelaEstado.requisicao, modulo = moduloAtual;
      const sumula = modulo === 'sumula-campeonato', consulta = sumula && sumulasEstado.consulta;
      tabelaEstado.resultado = null;
      tabelaEstado.formulario = 'Resultado da partida';
      area.innerHTML = '<div class="tabela-barra">'
        + (sumula ? '' : tabelaSelect_('tabelaCampeonato', 'Campeonato', tabelaEstado.dados.campeonatos, campeonatoId, ''))
        + '<button type="button" class="botao-apoio" id="trVoltar">' + (sumula ? 'Voltar para as súmulas' : 'Voltar para a tabela') + '</button>'
        + '<button type="button" class="botao-apoio" id="trRecarregar">Atualizar resultado</button></div>'
        + '<div id="tabelaLoading"></div><div id="tabelaMensagem" aria-live="polite"></div><div id="tabelaResultadoArea" class="tabela-form"></div>';
      document.getElementById('trVoltar').onclick = function () { tabelaNavegar_(function () { tabelaVoltarLista_(); }); };
      document.getElementById('trRecarregar').onclick = function () { tabelaNavegar_(function () { abrirTabelaResultado_(id); }); };
      if (!sumula) document.getElementById('tabelaCampeonato').onchange = function (evento) {
        const selecionado = evento.target.value;
        evento.target.value = campeonatoId;
        tabelaNavegar_(function () { carregarTabelaCampeonato_(selecionado); });
      };
      tabelaOcupada_(true);
      google.script.run.withSuccessHandler(function (dados) {
        if (requisicao !== tabelaEstado.requisicao || campeonatoId !== tabelaEstado.campeonatoId || moduloAtual !== modulo || !tabelaModuloAtivo_()) return;
        tabelaOcupada_(false);

        + escapar(draft.campeonato.nome) + (draft.campeonato.temporada ? ' · ' + escapar(draft.campeonato.temporada) : '')

        + '<div class="campo" id="trPenVisitante"><label for="trPenGolsVisitante">Pênaltis · ' + escapar(equipes[1].nome) + '</label>'

        + '<p class="apoio">Atletas: três amarelos geram um jogo de suspensão (o excedente é mantido); vermelho direto e expulsão por segundo amarelo geram um jogo cada. Vermelho por segundo amarelo exige dois CA e não soma esses cartões ao acumulado. Suspensões só são cumpridas em jogo finalizado com participação explicitamente não marcada. Cartões da comissão não geram suspensão automática.</p>'

          return '<button type="button" class="botao-apoio" data-tr-aba="' + indice + '" aria-pressed="' + (indice === 0) + '" aria-controls="trEquipe' + indice + '">' + escapar(equipe.nome) + '</button>';
        }).join('') + '</div>' + equipes.map(tabelaResultadoEquipeHTML_).join('')
        + '<div class="campo cheio"><label for="trObservacoes">Observações (até 2.000 caracteres)</label><textarea id="trObservacoes" maxlength="2000" rows="4" data-tr-resultado="observacoes">'
        + escapar(resultado.observacoes || '') + '</textarea></div><div class="tabela-acoes">'

      const form = document.getElementById('tabelaResultadoFormulario');

            if (pessoa.vermelhoTipo === 'segundo-amarelo' && Number(pessoa.amarelos) !== 2) pessoa.vermelhoTipo = '';
            tipoVermelho.value = pessoa.vermelhoTipo || '';
            tipoVermelho.hidden = !pessoa.vermelho;
            tipoVermelho.required = !!pessoa.vermelho;

        else return;
        tabelaEstado.sujo = true;
        tabelaResultadoResumo_();

      form.querySelectorAll('[data-tr-aba]').forEach(function (botao) {

    function tabelaResultadoParticipacoes_(indice, marcou) {
      const draft = tabelaEstado.resultado;
      if (tabelaEstado.ocupado || !draft || !draft.podeEditar) return;
      ['atletas', 'comissao'].forEach(function (tipo) {
        draft.equipes[indice][tipo].forEach(function (pessoa, posicao) {
          if (tipo === 'atletas' && pessoa.suspensaoAutomatica) {
            pessoa.participou = false;
            document.getElementById('tr-' + indice + '-' + tipo + '-' + posicao + '-participou').checked = false;
            return;
          }
          pessoa.participou = marcou;
          document.getElementById('tr-' + indice + '-' + tipo + '-' + posicao + '-participou').checked = marcou;
        });
      });
      tabelaEstado.sujo = true;
      tabelaResultadoResumo_();
