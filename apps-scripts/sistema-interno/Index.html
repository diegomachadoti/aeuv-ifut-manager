    /* ---------- Submenu ---------- */

    /* ---------- Carregamento ----------
       Mesma identidade da portaria (docs/sistema/index.html): anel girando
       ao redor da logomarca, reticências animadas e barra indeterminada.
       Toda tela usa este bloco, com o mesmo texto: o tempo depende do
       Drive, não da funcionalidade, então a mensagem não precisa variar. */
    .carregando {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 38px 24px 44px;
      color: var(--apoio);
    }

    .carregando .marca {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
    }

    .carregando .marca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--borda);
      border-top-color: var(--dourado);
      border-right-color: var(--dourado);
      animation: girar 1.1s linear infinite;
    }

    .carregando .marca img {
      width: 66px;
      height: 66px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    .carregando .rotulo {
      margin: 16px 0 0;
      font-size: 14px;
      color: var(--texto);
    }

    .carregando .rotulo::after {
      content: '';
      animation: reticencias 1.4s steps(4, end) infinite;
    }

    .carregando .barra {
      position: relative;
      width: 190px;
      height: 5px;
      margin-top: 16px;
      border-radius: 4px;
      background: var(--borda);
      overflow: hidden;
    }

    .carregando .barra span {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffc45c, var(--dourado));
      animation: correr 1.3s ease-in-out infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    @keyframes correr {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes reticencias {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* Quem pediu menos movimento vê o mesmo bloco, parado. */
    @media (prefers-reduced-motion: reduce) {
      .carregando .marca::before,
      .carregando .marca img,
      .carregando .barra span,
      .carregando .rotulo::after { animation: none; }

      .carregando .barra span { width: 100%; left: 0; }
    }

    /* ---------- Controle de punicoes ---------- */

    .resumo {

    .filtros {

    .filtros input, .filtros select {

    .filtros input { flex: 2 1 240px; }

    .barra-acoes {

    .botao-apoio {

    .botao-apoio.destaque {

    }

    .botao-apoio.destaque:hover { background: #17325c; }

    .tabela-rolagem { overflow-x: auto; }

    /* Larguras fixas: a tabela cabe na tela sem empurrar as colunas curtas. */
    .punicoes { table-layout: fixed; font-size: 13px; }
    .punicoes th, .punicoes td { padding: 9px 10px; }

    .punicoes th:nth-child(1) { width: 11%; }
    .punicoes th:nth-child(2) { width: 17%; }
    .punicoes th:nth-child(3) { width: 11%; }
    .punicoes th:nth-child(4) { width: 15%; }
    .punicoes th:nth-child(5) { width: 10%; }
    .punicoes th:nth-child(6) { width: 12%; }
    .punicoes th:nth-child(7) { width: 11%; }
    .punicoes th:nth-child(8) { width: 13%; }

    .punicoes td:nth-child(1),
    .punicoes td:nth-child(5) { white-space: nowrap; }

    /* O protocolo da súmula é longo e a coluna da nota é estreita: o
       atalho mostra um rótulo curto, com o protocolo no title. */
    .origem-sumula { white-space: normal; margin-top: 2px; }

    .punido-nome { font-weight: bold; color: var(--azul); }
    .punido-dado { font-size: 12px; color: var(--apoio); }

    .pilula.cumprir { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.cumprida { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.alerta { background: #fdecea; color: #922b21; font-weight: bold; }
    .pilula.definida { background: #e4f4e9; color: #1e8449; }

    /* ----- Solicitações de inscrição ----- */

    .solicitacoes { table-layout: fixed; font-size: 13px; }
    .solicitacoes th, .solicitacoes td { padding: 9px 10px; }

    .solicitacoes th:nth-child(1) { width: 15%; }
    .solicitacoes th:nth-child(2) { width: 15%; }
    .solicitacoes th:nth-child(3) { width: 14%; }
    .solicitacoes th:nth-child(4) { width: 13%; }

    /* ----- Notas oficiais ----- */

    /* Cinco colunas: número e data são curtos, a partida e os punidos

    .notas th:nth-child(1) { width: 12%; }
    .notas th:nth-child(2) { width: 16%; }

    /* A coluna de punidos traz nome e equipe: precisa quebrar linha, ao

    .notas .contagem { flex-direction: column; gap: 2px; }
    .notas .contagem span { white-space: normal; }

    /* ----- Regulamentos ----- */

    .regulamentos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .regulamento {
      border: 1px solid var(--borda);

      background: #fff;
      padding: 16px 18px;
      display: flex;

    }

    .regulamento-titulo { display: flex; align-items: flex-start; gap: 10px; }
    .regulamento-titulo .icone { font-size: 22px; line-height: 1.2; }
    .regulamento-titulo h3 { margin: 0; font-size: 15px; color: var(--azul); }
    .regulamento .barra-acoes { margin-top: auto; }

    .protocolo { font-weight: bold; color: var(--azul); font-family: monospace; }

    .pilula.aguardando { background: #fff2d8; color: #8a5a00; font-weight: bold; }
    .pilula.processada { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.analisada { background: #e4f4e9; color: #1e8449; font-weight: bold; }
    .pilula.falha { background: #fdecea; color: #922b21; font-weight: bold; }

    /* Contagem por ação, exibida na coluna de registros. */
    .contagem { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
    .contagem span { white-space: nowrap; color: var(--apoio); }
    .contagem strong { color: var(--texto); }

    .detalhe { background: var(--fundo); }
    .detalhe > td { padding: 0 10px 14px; }

    .detalhe-caixa {

    /* Relato da arbitragem. Texto corrido, lido de ponta a ponta pela

    .relato {

    .pessoa-nome { font-weight: bold; color: var(--azul); }

    /* Atalho de uma tela para a outra (súmula ⇄ nota no controle). */

<body>
  <script>
    // Aplica o tema salvo antes de desenhar a tela, evitando "piscar" o claro.
    try { if (localStorage.getItem('aeuv-interno-tema') === 'escuro') document.body.classList.add('tema-escuro'); } catch (e) {}
  </script>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="brasao">
        <img src="<?!= config.logoUrl ?>" alt="Logomarca da AEUV">
      </div>
      <div class="topo-identidade">
        <h1><?= config.associacao ?></h1>
        <p>Sistema Interno &middot; &Aacute;rea restrita da associa&ccedil;&atilde;o</p>
      </div>
      <button type="button" class="alternar-tema" id="alternarTema" title="Ativar modo escuro" aria-label="Alternar tema claro/escuro">🌙</button>
      <div class="usuario">
        <div class="inicial" id="inicial"></div>
        <div class="usuario-dados">
          <div class="usuario-nome" id="usuarioNome"></div>
          <div class="usuario-perfil" id="usuarioPerfil"></div>
        </div>
        <a class="sair" href="https://accounts.google.com/Logout" target="_blank" rel="noopener">Sair</a>
      </div>
    </div>
  </header>

  <main class="container">
    <button type="button" class="abrir-menu" id="abrirMenu" onclick="alternarMenu()">&#9776; Menu do sistema</button>

    <div class="layout">
      <nav class="menu" id="menu">
        <div class="menu-titulo">Funcionalidades</div>
        <div id="menuItens"></div>
      </nav>

      <section class="conteudo">
        <div class="card" id="conteudo"></div>
      </section>
    </div>
  </main>

  <script>
    const CONFIG = <?!= JSON.stringify(config) ?>;
    const MODULOS = CONFIG.modulos;

    (function configurarAlternanciaTema() {
      var botao = document.getElementById('alternarTema');
      function sincronizar() {
        var escuro = document.body.classList.contains('tema-escuro');
        botao.textContent = escuro ? '☀️' : '🌙';
        botao.title = escuro ? 'Voltar ao modo claro' : 'Ativar modo escuro';
        botao.setAttribute('aria-pressed', escuro ? 'true' : 'false');
      }
      botao.addEventListener('click', function () {
        var escuro = document.body.classList.toggle('tema-escuro');
        try { localStorage.setItem('aeuv-interno-tema', escuro ? 'escuro' : 'claro'); } catch (e) {}
        sincronizar();
      });
      sincronizar();
    })();

    const menuItens = document.getElementById('menuItens');
    const menu = document.getElementById('menu');
    const conteudo = document.getElementById('conteudo');

    let moduloAtual = '';

    /**
     * Bloco de carregamento, igual em todas as telas.
     *
     * A espera e sempre a mesma coisa - o servidor indo ao Drive - entao
     * o texto nao varia por funcionalidade: o nome do modulo ja esta no
     * cabecalho logo acima. Segue a identidade da portaria
     * (docs/sistema/index.html), para a transicao nao mudar de cara.
     *
     * @param {string} [id] Id do elemento, quando a tela precisa
     *   substitui-lo depois que os dados chegam.
     */
    function blocoCarregando(id) {
      return '<div class="carregando"' + (id ? ' id="' + escapar(id) + '"' : '') + '>'
        + '<div class="marca">'
        + (CONFIG.logoUrl
          ? '<img src="' + escapar(CONFIG.logoUrl) + '" alt="">'
          : '')
        + '</div>'
        + '<p class="rotulo">Carregando</p>'
        + '<div class="barra"><span></span></div>'
        + '</div>';
    }

    /**
     * Escapa texto vindo do servidor antes de injetar no HTML.
     */
    function escapar(valor) {
      return String(valor === null || valor === undefined ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * Preenche a identificacao do usuario no cabecalho.
     */
    function montarUsuario() {
      const nome = CONFIG.usuario.nome || CONFIG.usuario.email;

      document.getElementById('inicial').textContent = nome.trim().charAt(0).toUpperCase();
      document.getElementById('usuarioNome').textContent = nome;
      document.getElementById('usuarioPerfil').textContent = CONFIG.usuario.perfilNome;
    }

    /**
     * Monta o menu lateral com os modulos liberados para o perfil.
     * Modulos do mesmo grupo entram num submenu que abre e fecha.
     */
    function montarMenu() {
      const blocos = [];

      MODULOS.forEach(function (modulo) {
        const ultimo = blocos[blocos.length - 1];

        if (modulo.grupo && ultimo && ultimo.grupo === modulo.grupo) {
          ultimo.itens.push(modulo);
          return;
        }

        blocos.push({ grupo: modulo.grupo || '', itens: [modulo] });
      });

      menuItens.innerHTML = blocos.map(function (bloco) {
        const itens = bloco.itens.map(botaoMenu).join('');

        if (!bloco.grupo) {
          return itens;
        }

        const grupo = descricaoGrupo(bloco.grupo);

        return '<div class="grupo-menu" data-grupo="' + escapar(bloco.grupo) + '">'
          + '<button type="button" class="titulo-grupo" data-abrir-grupo="' + escapar(bloco.grupo) + '">'
          + '<span class="icone">' + escapar(grupo.icone) + '</span>'
          + '<span class="rotulo">' + escapar(grupo.nome) + '</span>'
          + '<span class="seta">&#9662;</span>'
          + '</button>'
          + '<div class="itens-grupo">' + itens + '</div>'
          + '</div>';
      }).join('');

      menuItens.querySelectorAll('[data-abrir-grupo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          const id = botao.dataset.abrirGrupo;

          gruposAbertos[id] = !gruposAbertos[id];
          aplicarGrupos();
        });
      });

      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirModulo(botao.dataset.modulo);
        });
      });

      aplicarGrupos();
    }

    /**
     * Botao de um modulo no menu.
     */
    function botaoMenu(modulo) {
      const etiqueta = modulo.tipo === 'breve'
        ? '<span class="etiqueta">em breve</span>'
        : (modulo.tipo === 'link' ? '<span class="etiqueta">abre fora</span>' : '');

      return '<button type="button" data-modulo="' + escapar(modulo.id) + '">'
        + '<span class="icone">' + escapar(modulo.icone) + '</span>'
        + '<span class="rotulo">' + escapar(modulo.nome) + '</span>'
        + etiqueta
        + '</button>';
    }

    /**
     * Nome e icone de um grupo. Grupo nao declarado em GRUPOS ainda
     * aparece, usando o proprio id, para nao sumir com os modulos dele.
     */
    function descricaoGrupo(id) {
      const achado = (CONFIG.grupos || []).filter(function (grupo) {
        return grupo.id === id;
      })[0];

      return achado || { id: id, nome: id, icone: '📁' };
    }

    /** Submenus abertos. Comecam fechados para encurtar o menu. */
    let gruposAbertos = {};

    /**
     * Aplica o estado de aberto/fechado dos submenus.
     */
    function aplicarGrupos() {
      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        bloco.classList.toggle('aberto', !!gruposAbertos[bloco.dataset.grupo]);
      });
    }

    /**
     * Marca o item ativo do menu e abre o submenu que o contem, para
     * o item em uso nunca ficar escondido.
     */
    function destacarMenu(id) {
      menuItens.querySelectorAll('[data-modulo]').forEach(function (botao) {
        botao.classList.toggle('ativo', botao.dataset.modulo === id);
      });

      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (modulo && modulo.grupo) {
        gruposAbertos[modulo.grupo] = true;
      }

      menuItens.querySelectorAll('.grupo-menu').forEach(function (bloco) {
        const contem = !!bloco.querySelector('[data-modulo].ativo');

        bloco.classList.toggle('com-ativo', contem);
      });

      aplicarGrupos();
    }

    /**
     * Termo que a proxima tela deve trazer ja preenchido na busca.
     * Consumido uma vez so, por consumirBusca().
     */
    let buscaPendente = '';

    /**
     * Le e limpa o termo pendente. Limpar na leitura evita que ele
     * reapareca quando a tela for aberta de novo pelo menu.
     */
    function consumirBusca() {
      const termo = buscaPendente;

      buscaPendente = '';

      return termo;
    }

    /**
     * Diz se o perfil do usuario tem acesso ao modulo. Os atalhos entre
     * telas so aparecem quando o destino esta no menu dele.
     */
    function moduloDisponivel(id) {
      return MODULOS.some(function (item) { return item.id === id; });
    }

    /**
     * Abre um modulo e registra o endereco na barra do navegador.
     * O segundo argumento pre-preenche a busca da tela, usado para ir da
     * sumula para a nota no controle de punicoes e vice-versa.
     */
    function abrirModulo(id, busca) {
      const modulo = MODULOS.filter(function (item) { return item.id === id; })[0];

      if (!modulo) {
        return abrirModulo(MODULOS[0].id);
      }

      if (moduloAtual === 'atas' && !podeSairDaAta()) {
        if (window.location.hash !== '#atas') window.location.hash = 'atas';
        return;
      }

      moduloAtual = id;

      // Sempre reatribuido: abrir a tela sem termo tem de limpar o que
      // tiver sobrado de uma navegacao anterior.
      buscaPendente = busca || '';
      destacarMenu(id);
      renderizarModulo(modulo);

      if (window.innerWidth <= 900) {
        menu.classList.remove('aberto');
      }

      if (window.location.hash !== '#' + id) {
        window.location.hash = id;
      }
    }

    /**
     * Desenha a tela de um modulo. Novas funcionalidades entram aqui.
     */
    function renderizarModulo(modulo) {
      const cabecalho = '<div class="cabecalho-modulo">'
        + '<span class="icone">' + escapar(modulo.icone) + '</span>'
        + '<h2>' + escapar(modulo.nome) + '</h2>'
        + '</div><p class="apoio">' + escapar(modulo.descricao) + '</p>';

      if (modulo.tipo === 'painel') {
        return renderizarPainel();
      }

      if (modulo.tipo === 'link') {
        conteudo.innerHTML = cabecalho
          + '<p class="apoio" style="margin-top:14px;">O formul&aacute;rio abre em uma nova aba, '
          + 'no endere&ccedil;o oficial da associa&ccedil;&atilde;o.</p>'
          + '<a class="botao-link" href="' + escapar(modulo.url) + '" target="_blank" rel="noopener">Abrir '
          + escapar(modulo.nome) + '</a>';
        return;
      }

      if (modulo.tipo === 'usuarios') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaUsuarios">' + blocoCarregando('statusUsuarios') + '</div>';
        carregarUsuarios();
        return;
      }

      if (modulo.tipo === 'equipes') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaEquipes">' + blocoCarregando('statusEquipes') + '</div>';
        carregarEquipes();
        return;
      }

      if (modulo.tipo === 'punicoes') {
        conteudo.innerHTML = cabecalho + blocoCarregando('statusPunicoes');
        carregarPunicoes();
        return;
      }

      if (modulo.tipo === 'solicitacoes') {
        conteudo.innerHTML = cabecalho + blocoCarregando('statusSolicitacoes');
        carregarSolicitacoes();
        return;
      }

      if (modulo.tipo === 'sumulas') {
        conteudo.innerHTML = cabecalho + blocoCarregando('statusSumulas');
        carregarSumulas();
        return;
      }

      if (modulo.tipo === 'notas') {
        conteudo.innerHTML = cabecalho + blocoCarregando('statusNotas');
        carregarNotas();
        return;
      }

      if (modulo.tipo === 'regulamentos') {
        conteudo.innerHTML = cabecalho + blocoCarregando('statusRegulamentos');
        carregarRegulamentos();
        return;
      }

      if (modulo.tipo === 'associados') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaAssociados">' + blocoCarregando() + '</div>';
        carregarAssociados();
        return;
      }

      if (modulo.tipo === 'financeiro') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaFinanceiro">' + blocoCarregando('statusFinanceiro') + '</div>';
        carregarFinanceiro();
        return;
      }

      if (modulo.tipo === 'atas') {
        conteudo.innerHTML = cabecalho
          + '<div id="areaAtas">' + blocoCarregando() + '</div>';
        carregarAtas();
        return;
      }

      conteudo.innerHTML = cabecalho
        + '<div class="aviso"><strong>Em desenvolvimento.</strong> Esta funcionalidade j&aacute; est&aacute; '
        + 'prevista no sistema e ser&aacute; liberada em uma pr&oacute;xima vers&atilde;o.</div>';
    }

    /**
     * Tela inicial: saudacao e atalhos para os demais modulos.
     */
    function renderizarPainel() {
      const hora = new Date().getHours();
      const saudacao = hora < 12 ? 'Bom dia' : (hora < 18 ? 'Boa tarde' : 'Boa noite');
      const primeiroNome = (CONFIG.usuario.nome || '').split(' ')[0] || CONFIG.usuario.email;

      const atalhos = MODULOS.filter(function (modulo) {
        return modulo.tipo !== 'painel';
      }).map(function (modulo) {
        const corpo = '<span class="icone">' + escapar(modulo.icone) + '</span>'
          + '<h3>' + escapar(modulo.nome) + '</h3>'
          + '<p>' + escapar(modulo.descricao) + '</p>';

        if (modulo.tipo === 'breve') {
          return '<div class="cartao inativo">' + corpo + '</div>';
        }

        return '<button type="button" class="cartao" data-atalho="' + escapar(modulo.id) + '">' + corpo + '</button>';
      }).join('');

      conteudo.innerHTML = '<div class="saudacao">'
        + '<h2>' + saudacao + ', ' + escapar(primeiroNome) + '!</h2>'
        + '<p>Voc&ecirc; est&aacute; na &aacute;rea interna da AEUV. Escolha abaixo uma das '
        + 'funcionalidades liberadas para o seu perfil.</p>'
        + '</div>'
        + '<div class="cartoes">' + atalhos + '</div>';

      conteudo.querySelectorAll('[data-atalho]').forEach(function (cartao) {
        cartao.addEventListener('click', function () {
          abrirModulo(cartao.dataset.atalho);
        });
      });
    }

    /**
     * Quem tem acesso e com qual perfil. So o admin chega ate aqui, e o
     * servidor refaz essa checagem a cada chamada.
     */
    let usuarios = { registros: [], perfis: [], equipes: [], emailAtual: '' };

    /**
     * Busca no servidor a lista de autorizados (somente admin).
     */
    function carregarUsuarios() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          usuarios = dados;
          montarTelaUsuarios();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'usuarios') {
            return;
          }

          document.getElementById('statusUsuarios').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarUsuarios();
    }

    /**
     * Lista dos acessos, com os botoes de conceder, editar e remover.
     * @param {string} recado Mensagem de sucesso da ultima gravacao.
     */
    function montarTelaUsuarios(recado) {
      const linhas = (usuarios.registros || []).map(function (usuario) {
        const eu = usuario.email === usuarios.emailAtual;

        const acoes = eu
          ? '<span class="apoio">voc&ecirc;</span>'
          : '<button type="button" class="botao-apoio" data-editar="' + escapar(usuario.email) + '">Editar</button>'
            + ' <button type="button" class="botao-apoio perigo" data-remover="' + escapar(usuario.email) + '">Remover</button>';

        const perfilTexto = usuario.equipe
          ? escapar(usuario.perfilNome) + ' · ' + escapar(usuario.equipe)
          : escapar(usuario.perfilNome);

        return '<tr>'
          + '<td data-rotulo="Nome">' + escapar(usuario.nome || '-') + '</td>'
          + '<td class="email" data-rotulo="E-mail">' + escapar(usuario.email) + '</td>'
          + '<td data-rotulo="Perfil"><span class="pilula ' + escapar(usuario.perfil) + '">'
          + perfilTexto + '</span></td>'
          + '<td class="acoes-linha" data-rotulo="Ações">' + acoes + '</td>'
          + '</tr>';
      }).join('');

      const sucesso = recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '';

      document.getElementById('areaUsuarios').innerHTML = sucesso
        + '<div class="barra-acoes">'
        + '<button type="button" class="botao-principal" id="novoUsuario">Conceder acesso</button>'
        + '</div>'
        + '<table class="usuarios"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>A&ccedil;&otilde;es</th></tr></thead>'
        + '<tbody>' + linhas + '</tbody></table>'
        + legendaPerfis()
        + '<div class="aviso">As mudan&ccedil;as valem na hora, sem publicar nova vers&atilde;o. '
        + 'Quem estiver com o sistema aberto passa a ver o novo perfil ao recarregar a p&aacute;gina.</div>';

      document.getElementById('novoUsuario').addEventListener('click', function () {
        abrirFormularioUsuario('');
      });

      document.querySelectorAll('[data-editar]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirFormularioUsuario(botao.dataset.editar);
        });
      });

      document.querySelectorAll('[data-remover]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          removerUsuarioDoSistema(botao.dataset.remover);
        });
      });
    }

    /**
     * O que cada perfil enxerga. Fica visivel na tela porque a escolha
     * do perfil so faz sentido sabendo o que ela libera.
     */
    function legendaPerfis() {
      const itens = (usuarios.perfis || []).map(function (perfil) {
        return '<div class="perfil-legenda">'
          + '<span class="pilula ' + escapar(perfil.id) + '">' + escapar(perfil.nome) + '</span>'
          + '<span class="apoio">' + escapar((perfil.modulos || []).join(', ')) + '</span>'
          + '</div>';
      }).join('');

      return '<h3 class="titulo-secao">O que cada perfil enxerga</h3>'
        + '<div class="perfis-legenda">' + itens + '</div>';
    }

    /**
     * Formulario de um acesso. Sem e-mail, abre em branco.
     * @param {string} email
     */
    function abrirFormularioUsuario(email) {
      const registro = (usuarios.registros || []).filter(function (u) {
        return u.email === email;
      })[0] || null;

      const opcoes = (usuarios.perfis || []).map(function (perfil) {
        const escolhido = registro && registro.perfil === perfil.id;

        return '<option value="' + escapar(perfil.id) + '"' + (escolhido ? ' selected' : '') + '>'
          + escapar(perfil.nome) + '</option>';
      }).join('');

      const opcoesEquipe = (usuarios.equipes || []).map(function (nome) {
        const escolhida = registro && registro.equipe === nome;

        return '<option value="' + escapar(nome) + '"' + (escolhida ? ' selected' : '') + '>'
          + escapar(nome) + '</option>';
      }).join('');

      document.getElementById('areaUsuarios').innerHTML = '<div class="formulario">'
        + '<h3>' + (registro ? 'Editar acesso' : 'Conceder acesso') + '</h3>'
        + '<p class="apoio">O e-mail precisa ser a conta Google com que a pessoa vai entrar.</p>'
        + '<div class="grupo"><div class="campos">'
        + campoTexto('uNome', 'Nome', registro ? registro.nome : '', 'largo', '', 'text')
        + campoTexto('uEmail', 'E-mail', registro ? registro.email : '', 'largo', '', 'email')
        + '<div class="campo largo"><label for="uPerfil">Perfil</label>'
        + '<select id="uPerfil">' + opcoes + '</select>'
        + '<span class="dica" id="uDica"></span></div>'
        + '<div class="campo largo" id="campoEquipe"><label for="uEquipe">Equipe</label>'
        + '<select id="uEquipe"><option value="">Selecione</option>' + opcoesEquipe + '</select>'
        + '<span class="dica">Este acesso s&oacute; enxerga o cadastro da equipe escolhida.</span></div>'
        + '</div></div>'
        + '<div class="acoes-formulario">'
        + '<button type="button" class="botao-principal" id="gravarUsuario">'
        + (registro ? 'Salvar' : 'Conceder acesso') + '</button>'
        + '<button type="button" class="botao-apoio" id="voltarUsuarios">Voltar &agrave; lista</button>'
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoUsuario"></span>'
        + '</div></div>';

      const seletor = document.getElementById('uPerfil');

      /** A equipe so aparece para o perfil que enxerga uma equipe so. */
      function ajustarPerfil() {
        const perfil = (usuarios.perfis || []).filter(function (p) {
          return p.id === seletor.value;
        })[0];

        document.getElementById('uDica').textContent = perfil
          ? 'Vai enxergar: ' + (perfil.modulos || []).join(', ')
          : '';

        document.getElementById('campoEquipe').style.display =
          perfil && perfil.exigeEquipe ? '' : 'none';
      }

      seletor.addEventListener('change', ajustarPerfil);
      ajustarPerfil();

      document.getElementById('voltarUsuarios').addEventListener('click', function () {
        montarTelaUsuarios();
      });

      document.getElementById('gravarUsuario').addEventListener('click', function () {
        gravarUsuario(registro ? registro.email : '');
      });
    }

    /**
     * Envia o acesso ao servidor, que e quem valida de verdade.
     * @param {string} emailOriginal Vazio quando e um acesso novo.
     */
    function gravarUsuario(emailOriginal) {
      const botao = document.getElementById('gravarUsuario');
      const aviso = document.getElementById('avisoUsuario');

      botao.disabled = true;
      aviso.textContent = 'Gravando...';

      google.script.run
        .withSuccessHandler(function (dados) {
          usuarios = dados;
          montarTelaUsuarios(dados.recado);
        })
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          aviso.innerHTML = '<span class="alerta">'
            + escapar(erro && erro.message ? erro.message : erro) + '</span>';
        })
        .salvarUsuario({
          emailOriginal: emailOriginal,
          email: document.getElementById('uEmail').value,
          nome: document.getElementById('uNome').value,
          perfil: document.getElementById('uPerfil').value,
          equipe: document.getElementById('uEquipe').value
        });
    }

    /**
     * Revoga um acesso, confirmando antes.
     * @param {string} email
     */
    function removerUsuarioDoSistema(email) {
      if (!window.confirm('Remover o acesso de ' + email + '?')) {
        return;
      }

      document.getElementById('areaUsuarios').innerHTML = blocoCarregando();

      google.script.run
        .withSuccessHandler(function (dados) {
          usuarios = dados;
          montarTelaUsuarios(dados.recado);
        })
        .withFailureHandler(function (erro) {
          montarTelaUsuarios();

          document.getElementById('areaUsuarios').insertAdjacentHTML('afterbegin',
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>');
        })
        .removerUsuario(email);
    }

    /**
     * Equipes participantes: fonte unica dos tres apps. Admin e
     * diretoria incluem, renomeiam e removem; o servidor recusa a
     * remocao de equipe que ainda tenha cadastro ou acesso.
     */
    let equipes = { equipes: [], arquivoUrl: '', podeEditar: false };

    /**
     * Busca no servidor a lista de equipes.
     */
    function carregarEquipes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'equipes') {
            return;
          }

          equipes = dados;
          montarTelaEquipes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'equipes') {
            return;
          }

          document.getElementById('statusEquipes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarEquipes();
    }

    /**
     * Lista das equipes, com editar e remover para quem pode.
     * @param {string} recado Mensagem de sucesso da ultima gravacao.
     */
    function montarTelaEquipes(recado) {
      const linhas = (equipes.equipes || []).map(function (item) {
        const uso = (item.emUso || []).join(', ');

        const acoes = equipes.podeEditar
          ? '<button type="button" class="botao-apoio" data-editar-equipe="' + escapar(item.nome) + '">Editar</button>'
            + ' <button type="button" class="botao-apoio perigo" data-remover-equipe="' + escapar(item.nome) + '">Remover</button>'
          : '<span class="apoio">-</span>';

        return '<tr>'
          + '<td data-rotulo="Equipe">' + escapar(item.nome) + '</td>'
          + '<td data-rotulo="Em uso">' + (uso ? escapar(uso) : '<span class="apoio">nenhum cadastro ainda</span>') + '</td>'
          + '<td class="acoes-linha" data-rotulo="Ações">' + acoes + '</td>'
          + '</tr>';
      }).join('');

      const sucesso = recado ? '<div class="sucesso">' + escapar(recado) + '</div>' : '';

      const barra = equipes.podeEditar
        ? '<div class="barra-acoes">'
          + '<button type="button" class="botao-principal" id="novaEquipe">Incluir equipe</button>'
          + '</div>'
        : '';

      const linkArquivo = equipes.arquivoUrl
        ? '<a href="' + escapar(equipes.arquivoUrl) + '" target="_blank" rel="noopener">arquivo publicado</a>'
        : 'arquivo publicado';

      document.getElementById('areaEquipes').innerHTML = sucesso
        + barra
        + '<table class="usuarios"><thead><tr><th>Equipe</th><th>Em uso</th><th>A&ccedil;&otilde;es</th></tr></thead>'
        + '<tbody>' + linhas + '</tbody></table>'
        + '<div class="aviso">Esta lista alimenta o cadastro de associados, os acessos do sistema e os '
        + 'formul&aacute;rios de s&uacute;mula e de inscri&ccedil;&atilde;o e portabilidade, atrav&eacute;s do '
        + linkArquivo + '. Vale na hora, sem publicar nova vers&atilde;o de nenhum dos tr&ecirc;s projetos.</div>';

      if (equipes.podeEditar) {
        document.getElementById('novaEquipe').addEventListener('click', function () {
          abrirFormularioEquipe('');
        });

        document.querySelectorAll('[data-editar-equipe]').forEach(function (botao) {
          botao.addEventListener('click', function () {
            abrirFormularioEquipe(botao.dataset.editarEquipe);
          });
        });

        document.querySelectorAll('[data-remover-equipe]').forEach(function (botao) {
          botao.addEventListener('click', function () {
            removerEquipeDoSistema(botao.dataset.removerEquipe);
          });
        });
      }
    }

    /**
     * Formulario de uma equipe. Sem nome, abre em branco.
     * @param {string} nome
     */
    function abrirFormularioEquipe(nome) {
      const registro = (equipes.equipes || []).filter(function (e) {
        return e.nome === nome;
      })[0] || null;

      document.getElementById('areaEquipes').innerHTML = '<div class="formulario">'
        + '<h3>' + (registro ? 'Renomear equipe' : 'Incluir equipe') + '</h3>'
        + '<div class="grupo"><div class="campos">'
        + campoTexto('eNome', 'Nome da equipe', registro ? registro.nome : '', 'largo', '', 'text')
        + '</div></div>'
        + '<div class="acoes-formulario">'
        + '<button type="button" class="botao-principal" id="gravarEquipe">'
        + (registro ? 'Salvar' : 'Incluir') + '</button>'
        + '<button type="button" class="botao-apoio" id="voltarEquipes">Voltar &agrave; lista</button>'
        + '<span class="espaco"></span>'
        + '<span class="apoio" id="avisoEquipe"></span>'
        + '</div></div>';

      document.getElementById('voltarEquipes').addEventListener('click', function () {
        montarTelaEquipes();
      });

      document.getElementById('gravarEquipe').addEventListener('click', function () {
        gravarEquipe(registro ? registro.nome : '');
      });
    }

    /**
     * Envia a equipe ao servidor, que e quem valida de verdade.
     * @param {string} nomeOriginal Vazio quando e uma equipe nova.
     */
    function gravarEquipe(nomeOriginal) {
      const botao = document.getElementById('gravarEquipe');
      const aviso = document.getElementById('avisoEquipe');

      botao.disabled = true;
      aviso.textContent = 'Gravando...';

      google.script.run
        .withSuccessHandler(function (dados) {
          equipes = dados;
          montarTelaEquipes(dados.recado);
        })
        .withFailureHandler(function (erro) {
          botao.disabled = false;
          aviso.innerHTML = '<span class="alerta">'
            + escapar(erro && erro.message ? erro.message : erro) + '</span>';
        })
        .salvarEquipe({
          nomeOriginal: nomeOriginal,
          nome: document.getElementById('eNome').value
        });
    }

    /**
     * Remove uma equipe, confirmando antes.
     * @param {string} nome
     */
    function removerEquipeDoSistema(nome) {
      if (!window.confirm('Remover a equipe ' + nome + '?')) {
        return;
      }

      document.getElementById('areaEquipes').innerHTML = blocoCarregando();

      google.script.run
        .withSuccessHandler(function (dados) {
          equipes = dados;
          montarTelaEquipes(dados.recado);
        })
        .withFailureHandler(function (erro) {
          montarTelaEquipes();

          document.getElementById('areaEquipes').insertAdjacentHTML('afterbegin',
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>');
        })
        .removerEquipe(nome);
    }

    /**
     * Estado da tela de punicoes: o arquivo e lido uma vez e os filtros
     * trabalham sobre essa copia, sem novas idas ao servidor.
     */
    let punicoes = { registros: [], atualizadoEm: '', arquivoUrl: '' };

    /**
     * Busca no servidor o controle de punicoes publicado no Drive.
     */
    function carregarPunicoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          punicoes = dados;
          montarTelaPunicoes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'punicoes') {
            return;
          }

          document.getElementById('statusPunicoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarPunicoes();
    }

    /**
     * Monta os indicadores, os filtros e a tabela do controle de punicoes.
     */
    function montarTelaPunicoes() {
      const registros = punicoes.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusPunicoes').outerHTML =
          '<div class="vazio">Nenhuma puni&ccedil;&atilde;o registrada at&eacute; o momento.</div>';
        return;
      }

      const atualizacao = punicoes.atualizadoEm
        ? 'Atualizado em ' + escapar(punicoes.atualizadoEm)
        : 'Dados lidos do arquivo de controle';

      document.getElementById('statusPunicoes').outerHTML = ''
        + '<div class="resumo" id="resumoPunicoes"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaPunicoes" placeholder="Buscar por atleta, equipe, nota ou artigo">'
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + opcoesFiltro('equipe', 'Todas as equipes', registros)
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('status', 'Todos os status', registros)
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemPunicoes"></span>'
        + '<span class="espaco"></span>'
        + '<span>' + atualizacao + '</span>'
        + '<button type="button" class="botao-apoio" id="recarregarPunicoes">Atualizar</button>'
        + (punicoes.arquivoUrl
          ? '<a class="botao-apoio" href="' + escapar(punicoes.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="punicoes"><thead><tr>'
        + '<th>Nota</th><th>Punido</th><th>Equipe</th><th>Partida</th><th>Artigo</th>'
        + '<th>Suspens&atilde;o</th><th>Status</th><th>Situa&ccedil;&atilde;o</th>'
        + '</tr></thead><tbody id="linhasPunicoes"></tbody></table></div>';

      document.getElementById('buscaPunicoes').addEventListener('input', filtrarPunicoes);
      document.getElementById('recarregarPunicoes').addEventListener('click', function () {
        abrirModulo('punicoes');
      });

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        campo.addEventListener('change', filtrarPunicoes);
      });

      if (termo) {
        document.getElementById('buscaPunicoes').value = termo;
      }

      filtrarPunicoes();
    }

    /**
     * Cria um seletor com os valores distintos de uma coluna.
     */
    function opcoesFiltro(campo, rotuloTodos, registros) {
      const valores = [];

      registros.forEach(function (registro) {
        const valor = registro[campo];

        if (valor && valor !== '-' && valores.indexOf(valor) === -1) {
          valores.push(valor);
        }
      });

      valores.sort();

      return '<select data-filtro="' + campo + '"><option value="">' + rotuloTodos + '</option>'
        + valores.map(function (valor) {
          return '<option value="' + escapar(valor) + '">' + escapar(valor) + '</option>';
        }).join('') + '</select>';
    }

    /**
     * Tira acentos e maiusculas para a busca livre nao depender da digitacao.
     */
    function simplificar(texto) {
      return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarPunicoes() {
      const busca = simplificar(document.getElementById('buscaPunicoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (punicoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(Object.keys(registro).map(function (campo) {
          return registro[campo];
        }).join(' ')).indexOf(busca) !== -1;
      });

      desenharResumo(filtrados);
      desenharLinhas(filtrados);
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumo(registros) {
      const cumprir = registros.filter(function (r) { return r.situacao.indexOf('A CUMPRIR') === 0; }).length;
      const cumpridas = registros.filter(function (r) { return r.situacao.indexOf('CUMPRIDA') === 0; }).length;
      const pendentes = registros.filter(function (r) { return r.status !== 'DEFINIDA'; }).length;

      const itens = [
        ['', registros.length, 'Punições'],
        ['cumprir', cumprir, 'A cumprir'],
        ['cumprida', cumpridas, 'Cumpridas'],
        ['pendente', pendentes, 'Pena a definir']
      ];

      document.getElementById('resumoPunicoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      document.getElementById('contagemPunicoes').textContent = registros.length === (punicoes.registros || []).length
        ? registros.length + ' registro(s)'
        : registros.length + ' de ' + punicoes.registros.length + ' registro(s)';
    }

    /**
     * Desenha as linhas da tabela (fichas empilhadas no celular).
     */
    function desenharLinhas(registros) {
      if (!registros.length) {
        document.getElementById('linhasPunicoes').innerHTML =
          '<tr><td colspan="8" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma puni&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasPunicoes').innerHTML = registros.map(function (r) {
        const detalhe = r.tipo + (r.camisa && r.camisa !== '-' ? ' · camisa ' + r.camisa : '')
          + (r.cartaoVermelho === 'Sim' ? ' · cartão vermelho' : '');

        // A sumula e a origem da punicao: o link leva direto ao relato do
        // arbitro que motivou a decisao. O rotulo e curto porque a coluna
        // e estreita; o protocolo inteiro fica no title.
        const origem = r.sumula && r.sumula !== '-' && moduloDisponivel('sumulas')
          ? '<div class="punido-dado origem-sumula"><a href="#" class="atalho-sumula" title="Súmula '
            + escapar(r.sumula) + '" data-sumula="' + escapar(r.sumula) + '">Ver súmula</a></div>'
          : '';

        return '<tr>'
          + celula('Nota', escapar(r.nota) + '<div class="punido-dado">' + escapar(r.dataNota) + '</div>' + origem)
          + celula('Punido', '<span class="punido-nome">' + escapar(r.punido) + '</span>'
            + '<div class="punido-dado">' + escapar(detalhe) + '</div>')
          + celula('Equipe', escapar(r.equipe))
          + celula('Partida', escapar(r.partida) + '<div class="punido-dado">' + escapar(r.dataJogo) + '</div>')
          + celula('Artigo', escapar(r.artigo))
          + celula('Suspensão', escapar(suspensao(r)))
          + celula('Status', '<span class="' + classeStatus(r.status) + '">' + escapar(r.status) + '</span>')
          + celula('Situação', '<span class="' + classeSituacao(r.situacao) + '">' + escapar(r.situacao) + '</span>')
          + '</tr>';
      }).join('');

      conteudo.querySelectorAll('#linhasPunicoes .atalho-sumula').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.preventDefault();
          abrirModulo('sumulas', link.dataset.sumula);
        });
      });
    }

    /**
     * Celula com rotulo, usado no layout de ficha do celular.
     */
    function celula(rotulo, html) {
      return '<td data-rotulo="' + escapar(rotulo) + '">' + html + '</td>';
    }

    /**
     * Suspensao adicional aplicada na nota. Quando nao ha partidas nem prazo,
     * mostra a decisao escrita na nota (por exemplo, pena ainda a definir).
     */
    function suspensao(registro) {
      const partes = [];

      if (registro.partidas && registro.partidas !== '-') {
        partes.push(registro.partidas + (registro.partidas === '1' ? ' partida' : ' partidas'));
      }

      if (registro.tempo && registro.tempo !== '-') {
        partes.push(registro.tempo);
      }

      if (partes.length) {
        return partes.join(' + ');
      }

      return registro.decisao && registro.decisao !== '-' ? registro.decisao : '-';
    }

    function classeStatus(status) {
      return 'pilula ' + (status === 'DEFINIDA' ? 'definida' : 'alerta');
    }

    function classeSituacao(situacao) {
      if (situacao.indexOf('CUMPRIDA') === 0) {
        return 'pilula cumprida';
      }

      return situacao.indexOf('A CUMPRIR') === 0 ? 'pilula cumprir' : 'pilula';
    }

    /**
     * Estado da tela de solicitacoes. A leitura do Drive e cara, entao
     * acontece uma vez so e os filtros trabalham sobre essa copia.
     */
    let solicitacoes = { registros: [], situacoes: [], acoes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Protocolos com o detalhe aberto. */
    let solicitacoesAbertas = {};

    /**
     * Busca no servidor as solicitacoes enviadas pelas equipes.
     */
    function carregarSolicitacoes() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'solicitacoes') {
            return;
          }

          solicitacoes = dados;
          solicitacoesAbertas = {};
          montarTelaSolicitacoes();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'solicitacoes') {
            return;
          }

          document.getElementById('statusSolicitacoes').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarSolicitacoes();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das solicitacoes.
     */
    function montarTelaSolicitacoes() {
      const registros = solicitacoes.registros || [];

      if (!registros.length) {
        document.getElementById('statusSolicitacoes').outerHTML =
          '<div class="vazio">Nenhuma solicita&ccedil;&atilde;o enviada at&eacute; o momento.</div>';
        return;
      }

      const recorte = solicitacoes.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + solicitacoes.total)
        : '';

      document.getElementById('statusSolicitacoes').outerHTML = ''
        + '<div class="resumo" id="resumoSolicitacoes"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaSolicitacoes" placeholder="Buscar por protocolo, equipe, respons&aacute;vel ou atleta">'
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + opcoesFiltro('equipe', 'Todas as equipes', registros)
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemSolicitacoes"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarSolicitacoes">Atualizar</button>'
        + (solicitacoes.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(solicitacoes.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes"><thead><tr>'
        + '<th>Situa&ccedil;&atilde;o</th><th>Protocolo</th><th>Enviada em</th><th>Equipe</th>'
        + '<th>Respons&aacute;vel</th><th>Registros</th><th>Resultado</th>'
        + '</tr></thead><tbody id="linhasSolicitacoes"></tbody></table></div>';

      document.getElementById('buscaSolicitacoes').addEventListener('input', filtrarSolicitacoes);
      document.getElementById('recarregarSolicitacoes').addEventListener('click', function () {
        abrirModulo('solicitacoes');
      });

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        campo.addEventListener('change', filtrarSolicitacoes);
      });

      filtrarSolicitacoes();
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarSolicitacoes() {
      const busca = simplificar(document.getElementById('buscaSolicitacoes').value.trim());
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (solicitacoes.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaSolicitacao(registro)).indexOf(busca) !== -1;
      });

      desenharResumoSolicitacoes(filtrados);
      desenharLinhasSolicitacoes(filtrados);
    }

    /**
     * Junta o cabecalho e os nomes dos atletas para a busca livre
     * encontrar a solicitacao tambem por quem foi inscrito nela.
     */
    function textoDaSolicitacao(registro) {
      return [
        registro.protocolo,
        registro.dataHora,
        registro.situacao,
        registro.competicao,
        registro.equipe,
        registro.responsavel,
        registro.telefone
      ].concat((registro.pessoas || []).map(function (pessoa) {
        return pessoa.nome + ' ' + pessoa.cpf + ' ' + pessoa.acao + ' ' + pessoa.tipo;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     * Alem das solicitacoes, conta os atletas envolvidos nelas.
     */
    function desenharResumoSolicitacoes(registros) {
      const pessoas = registros.reduce(function (total, registro) {
        return total + registro.quantidade;
      }, 0);

      function porSituacao(situacao) {
        return registros.filter(function (registro) {
          return registro.situacao === situacao;
        }).length;
      }

      const itens = [
        ['', registros.length, 'Solicitações'],
        ['cumprir', porSituacao('Aguardando'), 'Aguardando'],
        ['cumprida', porSituacao('Processada'), 'Processadas'],
        ['pendente', porSituacao('Falha'), 'Com falha'],
        ['', pessoas, 'Registros']
      ];

      document.getElementById('resumoSolicitacoes').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (solicitacoes.registros || []).length;

      document.getElementById('contagemSolicitacoes').textContent = registros.length === total
        ? registros.length + ' solicitação(ões)'
        : registros.length + ' de ' + total + ' solicitação(ões)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha pode abrir uma segunda,
     * com os dados completos e a lista de atletas da solicitacao.
     */
    function desenharLinhasSolicitacoes(registros) {
      if (!registros.length) {
        document.getElementById('linhasSolicitacoes').innerHTML =
          '<tr><td colspan="7" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma solicita&ccedil;&atilde;o encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasSolicitacoes').innerHTML = registros.map(function (r) {
        const aberta = !!solicitacoesAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Situação', '<span class="' + classeSituacaoSolicitacao(r.situacao) + '">'
            + escapar(r.icone + ' ' + r.situacao) + '</span>')
          + celula('Protocolo', '<span class="protocolo">' + escapar(r.protocolo || '—') + '</span>')
          + celula('Enviada em', escapar(r.dataHora || '—')
            + '<div class="equipe-dado">' + escapar(r.competicao) + '</div>')
          + celula('Equipe', '<span class="equipe-nome">' + escapar(r.equipe) + '</span>')
          + celula('Responsável', escapar(r.responsavel)
            + '<div class="equipe-dado">' + escapar(r.telefone) + '</div>')
          + celula('Registros', contagemPorAcao(r))
          + celula('Resultado', atalhoPdfDoResultado(r))
          + '</tr>';

        return linha + (aberta ? detalheSolicitacao(r) : '');
      }).join('');

      conteudo.querySelectorAll('.solicitacoes tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (solicitacoesAbertas[chave]) {
            delete solicitacoesAbertas[chave];
          } else {
            solicitacoesAbertas[chave] = true;
          }

          filtrarSolicitacoes();
        });
      });

      // O clique no link do resultado nao deve abrir ou fechar a linha junto.
      conteudo.querySelectorAll('#linhasSolicitacoes [data-nao-abre]').forEach(function (link) {
        link.addEventListener('click', function (evento) {
          evento.stopPropagation();
        });
      });
    }

    /**
     * Quantas pessoas de cada acao a solicitacao tem. Acoes zeradas
     * ficam de fora para a coluna nao virar uma lista de zeros.
     */
    function contagemPorAcao(registro) {
      const partes = (solicitacoes.acoes || []).filter(function (acao) {
        return registro.resumo[acao];
      }).map(function (acao) {
        return '<span><strong>' + registro.resumo[acao] + '</strong> ' + escapar(nomeAcao(acao)) + '</span>';
      });

      if (!partes.length) {
        return '<span class="equipe-dado">nenhum registro</span>';
      }

      return '<div class="contagem">' + partes.join('') + '</div>';
    }

    /**
     * O formulario grava as acoes sem acento; aqui elas voltam acentuadas.
     */
    function nomeAcao(acao) {
      const nomes = { Inclusao: 'inclusão', Remocao: 'remoção', Portabilidade: 'portabilidade' };

      return nomes[acao] || acao;
    }

    /**
     * O resultado em PDF, que e o documento de leitura. Fica na propria
     * linha; o TXT continua no detalhe, para quem precisa do arquivo bruto.
     */
    function atalhoPdfDoResultado(registro) {
      if (!registro.resultadoPdfUrl) {
        return registro.situacao === 'Aguardando'
          ? '<span class="equipe-dado">—</span>'
          : '<span class="equipe-dado">não publicado</span>';
      }

      return '<a class="botao-apoio destaque" data-nao-abre="1" href="'
        + escapar(registro.resultadoPdfUrl) + '" target="_blank" rel="noopener">Ver resultado</a>';
    }

    /**
     * Botoes do resultado da automacao, publicados pelo Python na pasta
     * "Resultados". Sao eles que mostram por que um registro falhou.
     *
     * O PDF fica na coluna "Resultado" da linha; aqui sobra o TXT, que e a
     * origem do que a automacao leu.
     *
     * Enquanto a automacao nao roda o resultado nao existe, e a solicitacao
     * aparece sem esses botoes — por isso o aviso so surge quando ja houve
     * processamento (situacao diferente de "Aguardando").
     */
    function linksResultado(registro) {
      const txt = registro.resultadoTxtUrl;

      if (!txt) {
        return registro.situacao === 'Aguardando' || registro.resultadoPdfUrl
          ? ''
          : '<span class="equipe-dado">Resultado ainda não publicado</span>';
      }

      return '<a class="botao-apoio" href="' + escapar(txt)
        + '" target="_blank" rel="noopener">Resultado (TXT)</a>';
    }

    /**
     * Linha extra com os dados completos e a tabela de atletas.
     */
    function detalheSolicitacao(registro) {
      const dados = [
        ['Competição', registro.competicao],
        ['Telefone', registro.telefone],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1];
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + (registro.comprovanteUrl
          ? '<a class="botao-apoio" href="' + escapar(registro.comprovanteUrl) + '" target="_blank" rel="noopener">Comprovante PIX</a>'
          : '<span class="equipe-dado">Sem comprovante anexado</span>')
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + linksResultado(registro)
        + '</div>';

      const pessoas = (registro.pessoas || []).map(function (p) {
        return '<tr>'
          + celula('Ação', escapar(nomeAcao(p.acao)))
          + celula('Tipo', escapar(p.tipo))
          + celula('Nome', '<span class="pessoa-nome">' + escapar(p.nome) + '</span>')
          + celula('Nascimento', escapar(p.nascimento || '—'))
          + celula('CPF', escapar(formatarCpf(p.cpf) || '—'))
          + celula('Competição anterior', escapar(p.competicaoAnterior || '—'))
          + '</tr>';
      }).join('');

      const tabela = pessoas
        ? '<table class="pessoas"><thead><tr><th>A&ccedil;&atilde;o</th><th>Tipo</th><th>Nome</th>'
          + '<th>Nascimento</th><th>CPF</th><th>Competi&ccedil;&atilde;o anterior</th></tr></thead>'
          + '<tbody>' + pessoas + '</tbody></table>'
        : '<p class="equipe-dado">Esta solicita&ccedil;&atilde;o n&atilde;o tem registros.</p>';

      return '<tr class="detalhe"><td colspan="7"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + tabela
        + links
        + '</div></td></tr>';
    }

    function classeSituacaoSolicitacao(situacao) {
      return 'pilula ' + simplificar(situacao);
    }

    /**
     * Estado da tela de sumulas. Mesma ideia das solicitacoes: le do
     * Drive uma vez e filtra sobre essa copia.
     */
    let sumulas = { registros: [], situacoes: [], equipes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Arquivos com o detalhe aberto. */
    let sumulasAbertas = {};

    /**
     * Busca no servidor as sumulas enviadas pela arbitragem.
     */
    function carregarSumulas() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'sumulas') {
            return;
          }

          sumulas = dados;
          sumulasAbertas = {};
          montarTelaSumulas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'sumulas') {
            return;
          }

          document.getElementById('statusSumulas').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarSumulas();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das sumulas.
     */
    function montarTelaSumulas() {
      const registros = sumulas.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusSumulas').outerHTML =
          '<div class="vazio">Nenhuma s&uacute;mula enviada at&eacute; o momento.</div>';
        return;
      }

      const recorte = sumulas.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + sumulas.total)
        : '';

      document.getElementById('statusSumulas').outerHTML = ''
        + '<div class="resumo" id="resumoSumulas"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaSumulas" placeholder="Buscar por protocolo, equipe, &aacute;rbitro, envolvido ou pelo relato">'
        + opcoesFiltro('situacao', 'Todas as situa&ccedil;&otilde;es', registros)
        + opcoesFiltro('arbitro', 'Todos os &aacute;rbitros', registros)
        + filtroEquipeSumulas()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemSumulas"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarSumulas">Atualizar</button>'
        + (sumulas.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(sumulas.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes"><thead><tr>'
        + '<th>Situa&ccedil;&atilde;o</th><th>Protocolo</th><th>Enviada em</th><th>Partida</th>'
        + '<th>&Aacute;rbitro</th><th>Envolvidos</th>'
        + '</tr></thead><tbody id="linhasSumulas"></tbody></table></div>';

      document.getElementById('buscaSumulas').addEventListener('input', filtrarSumulas);
      document.getElementById('recarregarSumulas').addEventListener('click', function () {
        abrirModulo('sumulas');
      });

      conteudo.querySelectorAll('[data-filtro], #filtroEquipeSumulas').forEach(function (campo) {
        campo.addEventListener('change', filtrarSumulas);
      });

      if (termo) {
        document.getElementById('buscaSumulas').value = termo;
      }

      filtrarSumulas();
    }

    /**
     * A equipe nao e um campo unico da sumula: uma partida tem dois times e
     * os envolvidos podem ser de qualquer um deles. Por isso este filtro e
     * montado a parte, com a lista que o servidor ja devolveu pronta.
     */
    function filtroEquipeSumulas() {
      const opcoes = (sumulas.equipes || []).map(function (equipe) {
        return '<option value="' + escapar(equipe) + '">' + escapar(equipe) + '</option>';
      }).join('');

      return '<select id="filtroEquipeSumulas"><option value="">Todas as equipes</option>' + opcoes + '</select>';
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarSumulas() {
      const busca = simplificar(document.getElementById('buscaSumulas').value.trim());
      const equipe = document.getElementById('filtroEquipeSumulas').value;
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (sumulas.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (equipe && (registro.equipes || []).indexOf(equipe) === -1) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaSumula(registro)).indexOf(busca) !== -1;
      });

      desenharResumoSumulas(filtrados);
      desenharLinhasSumulas(filtrados);
    }

    /**
     * Junta tudo o que identifica a sumula, inclusive o relato: e comum
     * procurar por uma palavra que se lembra do texto, nao pelo protocolo.
     */
    function textoDaSumula(registro) {
      return [
        registro.protocolo,
        registro.dataEnvio,
        registro.situacao,
        registro.confronto,
        registro.arbitro,
        registro.documento,
        registro.dataJogo,
        registro.fatos
      ].concat(registro.notas || []).concat((registro.envolvidos || []).map(function (envolvido) {
        return envolvido.nome + ' ' + envolvido.equipe + ' ' + envolvido.tipo + ' ' + envolvido.camisa;
      })).join(' ');
    }

    /**
     * Indicadores do topo, sempre referentes ao que esta filtrado.
     */
    function desenharResumoSumulas(registros) {
      const envolvidos = registros.reduce(function (total, registro) {
        return total + registro.quantidade;
      }, 0);

      function porSituacao(situacao) {
        return registros.filter(function (registro) {
          return registro.situacao === situacao;
        }).length;
      }

      const itens = [
        ['', registros.length, 'Súmulas'],
        ['cumprir', porSituacao('Aguardando'), 'Aguardando'],
        ['cumprida', porSituacao('Analisada'), 'Analisadas'],
        ['pendente', porSituacao('Falha'), 'Com falha'],
        ['', envolvidos, 'Envolvidos']
      ];

      document.getElementById('resumoSumulas').innerHTML = itens.map(function (item) {
        return '<div class="indicador ' + item[0] + '">'
          + '<div class="numero">' + item[1] + '</div>'
          + '<div class="rotulo">' + item[2] + '</div>'
          + '</div>';
      }).join('');

      const total = (sumulas.registros || []).length;

      document.getElementById('contagemSumulas').textContent = registros.length === total
        ? registros.length + ' súmula(s)'
        : registros.length + ' de ' + total + ' súmula(s)';
    }

    /**
     * Desenha as linhas da tabela. Cada linha abre uma segunda, com o
     * relato dos fatos e a lista de envolvidos.
     */
    function desenharLinhasSumulas(registros) {
      if (!registros.length) {
        document.getElementById('linhasSumulas').innerHTML =
          '<tr><td colspan="6" style="text-align:center;color:var(--apoio);">'
          + 'Nenhuma s&uacute;mula encontrada com os filtros atuais.</td></tr>';
        return;
      }

      document.getElementById('linhasSumulas').innerHTML = registros.map(function (r) {
        const aberta = !!sumulasAbertas[r.arquivoNome];

        const linha = '<tr class="linha" data-arquivo="' + escapar(r.arquivoNome) + '">'
          + celula('Situação', '<span class="' + classeSituacaoSolicitacao(r.situacao) + '">'
            + escapar(r.icone + ' ' + r.situacao) + '</span>'
            + resumoNota(r))
          + celula('Protocolo', '<span class="protocolo">' + escapar(r.protocolo || '—') + '</span>')
          + celula('Enviada em', escapar(r.dataEnvio || '—'))
          + celula('Partida', '<span class="equipe-nome">' + escapar(r.confronto || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(dataHoraDoJogo(r)) + '</div>')
          + celula('Árbitro', escapar(r.arbitro || '—'))
          + celula('Envolvidos', contagemEnvolvidos(r))
          + '</tr>';

        return linha + (aberta ? detalheSumula(r) : '');
      }).join('');

      conteudo.querySelectorAll('#linhasSumulas tr.linha').forEach(function (linha) {
        linha.addEventListener('click', function () {
          const chave = linha.dataset.arquivo;

          if (sumulasAbertas[chave]) {
            delete sumulasAbertas[chave];
          } else {
            sumulasAbertas[chave] = true;
          }

          filtrarSumulas();
        });
      });

      conteudo.querySelectorAll('#linhasSumulas .atalho-punicoes').forEach(function (botao) {
        botao.addEventListener('click', function () {
          abrirModulo('punicoes', botao.dataset.sumula);
        });
      });
    }

    /**
     * Data e hora do jogo, com a data no formato brasileiro.
     * O formulario grava a data como o navegador devolve (AAAA-MM-DD).
     */
    function dataHoraDoJogo(registro) {
      const partes = String(registro.dataJogo || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const data = partes ? partes[3] + '/' + partes[2] + '/' + partes[1] : registro.dataJogo;

      return [data, registro.horaJogo].filter(Boolean).join(' às ') || '—';
    }

    /**
     * Quantos envolvidos de cada tipo a sumula tem.
     */
    function contagemEnvolvidos(registro) {
      const porTipo = {};

      (registro.envolvidos || []).forEach(function (envolvido) {
        const tipo = envolvido.tipo || 'Sem tipo';

        porTipo[tipo] = (porTipo[tipo] || 0) + 1;
      });

      const partes = Object.keys(porTipo).sort().map(function (tipo) {
        return '<span><strong>' + porTipo[tipo] + '</strong> ' + escapar(tipo.toLowerCase()) + '</span>';
      });

      if (!partes.length) {
        return '<span class="equipe-dado">ninguém citado</span>';
      }

      return '<div class="contagem">' + partes.join('') + '</div>';
    }

    /**
     * Linha extra com o relato da arbitragem e a lista de envolvidos.
     */
    function detalheSumula(registro) {
      const dados = [
        ['Partida', dataHoraDoJogo(registro)],
        ['Documento do árbitro', registro.documento],
        ['Arquivo', registro.arquivoNome]
      ].filter(function (item) {
        return item[1] && item[1] !== '—';
      }).map(function (item) {
        return '<span>' + escapar(item[0]) + ': <strong>' + escapar(item[1]) + '</strong></span>';
      }).join('');

      // O relato e o que a comissao de fato le. Fica em destaque, com as
      // quebras de linha preservadas como o arbitro escreveu.
      const fatos = registro.fatos
        ? '<div class="relato"><h4>Dos fatos</h4><p>' + escapar(registro.fatos) + '</p></div>'
        : '<p class="equipe-dado">Esta s&uacute;mula n&atilde;o traz relato.</p>';

      const linhas = (registro.envolvidos || []).map(function (e) {
        return '<tr>'
          + celula('Equipe', '<span class="equipe-nome">' + escapar(e.equipe || '—') + '</span>')
          + celula('Tipo', escapar(e.tipo || '—'))
          + celula('Nome', '<span class="pessoa-nome">' + escapar(e.nome || '—') + '</span>')
          + celula('Camisa', escapar(e.camisa || '—'))
          + '</tr>';
      }).join('');

      const tabela = linhas
        ? '<table class="pessoas"><thead><tr><th>Equipe</th><th>Tipo</th><th>Nome</th><th>Camisa</th></tr></thead>'
          + '<tbody>' + linhas + '</tbody></table>'
        : '<p class="equipe-dado">Nenhum atleta ou membro de comiss&atilde;o foi citado.</p>';

      const links = '<div class="barra-acoes" style="margin-top:12px;">'
        + (registro.pdfUrl
          ? '<a class="botao-apoio destaque" href="' + escapar(registro.pdfUrl) + '" target="_blank" rel="noopener">Súmula oficial (PDF)</a>'
          : '<span class="equipe-dado">Sem PDF oficial gerado</span>')
        + '<a class="botao-apoio" href="' + escapar(registro.arquivoUrl) + '" target="_blank" rel="noopener">Abrir arquivo</a>'
        + '</div>';

      return '<tr class="detalhe"><td colspan="6"><div class="detalhe-caixa">'
        + (dados ? '<div class="detalhe-dados">' + dados + '</div>' : '')
        + fatos
        + tabela
        + blocoNota(registro)
        + links
        + '</div></td></tr>';
    }

    /**
     * Linha curta na tabela dizendo qual nota a sumula gerou.
     * O vinculo vem do controle de punicoes, que guarda o protocolo da
     * sumula ao lado do numero da nota.
     */
    function resumoNota(registro) {
      const notas = registro.notas || [];

      if (!notas.length) {
        return '';
      }

      return '<div class="equipe-dado">Nota ' + escapar(notas.join(', ')) + '</div>';
    }

    /**
     * Fecha o ciclo da sumula: o que a comissao decidiu a partir dela.
     *
     * Sumula ainda na fila nao tem decisao, e sumula analisada sem
     * infracao nao gera punicao nenhuma. Os dois casos sao normais e
     * aparecem com o texto correspondente, nunca como erro.
     */
    function blocoNota(registro) {
      const notas = registro.notas || [];
      const punidos = registro.punidos || [];

      if (!notas.length) {
        const aviso = registro.situacao === 'Analisada'
          ? 'S&uacute;mula analisada sem puni&ccedil;&atilde;o registrada no controle.'
          : 'A an&aacute;lise disciplinar desta s&uacute;mula ainda n&atilde;o foi feita.';

        return '<p class="equipe-dado" style="margin-top:12px;">' + aviso + '</p>';
      }

      const linhas = punidos.map(function (p) {
        return '<tr>'
          + celula('Punido', '<span class="pessoa-nome">' + escapar(p.nome || '—') + '</span>'
            + '<div class="equipe-dado">' + escapar(p.equipe || '—') + '</div>')
          + celula('Artigo', escapar(p.artigo || '—'))
          + celula('Decisão', escapar(p.decisao || '—'))
          + celula('Situação', '<span class="' + classeSituacao(p.situacao || '') + '">'
            + escapar(p.situacao || '—') + '</span>')
          + '</tr>';
      }).join('');

      const titulo = 'Nota oficial ' + escapar(notas.join(', '))
        + (registro.dataNota ? ' <span class="equipe-dado">· ' + escapar(registro.dataNota) + '</span>' : '');

      const atalho = moduloDisponivel('punicoes')
        ? '<div class="barra-acoes" style="margin-top:10px;">'
          + '<button type="button" class="botao-apoio atalho-punicoes" data-sumula="'
          + escapar(registro.protocolo) + '">Ver no controle de punições</button></div>'
        : '';

      return '<div class="relato" style="margin-top:14px;"><h4>Decis&atilde;o</h4>'
        + '<p style="font-family:inherit;white-space:normal;">' + titulo + '</p></div>'
        + '<table class="pessoas"><thead><tr>'
        + '<th>Punido</th><th>Artigo</th><th>Decis&atilde;o</th><th>Situa&ccedil;&atilde;o</th>'
        + '</tr></thead><tbody>' + linhas + '</tbody></table>'
        + atalho;
    }

    /**
     * Estado da tela de notas oficiais. Mesma ideia das demais consultas:
     * o servidor devolve tudo de uma vez e os filtros trabalham sobre a copia.
     */
    let notas = { registros: [], competicoes: [], equipes: [], total: 0, limite: 0, pastaUrl: '' };

    /** Notas com o texto aberto. */
    let notasAbertas = {};

    /**
     * Busca no servidor as notas oficiais publicadas.
     */
    function carregarNotas() {
      google.script.run
        .withSuccessHandler(function (dados) {
          if (moduloAtual !== 'notas') {
            return;
          }

          notas = dados;
          notasAbertas = {};
          montarTelaNotas();
        })
        .withFailureHandler(function (erro) {
          if (moduloAtual !== 'notas') {
            return;
          }

          document.getElementById('statusNotas').outerHTML =
            '<div class="erro">' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        })
        .listarNotas();
    }

    /**
     * Monta os indicadores, os filtros e a tabela das notas oficiais.
     */
    function montarTelaNotas() {
      const registros = notas.registros || [];
      const termo = consumirBusca();

      if (!registros.length) {
        document.getElementById('statusNotas').outerHTML =
          '<div class="vazio">Nenhuma nota oficial publicada at&eacute; o momento.</div>';
        return;
      }

      const recorte = notas.total > registros.length
        ? escapar(registros.length + ' mais recentes de ' + notas.total)
        : '';

      document.getElementById('statusNotas').outerHTML = ''
        + '<div class="resumo" id="resumoNotas"></div>'
        + '<div class="filtros">'
        + '<input type="search" id="buscaNotas" placeholder="Buscar por n&uacute;mero, partida, punido, artigo ou pelo texto da nota">'
        + opcoesFiltro('competicao', 'Todas as competi&ccedil;&otilde;es', registros)
        + filtroEquipeNotas()
        + '</div>'
        + '<div class="barra-acoes">'
        + '<span id="contagemNotas"></span>'
        + '<span class="espaco"></span>'
        + (recorte ? '<span>' + recorte + '</span>' : '')
        + '<button type="button" class="botao-apoio" id="recarregarNotas">Atualizar</button>'
        + (notas.pastaUrl
          ? '<a class="botao-apoio" href="' + escapar(notas.pastaUrl) + '" target="_blank" rel="noopener">Abrir pasta</a>'
          : '')
        + '</div>'
        + '<div class="tabela-rolagem"><table class="solicitacoes notas"><thead><tr>'
        + '<th>Nota</th><th>Publicada em</th><th>Partida</th><th>Documento</th><th>Punidos</th>'
        + '</tr></thead><tbody id="linhasNotas"></tbody></table></div>';

      document.getElementById('buscaNotas').addEventListener('input', filtrarNotas);
      document.getElementById('recarregarNotas').addEventListener('click', function () {
        abrirModulo('notas');
      });

      conteudo.querySelectorAll('[data-filtro], #filtroEquipeNotas').forEach(function (campo) {
        campo.addEventListener('change', filtrarNotas);
      });

      if (termo) {
        document.getElementById('buscaNotas').value = termo;
      }

      filtrarNotas();
    }

    /**
     * A equipe da nota vem dos times da partida e da equipe de cada punido;
     * o servidor ja devolve a lista pronta.
     */
    function filtroEquipeNotas() {
      const opcoes = (notas.equipes || []).map(function (equipe) {
        return '<option value="' + escapar(equipe) + '">' + escapar(equipe) + '</option>';
      }).join('');

      return '<select id="filtroEquipeNotas"><option value="">Todas as equipes</option>' + opcoes + '</select>';
    }

    /**
     * Aplica a busca e os seletores e redesenha a tabela.
     */
    function filtrarNotas() {
      const busca = simplificar(document.getElementById('buscaNotas').value.trim());
      const equipe = document.getElementById('filtroEquipeNotas').value;
      const selecionados = {};

      conteudo.querySelectorAll('[data-filtro]').forEach(function (campo) {
        selecionados[campo.dataset.filtro] = campo.value;
      });

      const filtrados = (notas.registros || []).filter(function (registro) {
        const passaSelecao = Object.keys(selecionados).every(function (campo) {
          return !selecionados[campo] || registro[campo] === selecionados[campo];
        });

        if (!passaSelecao) {
          return false;
        }

        if (equipe && (registro.equipes || []).indexOf(equipe) === -1) {
          return false;
        }

        if (!busca) {
          return true;
        }

        return simplificar(textoDaNota(registro)).indexOf(busca) !== -1;
      });

      desenharResumoNotas(filtrados);
      desenharLinhasNotas(filtrados);
    }

    /**
     * Junta tudo o que identifica a nota, inclusive o texto inteiro: o
     * enquadramento e a fundamentacao so existem la dentro.
     */
    function textoDaNota(registro) {
      return [
        registro.numero,
        registro.competicao,
        registro.confronto,
        registro.dataJogo,
        registro.dataNota,
        registro.protocolo,
        registro.arbitro,
        registro.texto
      ].concat((registro.punidos || []).map(function (p) {
        return p.nome + ' ' + p.equipe + ' ' + p.artigo + ' ' + p.decisao;
      })).join(' ');
