[login]
username_input = css=input[data-testid='input-email']
password_input = css=input[data-testid='input-password']
submit_button = css=button[data-testid='button-submit']

[teams]
page_ready = css=body
search_input =
team_card = xpath=//a[.//span[contains(@class, 'q-title')]]
pagination_next = xpath=//div[contains(@class, 'q-pagination')]//button[@aria-label='2' and not(@disabled='disabled')]

[team]
roster_tab = css=button.section-tab[aria-label='Elenco']
commission_tab = css=button.section-tab[aria-label='Comissão Téc.']
roster_ready = css=.player-tab
commission_ready = css=body
roster_row = css=div.athlete-card

[actions]
include_button = xpath=//span[normalize-space()='Adicionar atleta']/ancestor::button[1]
commission_include_button = xpath=//span[normalize-space()='Adicionar comissão']/ancestor::button[1]
portability_button = xpath=//span[normalize-space()='Importar atletas']/ancestor::button[1]
person_type_select =
athlete_type_option =
commission_type_option =
search_person_input =
search_person_button =
select_first_search_result =
save_button = xpath=//div[contains(@class, 'dialog-footer')]//span[normalize-space()='Salvar']/ancestor::button[1]
cancel_button = xpath=//div[contains(@class, 'dialog-footer')]//span[normalize-space()='Cancelar']/ancestor::button[1]
; Portabilidade (2026): pop-up "Importar cadastros". A antiga selecao de
; "campeonato" virou "Categoria de Origem" (q-select) e hoje lista apenas as
; CATEGORIAS do proprio campeonato (nao os campeonatos de origem), entao a
; automacao NAO usa mais este filtro por padrao (ver [app] portability_use_source_filter).
; Os seletores ficam prontos caso o filtro por campeonato volte a existir.
portability_championship_select = xpath=//span[normalize-space()='Categoria de Origem']/following::label[1]
portability_championship_option = xpath=//div[@role='option' or contains(@class, 'q-item')][contains(normalize-space(.), "{championship_name}")]
; Abas internas do pop-up: "Atletas" (default) e "Comissao Tecnica".
portability_tab_atletas = xpath=//div[@role='tab' and .//div[normalize-space()='Atletas']]
portability_tab_comissao = xpath=//div[@role='tab' and .//div[normalize-space()='Comissão Técnica']]
; Cada atleta importavel e um .team-card-select; o nome fica em .import-name.
portability_player_checkbox = css=div.team-card-select
portability_submit_button = xpath=//span[normalize-space()='Importar Selecionados']/ancestor::button[1]
portability_cancel_button = xpath=//div[contains(@class, 'dialog-footer')]//span[normalize-space()='Cancelar']/ancestor::button[1]
; Lixeira vermelha do card do atleta: botao com modificador --red e icone lucide-trash
; (cuidado: --amber/lucide-ban = suspender; lucide-arrow-left-right = transferir).
remove_row_button = xpath=.//button[contains(@class, 'athlete-card__action-btn--red')]
; Pop-up de remocao (ds-dialog): botao vermelho "Confirmar" (bg-negative).
confirm_remove_button = xpath=//div[contains(@class, 'ds-dialog__footer')]//span[normalize-space()='Confirmar']/ancestor::button[1]

[form]
; Novo layout (2026): os campos nao tem mais aria-label; usamos o sufixo do
; atributo name, que e estavel (o prefixo "player-v-N-" muda a cada abertura).
image_input = css=input[type='file'][accept='image/*']
image_button = xpath=//span[normalize-space()='Selecionar Foto']/ancestor::button[1]
; Editor de recorte (2026): abre apos enviar a foto; precisa clicar em Confirmar
; para aplicar. O container e identificado pelo cabecalho "Editar Imagem".
image_crop_dialog = xpath=//div[contains(@class, 'modern-dialog') and .//*[normalize-space()='Editar Imagem']]
image_crop_confirm = xpath=//div[contains(@class, 'editor-actions')]//span[normalize-space()='Confirmar']/ancestor::button[1]
full_name_input = css=input[name$='-name']
birthdate_input = css=input[name$='-birthdate']
cpf_input = css=input[name$='-document']
; Comissao (2026): "Posicao / Cargo" e um q-select (combobox) cujo input tem
; name terminando em -position; clicamos no label para abrir a lista.
role_input = xpath=//label[.//input[@role='combobox' and contains(@name, '-position')]]
role_default_option = xpath=//div[@role='option' and contains(normalize-space(.), 'Treinador')]
; O documento da comissao usa o MESMO campo RG (name$='-document'); nao ha mais
; um "Numero do Documento" separado.
commission_document_input = css=input[name$='-document']

[messages]
; RG duplicado (2026): aviso inline "duplicate-note" dentro do proprio formulario
; (data-testid="duplicate-details"), nao mais um card separado.
duplicate_rg_card = xpath=//*[@data-testid='duplicate-details' or contains(@class, 'duplicate-note')]
; Modal de cadastro aberto: titulo "Insira os dados necessarios" (modern-dialog).
include_dialog = xpath=//div[contains(@class, 'modern-dialog') and .//*[contains(normalize-space(), 'Insira os dados necessários')]]
