[login]
username_input = css=input[type='text']
password_input = css=input[type='password']
submit_button = xpath=//span[normalize-space()='Acessar']/ancestor::button[1]

[teams]
page_ready = css=body
search_input =
team_card = xpath=//a[.//span[contains(@class, 'q-title')]]
pagination_next = xpath=//div[contains(@class, 'q-pagination')]//button[@aria-label='2' and not(@disabled='disabled')]

[team]
roster_tab =
roster_ready = css=body
roster_row = xpath=//*[self::tr or self::div]

[actions]
include_button = xpath=//span[normalize-space()='Adicionar atleta']/ancestor::button[1]
portability_button = xpath=//span[normalize-space()='Importar atletas']/ancestor::button[1]
person_type_select =
athlete_type_option =
commission_type_option =
search_person_input =
search_person_button =
select_first_search_result =
save_button = xpath=//div[contains(@class, 'q-card__actions')]//span[normalize-space()='Salvar']/ancestor::button[1]
cancel_button = xpath=//div[contains(@class, 'q-card__actions')]//span[normalize-space()='Cancelar']/ancestor::button[1]
portability_championship_select = xpath=//input[@role='combobox' and @aria-label='Selecione um campeonato']/ancestor::label[1]
portability_championship_option = xpath=//div[@role='option' or contains(@class, 'q-item')][contains(normalize-space(.), "{championship_name}")]
portability_player_checkbox = xpath=//div[@role='checkbox' and @aria-label]
portability_submit_button = xpath=//span[normalize-space()='Inscrever atletas']/ancestor::button[1]
portability_cancel_button = xpath=//span[normalize-space()='Cancelar']/ancestor::button[1]
remove_row_button =
confirm_remove_button =

[form]
image_input = css=input[type='file']
image_button = xpath=//span[normalize-space()='ESCOLHER IMAGEM']/ancestor::button[1]
full_name_input = css=input[aria-label='Nome']
birthdate_input = css=input[aria-label='Data de Nascimento']
cpf_input = css=input[aria-label='Número do RG']
role_input =

[messages]
duplicate_rg_card = xpath=//div[contains(@class, 'duplicated_card')]
include_dialog = xpath=//div[contains(@class, 'dialog-content') and .//span[contains(normalize-space(), 'Insira os dados necessários')]]
