<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEUV - Inscrição, Remoção e Portabilidade</title>
  <meta name="description" content="Formulário oficial da AEUV para inscrição, remoção e portabilidade de atletas e comissão técnica.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AEUV (Associação Esportiva Uberlandense Varzeana)">
  <meta property="og:title" content="AEUV - Inscrição, Remoção e Portabilidade">
  <meta property="og:description" content="Formulário oficial da AEUV para inscrição, remoção e portabilidade de atletas e comissão técnica.">
  <meta property="og:image" content="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <meta property="og:image:alt" content="Logomarca da AEUV">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <style>
    :root {
      --azul: #14213d;
      --dourado: #fca311;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--azul);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* O iframe carrega desde o inicio, escondido atras da tela de carregamento. */
    #quadro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transition: opacity .35s ease;
    }

    #quadro.visivel { opacity: 1; }

    #carregando {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: var(--azul);
      transition: opacity .35s ease;
    }

    #carregando.oculto {
      opacity: 0;
      pointer-events: none;
    }

    /* Anel giratorio ao redor da logomarca. */
    .marca {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .marca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: var(--dourado);
      border-right-color: var(--dourado);
      animation: girar 1.1s linear infinite;
    }

    .logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    h1 { font-size: 19px; margin: 18px 0 4px; }
    p { margin: 0; opacity: .85; font-size: 14px; }

    #reticencias::after {
      content: '';
      animation: reticencias 1.4s steps(4, end) infinite;
    }

    .barra {
      position: relative;
      width: 210px;
      height: 5px;
      margin: 20px auto 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .16);
      overflow: hidden;
    }

    /* Avanca ate 90% conforme o tempo estimado e completa quando o formulario abre. */
    .barra span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffc45c, var(--dourado));
      transition: width .4s ease;
    }

    .barra::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
      animation: brilho 1.4s ease-in-out infinite;
    }

    .etapa {
      margin-top: 12px;
      font-size: 13px;
      opacity: .7;
      min-height: 17px;
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    @keyframes brilho {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes reticencias {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .marca::before, .barra::after, #reticencias::after { animation: none; }
    }
  </style>
</head>
<body>
  <iframe id="quadro" title="Inscri&ccedil;&atilde;o, Remo&ccedil;&atilde;o e Portabilidade" allow="clipboard-write"></iframe>

  <div id="carregando">
    <main>
      <div class="marca">
        <img class="logo" src="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png" alt="Logomarca da AEUV">
      </div>
      <h1>Inscri&ccedil;&atilde;o, Remo&ccedil;&atilde;o e Portabilidade</h1>
      <p>Carregando o formul&aacute;rio da AEUV<span id="reticencias"></span></p>
      <div class="barra"><span id="preenchimento"></span></div>
      <p class="etapa" id="etapa">Conectando ao servidor...</p>
    </main>
  </div>

  <script>
    // URL /exec da implantacao no Apps Script. Ao publicar uma NOVA implantacao, atualize aqui.
    const URL_FORMULARIO = 'https://script.google.com/macros/s/AKfycbyP2WRKuyR9dbF4HVUFM14_p-exiNoPlQFyOlIx05_BBzcNkCR_fS7ruxXhtQ0rsnDBbg/exec';

    const quadro = document.getElementById('quadro');
    const carregando = document.getElementById('carregando');
    const preenchimento = document.getElementById('preenchimento');
    const etapa = document.getElementById('etapa');

    // Tempo tipico de carregamento do Apps Script, usado so para animar a barra.
    const DURACAO_ESTIMADA = 20000;

    const ETAPAS = [
      [0, 'Conectando ao servidor...'],
      [3000, 'Carregando o aplicativo...'],
      [9000, 'Montando os campos do formul\u00e1rio...'],
      [16000, 'Quase pronto...'],
    ];

    let exibido = false;
    const inicio = Date.now();

    // A barra avanca desacelerando e para em 98%, reservando o fim para a abertura real.
    const cronometro = setInterval(() => {
      if (exibido) return;
      const decorrido = Date.now() - inicio;
      const progresso = 1 - Math.pow(1 - Math.min(decorrido / DURACAO_ESTIMADA, 1), 3);
      preenchimento.style.width = (progresso * 98).toFixed(1) + '%';

      for (let i = ETAPAS.length - 1; i >= 0; i--) {
        if (decorrido >= ETAPAS[i][0]) {
          if (etapa.textContent !== ETAPAS[i][1]) etapa.textContent = ETAPAS[i][1];
          break;
        }
      }
    }, 120);

    function exibirFormulario() {
      if (exibido) return;
      exibido = true;
      clearInterval(cronometro);
      preenchimento.style.width = '100%';
      etapa.textContent = 'Pronto!';

      // Deixa a barra completar antes da transicao, evitando corte brusco.
      setTimeout(() => {
        quadro.classList.add('visivel');
        carregando.classList.add('oculto');
        setTimeout(() => { carregando.style.display = 'none'; }, 400);
      }, 300);
    }

    // O load do iframe sinaliza a pagina do Apps Script pronta; a folga cobre a
    // montagem do formulario dentro dela e evita a tela branca intermediaria.
    quadro.addEventListener('load', () => setTimeout(exibirFormulario, 700));

    quadro.src = URL_FORMULARIO;
  </script>
</body>
</html>
