<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEUV - Inscrição, Remoção e Portabilidade</title>
  <meta name="description" content="Formulário oficial da AEUV para inscrição, remoção e portabilidade de atletas e comissão técnica.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AEUV (Associação Esportiva Uberlandense Varzeana)">
  <meta property="og:title" content="AEUV - Inscrição, Remoção e Portabilidade">
  <meta property="og:description" content="Formulário oficial da AEUV para inscrição, remoção e portabilidade de atletas e comissão técnica.">
  <meta property="og:image" content="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <meta property="og:image:alt" content="Logomarca da AEUV">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <style>
    :root {
      --azul: #14213d;
      --dourado: #fca311;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--azul);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* O iframe carrega desde o inicio, escondido atras da tela de carregamento. */
    #quadro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transition: opacity .35s ease;
    }

    #quadro.visivel { opacity: 1; }

    #carregando {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: var(--azul);
      transition: opacity .35s ease;
    }

    #carregando.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    h1 { font-size: 19px; margin: 18px 0 4px; }
    p { margin: 0; opacity: .85; font-size: 14px; }

    .barra {
      width: 190px;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .18);
      overflow: hidden;
    }

    .barra span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background: var(--dourado);
      animation: correr 1.2s ease-in-out infinite;
    }

    #alternativo {
      display: none;
      margin-top: 22px;
    }

    #alternativo a {
      display: inline-block;
      background: var(--dourado);
      color: var(--azul);
      font-weight: 700;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 8px;
    }

    @keyframes correr {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .barra span { animation: none; }
    }
  </style>
</head>
<body>
  <iframe id="quadro" title="Inscri&ccedil;&atilde;o, Remo&ccedil;&atilde;o e Portabilidade" allow="clipboard-write"></iframe>

  <div id="carregando">
    <main>
      <img class="logo" src="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png" alt="Logomarca da AEUV">
      <h1>Inscri&ccedil;&atilde;o, Remo&ccedil;&atilde;o e Portabilidade</h1>
      <p>Carregando o formul&aacute;rio da AEUV...</p>
      <div class="barra"><span></span></div>
      <div id="alternativo">
        <p>Est&aacute; demorando mais que o normal.</p>
        <a id="destino" href="#" target="_blank" rel="noopener">Abrir formul&aacute;rio em nova aba</a>
      </div>
    </main>
  </div>

  <script>
    // URL /exec da implantacao no Apps Script. Ao publicar uma NOVA implantacao, atualize aqui.
    const URL_FORMULARIO = 'https://script.google.com/macros/s/AKfycbyP2WRKuyR9dbF4HVUFM14_p-exiNoPlQFyOlIx05_BBzcNkCR_fS7ruxXhtQ0rsnDBbg/exec';

    const quadro = document.getElementById('quadro');
    const carregando = document.getElementById('carregando');
    const alternativo = document.getElementById('alternativo');
    document.getElementById('destino').href = URL_FORMULARIO;

    let exibido = false;

    function exibirFormulario() {
      if (exibido) return;
      exibido = true;
      quadro.classList.add('visivel');
      carregando.classList.add('oculto');
      setTimeout(() => { carregando.style.display = 'none'; }, 400);
    }

    // O load do iframe sinaliza a pagina do Apps Script pronta; a folga cobre a
    // montagem do formulario dentro dela e evita a tela branca intermediaria.
    quadro.addEventListener('load', () => setTimeout(exibirFormulario, 700));

    // Se o navegador bloquear o iframe ou a resposta demorar, oferece o link direto.
    setTimeout(() => {
      if (!exibido) alternativo.style.display = 'block';
    }, 12000);

    quadro.src = URL_FORMULARIO;
  </script>
</body>
</html>
