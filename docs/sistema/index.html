<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEUV - Sistema Interno</title>
  <meta name="description" content="Área restrita da AEUV. O acesso exige login com Conta Google autorizada.">

  <!-- Area restrita: nao deve aparecer em buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AEUV (Associação Esportiva Uberlandense Varzeana)">
  <meta property="og:title" content="AEUV - Sistema Interno">
  <meta property="og:description" content="Área restrita da AEUV. O acesso exige login com Conta Google autorizada.">
  <meta property="og:image" content="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <meta property="og:image:alt" content="Logomarca da AEUV">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <style>
    :root {
      --azul: #14213d;
      --dourado: #fca311;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--azul);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* O quadro carrega desde o inicio, escondido atras da tela de carregamento. */
    #quadro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f6fb;
      opacity: 0;
      transition: opacity .35s ease;
    }

    #quadro.visivel { opacity: 1; }

    #carregando {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: var(--azul);
      transition: opacity .35s ease;
    }

    #carregando.oculto {
      opacity: 0;
      pointer-events: none;
    }

    /* Anel giratorio ao redor da logomarca. */
    .marca {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .marca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: var(--dourado);
      border-right-color: var(--dourado);
      animation: girar 1.1s linear infinite;
    }

    .logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    h1 { font-size: 19px; margin: 18px 0 4px; }
    p { margin: 0; opacity: .85; font-size: 14px; }

    #reticencias::after {
      content: '';
      animation: reticencias 1.4s steps(4, end) infinite;
    }

    /* Barra indeterminada: o tempo depende da sessao do Google. */
    .barra {
      position: relative;
      width: 210px;
      height: 5px;
      margin: 20px auto 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .16);
      overflow: hidden;
    }

    .barra span {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffc45c, var(--dourado));
      animation: correr 1.3s ease-in-out infinite;
    }

    .etapa {
      margin-top: 12px;
      font-size: 13px;
      opacity: .7;
      min-height: 17px;
    }

    .cadeado {
      margin-top: 22px;
      font-size: 12px;
      opacity: .55;
      max-width: 340px;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    @keyframes correr {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes reticencias {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .marca::before, .barra span, #reticencias::after { animation: none; }
      .barra span { width: 100%; left: 0; }
    }
  </style>
</head>
<body>
  <iframe id="quadro" title="Sistema Interno da AEUV" allow="clipboard-write"></iframe>

  <div id="carregando">
    <main>
      <div class="marca">
        <img class="logo" src="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png" alt="Logomarca da AEUV">
      </div>
      <h1>Sistema Interno</h1>
      <p>Abrindo a &aacute;rea restrita da AEUV<span id="reticencias"></span></p>
      <div class="barra"><span></span></div>
      <p class="etapa" id="etapa">Verificando sua Conta Google...</p>
      <p class="cadeado">&#128274; O acesso exige login com uma Conta Google autorizada pela associa&ccedil;&atilde;o.</p>
    </main>
  </div>

  <script>
    // URL /exec da implantacao do sistema interno no Apps Script.
    // Ao publicar uma NOVA implantacao, atualize aqui.
    const URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbwKfTZWMkmv80XbwvmfNyRHltEUFGOYQ3srJz9TKODKvbL5nu5FTuB5YR7KJ_3jwF7weg/exec';

    const quadro = document.getElementById('quadro');
    const carregando = document.getElementById('carregando');
    const etapa = document.getElementById('etapa');

    // Quem ja tem sessao ativa no Google abre o sistema dentro do quadro e a
    // barra do navegador continua mostrando portal.aeuv.org. Quem ainda nao
    // entrou recebe a tela de login, que recusa ser exibida dentro de quadro;
    // nesse caso a navegacao passa para a aba inteira depois deste tempo.
    const LIMITE_QUADRO = 9000;

    const ETAPAS = [
      [2500, 'Carregando o sistema...'],
      [5500, 'Quase pronto...']
    ];

    let exibido = false;
    let desistiu = false;
    const inicio = Date.now();

    const cronometro = setInterval(function () {
      if (exibido) {
        return;
      }

      const decorrido = Date.now() - inicio;

      for (let i = ETAPAS.length - 1; i >= 0; i--) {
        if (decorrido >= ETAPAS[i][0]) {
          if (etapa.textContent !== ETAPAS[i][1]) {
            etapa.textContent = ETAPAS[i][1];
          }

          break;
        }
      }
    }, 200);

    /**
     * Troca a tela de carregamento pelo sistema ja montado.
     */
    function exibirSistema() {
      if (exibido || desistiu) {
        return;
      }

      exibido = true;
      clearInterval(cronometro);
      clearTimeout(limite);

      quadro.classList.add('visivel');
      carregando.classList.add('oculto');
      setTimeout(function () { carregando.style.display = 'none'; }, 400);
    }

    // O proprio sistema avisa que abriu, pelo script da Ponte. O evento load do
    // quadro nao serve aqui: ele dispara tambem quando o Google devolve a tela
    // de login recusada, o que deixaria a pagina presa em branco.
    window.addEventListener('message', function (evento) {
      const dados = evento.data;

      if (dados && dados.aeuv === 'sistema-pronto') {
        exibirSistema();
      }
    });

    // Sem aviso dentro do prazo, o conteudo foi bloqueado: quase sempre por
    // falta de sessao no Google. O parametro origem=direto impede que o sistema
    // tente devolver a navegacao para ca, o que criaria um vaivem sem fim.
    const limite = setTimeout(function () {
      if (exibido) {
        return;
      }

      desistiu = true;
      clearInterval(cronometro);
      etapa.textContent = 'Abrindo a tela de login do Google...';
      window.location.replace(URL_SISTEMA + '?origem=direto');
    }, LIMITE_QUADRO);

    quadro.src = URL_SISTEMA + '?origem=portal';
  </script>
</body>
</html>
