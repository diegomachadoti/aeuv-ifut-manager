<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEUV - Sistema Interno</title>
  <meta name="description" content="Área restrita da AEUV. O acesso exige login com Conta Google autorizada.">

  <!-- Area restrita: nao deve aparecer em buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AEUV (Associação Esportiva Uberlandense Varzeana)">
  <meta property="og:title" content="AEUV - Sistema Interno">
  <meta property="og:description" content="Área restrita da AEUV. O acesso exige login com Conta Google autorizada.">
  <meta property="og:image" content="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <meta property="og:image:alt" content="Logomarca da AEUV">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png">
  <style>
    :root {
      --azul: #14213d;
      --dourado: #fca311;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--azul);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    /* Anel giratorio ao redor da logomarca. */
    .marca {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .marca::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: var(--dourado);
      border-right-color: var(--dourado);
      animation: girar 1.1s linear infinite;
    }

    .logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    h1 { font-size: 19px; margin: 18px 0 4px; }
    p { margin: 0; opacity: .85; font-size: 14px; }

    #reticencias::after {
      content: '';
      animation: reticencias 1.4s steps(4, end) infinite;
    }

    /* Barra indeterminada: o tempo depende do login do Google, entao nao ha progresso real. */
    .barra {
      position: relative;
      width: 210px;
      height: 5px;
      margin: 20px auto 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .16);
      overflow: hidden;
    }

    .barra span {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffc45c, var(--dourado));
      animation: correr 1.3s ease-in-out infinite;
    }

    .etapa {
      margin-top: 12px;
      font-size: 13px;
      opacity: .7;
      min-height: 17px;
    }

    .cadeado {
      margin-top: 22px;
      font-size: 12px;
      opacity: .55;
      max-width: 340px;
    }

    /* Só aparece se o navegador bloquear o redirecionamento automático. */
    .manual {
      display: none;
      margin-top: 18px;
      padding: 11px 18px;
      background: var(--dourado);
      color: var(--azul);
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
    }

    .manual.visivel { display: inline-block; }

    @keyframes girar { to { transform: rotate(360deg); } }

    @keyframes correr {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes reticencias {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .marca::before, .barra span, #reticencias::after { animation: none; }
      .barra span { width: 100%; left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <div class="marca">
      <img class="logo" src="https://raw.githubusercontent.com/diegomachadoti/aeuv-ifut-manager/master/assets/logo-aeuv.png" alt="Logomarca da AEUV">
    </div>
    <h1>Sistema Interno</h1>
    <p>Abrindo a &aacute;rea restrita da AEUV<span id="reticencias"></span></p>
    <div class="barra"><span></span></div>
    <p class="etapa" id="etapa">Verificando sua Conta Google...</p>
    <p class="cadeado">&#128274; O acesso exige login com uma Conta Google autorizada pela associa&ccedil;&atilde;o.</p>
    <a class="manual" id="manual" href="#">Continuar para o sistema</a>
  </main>

  <script>
    // URL /exec da implantacao do sistema interno no Apps Script.
    // Ao publicar uma NOVA implantacao, atualize aqui.
    const URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbwKfTZWMkmv80XbwvmfNyRHltEUFGOYQ3srJz9TKODKvbL5nu5FTuB5YR7KJ_3jwF7weg/exec';

    const manual = document.getElementById('manual');
    const etapa = document.getElementById('etapa');

    manual.href = URL_SISTEMA;

    // Diferente das paginas dos formularios, aqui NAO se usa iframe: a tela de
    // login do Google envia X-Frame-Options e ficaria em branco dentro do quadro.
    // Por isso a navegacao acontece na propria aba.
    setTimeout(function () {
      window.location.replace(URL_SISTEMA);
    }, 600);

    // Se o navegador bloquear o redirecionamento, o usuario segue pelo botao.
    setTimeout(function () {
      etapa.textContent = 'Se a p\u00e1gina n\u00e3o abrir sozinha, use o bot\u00e3o abaixo.';
      manual.classList.add('visivel');
    }, 5000);
  </script>
</body>
</html>
